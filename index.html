<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f8edf7">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="별빛의 운명">
  <title>별빛의 운명</title>

  <link rel="apple-touch-icon" href="./icon.PNG?v=49">
  <link rel="icon" type="image/png" href="./icon.PNG?v=49">
  <link rel="manifest" href="./manifest.webmanifest?v=49">
  <script src="./push-config.js?v=1"></script>

  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0; width: 100%; min-height: 100%;
      background: linear-gradient(135deg,#fff5f7,#f5f0fa 55%,#f0f7f7);
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", sans-serif;
      color:#55485d;
    }
    .wrap {
      min-height:100vh; display:grid; place-items:center;
      padding:28px; text-align:center;
    }
    .card {
      width:min(420px,100%); padding:28px 22px;
      border-radius:24px; background:rgba(255,255,255,.78);
      box-shadow:0 12px 34px rgba(85,72,93,.12);
      border:1px solid rgba(255,255,255,.9);
      backdrop-filter: blur(16px);
    }
    .orb {
      width:70px;height:70px;border-radius:50%;margin:0 auto 16px;
      background:radial-gradient(circle at 35% 30%,#fff,#e2c9ff 36%,#a47dd3 70%,#6d4a92);
      box-shadow:0 0 32px rgba(164,125,211,.38);
    }
    h1 { margin:0 0 8px; font-size:24px; }
    p { margin:0 0 20px; color:#7b6f82; line-height:1.65; font-size:14px; }
    .open, .push-button, .skip-button {
      display:block; width:100%; padding:14px 18px; border:0;
      border-radius:15px; background:#fff; color:#75589b;
      font:inherit; font-weight:800; text-decoration:none;
      box-shadow:0 5px 20px rgba(50,35,55,.10); cursor:pointer;
    }
    .push-button { margin-top:10px; background:#7b5aa6; color:#fff; }
    .skip-button { margin-top:10px; background:rgba(255,255,255,.65); box-shadow:none; }
    .hint, .push-box {
      margin-top:16px; padding:12px 13px; border-radius:14px;
      background:rgba(193,166,220,.10);
      color:#6d6075; font-size:12px; line-height:1.55;
    }
    .push-box { display:none; text-align:left; padding:15px; }
    .push-title { font-size:14px; font-weight:900; color:#665071; margin-bottom:5px; }
    .push-status { margin-top:9px; min-height:18px; color:#7b6f82; }
  </style>

  <script>
    const FALLBACK_STREAMLIT_URL = 'https://astro-app-wmz23ohfhmhrhrz2gg3kej.streamlit.app/';
    const PUSH_ENABLED_MARKER = 'astro_push_enabled_v1';

    function launchedFromHomeScreen() {
      return window.navigator.standalone === true ||
             window.matchMedia('(display-mode: standalone)').matches;
    }

    function pushConfig() {
      return window.ASTRO_PUSH_CONFIG || {};
    }

    function buildAppUrl() {
      const base = pushConfig().streamlitUrl || FALLBACK_STREAMLIT_URL;
      const target = new URL(base);
      const current = new URLSearchParams(window.location.search);
      const kind = current.get('kind');
      const date = current.get('date');
      const year = current.get('year');
      const month = current.get('month');
      if (kind) target.searchParams.set('push_kind', kind);
      if (date) target.searchParams.set('push_date', date);
      if (year) target.searchParams.set('push_year', year);
      if (month) target.searchParams.set('push_month', month);
      return target.toString();
    }

    function openApp() {
      window.location.replace(buildAppUrl());
    }

    function loadOneSignalSdk() {
      return new Promise((resolve, reject) => {
        if (window.OneSignalDeferred) return resolve();
        window.OneSignalDeferred = window.OneSignalDeferred || [];
        const script = document.createElement('script');
        script.src = 'https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js';
        script.defer = true;
        script.onload = () => resolve();
        script.onerror = () => reject(new Error('OneSignal SDK load failed'));
        document.head.appendChild(script);
      });
    }

    async function initializePush() {
      const cfg = pushConfig();
      if (!cfg.oneSignalAppId) return { configured:false };
      await loadOneSignalSdk();
      return new Promise((resolve, reject) => {
        let finished = false;
        const timer = setTimeout(() => {
          if (!finished) reject(new Error('OneSignal initialization timeout'));
        }, 6000);
        window.OneSignalDeferred.push(async function(OneSignal) {
          try {
            await OneSignal.init({
              appId: cfg.oneSignalAppId,
              serviceWorkerPath: cfg.serviceWorkerPath || 'OneSignalSDKWorker.js',
              serviceWorkerParam: { scope: cfg.serviceWorkerScope || '/astro-app/' },
              autoResubscribe: true,
              notifyButton: { enable: false }
            });
            window.__astroOneSignal = OneSignal;
            finished = true;
            clearTimeout(timer);
            resolve({
              configured:true,
              supported:Boolean(OneSignal.Notifications.isPushSupported()),
              permission:Boolean(OneSignal.Notifications.permission),
              optedIn:Boolean(OneSignal.User.PushSubscription.optedIn)
            });
          } catch (error) {
            finished = true;
            clearTimeout(timer);
            reject(error);
          }
        });
      });
    }

    function showPushSetup(message='') {
      const box = document.getElementById('pushBox');
      const status = document.getElementById('pushStatus');
      if (box) box.style.display = 'block';
      if (status && message) status.textContent = message;
    }

    async function enablePushFromUserGesture() {
      const button = document.getElementById('enablePush');
      const status = document.getElementById('pushStatus');
      if (button) button.disabled = true;
      if (status) status.textContent = 'iPhone 알림 권한을 확인하는 중…';
      try {
        let OneSignal = window.__astroOneSignal;
        if (!OneSignal) {
          await initializePush();
          OneSignal = window.__astroOneSignal;
        }
        if (!OneSignal || !OneSignal.Notifications.isPushSupported()) {
          if (status) status.textContent = '이 환경에서는 웹 푸시를 사용할 수 없어. 앱은 그대로 열 수 있어.';
          return;
        }
        await OneSignal.Notifications.requestPermission();
        if (OneSignal.Notifications.permission && !OneSignal.User.PushSubscription.optedIn) {
          await OneSignal.User.PushSubscription.optIn();
        }
        if (OneSignal.Notifications.permission && OneSignal.User.PushSubscription.optedIn) {
          localStorage.setItem(PUSH_ENABLED_MARKER, '1');
          if (status) status.textContent = '✅ 알림이 켜졌어. 이제 운세 알림을 받을 수 있어.';
          setTimeout(openApp, 700);
        } else {
          if (status) status.textContent = '알림 권한이 아직 허용되지 않았어. iPhone 설정에서 허용한 뒤 다시 눌러줘.';
        }
      } catch (error) {
        console.error(error);
        if (status) status.textContent = '알림 설정에 실패했어. 앱은 정상적으로 열 수 있어.';
      } finally {
        if (button) button.disabled = false;
      }
    }

    window.addEventListener('DOMContentLoaded', async () => {
      document.getElementById('enablePush')?.addEventListener('click', enablePushFromUserGesture);
      document.getElementById('skipPush')?.addEventListener('click', openApp);

      const standalone = launchedFromHomeScreen();
      const params = new URLSearchParams(window.location.search);
      const fromPush = params.get('from') === 'push';
      const configured = Boolean(pushConfig().oneSignalAppId);

      // 일반 Safari에서는 홈 화면 추가 안내를 위해 이 페이지에 머문다.
      if (!standalone) return;

      // 실제 알림을 눌러 들어온 경우나 이미 알림 설정을 마친 경우는 즉시 앱으로 보낸다.
      if (fromPush || localStorage.getItem(PUSH_ENABLED_MARKER) === '1') {
        setTimeout(openApp, 180);
        return;
      }

      // OneSignal App ID를 아직 넣지 않았으면 기존 동작을 그대로 유지한다.
      if (!configured) {
        setTimeout(openApp, 250);
        return;
      }

      // iOS는 홈 화면 웹앱에서 사용자 동작으로 알림 권한을 받아야 하므로 첫 실행 때만 설정 화면을 보여준다.
      try {
        const state = await initializePush();
        if (state.supported && state.permission && state.optedIn) {
          localStorage.setItem(PUSH_ENABLED_MARKER, '1');
          setTimeout(openApp, 180);
          return;
        }
        showPushSetup(state.supported ? '알림을 켜면 일일·주간·월간 운세 알림을 받을 수 있어.' : '이 환경에서는 웹 푸시를 지원하지 않아.');
      } catch (error) {
        console.error(error);
        showPushSetup('푸시 초기화가 늦어지고 있어. 앱을 먼저 열어도 돼.');
      }
    });
  </script>
</head>
<body>
  <main class="wrap">
    <section class="card">
      <div class="orb"></div>
      <h1>별빛의 운명</h1>
      <p>개인용 정밀 점성술 리포트</p>
      <a class="open" href="https://astro-app-wmz23ohfhmhrhrz2gg3kej.streamlit.app/">🌙 지금 앱 열기</a>

      <div id="pushBox" class="push-box">
        <div class="push-title">🔔 운세 알림 받기</div>
        <div>홈 화면 앱에서 알림을 한 번 허용하면, 앱을 닫아둬도 예약된 운세 알림을 받을 수 있어.</div>
        <button id="enablePush" class="push-button" type="button">🔔 알림 켜기</button>
        <button id="skipPush" class="skip-button" type="button">나중에 · 앱 먼저 열기</button>
        <div id="pushStatus" class="push-status" aria-live="polite"></div>
      </div>

      <div class="hint">
        홈 화면 아이콘을 만들 때는 이 페이지에서<br>
        Safari 공유 → <strong>홈 화면에 추가</strong>를 눌러주세요.<br>
        <span style="opacity:.78">iPhone 웹 푸시는 홈 화면 앱에서만 설정할 수 있어요.</span>
      </div>
    </section>
  </main>
</body>
</html>
