<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f8edf7">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="별빛의 운명">
  <title>별빛의 운명</title>

  <link rel="apple-touch-icon" href="./icon.PNG?v=43">
  <link rel="icon" type="image/png" href="./icon.PNG?v=43">
  <link rel="manifest" href="./manifest.webmanifest?v=43">

  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0; width: 100%; height: 100%;
      background: linear-gradient(135deg,#fff5f7,#f5f0fa 55%,#f0f7f7);
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", sans-serif;
      color:#55485d;
    }
    .wrap {
      min-height:100%;
      display:grid;
      place-items:center;
      padding:24px;
      text-align:center;
    }
    .orb {
      width:64px;height:64px;border-radius:50%;margin:0 auto 16px;
      background:radial-gradient(circle at 35% 30%,#fff,#e2c9ff 36%,#a47dd3 70%,#6d4a92);
      box-shadow:0 0 30px rgba(164,125,211,.38);
    }
    h1 { margin:0 0 8px; font-size:22px; }
    p { margin:0 0 18px; color:#7b6f82; line-height:1.6; }
    a {
      display:inline-block;
      padding:12px 16px;
      border-radius:14px;
      background:#fff;
      color:#75589b;
      font-weight:800;
      text-decoration:none;
      box-shadow:0 5px 22px rgba(50,35,55,.12);
    }
  </style>

  <script>
    // 중요: iframe으로 임베드하지 않고 Streamlit을 최상위 페이지로 직접 엽니다.
    // private/auth Streamlit은 iframe 인증이 지원되지 않기 때문에 top-level navigation이 필요합니다.
    window.addEventListener('DOMContentLoaded', () => {
      setTimeout(() => window.location.replace('https://astro-app-wmz23ohfmhmhrhrz2gg3kej.streamlit.app/'), 350);
    });
  </script>
</head>
<body>
  <main class="wrap">
    <div>
      <div class="orb"></div>
      <h1>별빛의 운명</h1>
      <p>정밀 운세 앱을 여는 중…</p>
      <a href="https://astro-app-wmz23ohfmhmhrhrz2gg3kej.streamlit.app/">바로 열기</a>
    </div>
  </main>
</body>
</html>
