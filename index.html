<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f8edf7">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="별빛의 운명">
  <title>별빛의 운명</title>

  <link rel="apple-touch-icon" href="./icon.PNG?v=46">
  <link rel="icon" type="image/png" href="./icon.PNG?v=46">
  <link rel="manifest" href="./manifest.webmanifest?v=46">

  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0; width: 100%; min-height: 100%;
      background: linear-gradient(135deg,#fff5f7,#f5f0fa 55%,#f0f7f7);
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", sans-serif;
      color:#55485d;
    }
    .wrap {
      min-height:100vh; display:grid; place-items:center;
      padding:28px; text-align:center;
    }
    .card {
      width:min(420px,100%); padding:28px 22px;
      border-radius:24px; background:rgba(255,255,255,.78);
      box-shadow:0 12px 34px rgba(85,72,93,.12);
      border:1px solid rgba(255,255,255,.9);
      backdrop-filter: blur(16px);
    }
    .orb {
      width:70px;height:70px;border-radius:50%;margin:0 auto 16px;
      background:radial-gradient(circle at 35% 30%,#fff,#e2c9ff 36%,#a47dd3 70%,#6d4a92);
      box-shadow:0 0 32px rgba(164,125,211,.38);
    }
    h1 { margin:0 0 8px; font-size:24px; }
    p { margin:0 0 20px; color:#7b6f82; line-height:1.65; font-size:14px; }
    .open {
      display:block; width:100%; padding:14px 18px;
      border-radius:15px; background:#fff; color:#75589b;
      font-weight:800; text-decoration:none;
      box-shadow:0 5px 20px rgba(50,35,55,.10);
    }
    .hint {
      margin-top:16px; padding:12px 13px; border-radius:14px;
      background:rgba(193,166,220,.10);
      color:#6d6075; font-size:12px; line-height:1.55;
    }
  </style>

  <script>
    function launchedFromHomeScreen() {
      return window.navigator.standalone === true ||
             window.matchMedia('(display-mode: standalone)').matches;
    }

    window.addEventListener('DOMContentLoaded', () => {
      // Safari에서 이 페이지를 열었을 때는 여기 머문다.
      // 그래야 iOS '홈 화면에 추가'가 GitHub Pages의 apple-touch-icon을 읽을 수 있다.
      // 홈 화면에서 실행된 경우에만 실제 Streamlit 앱으로 이동한다.
      if (launchedFromHomeScreen()) {
        setTimeout(() => window.location.replace('https://astro-app-wmz23ohfhmhrhrz2gg3kej.streamlit.app/'), 250);
      }
    });
  </script>
</head>
<body>
  <main class="wrap">
    <section class="card">
      <div class="orb"></div>
      <h1>별빛의 운명</h1>
      <p>개인용 정밀 점성술 리포트</p>
      <a class="open" href="https://astro-app-wmz23ohfhmhrhrz2gg3kej.streamlit.app/">🌙 지금 앱 열기</a>
      <div class="hint">
        홈 화면 아이콘을 만들 때는 이 페이지에서<br>
        Safari 공유 → <strong>홈 화면에 추가</strong>를 눌러주세요.
      </div>
    </section>
  </main>
</body>
</html>
