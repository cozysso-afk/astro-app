name: Thai Lagna phase 1 final research gate

on:
  push:
    branches:
      - feature/thai-lagna-phase1-real-20260831
    paths:
      - .github/workflows/thai-lagna-phase1-final-gate.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/thai-lagna-phase1-real-20260831
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Swiss Ephemeris
        run: python -m pip install --disable-pip-version-check pyswisseph==2.10.3.2

      - name: Finalize Phase-1 metadata
        run: python scripts/finalize_thai_lagna_phase1.py

      - name: Syntax gate
        run: python -m py_compile thai_suriyayat_v1.py thai_lagna_v1.py thai_astrology_v2.py integrated_fortune_v1.py api/main.py

      - name: Permanent seven-vector corpus
        run: python -m unittest discover -s tests -p 'test_thai_lagna_v1.py' -v

      - name: World-coordinate computation matrix
        run: |
          python - <<'PY'
          import math
          from datetime import date,time,timedelta,datetime
          from thai_lagna_v1 import build_suriyayat_lagna_research,calculate_common_anto_0600,angular_delta_deg

          cases=[
            ('Yeosu',34.7604,127.6622,9.0),
            ('Seoul',37.5665,126.9780,9.0),
            ('Tokyo',35.6762,139.6503,9.0),
            ('New York',40.7128,-74.0060,-4.0),
            ('London',51.5074,-0.1278,1.0),
            ('Sydney',-33.8688,151.2093,10.0),
            ('Santiago',-33.4489,-70.6693,-4.0),
            ('Singapore',1.3521,103.8198,8.0),
          ]
          for name,lat,lon,utc in cases:
            r=build_suriyayat_lagna_research(
              birth_date=date(1991,3,21),birth_time=time(7,26),
              latitude=lat,longitude=lon,utc_offset_hours=utc,
            )
            assert r['available'] and r['research_only']
            assert r['promotion_status']=='research_only_not_for_interpretation'
            for key in ('common_anto_0600_lmt','astronomical_suriyayat_sidereal_crosscheck'):
              x=float(r[key]['longitude_deg'])
              assert math.isfinite(x) and 0<=x<360,(name,key,x)
            assert not r['promotion_gate']['houses_allowed']
            assert not r['promotion_gate']['gemini_interpretation_allowed']
            print(name,r['common_anto_0600_lmt']['display'],r['astronomical_suriyayat_sidereal_crosscheck']['display'],'delta_arcmin=',r['candidate_delta_arcmin'])
          print('WORLD_COORDINATE_MATRIX_PASS',len(cases))

          # Five-minute continuity stress test for the selected common method.
          start=datetime(2026,3,24,0,0)
          previous=None
          max_step=0.0
          for i in range(24*12):
            dt=start+timedelta(minutes=5*i)
            row=calculate_common_anto_0600(
              birth_date=dt.date(),birth_time=dt.time(),longitude=100.494066,
              utc_offset_hours=7.0,adjust_local_mean_time=True,
            )
            x=float(row['longitude_deg'])
            if previous is not None:
              step=abs(angular_delta_deg(x,previous))
              max_step=max(max_step,step)
              assert step<3.0,(dt.isoformat(),step)
            previous=x
          print('COMMON_5MIN_CONTINUITY_PASS max_step_deg=',round(max_step,6))
          PY

      - name: Product isolation gate
        run: |
          python - <<'PY'
          from pathlib import Path
          lagna=Path('thai_lagna_v1.py').read_text()
          thai=Path('thai_astrology_v2.py').read_text()
          edge=Path('supabase/functions/fortune-interpret-v6-preview/core.ts').read_text()
          assert '"vectors": 7' in lagna
          assert '"year_span": "1777-2026"' in lagna
          assert '"global_coordinates_independently_validated": False' in lagna
          assert '"lagna_research": lagna_research' in thai
          assert '"available": False' in thai
          assert 'lagna_research' not in edge
          assert 'suriyayat_lagna:Boolean(payload?.thai?.suriyayat?.lagna?.available)' in Path('supabase/functions/fortune-interpret-v6-preview/index.ts').read_text()
          print('PRODUCT_ISOLATION_GATE_PASS')
          PY

      - name: Diff safety
        run: |
          git diff --check
          git status --short

      - name: Commit validated Phase-1 checkpoint
        run: |
          rm -rf __pycache__ api/__pycache__ tests/__pycache__
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f scripts/finalize_thai_lagna_phase1.py .github/workflows/thai-lagna-phase1-final-gate.yml
          git add thai_lagna_v1.py thai_astrology_v2.py tests/test_thai_lagna_v1.py
          git commit -m 'test: finalize Thai Lagna phase 1 research checkpoint'
          git push origin HEAD:feature/thai-lagna-phase1-real-20260831
