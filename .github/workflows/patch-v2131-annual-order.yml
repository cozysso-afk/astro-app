name: Finalize annual interpretation hierarchy

on:
  push:
    branches: [work/ai-cost-guard-v21]
    paths:
      - '.github/workflows/patch-v2131-annual-order.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch annual semantic order
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('web/src/AiInterpretationPanel.tsx')
          s=p.read_text()
          old='{showRelationshipFocus && relationshipReading ? <><div className="ai-highlight"><strong>관계 · 연락 · 재회 핵심 흐름</strong>'
          new='{showRelationshipFocus && relationshipReading ? <><div className="ai-highlight ai-relationship-highlight"><strong>관계 · 연락 · 재회 핵심 흐름</strong>'
          if old not in s: raise SystemExit('relationship highlight anchor missing')
          s=s.replace(old,new,1)
          old='<div className="ai-direction-grid"><article><strong>이어지는 흐름</strong><p>{relationshipReading.flow}</p>'
          new='<div className="ai-direction-grid ai-relationship-direction"><article><strong>이어지는 흐름</strong><p>{relationshipReading.flow}</p>'
          if old not in s: raise SystemExit('relationship direction anchor missing')
          s=s.replace(old,new,1)
          p.write_text(s)

          css=Path('web/src/ai-interpret-v2.css')
          c=css.read_text()
          c += '''\n\n/* V21.3.1 UI audit · semantic order for annual reading */\n.ai-interpret-card>.ai-interpret-head{order:-100}\n.ai-interpret-card>.ai-overall-block{order:-90}\n.ai-interpret-card>.ai-quick-dates{order:-80}\n.ai-interpret-card>.ai-decision-section{order:-70}\n.ai-interpret-card>.ai-key-window-section{order:-60}\n.ai-interpret-card>.ai-relationship-highlight{order:-50}\n.ai-interpret-card>.ai-relationship-direction{order:-49}\n'''
          css.write_text(c)
          PY
      - name: Verify web build
        shell: bash
        run: |
          set -euo pipefail
          cd web
          npm ci
          npm run build
      - name: Diff sanity
        run: git diff --check
      - name: Commit and clean one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/patch-v2131-annual-order.yml
          git add web/src/AiInterpretationPanel.tsx web/src/ai-interpret-v2.css
          git commit -m 'fix(ui): align annual interpretation reading order'
          git push origin HEAD:work/ai-cost-guard-v21
