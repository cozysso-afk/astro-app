name: Apply Gemini-first cost cap v46

on:
  push:
    branches:
      - fix/gemini-main-cost-cap-v46

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply focused patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p=Path(path); s=p.read_text(encoding='utf-8')
              if old not in s:
                  raise SystemExit(f'anchor missing: {path}\n{old[:180]}')
              p.write_text(s.replace(old,new,1),encoding='utf-8')

          # 1) Fortune AI: replace byte-only blocking with a 300 KRW estimated whole-job cap.
          path='supabase/functions/fortune-interpret-v21-preview/costGuardV21.ts'
          old='''export function promptBudget(payload:any){
            const packet=buildPromptPacket(payload);
            const bytes=jsonBytes(packet);
            const kind=String(payload?.period_kind??"annual");
            const max_bytes=kind==="annual"?95000:kind==="month"?76000:kind==="week"?62000:52000;
            return {packet,bytes,max_bytes,ok:bytes<=max_bytes,estimated_input_tokens:Math.ceil(bytes/2.6)};
          }
          '''
          new='''const MAX_AI_JOB_ESTIMATED_KRW=300;
          const GEMINI_USD_KRW_ESTIMATE=1384;
          const GEMINI_INTRO_END=Date.parse("2026-12-31T23:59:59Z");
          const HARD_PROMPT_BYTES=180000;
          function fortuneOutputCaps(kind:string){if(kind==="annual")return [7200,6200];if(kind==="month")return [5600,4800];if(kind==="week")return [4700,4000];return [4000,3400];}
          function estimatedGeminiJobKrw(inputTokens:number,kind:string){
            const intro=Date.now()<=GEMINI_INTRO_END,inputRate=intro?.75:1.5,outputRate=intro?3.75:7.5;
            const [firstOutput,retryOutput]=fortuneOutputCaps(kind),thoughtReserve=3000;
            const one=(output:number)=>((inputTokens/1_000_000)*inputRate+((output+thoughtReserve)/1_000_000)*outputRate)*GEMINI_USD_KRW_ESTIMATE;
            return one(firstOutput)+one(retryOutput);
          }
          function compressPromptPacketForCost(packet:any,level:number){
            if(level<=0)return packet;
            const out=structuredClone(packet);
            const must=new Set<string>();
            for(const row of out?.deterministic_topic_summary??[])for(const ref of row?.evidence_refs??[])must.add(String(ref));
            for(const row of out?.key_dates??[])for(const ref of row?.western_refs??[])must.add(String(ref));
            for(const row of out?.cross_system_timeline??[]){for(const ref of row?.saju_context_refs??[])must.add(String(ref));for(const ref of row?.thai_context_refs??[])must.add(String(ref));}
            const evidence=Array.isArray(out?.evidence_ledger)?out.evidence_ledger:[];
            const priority=[...evidence.filter((row:any)=>must.has(String(row?.id??""))),...evidence.filter((row:any)=>!must.has(String(row?.id??"")))];
            out.evidence_ledger=priority.slice(0,level===1?80:55);
            out.key_dates=(out?.key_dates??[]).slice(0,level===1?6:4);
            out.cross_system_timeline=(out?.cross_system_timeline??[]).slice(0,level===1?6:4);
            if(out.western){
              out.western.detail_days=(out.western.detail_days??[]).slice(0,level===1?6:4);
              out.western.observed_transit_context=(out.western.observed_transit_context??[]).slice(0,level===1?16:10);
            }
            return out;
          }
          export function promptBudget(payload:any){
            const base=buildPromptPacket(payload);
            const kind=String(payload?.period_kind??"annual");
            const legacy_max_bytes=kind==="annual"?95000:kind==="month"?76000:kind==="week"?62000:52000;
            let last:any=null;
            for(let level=0;level<=2;level++){
              const packet=compressPromptPacketForCost(base,level),bytes=jsonBytes(packet),estimated_input_tokens=Math.ceil(bytes/2.6),estimated_max_job_krw=estimatedGeminiJobKrw(estimated_input_tokens,kind);
              last={packet,bytes,max_bytes:HARD_PROMPT_BYTES,legacy_max_bytes,estimated_input_tokens,estimated_max_job_krw,max_job_krw:MAX_AI_JOB_ESTIMATED_KRW,compression_level:level,ok:bytes<=HARD_PROMPT_BYTES&&estimated_max_job_krw<=MAX_AI_JOB_ESTIMATED_KRW};
              if(last.ok)return last;
            }
            return last;
          }
          '''
          replace_once(path,old,new)

          # Fortune server error now explains the real cost rule, not the old byte threshold.
          path='supabase/functions/fortune-interpret-v21-preview/index.ts'
          old='''  if(!pb.ok)return {ok:false,error:`AI 입력 근거가 비용 상한을 넘었어(${pb.bytes}/${pb.max_bytes} bytes). Gemini를 호출하지 않았어.`,model,cost_guard_blocked:true,prompt_budget:pb};'''
          new='''  if(!pb.ok)return {ok:false,error:`AI 해설 예상 최대 비용이 약 ${Math.round(pb.estimated_max_job_krw)}원으로 작업 상한 ${pb.max_job_krw}원을 넘어 Gemini 호출을 막았어.`,model,cost_guard_blocked:true,prompt_budget:pb};'''
          replace_once(path,old,new)

          # 2) Relationship AI: allow the old 110 KB cases when the whole two-call job stays under 300 KRW.
          path='supabase/functions/relationship-interpret-v9-preview/index.ts'
          old='''const MAX_GEMINI_CALLS=2,MAX_PROMPT_BYTES=110000;'''
          new='''const MAX_GEMINI_CALLS=2,MAX_PROMPT_BYTES=180000,MAX_AI_JOB_ESTIMATED_KRW=300;
          const GEMINI_USD_KRW_ESTIMATE=1384,GEMINI_INTRO_END=Date.parse("2026-12-31T23:59:59Z");'''
          replace_once(path,old,new)
          old='''function promptBudget(payload:any,purpose:Purpose){const bytes=enc.encode(SYSTEM+promptText(payload,purpose,false)).length;return {bytes,max_bytes:MAX_PROMPT_BYTES,ok:bytes<=MAX_PROMPT_BYTES,estimated_input_tokens:Math.ceil(bytes/2.6)};}'''
          new='''function relationshipEstimatedJobKrw(inputTokens:number){const intro=Date.now()<=GEMINI_INTRO_END,inputRate=intro?.75:1.5,outputRate=intro?3.75:7.5,thoughtReserve=3000;const one=(output:number)=>((inputTokens/1_000_000)*inputRate+((output+thoughtReserve)/1_000_000)*outputRate)*GEMINI_USD_KRW_ESTIMATE;return one(16000)+one(12000);}
          function promptBudget(payload:any,purpose:Purpose){const bytes=enc.encode(SYSTEM+promptText(payload,purpose,false)).length,estimated_input_tokens=Math.ceil(bytes/2.6),estimated_max_job_krw=relationshipEstimatedJobKrw(estimated_input_tokens);return {bytes,max_bytes:MAX_PROMPT_BYTES,ok:bytes<=MAX_PROMPT_BYTES&&estimated_max_job_krw<=MAX_AI_JOB_ESTIMATED_KRW,estimated_input_tokens,estimated_max_job_krw,max_job_krw:MAX_AI_JOB_ESTIMATED_KRW};}'''
          replace_once(path,old,new)
          old='''if(!budget.ok)return respond({...publicRelationshipError("REL_COST_GUARD_BLOCKED",{cost_guard_blocked:true}),prompt_budget:true,error:`관계 해설 근거를 3단계로 압축했지만 안전 상한 ${budget.max_bytes.toLocaleString()} bytes를 넘어 Gemini 호출을 막았어.`,prompt_bytes:budget.bytes,max_prompt_bytes:budget.max_bytes,prompt_compression_level:pack.compression_level,original_prompt_bytes:pack.original_prompt_bytes},200);'''
          new='''if(!budget.ok)return respond({...publicRelationshipError("REL_COST_GUARD_BLOCKED",{cost_guard_blocked:true}),prompt_budget:true,error:`관계 해설을 3단계로 압축했지만 예상 최대 비용 약 ${Math.round(budget.estimated_max_job_krw)}원이 작업 상한 ${budget.max_job_krw}원을 넘어 Gemini 호출을 막았어.`,prompt_bytes:budget.bytes,max_prompt_bytes:budget.max_bytes,estimated_max_job_krw:budget.estimated_max_job_krw,max_job_krw:budget.max_job_krw,prompt_compression_level:pack.compression_level,original_prompt_bytes:pack.original_prompt_bytes},200);'''
          replace_once(path,old,new)
          old='''const result:any={...generated,prompt_bytes:budget.bytes,max_prompt_bytes:budget.max_bytes,prompt_compression_level:pack.compression_level,original_prompt_bytes:pack.original_prompt_bytes};'''
          new='''const result:any={...generated,prompt_bytes:budget.bytes,max_prompt_bytes:budget.max_bytes,estimated_max_job_krw:budget.estimated_max_job_krw,max_job_krw:budget.max_job_krw,prompt_compression_level:pack.compression_level,original_prompt_bytes:pack.original_prompt_bytes};'''
          replace_once(path,old,new)

          # 3) Period fortune: Gemini natural-language reading is the primary surface; code reading is a collapsed fallback.
          path='web/src/PeriodFortuneResults.tsx'
          old='''  const aiOpen = Boolean(aiInterpretation?.data || aiLoading)
          return <div className="fortune-experience">'''
          new='''  const hasNaturalReading = Boolean(aiInterpretation?.ok && aiInterpretation.data)
          return <div className="fortune-experience">'''
          replace_once(path,old,new)
          old='''    <SystemReadingViews initialSystem={initialSystem} loveStatus={field?.id==='love'?loveStatus:undefined} key={`${fieldId}-${initialSystem}`} calculation={result} field={field}><>
              <BasicFortuneReading calculation={result} period={period} field={field}/>
              <details className="period-deep-reading" open={aiOpen}>
                <summary><span>AI 심층해설</span><small>선택 기능 · 기본 해설은 위에서 항상 제공</small></summary>
                <PeriodAiInterpretationPanel loveStatus={loveStatus} field={field} period={period} calculation={result} result={aiInterpretation} loading={aiLoading} error={aiError} cacheSource={aiCacheSource} onRetry={onRetryAi} onCopyPrompt={onCopyAiPrompt} onCancel={onCancelAi} canCancel={aiCanCancel} technicalDetails={technicalDetails}/>
              </details>
            </></SystemReadingViews>'''
          new='''    <SystemReadingViews initialSystem={initialSystem} loveStatus={field?.id==='love'?loveStatus:undefined} key={`${fieldId}-${initialSystem}`} calculation={result} field={field}><>
              <PeriodAiInterpretationPanel loveStatus={loveStatus} field={field} period={period} calculation={result} result={aiInterpretation} loading={aiLoading} error={aiError} cacheSource={aiCacheSource} onRetry={onRetryAi} onCopyPrompt={onCopyAiPrompt} onCancel={onCancelAi} canCancel={aiCanCancel} technicalDetails={technicalDetails}/>
              <details className="period-fallback-reading" open={!hasNaturalReading && !aiLoading}>
                <summary><span>계산 기반 보조 해설</span><small>{hasNaturalReading ? 'Gemini 해설의 보조 근거' : '자연어 해설을 못 불러올 때 확인'}</small></summary>
                <BasicFortuneReading calculation={result} period={period} field={field}/>
              </details>
            </></SystemReadingViews>'''
          replace_once(path,old,new)

          # 4) Relationship: put Gemini text first and collapse deterministic prose to fallback once Gemini exists.
          path='web/src/RelationshipInterpretationPanel.tsx'
          old='''    <header className="reading-hero"><span className="celestial-mark" aria-hidden="true"><Orbit size={26}/></span><p className="eyebrow">{view.title}</p><h3>{view.headline}</h3><p className="reading-hero-subtitle">{reunion ? '다시 연락하는 계기와 관계를 회복할 준비를 나눠서 읽어봐.' : analysisMode === 'marriage_married' ? '이미 함께하는 생활 안에서 지킬 것과 조정할 것을 살펴봐.' : analysisMode === 'marriage_unmarried' ? '끌림뿐 아니라 함께 살아갈 때의 약속과 부담까지 살펴봐.' : '잘 맞는 부분과 서로 배워야 할 부분을 함께 읽어봐.'}</p></header>
            <section className="reading-section relationship-full-reading">'''
          new='''    <header className="reading-hero"><span className="celestial-mark" aria-hidden="true"><Orbit size={26}/></span><p className="eyebrow">{view.title}</p><h3>{view.headline}</h3><p className="reading-hero-subtitle">{reunion ? '다시 연락하는 계기와 관계를 회복할 준비를 나눠서 읽어봐.' : analysisMode === 'marriage_married' ? '이미 함께하는 생활 안에서 지킬 것과 조정할 것을 살펴봐.' : analysisMode === 'marriage_unmarried' ? '끌림뿐 아니라 함께 살아갈 때의 약속과 부담까지 살펴봐.' : '잘 맞는 부분과 서로 배워야 할 부분을 함께 읽어봐.'}</p></header>
            {ai?.ok && ai.data ? <section className="reading-section relationship-natural-reading"><h3>{ai.data.headline}</h3><p className="reading-conclusion">{analysisMode === 'reunion' ? ai.data.reunion_reading?.bottom_line || ai.data.overview : analysisMode.startsWith('marriage_') ? ai.data.marriage_reading?.bottom_line || ai.data.overview : ai.data.overview}</p>{analysisMode==='reunion' ? <><ReadingExplanation kind="reason">{ai.data.reunion_reading?.contact_recontact} {ai.data.reunion_reading?.emotional_reactivation} {ai.data.reunion_reading?.relationship_rebuilding}</ReadingExplanation><ReadingExplanation kind="practice">{ai.data.reunion_reading?.incoming_contact} {ai.data.reunion_reading?.outgoing_contact}</ReadingExplanation><ReadingExplanation kind="timing">{ai.data.reunion_reading?.reconnection_windows}</ReadingExplanation><ReadingExplanation kind="caution">{ai.data.reunion_reading?.low_windows} {ai.data.reunion_reading?.relationship_filter}</ReadingExplanation></> : analysisMode.startsWith('marriage_') ? <><ReadingExplanation kind="reason">{ai.data.marriage_reading?.bond} {ai.data.marriage_reading?.emotional_home}</ReadingExplanation><ReadingExplanation kind="practice">{ai.data.marriage_reading?.daily_life} {ai.data.marriage_reading?.intimacy_resources} {ai.data.marriage_reading?.conflict_repair}</ReadingExplanation><ReadingExplanation kind="timing">{ai.data.marriage_reading?.commitment_or_current_cycle} {ai.data.marriage_reading?.timing}</ReadingExplanation><ReadingExplanation kind="caution">{ai.data.marriage_reading?.caution}</ReadingExplanation></> : <><ReadingExplanation kind="reason">{ai.data.chemistry} {ai.data.emotional_dynamic} {ai.data.communication}</ReadingExplanation><ReadingExplanation kind="practice">{ai.data.long_term} {(ai.data.practical_advice??[]).join(' ')}</ReadingExplanation><ReadingExplanation kind="timing">{ai.data.timing}</ReadingExplanation><ReadingExplanation kind="caution">{ai.data.conflict_pattern} {ai.data.power_boundaries}</ReadingExplanation></>}</section> : <section className="reading-section relationship-natural-reading is-ready"><h3>Gemini 자연어 해설</h3><p>계산은 끝났어. 저장된 자연어 해설이 없으면 여기서 한 번 생성해.</p><button type="button" onClick={onAi} disabled={aiLoading}><Sparkles size={16}/>{aiLoading ? '관계 흐름을 정리하고 있어…' : '자연어 해설 생성'}</button>{aiError && <p className="reading-alert" role="status"><AlertTriangle size={16}/>{aiError}</p>}</section>}
            <details className="relationship-calculated-fallback" open={!(ai?.ok && ai.data)}><summary>계산 기반 보조 해설</summary>
            <section className="reading-section relationship-full-reading">'''
          replace_once(path,old,new)
          old='''    <p className="reading-safety-note">{partnerExact ? '계산된 관계 패턴이야. 실제 감정이나 관계의 결과를 확정하지 않아.' : '출생시간이 검증되지 않은 요소는 제외했어. 실제 감정이나 관계의 결과를 확정하지 않아.'}</p>
            <details className="relationship-enrichment"><summary>추가 맞춤 해설</summary>
              {ai?.ok && ai.data ? <><p>{ai.data.headline}</p><p>{analysisMode === 'reunion' ? ai.data.reunion_reading?.bottom_line || ai.data.overview : analysisMode.startsWith('marriage_') ? ai.data.marriage_reading?.bottom_line || ai.data.overview : ai.data.overview}</p></> : <><p>기본 해설은 위에서 볼 수 있어. 추가 해설은 별도로 요청할 수 있어.</p><button type="button" onClick={onAi} disabled={aiLoading}><Sparkles size={16}/>{aiLoading ? '관계 흐름을 정리하고 있어…' : '추가 해설 요청'}</button></>}
              {aiError && <p className="reading-alert" role="status"><AlertTriangle size={16}/>{aiError}</p>}
            </details>
            <details className="relationship-technical">'''
          new='''    <p className="reading-safety-note">{partnerExact ? '계산된 관계 패턴이야. 실제 감정이나 관계의 결과를 확정하지 않아.' : '출생시간이 검증되지 않은 요소는 제외했어. 실제 감정이나 관계의 결과를 확정하지 않아.'}</p>
            </details>
            <details className="relationship-technical">'''
          replace_once(path,old,new)

          # 5) Relationship Gemini result: cache + archive automatically, so a paid reading is not paid for twice.
          path='web/src/AppNext.tsx'
          old='''      await writeReadingCache(relationshipCacheId, 'relationship-ai', annotated, RELATIONSHIP_AI_CACHE_TTL_DAYS)
                setRelationshipAi(annotated)
                setRelationshipAiCacheSource('fresh')'''
          new='''      await writeReadingCache(relationshipCacheId, 'relationship-ai', annotated, RELATIONSHIP_AI_CACHE_TTL_DAYS)
                setRelationshipAi(annotated)
                setRelationshipAiCacheSource('fresh')
                if (relationshipRequestSnapshot) {
                  const autoKind = selectedTool === 'marriage' ? 'marriage' : 'compatibility'
                  const autoIsReunion = selectedTool === 'compatibility' && relationshipPurpose === 'reunion'
                  const autoRequest = autoIsReunion ? { ...relationshipRequestSnapshot, reunion_context: reunionTiming, archive_mode:'relationship_ai_auto_v1' } : { ...relationshipRequestSnapshot, archive_mode:'relationship_ai_auto_v1' }
                  const cp = (relationshipRequestSnapshot.counterpart ?? {}) as Record<string, unknown>
                  const autoLabel = autoKind === 'marriage' ? '결혼운' : autoIsReunion ? '재회운' : '궁합운'
                  void saveArchive({kind:autoKind,periodKey:relationshipPeriodKey,title:`${autoLabel} · ${String(cp.name ?? '상대')} · ${relationshipResult.period.start}`,periodStart:relationshipResult.period.start,periodEnd:relationshipResult.period.end,engine:relationshipResult.engine,request:autoRequest,result:relationshipResult as unknown as Record<string,unknown>,interpretation:annotated as unknown as Record<string,unknown>},`relationship-ai:${relationshipCacheId}`)
                }'''
          replace_once(path,old,new)

          # 6) Contract tests: natural language is primary, deterministic prose is fallback, and cost is job-based.
          path='web/src/lib/basicFortuneReading.test.mjs'
          old="""test('period UI renders substantial in-app reading before optional AI depth',()=>{\n  const source=readFileSync(new URL('../PeriodFortuneResults.tsx',import.meta.url),'utf8')\n  const component=readFileSync(new URL('../BasicFortuneReading.tsx',import.meta.url),'utf8')\n  const basic=source.indexOf('<BasicFortuneReading')\n  const deep=source.indexOf('className=\"period-deep-reading\"')\n  assert.ok(basic>=0 && deep>basic)\n  assert.match(component,/앱 기본 해설/)\n  assert.match(component,/왜 이렇게 보냐면/)\n  assert.match(component,/현실에서는/)\n  assert.match(component,/주의할 점/)\n  assert.doesNotMatch(component,/추가 AI 호출 없음/)\n  assert.match(source,/AI 심층해설/)\n})"""
          new="""test('period UI keeps Gemini natural language primary and deterministic reading as fallback',()=>{\n  const source=readFileSync(new URL('../PeriodFortuneResults.tsx',import.meta.url),'utf8')\n  const component=readFileSync(new URL('../BasicFortuneReading.tsx',import.meta.url),'utf8')\n  const natural=source.indexOf('<PeriodAiInterpretationPanel')\n  const fallback=source.indexOf('className=\"period-fallback-reading\"')\n  assert.ok(natural>=0 && fallback>natural)\n  assert.match(source,/계산 기반 보조 해설/)\n  assert.match(source,/open={!hasNaturalReading && !aiLoading}/)\n  assert.match(component,/앱 기본 해설/)\n  assert.match(component,/왜 이렇게 보냐면/)\n})"""
          replace_once(path,old,new)

          path='web/src/lib/relationshipModeContract.test.mjs'
          old="""test('relationship modes expose a substantial deterministic reading before optional AI', () => {\n  assert.match(panel, /className=\"reading-section relationship-full-reading\"/)\n  assert.match(panel, /궁합 전체 해설/)\n  assert.match(panel, /재회 흐름 전체 해설/)\n  assert.match(panel, /결혼궁합 전체 해설/)\n  assert.match(panel, /결혼생활 전체 해설/)\n  assert.match(panel, /ReadingExplanation kind=\"reason\"/)\n  assert.match(panel, /ReadingExplanation kind=\"practice\"/)\n  assert.match(panel, /ReadingExplanation kind=\"caution\"/)\n  const rich = panel.indexOf('relationship-full-reading')\n  const enrichment = panel.indexOf('relationship-enrichment')\n  assert.ok(rich >= 0 && enrichment > rich)\n})"""
          new="""test('relationship modes keep Gemini natural language primary and deterministic prose as fallback', () => {\n  assert.match(panel, /relationship-natural-reading/)\n  assert.match(panel, /Gemini 자연어 해설/)\n  assert.match(panel, /relationship-calculated-fallback/)\n  const natural = panel.indexOf('relationship-natural-reading')\n  const fallback = panel.indexOf('relationship-calculated-fallback')\n  assert.ok(natural >= 0 && fallback > natural)\n  assert.match(panel, /궁합 전체 해설/)\n  assert.match(panel, /재회 흐름 전체 해설/)\n})"""
          replace_once(path,old,new)
          replace_once(path,"  assert.match(relationshipFn, /MAX_PROMPT_BYTES=110000/)\n","  assert.match(relationshipFn, /MAX_PROMPT_BYTES=180000,MAX_AI_JOB_ESTIMATED_KRW=300/)\n  assert.match(relationshipFn, /estimated_max_job_krw/)\n")

          path='web/src/lib/readingExperience.render.test.mjs'
          replace_once(path,"  const visible=html.split('<details class=\"relationship-enrichment\"')[0]\n","  const visible=html.split('<details class=\"relationship-technical\"')[0]\n")

          # Add one explicit source contract for the 300-won policy and auto archive.
          p=Path('web/src/lib/geminiNaturalReadingPolicy.test.mjs')
          p.write_text("""import assert from 'node:assert/strict'\nimport { readFileSync } from 'node:fs'\nimport test from 'node:test'\nconst fortune=readFileSync(new URL('../../../supabase/functions/fortune-interpret-v21-preview/costGuardV21.ts',import.meta.url),'utf8')\nconst fortuneFn=readFileSync(new URL('../../../supabase/functions/fortune-interpret-v21-preview/index.ts',import.meta.url),'utf8')\nconst relationFn=readFileSync(new URL('../../../supabase/functions/relationship-interpret-v9-preview/index.ts',import.meta.url),'utf8')\nconst period=readFileSync(new URL('../PeriodFortuneResults.tsx',import.meta.url),'utf8')\nconst relationship=readFileSync(new URL('../RelationshipInterpretationPanel.tsx',import.meta.url),'utf8')\nconst app=readFileSync(new URL('../AppNext.tsx',import.meta.url),'utf8')\ntest('AI cost guard uses estimated whole-job KRW rather than old 52-110KB hard stop',()=>{\n  assert.match(fortune,/MAX_AI_JOB_ESTIMATED_KRW=300/)\n  assert.match(fortune,/HARD_PROMPT_BYTES=180000/)\n  assert.match(fortune,/estimated_max_job_krw/)\n  assert.match(fortuneFn,/예상 최대 비용/)\n  assert.match(relationFn,/MAX_PROMPT_BYTES=180000,MAX_AI_JOB_ESTIMATED_KRW=300/)\n  assert.match(relationFn,/relationshipEstimatedJobKrw/)\n  assert.match(relationFn,/예상 최대 비용/)\n})\ntest('Gemini natural language is primary and successful relationship AI is archived automatically',()=>{\n  assert.ok(period.indexOf('<PeriodAiInterpretationPanel') < period.indexOf('period-fallback-reading'))\n  assert.ok(relationship.indexOf('relationship-natural-reading') < relationship.indexOf('relationship-calculated-fallback'))\n  assert.match(app,/archive_mode:'relationship_ai_auto_v1'/)\n  assert.match(app,/`relationship-ai:\\$\\{relationshipCacheId\\}`/)\n})\n""",encoding='utf-8')
