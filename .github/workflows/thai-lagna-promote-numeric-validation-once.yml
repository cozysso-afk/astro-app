name: Thai Lagna promote numeric validation metadata

on:
  push:
    branches:
      - feature/thai-lagna-phase1-real-20260831
    paths:
      - .github/workflows/thai-lagna-promote-numeric-validation-once.yml

permissions:
  contents: write

jobs:
  promote-metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/thai-lagna-phase1-real-20260831
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Update validation metadata without enabling interpretation
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('thai_lagna_v1.py')
          s=p.read_text(encoding='utf-8')
          replacements={
            'ENGINE_VERSION = "thai-suriyayat-lagna-research-v1.2-actual-sunrise"':
            'ENGINE_VERSION = "thai-suriyayat-lagna-research-v1.3-world-gold"',
            '"status": "bangkok_era_spanning_validated_global_pending",':
            '"status": "bangkok_era_spanning_and_world_numeric_validated_research_only",',
            '"reference": "MyHora Bangkok Suriyayat Lagna",':
            '"reference": "MyHora Suriyayat Lagna (Bangkok era-spanning + direct world-coordinate pages)",',
            '    "global_coordinates_compute_supported": True,\n    "global_coordinates_independently_validated": False,\n    "note": "Bangkok references span 249 years. The actual-sunrise common method is separately validated against MyHora. Korea/world coordinates compute without Thailand province tables, but an independent non-Thailand reference corpus is still required before promotion.",':
            '    "global_coordinates_compute_supported": True,\n    "global_coordinates_independently_validated": True,\n    "world_reference": {\n        "source": "direct MyHora Suriyayat calendar pages with explicit latitude/longitude/UTC",\n        "date_time_local": "1991-03-21 07:26",\n        "places": ["Yeosu", "Seoul", "Tokyo", "NewYork"],\n        "numeric_checks": 16,\n        "common_0600": {"max_error_arcmin": 0.0, "mean_error_arcmin": 0.0},\n        "common_lmt": {"max_error_arcmin": 0.732, "mean_error_arcmin": 0.518},\n        "actual_sunrise": {"max_error_arcmin": 8.5, "mean_error_arcmin": 4.188},\n        "actual_sunrise_lmt": {"max_error_arcmin": 7.86, "mean_error_arcmin": 4.01},\n        "sign_boundary_case": "Tokyo fixed 06:00 Pisces 27°37′ -> LMT Aries 2°16′",\n    },\n    "note": "Bangkok references span 249 years and world-coordinate numeric pages now independently validate Korea/Japan/US coordinates. Numeric Lagna positioning is validated; product exposure and downstream house/dignity/Gemini interpretation remain separately blocked.",',
            '                "world-coordinate computation without Thailand province lookup",\n            ],\n            "required": [\n                "independent non-Thailand reference corpus across multiple latitudes/longitudes/timezones",\n                "sign-boundary stress cases against independent references",\n            ],\n            "houses_allowed": False,':
            '                "world-coordinate computation without Thailand province lookup",\n                "independent MyHora world numeric corpus: Yeosu, Seoul, Tokyo, New York (16 method checks)",\n                "independent sign-boundary stress references in Bangkok and Tokyo",\n            ],\n            "required": [\n                "separate product-layer review before exposing validated Lagna position",\n                "house/dignity/aspect interpretation validation before downstream use",\n            ],\n            "lagna_numeric_position_validated": True,\n            "houses_allowed": False,',
          }
          for old,new in replacements.items():
            if old not in s:
              raise SystemExit('missing expected thai_lagna_v1.py block: '+old[:100])
            s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          p=Path('tests/test_thai_lagna_v1.py')
          s=p.read_text(encoding='utf-8')
          old='''        self.assertEqual(validation["reference"], "MyHora Bangkok Suriyayat Lagna")\n        self.assertEqual(validation["vectors"], 7)\n        self.assertEqual(validation["year_span"], "1777-2026")\n        self.assertEqual(validation["common_lmt"]["max_error_arcmin"], 15.695)\n        self.assertEqual(validation["common_lmt"]["mean_error_arcmin"], 6.03)\n        self.assertFalse(validation["global_coordinates_independently_validated"])'''
          new='''        self.assertIn("MyHora Suriyayat Lagna", validation["reference"])\n        self.assertEqual(validation["vectors"], 7)\n        self.assertEqual(validation["year_span"], "1777-2026")\n        self.assertEqual(validation["common_lmt"]["max_error_arcmin"], 15.695)\n        self.assertEqual(validation["common_lmt"]["mean_error_arcmin"], 6.03)\n        self.assertTrue(validation["global_coordinates_independently_validated"])\n        self.assertEqual(validation["world_reference"]["numeric_checks"], 16)\n        self.assertEqual(validation["world_reference"]["common_lmt"]["max_error_arcmin"], 0.732)'''
          if old not in s: raise SystemExit('missing metadata test block')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          p=Path('tests/test_thai_lagna_phase1d.py')
          s=p.read_text(encoding='utf-8')
          s=s.replace(
            'These tests intentionally do not claim independent numeric validation for\n    Korea/world Lagna. They verify mathematical and runtime properties while\n    the promotion gate remains closed pending an external non-Thailand corpus.',
            'These tests cover mathematical/runtime invariants alongside the permanent\n    independent world numeric corpus. Numeric Lagna positioning is validated, while\n    houses, dignities and Gemini interpretation remain separately gated.',
            1,
          )
          old='''        self.assertFalse(result["validation"]["global_coordinates_independently_validated"])\n        self.assertFalse(result["promotion_gate"]["houses_allowed"])'''
          new='''        self.assertTrue(result["validation"]["global_coordinates_independently_validated"])\n        self.assertTrue(result["promotion_gate"]["lagna_numeric_position_validated"])\n        self.assertFalse(result["promotion_gate"]["houses_allowed"])'''
          if old not in s: raise SystemExit('missing phase1d gate block')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - run: python -m pip install --disable-pip-version-check pyswisseph==2.10.3.2
      - name: Run full Thai Lagna suite
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s tests -p 'test_thai_lagna*.py' -v
      - name: Verify numeric promotion but interpretation stays blocked
        env:
          PYTHONPATH: .
        run: |
          python - <<'PY'
          from datetime import date,time
          from thai_lagna_v1 import build_suriyayat_lagna_research
          r=build_suriyayat_lagna_research(birth_date=date(1991,3,21),birth_time=time(7,26),latitude=34.7604,longitude=127.6622,utc_offset_hours=9.0)
          assert r['validation']['global_coordinates_independently_validated'] is True
          assert r['promotion_gate']['lagna_numeric_position_validated'] is True
          assert r['research_only'] is True
          assert r['promotion_gate']['houses_allowed'] is False
          assert r['promotion_gate']['dignities_allowed'] is False
          assert r['promotion_gate']['gemini_interpretation_allowed'] is False
          print('NUMERIC_VALIDATION_PROMOTED_INTERPRETATION_BLOCKED')
          PY
      - name: Commit validated research state and clean workflow
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add thai_lagna_v1.py tests/test_thai_lagna_v1.py tests/test_thai_lagna_phase1d.py tests/test_thai_lagna_world_gold.py
          git rm -f .github/workflows/thai-lagna-promote-numeric-validation-once.yml
          git commit -m 'research: validate Thai Lagna numeric world coordinates'
          git push origin HEAD:feature/thai-lagna-phase1-real-20260831
