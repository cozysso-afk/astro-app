name: PR270 version compatibility patch

on:
  push:
    paths:
      - "scripts/patch_pr270_quality_version_once.py"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/quality-v6-no-padding-gates
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/patch_pr270_quality_version_once.py
      - run: git diff --check
      - name: Commit patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/fortune-interpret-v6-preview/qualityV2.ts
          git commit -m "fix: keep Quality version compatible with public sanitizer"
          git push origin HEAD:refactor/quality-v6-no-padding-gates
