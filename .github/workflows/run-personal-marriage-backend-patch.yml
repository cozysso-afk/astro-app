name: Run personal marriage backend patch

on:
  push:
    branches:
      - work/ai-cost-guard-v21
    paths:
      - '.github/workflows/run-personal-marriage-backend-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply API patch
        run: python scripts/patch_personal_marriage_backend.py
      - name: Install calculation dependencies
        run: python -m pip install -r api/requirements.txt
      - name: Verify personal marriage calculation and API syntax
        run: |
          python -m py_compile personal_marriage_v1.py api/main.py
          python -m pytest -q tests/test_personal_marriage_v1.py
          git diff --check
      - name: Commit verified backend
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add personal_marriage_v1.py tests/test_personal_marriage_v1.py api/main.py
          git commit -m 'feat(marriage): split personal unmarried calculation'
          git push origin HEAD:work/ai-cost-guard-v21
