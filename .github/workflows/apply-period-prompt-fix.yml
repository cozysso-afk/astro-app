name: Apply Period Prompt Fix

on:
  push:
    branches:
      - work/integrated-interpretation-v2
    paths:
      - .github/workflows/apply-period-prompt-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/integrated-interpretation-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Wire period-specific prompt focus
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('supabase/functions/fortune-interpret-v6-preview/index.ts')
          s=p.read_text(encoding='utf-8')
          old='import { QUALITY_VERSION, inspectInterpretationQuality, strictQualityRetryInstruction } from "./qualityV2.ts";\n'
          new=old+'import { periodModeInstruction } from "./periodInstruction.ts";\n'
          if 'from "./periodInstruction.ts"' not in s:
              if old not in s: raise SystemExit('period instruction import anchor missing')
              s=s.replace(old,new,1)
          old_block='''    const modeInstruction=compactMode\n      ?"이전 생성이 검증을 끝까지 통과하지 못했다. 문장을 불필요하게 늘리지 말되 핵심 시기·근거 ID·행동을 빠뜨리지 말고 완전한 JSON으로 끝내라."\n      :"연평균만 요약하지 말고 365일 일별 궤적→월별 변화→핵심 날짜→독립 체계 교차맥락 순으로 분석하라. 중요한 날짜 문단에는 계산엔진이 보존한 실제 일별 트랜짓·하우스 근거 W:daily:*를 우선 연결하라.";\n'''
          new_block='''    const modeInstruction=periodModeInstruction(payload,compactMode);\n'''
          if old_block in s:
              s=s.replace(old_block,new_block,1)
          elif new_block not in s:
              raise SystemExit('mode instruction anchor missing')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Period prompt and interpretation tests
        run: |
          node --experimental-strip-types --test supabase/functions/fortune-interpret-v6-preview/periodInstruction.test.mjs
          node --experimental-strip-types --test supabase/functions/fortune-interpret-v6-preview/integratedInterpretationV2.test.mjs
          node --experimental-strip-types --test supabase/functions/fortune-interpret-v6-preview/thaiContract.test.mjs
      - name: Web production build
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Commit runtime prompt fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/functions/fortune-interpret-v6-preview/index.ts
          git diff --cached --quiet && exit 0
          git commit -m 'fix(ai): branch interpretation focus by period'
          git push origin HEAD:work/integrated-interpretation-v2
