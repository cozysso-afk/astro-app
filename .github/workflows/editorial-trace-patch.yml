name: Editorial trace patch

on:
  push:
    branches:
      - audit/editorial-prose-trace-v1

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/editorial-prose-trace-v1
      - name: Apply trace patch
        run: python .github/editorial_trace_patch.py
      - name: Commit trace patch
        run: |
          if git diff --quiet; then
            echo "No patch needed"
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add supabase/functions/fortune-interpret-v23-preview/index.ts
          git commit -m "audit: instrument V23 prose ownership trace"
          git push origin HEAD:audit/editorial-prose-trace-v1
