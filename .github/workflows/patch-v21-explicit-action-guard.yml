name: Patch V21 explicit paid action guard

on:
  push:
    branches: [work/ai-cost-guard-v21]
    paths:
      - "scripts/patch_v21_explicit_action_guard.py"
      - ".github/workflows/patch-v21-explicit-action-guard.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply explicit paid action guard
        run: python scripts/patch_v21_explicit_action_guard.py

      - name: Run V21 cost guard tests
        run: node --experimental-strip-types --test supabase/functions/fortune-interpret-v21-preview/costGuardV21.test.mjs

      - name: Diff sanity check
        run: git diff --check

      - name: Explicit-action guard sanity
        shell: bash
        run: |
          grep -q 'supabase-ai-v21.2.1-explicit-action-guard' supabase/functions/fortune-interpret-v21-preview/index.ts
          grep -Fq 'b?.action!=="start"' supabase/functions/fortune-interpret-v21-preview/index.ts
          if grep -Fq 'calculate(payload,preferred,key,async()=>true)' supabase/functions/fortune-interpret-v21-preview/index.ts; then
            echo 'Direct paid calculate fallback still exists.'
            exit 1
          fi

      - name: Commit patch and remove one-shot files
        shell: bash
        run: |
          git rm scripts/patch_v21_explicit_action_guard.py .github/workflows/patch-v21-explicit-action-guard.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/fortune-interpret-v21-preview/index.ts supabase/functions/fortune-interpret-v21-preview/costGuardV21.test.mjs supabase/functions/fortune-interpret-v21-preview/README.md
          git commit -m "fix(ai): fail closed outside explicit paid start"
          git push origin HEAD:work/ai-cost-guard-v21
