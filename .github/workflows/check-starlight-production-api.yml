name: Check starlight production API
on:
  push:
    branches: [starlight-fixpack-20260829-v2]
    paths: ['.github/workflows/check-starlight-production-api.yml']
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify health and production endpoints
        run: |
          set -euo pipefail
          BASE=https://astro-app-api-f7fn.onrender.com
          HEALTH=$(curl -fsS --max-time 30 "$BASE/health")
          echo "$HEALTH"
          echo "$HEALTH" | grep -q 'api-fortune-v4.6-fixpack'

          LOC=$(curl -fsS --max-time 60 -X POST "$BASE/v1/location/fit" -H 'Content-Type: application/json' -d '{"profile":{"name":"test","birth_date":"1991-03-21","birth_time":"07:26:00","latitude":34.7604,"longitude":127.6622,"utc_offset_hours":9,"gender":"female"}}')
          echo "$LOC" > /tmp/location.json

          REL=$(curl -fsS --max-time 90 -X POST "$BASE/v1/relationship/western" -H 'Content-Type: application/json' -d '{"user":{"name":"u","birth_date":"1991-03-21","birth_time":"07:26:00","time_known":true,"latitude":34.7604,"longitude":127.6622,"utc_offset_hours":9},"counterpart":{"name":"c","birth_date":"1992-02-09","birth_time":null,"time_known":false,"latitude":null,"longitude":null,"utc_offset_hours":9},"start_date":"2026-08-29","end_date":"2026-09-28","relationship_status":"single"}')
          echo "$REL" > /tmp/relationship.json

          python - <<'PY'
          import json
          loc=json.load(open('/tmp/location.json'))
          rel=json.load(open('/tmp/relationship.json'))
          assert loc.get('ok') is True
          assert len(loc.get('countries',[])) >= 10
          assert loc['purposes']['overall']['cities']
          trans=rel['result']['reunion_transits']
          assert trans['available'] is True and trans['top_days']
          assert rel['result']['natal_synastry']['partner_time_exact'] is False
          aspects=rel['result']['natal_synastry']['aspects']
          # a=user, b=counterpart. User Moon/angles remain valid; unknown counterpart Moon/angles must be absent.
          assert not any(a.get('b') in {'Moon','ASC','DSC','MC','IC'} for a in aspects)
          print('LOCATION',loc['countries'][0]['country'],loc['countries'][0]['best_city'],loc['countries'][0]['score'])
          print('REUNION_TRIGGER',trans['top_days'][0]['date'],trans['top_days'][0]['score'])
          print('ASPECTS',len(aspects),'TRANSIT_DAYS',len(trans['top_days']))
          PY
