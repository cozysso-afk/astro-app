name: Apply period UX v22b
on:
  push:
    branches:
      - work/period-selector-ui-v1
    paths:
      - .github/workflows/apply-period-ux-v22b.yml
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/period-selector-ui-v1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Apply patch
        run: python scripts/apply_period_ux_v22.py
      - name: Run UX contracts
        run: node --test web/src/lib/periodSelectionContract.test.mjs web/src/lib/interpretationUiContract.test.mjs web/src/lib/relationshipModeContract.test.mjs
      - name: Install web dependencies
        working-directory: web
        run: npm ci
      - name: Production build
        working-directory: web
        run: npm run build
      - name: Commit verified source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/src/AppNext.tsx web/src/HomeControls.tsx web/src/PeriodAiInterpretationPanel.tsx web/src/PeriodFortunePanel.tsx web/src/main.tsx web/src/ux-readability-v22.css web/src/lib/periodSelectionContract.test.mjs
          git commit -m "feat(ux): calendar period selectors and readable mobile hierarchy"
          git push origin HEAD:work/period-selector-ui-v1
