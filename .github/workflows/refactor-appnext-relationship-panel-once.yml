name: Refactor AppNext relationship panel once

on:
  push:
    branches:
      - refactor/appnext-relationship-panel-20260901

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/appnext-relationship-panel-20260901
          fetch-depth: 0

      - name: Extract relationship interpretation panel
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          app_path = Path('web/src/AppNext.tsx')
          panel_path = Path('web/src/RelationshipInterpretationPanel.tsx')
          workflow_path = Path('.github/workflows/refactor-appnext-relationship-panel-once.yml')

          original = app_path.read_text()
          text = original

          helper_start = text.index('function hasPair(aspect: Aspect')
          helper_end = text.index('type OutcomeEvent', helper_start)
          helper_block = text[helper_start:helper_end].rstrip()
          if helper_block.count('function hasPair') != 1 or helper_block.count('function relationshipAspectMeaning') != 1:
              raise SystemExit('Unexpected relationship helper block')
          text = text[:helper_start] + text[helper_end:]

          panel_start = text.index('function RelationshipInterpretationPanel')
          panel_end = text.index('function initialPeriodFromUrl', panel_start)
          panel_block = text[panel_start:panel_end].rstrip()
          signature = 'function RelationshipInterpretationPanel({ aspects, partnerExact, ai, aiLoading, aiError, onAi, analysisMode }: { aspects: Aspect[]; partnerExact: boolean; ai: RelationshipAiResponse | null; aiLoading: boolean; aiError: string; onAi: () => void; analysisMode: RelationshipAnalysisMode }) {'
          replacement = 'export function RelationshipInterpretationPanel({ aspects, partnerExact, ai, aiLoading, aiError, onAi, analysisMode, timeSensitivePoints, formatAspect }: { aspects: Aspect[]; partnerExact: boolean; ai: RelationshipAiResponse | null; aiLoading: boolean; aiError: string; onAi: () => void; analysisMode: RelationshipAnalysisMode; timeSensitivePoints: ReadonlySet<string>; formatAspect: (aspect: Aspect) => string }) {'
          if panel_block.count(signature) != 1:
              raise SystemExit('Relationship panel signature mismatch')
          panel_block = panel_block.replace(signature, replacement, 1)
          panel_block = panel_block.replace('relationshipTimeSensitivePoints', 'timeSensitivePoints')
          panel_block = panel_block.replace('aspectText(', 'formatAspect(')
          if 'relationshipTimeSensitivePoints' in panel_block or 'aspectText(' in panel_block:
              raise SystemExit('Relationship panel still has AppNext-only dependencies')
          text = text[:panel_start] + text[panel_end:]

          panel_path.write_text(
              "import { AlertTriangle, Sparkles } from 'lucide-react'\n"
              "import type { Aspect, RelationshipAiResponse, RelationshipAnalysisMode } from './appTypes'\n"
              "import { estimateGeminiUsage } from './lib/aiUsage'\n\n"
              + helper_block + '\n\n' + panel_block + '\n'
          )

          import_anchor = "import { AiInterpretationPanel } from './AiInterpretationPanel'\n"
          if import_anchor not in text:
              raise SystemExit('AI panel import anchor missing')
          text = text.replace(import_anchor, import_anchor + "import { RelationshipInterpretationPanel } from './RelationshipInterpretationPanel'\n", 1)

          old_call = "<RelationshipInterpretationPanel aspects={natalAspects} partnerExact={Boolean(relationshipResult.result.natal_synastry?.partner_time_exact)} ai={relationshipAi} aiLoading={relationshipAiLoading} aiError={relationshipAiError} onAi={runRelationshipAi} analysisMode={selectedTool==='marriage'?`marriage_${marriageMode}`:relationshipPurpose} />"
          new_call = "<RelationshipInterpretationPanel aspects={natalAspects} partnerExact={Boolean(relationshipResult.result.natal_synastry?.partner_time_exact)} ai={relationshipAi} aiLoading={relationshipAiLoading} aiError={relationshipAiError} onAi={runRelationshipAi} analysisMode={selectedTool==='marriage'?`marriage_${marriageMode}`:relationshipPurpose} timeSensitivePoints={relationshipTimeSensitivePoints} formatAspect={aspectText} />"
          if text.count(old_call) != 1:
              raise SystemExit(f'Expected one relationship panel call, found {text.count(old_call)}')
          text = text.replace(old_call, new_call, 1)
          app_path.write_text(text)

          workflow_path.unlink()
          print(f'AppNext bytes: {len(original.encode())} -> {len(text.encode())}')
          print(f'RelationshipInterpretationPanel bytes: {len(panel_path.read_bytes())}')
          PY

      - name: Build web
        working-directory: web
        run: npm ci && npm run build

      - name: Commit refactor
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/src/AppNext.tsx web/src/RelationshipInterpretationPanel.tsx .github/workflows/refactor-appnext-relationship-panel-once.yml
          git diff --cached --check
          git commit -m "refactor(web): extract relationship interpretation panel"
          git push origin HEAD:refactor/appnext-relationship-panel-20260901
