name: Apply Fortune Lab v7.1

on:
  push:
    branches: [main]
    paths:
      - "fortune_lab_v71.py"
      - "scripts/upgrade_fortune_lab_v71.py"
      - ".github/workflows/apply-fortune-lab-v71.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Fortune Lab upgrade
        run: python scripts/upgrade_fortune_lab_v71.py

      - name: Install Saju engine for verification
        run: python -m pip install --disable-pip-version-check lunar_python==1.4.8

      - name: Verify known Korean Saju pillars
        shell: bash
        run: |
          python - <<'PY'
          from lunar_python import Solar
          s=Solar.fromYmdHms(1991,3,21,7,26,0)
          e=s.getLunar().getEightChar()
          e.setSect(2)
          got=[e.getYear(),e.getMonth(),e.getDay(),e.getTime()]
          expected=["辛未","辛卯","庚寅","己卯"]
          print("pillars:",got)
          if got!=expected:
              raise SystemExit(f"pillar mismatch: expected {expected}, got {got}")
          for sect in (1,2):
              yun=e.getYun(0,sect)
              print("yun sect",sect,"start",yun.getStartSolar().toYmdHms(),"start offset",yun.getStartYear(),yun.getStartMonth(),yun.getStartDay())
              for dy in yun.getDaYun(12):
                  if dy.getStartYear() <= 2026 <= dy.getEndYear():
                      print("2026 dayun sect",sect,dy.getGanZhi(),dy.getStartYear(),dy.getEndYear(),dy.getStartAge(),dy.getEndAge())
          PY

      - name: Python syntax check
        run: |
          python -m py_compile app.py fortune_lab_v71.py

      - name: Diff sanity check
        run: git diff --check

      - name: Feature marker check
        shell: bash
        run: |
          grep -q 'from fortune_lab_v71 import render_fortune_lab' app.py
          grep -q 'elif main_view=="🧭 포춘랩"' app.py
          grep -q 'lunar_python==1.4.8' requirements.txt
          grep -q 'FORTUNE_LAB_VERSION = "v0.1.0"' fortune_lab_v71.py
          grep -q 'Suriyayat' fortune_lab_v71.py

      - name: Commit patched app and requirements
        shell: bash
        run: |
          if git diff --quiet -- app.py requirements.txt; then
            echo "No app.py/requirements changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py requirements.txt
          git commit -m "feat: add Fortune Lab multi-system analysis"
          git push origin HEAD:main
