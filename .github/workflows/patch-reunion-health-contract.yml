name: Patch reunion public health contract

on:
  push:
    branches:
      - fix/reunion-runtime-health-contract

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[health-contract-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/reunion-runtime-health-contract
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch public health contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def once(text, old, new, label):
              c=text.count(old)
              assert c==1, f'{label}: expected 1 occurrence, got {c}'
              return text.replace(old,new,1)

          api=Path('api/main.py')
          s=api.read_text()
          s=once(
              s,
              'def health() -> dict:\n    return {"status": "ok", "version": APP_VERSION}\n',
              'def health() -> dict:\n    return {\n        "status": "ok",\n        "version": APP_VERSION,\n        "reunion_evidence_contract": REUNION_EVIDENCE_CONTRACT_VERSION,\n        "runtime_git_sha": os.getenv("RENDER_GIT_COMMIT", ""),\n    }\n',
              'public health contract',
          )
          api.write_text(s)

          app=Path('web/src/AppNext.tsx')
          s=app.read_text()
          old='''    fetch(`${API_BASE}/v1/meta`)\n      .then((response) => {\n        if (!response.ok) throw new Error('meta check failed')\n        return response.json()\n      })'''
          new='''    fetch(`${API_BASE}/health`)\n      .then((response) => {\n        if (!response.ok) throw new Error('health check failed')\n        return response.json()\n      })'''
          s=once(s,old,new,'frontend public health probe')
          app.write_text(s)

          webtest=Path('web/src/lib/reunionRuntimeContract.test.mjs')
          s=webtest.read_text()
          s=once(s,"assert.match(app, /fetch\\(`\\$\\{API_BASE\\}\\/v1\\/meta`\\)/)","assert.match(app, /fetch\\(`\\$\\{API_BASE\\}\\/health`\\)/)",'runtime test health probe')
          s=s.replace("assert.match(api, /\\\"reunion_evidence_contract\\\": REUNION_EVIDENCE_CONTRACT_VERSION/)","assert.match(api, /\\\"reunion_evidence_contract\\\": REUNION_EVIDENCE_CONTRACT_VERSION/)")
          webtest.write_text(s)

          apitest=Path('tests/test_relationship_api_e2e_v15.py')
          t=apitest.read_text().rstrip()
          addition='''\n\ndef test_reunion_health_exposes_public_runtime_contract_and_git_sha_field():\n    response = client.get("/health")\n    assert response.status_code == 200\n    body = response.json()\n    assert body["reunion_evidence_contract"] == "reunion-evidence-contract-v1"\n    assert "runtime_git_sha" in body\n'''
          assert 'test_reunion_health_exposes_public_runtime_contract_and_git_sha_field' not in t
          apitest.write_text(t+addition+'\n')
          PY
      - name: Sanity checks
        run: |
          python -m py_compile api/main.py relationship_evidence_contract_v1.py
          node --test web/src/lib/reunionRuntimeContract.test.mjs
      - name: Commit hotfix
        run: |
          git config user.name "cozysso-afk"
          git config user.email "cozysso@gmail.com"
          git add api/main.py web/src/AppNext.tsx web/src/lib/reunionRuntimeContract.test.mjs tests/test_relationship_api_e2e_v15.py
          git commit -m "[health-contract-patched] use public health for reunion runtime contract"
          git push origin HEAD:fix/reunion-runtime-health-contract
