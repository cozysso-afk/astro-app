name: Relationship API E2E V15 Once

on:
  push:
    branches:
      - audit/relationship-api-e2e-v15
    paths:
      - '.github/workflows/relationship-api-e2e-v15-once.yml'

permissions:
  contents: read

jobs:
  api-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/relationship-api-e2e-v15
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -q -r api/requirements.txt pytest httpx
      - name: Run V15 relationship API E2E
        run: python -m pytest -q tests/test_relationship_api_e2e_v15.py
