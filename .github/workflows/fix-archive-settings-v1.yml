name: Fix archive and settings UX v1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-archive-settings-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply patch
        run: python scripts/fix_archive_settings_v1.py

      - name: Build frontend
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Commit fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/src/AppNext.tsx web/src/celestial-pastel.css
          git commit -m 'fix: make archive states clear and settings interactive'
          git push
