name: Reunion six-section UI
on:
  push:
    branches:
      - fix/reunion-six-section-ui
permissions:
  contents: write
jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch reunion primary reading
        run: python scripts/tmp_reunion_six_section_patch.py
      - name: Install web dependencies
        working-directory: web
        run: npm ci
      - name: Reunion contract tests
        working-directory: web
        run: node src/lib/relationshipReunionV2.contract.test.mjs
      - name: Web build
        working-directory: web
        run: npm run build
      - name: Diff check
        run: git diff --check
      - name: Commit clean change
        run: |
          git rm .github/workflows/reunion-six-section-ui.yml scripts/tmp_reunion_six_section_patch.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add web/src/RelationshipInterpretationPanel.tsx web/src/lib/relationshipReunionV2.contract.test.mjs
          git commit -m "fix: simplify reunion into six primary sections"
          git push origin HEAD:fix/reunion-six-section-ui
