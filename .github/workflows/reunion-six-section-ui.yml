name: Reunion six-section UI
on:
  push:
    branches:
      - fix/reunion-six-section-ui
permissions:
  contents: write
jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch reunion primary reading
        run: python scripts/tmp_reunion_six_section_patch.py
      - name: Fix optional rebuild conditions narrowing
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('web/src/RelationshipInterpretationPanel.tsx')
          s=p.read_text(encoding='utf-8')
          old="{reunionV2?.rebuild?.conditions?.length>0&&<ul>{reunionV2.rebuild.conditions.slice(0,3).map((x,i)=><li key={i}>{x}</li>)}</ul>}"
          new="{(reunionV2?.rebuild?.conditions?.length ?? 0)>0&&<ul>{reunionV2?.rebuild?.conditions?.slice(0,3).map((x,i)=><li key={i}>{x}</li>)}</ul>}"
          if old not in s:
              raise SystemExit('rebuild narrowing marker missing')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Normalize changed-file whitespace
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in ['web/src/RelationshipInterpretationPanel.tsx','web/src/lib/relationshipReunionV2.contract.test.mjs']:
              p=Path(name)
              lines=p.read_text(encoding='utf-8').splitlines()
              p.write_text('\n'.join(line.rstrip() for line in lines)+'\n',encoding='utf-8')
          PY
      - name: Install web dependencies
        working-directory: web
        run: npm ci
      - name: Reunion contract tests
        working-directory: web
        run: node src/lib/relationshipReunionV2.contract.test.mjs
      - name: Web build
        working-directory: web
        run: npm run build
      - name: Diff check
        run: git diff --check
      - name: Commit clean change
        run: |
          git rm .github/workflows/reunion-six-section-ui.yml scripts/tmp_reunion_six_section_patch.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add web/src/RelationshipInterpretationPanel.tsx web/src/lib/relationshipReunionV2.contract.test.mjs
          git commit -m "fix: simplify reunion into six primary sections"
          git push origin HEAD:fix/reunion-six-section-ui
