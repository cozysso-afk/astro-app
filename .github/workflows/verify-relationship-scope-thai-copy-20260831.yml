name: Verify Relationship Scope and Thai Copy 2026-08-31

on:
  push:
    branches:
      - work/full-year-thai-hardening-20260831
    paths:
      - scripts/patch_relationship_scope_thai_copy_v4.py
      - .github/workflows/verify-relationship-scope-thai-copy-20260831.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-purpose-scope:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/full-year-thai-hardening-20260831
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: api/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Apply scope and copy patch
        run: python scripts/patch_relationship_scope_thai_copy_v4.py

      - name: Install calculation dependencies
        run: pip install -r api/requirements.txt

      - name: Compile product modules
        run: python -m py_compile relationship_western_v1.py api/main.py integrated_fortune_v1.py thai_astrology_v2.py

      - name: Benchmark exact-time relationship modes
        run: |
          python - <<'PY'
          import time, resource
          from datetime import date,time as dt_time
          from relationship_western_v1 import build_relationship_western
          from api.main import _month_segments

          a={'name':'A','birth_date':date(1991,3,21),'birth_time':dt_time(7,26),'time_known':True,'latitude':34.7604,'longitude':127.6622,'utc_offset_hours':9}
          b={'name':'B','birth_date':date(1992,2,9),'birth_time':dt_time(10,15),'time_known':True,'latitude':35.1595,'longitude':126.8526,'utc_offset_hours':9}
          seg=_month_segments(date(2026,1,1),date(2026,12,31))
          timings={}
          results={}
          for mode in ['compatibility','marriage_unmarried','marriage_married','reunion']:
              t0=time.perf_counter()
              r=build_relationship_western(a,b,seg,analysis_mode=mode)
              timings[mode]=time.perf_counter()-t0
              results[mode]=r
              assert r['ok'] is True
              assert r['analysis_mode']==mode
              assert len(r['months'])==12
          for mode in ['compatibility','marriage_unmarried','marriage_married']:
              r=results[mode]
              assert r['daily_transit_policy']['reunion_scan']=='skipped'
              assert 'reunion_transits' not in r
              assert 'relationship_transits' not in r
          rr=results['reunion']
          assert rr['daily_transit_policy']['reunion_scan']=='enabled'
          assert rr['reunion_transits']['available'] is True
          assert rr['reunion_transits']['directional_context']['period']=={'start':'2026-01-01','end':'2026-12-31'}
          assert rr['reunion_transits']['top_days']
          rss=resource.getrusage(resource.RUSAGE_SELF).ru_maxrss/1024
          print('RELATIONSHIP_MODE_SCOPE_PASS', {k:round(v,3) for k,v in timings.items()}, 'maxrss',round(rss,1))
          PY

      - name: Verify unknown-time reunion remains safe
        run: |
          python - <<'PY'
          from datetime import date,time as dt_time
          from relationship_western_v1 import build_relationship_western
          from api.main import _month_segments
          a={'name':'A','birth_date':date(1991,3,21),'birth_time':dt_time(7,26),'time_known':True,'latitude':34.7604,'longitude':127.6622,'utc_offset_hours':9}
          b={'name':'B','birth_date':date(1992,2,9),'birth_time':None,'time_known':False,'latitude':None,'longitude':None,'utc_offset_hours':9}
          r=build_relationship_western(a,b,_month_segments(date(2026,8,1),date(2027,7,31)),analysis_mode='reunion')
          assert r['ok'] is True
          assert r['natal_synastry']['partner_time_exact'] is False
          assert r['house_overlays']['available'] is False
          assert r['reunion_transits']['available'] is True
          assert r['reunion_transits']['directional_context']['incoming'] is not None
          # Unknown-time partner chart must not fabricate partner Moon or angles.
          cp_sensitive=[x for x in r['natal_synastry']['aspects'] if x.get('b') in {'Moon','ASC','DSC','MC','IC'}]
          assert not cp_sensitive, cp_sensitive[:3]
          print('UNKNOWN_TIME_REUNION_SAFE_PASS')
          PY

      - name: Verify API passes analysis mode to engine
        run: |
          python - <<'PY'
          from datetime import date,time
          import api.main as m
          req=m.RelationshipRequest(
            user=m.RelationshipProfile(name='A',birth_date=date(1991,3,21),birth_time=time(7,26),time_known=True,latitude=34.7604,longitude=127.6622,utc_offset_hours=9),
            counterpart=m.RelationshipProfile(name='B',birth_date=date(1992,2,9),birth_time=time(10,15),time_known=True,latitude=35.1595,longitude=126.8526,utc_offset_hours=9),
            start_date=date(2026,8,1),end_date=date(2026,8,31),relationship_status='dating',analysis_mode='compatibility')
          out=m.relationship_western(req)
          assert out['result']['analysis_mode']=='compatibility'
          assert out['result']['daily_transit_policy']['reunion_scan']=='skipped'
          assert 'reunion_transits' not in out['result']
          print('API_RELATIONSHIP_MODE_PASS')
          PY

      - name: Build frontend
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Verify stale Thai wording removed
        run: |
          ! grep -q 'Thai(태국점성술) 출생요일층을 각각 계산' web/src/AppNext.tsx
          ! grep -q 'Thai(태국점성술)는 현재 출생요일 기준값만 사용해' web/src/AppNext.tsx
          ! grep -q '출생요일 baseline을 날짜 예측 합의점수에 섞지 않는다' web/src/AppNext.tsx
          grep -q 'Mahathaksa(마하탁사)·Taksajorn(탁사쫀)' web/src/AppNext.tsx
          grep -q 'Full Suriyayat(수리야얏)' web/src/AppNext.tsx
          echo 'THAI_COPY_SCOPE_PASS'

      - name: Verify production isolation
        run: echo 'NO_PRODUCTION_CALLS=TRUE'

      - name: Commit verified product files to work branch only
        run: |
          git config user.name "cozysso-afk"
          git config user.email "cozysso@gmail.com"
          git add relationship_western_v1.py api/main.py web/src/AppNext.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: scope relationship transits by analysis purpose'
          git push origin HEAD:work/full-year-thai-hardening-20260831
