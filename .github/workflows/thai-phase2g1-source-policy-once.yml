name: Thai Phase 2G1 source-policy profiles

on:
  push:
    branches:
      - feature/thai-lagna-phase1-real-20260831
    paths:
      - '.github/workflows/thai-phase2g1-source-policy-once.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/thai-lagna-phase1-real-20260831
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Attach research-only source-policy comparison layer
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('thai_astrology_v2.py')
          text = path.read_text(encoding='utf-8')
          replacements = {
              'from thai_dignity_exceptions_v1 import build_dignity_exception_research\n':
                  'from thai_dignity_exceptions_v1 import build_dignity_exception_research\nfrom thai_school_policy_v1 import build_source_policy_research\n',
              'ENGINE_VERSION = "thai-mahathaksa-taksajorn-suriyayat-v2.11-phase2f3-dignity-exception-candidates"':
                  'ENGINE_VERSION = "thai-mahathaksa-taksajorn-suriyayat-v2.12-phase2g1-source-policy-profiles"',
              '    dignity_exceptions_research = build_dignity_exception_research(\n        dignities_research=dignities_research,\n        aspects_research=aspects_research,\n        houses_research=houses_research,\n    )\n    planet_pairs_research = build_planet_pair_research(aspects_research)':
                  '    dignity_exceptions_research = build_dignity_exception_research(\n        dignities_research=dignities_research,\n        aspects_research=aspects_research,\n        houses_research=houses_research,\n    )\n    school_policy_research = build_source_policy_research(\n        dignity_exceptions_research=dignity_exceptions_research,\n        selected_profile="none",\n    )\n    planet_pairs_research = build_planet_pair_research(aspects_research)',
              '        "dignity_exceptions_research": dignity_exceptions_research,\n        "aspects_research": aspects_research,':
                  '        "dignity_exceptions_research": dignity_exceptions_research,\n        "school_policy_research": school_policy_research,\n        "aspects_research": aspects_research,',
              '            "suriyayat_dignity_exception_candidates": "research_only_school_variant_candidates_not_applied",\n            "suriyayat_predictive_rules": "not_implemented",':
                  '            "suriyayat_dignity_exception_candidates": "research_only_school_variant_candidates_not_applied",\n            "suriyayat_source_policy_profiles": "research_only_explicit_comparison_default_none",\n            "suriyayat_predictive_rules": "not_implemented",',
              '            "Suriyayat predictive/final synthesis into outcomes, application of school-variant dignity exceptions, concrete house outcomes, advanced-standard meanings/ranking, canonical aspect strength, net pair valence, pair-event interpretation, combined good/bad judgement",':
                  '            "Suriyayat production school-policy selection or actual exception application, predictive/final synthesis into outcomes, concrete house outcomes, advanced-standard meanings/ranking, canonical aspect strength, net pair valence, pair-event interpretation, combined good/bad judgement",',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit('missing Phase 2G1 anchor: ' + old[:190])
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Install Swiss Ephemeris dependency
        run: python -m pip install --disable-pip-version-check pyswisseph==2.10.3.2

      - name: Run Phase 2G1 full 160-test regression matrix
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          for pattern in \
            test_thai_school_policy_v1.py \
            test_thai_school_policy_integration.py \
            test_thai_dignity_exceptions_v1.py \
            test_thai_dignity_exceptions_integration.py \
            test_thai_descriptive_synthesis_v1.py \
            test_thai_descriptive_synthesis_integration.py \
            test_thai_context_graph_v1.py \
            test_thai_context_graph_integration.py \
            test_thai_house_lord_routes_v1.py \
            test_thai_house_lord_routes_integration.py \
            test_thai_planet_pairs_v1.py \
            test_thai_planet_pairs_integration.py \
            test_thai_interpretation_policy_v1.py \
            test_thai_interpretation_policy_integration.py \
            test_thai_semantics_v1.py \
            test_thai_phase2c_labels_standards.py \
            test_thai_dignities_v1.py \
            test_thai_aspects_v1.py \
            test_thai_rules_phase2b_integration.py \
            'test_thai_houses*.py' \
            'test_thai_lagna*.py' \
            test_ai_thai_research_isolation.py
          do
            python -m unittest discover -s tests -p "$pattern" -v
          done

      - name: Compile Thai modules
        run: python -m py_compile thai_lagna_v1.py thai_houses_v1.py thai_dignities_v1.py thai_aspects_v1.py thai_semantics_v1.py thai_interpretation_policy_v1.py thai_planet_pairs_v1.py thai_house_lord_routes_v1.py thai_context_graph_v1.py thai_descriptive_synthesis_v1.py thai_dignity_exceptions_v1.py thai_school_policy_v1.py thai_astrology_v2.py ai_interpret_v1.py

      - name: Verify source profiles are diagnostic only and default stays none
        env:
          PYTHONPATH: .
        run: |
          python - <<'PY'
          import json
          from datetime import date, time
          from ai_interpret_v1 import _compact_calculation
          from thai_astrology_v2 import build_thai_fortune

          thai = build_thai_fortune(
              birth_date=date(1991,3,21), birth_time=time(7,26),
              start_date=date(2026,8,31), end_date=date(2026,8,31),
              utc_offset_hours=9.0, latitude=34.7604, longitude=127.6622,
          )
          suri = thai['suriyayat']
          layer = suri['school_policy_research']
          assert layer['available'] is True and layer['research_only'] is True
          assert layer['default_profile'] == 'none'
          assert layer['selected_profile'] == 'none'
          assert layer['selected']['projected_count'] == 0
          assert layer['actual_engine_exception_application_count'] == 0
          assert layer['base_dignities_mutated'] is False
          assert set(layer['comparisons']) == {'none','literal_exception','standard_reach_overlay','opposition_exchange_caution'}
          assert layer['comparisons']['literal_exception']['engine_exception_application_count'] == 0
          assert layer['comparisons']['standard_reach_overlay']['engine_exception_application_count'] == 0
          assert layer['comparisons']['opposition_exchange_caution']['projected_count'] == 0
          for comparison in layer['comparisons'].values():
              assert comparison['base_dignities_mutated'] is False
              assert comparison['final_judgement'] is None
              assert comparison['prediction'] is None
              assert comparison['score'] is None
              for decision in comparison['decisions']:
                  assert decision['base_status_mutated'] is False
                  assert decision['exception_applied_to_engine'] is False
          gate = layer['promotion_gate']
          assert gate['explicit_source_profiles_validated'] is True
          assert gate['default_none_profile_validated'] is True
          assert gate['deterministic_rule_applicability_matrix_validated'] is True
          assert gate['literal_projection_research_allowed'] is True
          assert gate['non_destructive_overlay_research_allowed'] is True
          assert gate['conflicting_single_source_profile_application_allowed'] is False
          assert gate['base_status_rewrite_allowed'] is False
          assert gate['production_school_selection_allowed'] is False
          assert gate['final_interpretation_allowed'] is False
          assert gate['event_judgement_allowed'] is False
          assert gate['timing_prediction_allowed'] is False
          assert gate['probability_allowed'] is False
          assert gate['scores_allowed'] is False
          assert gate['gemini_interpretation_allowed'] is False
          assert suri['lagna']['available'] is False
          compact_suri = _compact_calculation({'period': {'day_count': 1}, 'thai': thai})['thai']['suriyayat']
          assert 'school_policy_research' not in compact_suri
          encoded = json.dumps(compact_suri, ensure_ascii=False)
          assert 'literal_exception' not in encoded
          assert 'standard_reach_overlay' not in encoded
          assert thai['engine'] == 'thai-mahathaksa-taksajorn-suriyayat-v2.12-phase2g1-source-policy-profiles'
          print('PHASE2G1_SOURCE_POLICY_PROFILES_PASS_DEFAULT_NONE_BASE_UNCHANGED_PRODUCT_SCORE_GEMINI_BLOCKED')
          PY

      - name: Check whitespace
        run: git diff --check

      - name: Commit Phase 2G1 state and clean workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add thai_astrology_v2.py thai_school_policy_v1.py tests/test_thai_school_policy_v1.py tests/test_thai_school_policy_integration.py
          git rm -f .github/workflows/thai-phase2g1-source-policy-once.yml
          git commit -m 'research: validate Thai source-policy profiles'
          git push origin HEAD:feature/thai-lagna-phase1-real-20260831
