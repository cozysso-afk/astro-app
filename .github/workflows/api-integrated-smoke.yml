name: API integrated fortune smoke

on:
  push:
    paths:
      - 'integrated_fortune_v1.py'
      - 'api/**'
      - '.github/workflows/api-integrated-smoke.yml'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: api/requirements.txt
      - name: Install API dependencies
        run: pip install -r api/requirements.txt
      - name: Compile API modules
        run: python -m py_compile integrated_fortune_v1.py api/main.py relationship_western_v1.py
      - name: Run one-day integrated calculation with dummy profile
        run: |
          python - <<'PY'
          from api.main import IntegratedFortuneRequest, FortuneProfile, health, fortune_integrated, meta
          from datetime import date, time

          assert health()['status'] == 'ok'
          assert 'fortune/integrated' in meta()['routes']
          request = IntegratedFortuneRequest(
              profile=FortuneProfile(
                  name='dummy-smoke-profile',
                  birth_date=date(1990, 1, 1),
                  birth_time=time(12, 0),
                  latitude=37.5665,
                  longitude=126.9780,
                  utc_offset_hours=9,
                  gender='female',
              ),
              start_date=date(2026, 8, 28),
              end_date=date(2026, 8, 28),
          )
          result = fortune_integrated(request)
          assert result['ok'] is True
          assert result['western']['ok'] is True
          assert result['saju']['ok'] is True
          assert result['thai']['ok'] is True
          assert result['period']['day_count'] == 1
          assert result['western']['overall']['연애']['average'] is not None
          print('integrated-smoke-ok', result['engine'])
          PY
      - name: Verify Render live API has integrated route
        if: github.ref == 'refs/heads/main'
        run: |
          python - <<'PY'
          import json
          import time
          import urllib.request

          url = 'https://astro-app-api-f7fn.onrender.com/v1/meta'
          last = None
          for _ in range(36):
              try:
                  with urllib.request.urlopen(url, timeout=15) as response:
                      payload = json.load(response)
                  last = payload
                  if 'fortune/integrated' in payload.get('routes', []):
                      print('render-integrated-live', payload.get('api_version'))
                      break
              except Exception as exc:
                  last = repr(exc)
              time.sleep(5)
          else:
              raise SystemExit(f'Render integrated route not live: {last}')
          PY
      - name: Run Render live integrated POST
        if: github.ref == 'refs/heads/main'
        run: |
          python - <<'PY'
          import json
          import urllib.request

          payload = {
              'profile': {
                  'name': 'dummy-live-profile',
                  'birth_date': '1990-01-01',
                  'birth_time': '12:00:00',
                  'latitude': 37.5665,
                  'longitude': 126.9780,
                  'utc_offset_hours': 9,
                  'gender': 'female',
              },
              'start_date': '2026-08-28',
              'end_date': '2026-08-28',
          }
          request = urllib.request.Request(
              'https://astro-app-api-f7fn.onrender.com/v1/fortune/integrated',
              data=json.dumps(payload).encode('utf-8'),
              headers={'Content-Type': 'application/json'},
              method='POST',
          )
          with urllib.request.urlopen(request, timeout=120) as response:
              result = json.load(response)
          assert result['ok'] is True
          assert result['western']['ok'] is True
          assert result['saju']['ok'] is True
          assert result['thai']['ok'] is True
          assert result['period']['day_count'] == 1
          assert result['western']['overall']['연애']['average'] is not None
          print('render-live-post-ok', result.get('api_version'), result.get('engine'))
          PY
