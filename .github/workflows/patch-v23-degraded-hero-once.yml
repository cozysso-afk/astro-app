name: Patch V23 degraded hero once

on:
  push:
    branches:
      - fix/v23-degraded-hero-particles
    paths:
      - scripts/patch_v23_degraded_hero_particles.py
      - .github/workflows/patch-v23-degraded-hero-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v23-degraded-hero-particles
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        working-directory: web
        run: npm ci
      - name: Apply patch
        run: python scripts/patch_v23_degraded_hero_particles.py
      - name: Verify focused contracts
        run: node --test web/src/lib/interpretationUiContract.test.mjs
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/src/PeriodAiInterpretationPanel.tsx web/src/SystemReadingViews.tsx web/src/lib/interpretationTopics.ts web/src/lib/interpretationUiContract.test.mjs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Show safely repaired V23 narrative and fix Korean particles"
          git push origin HEAD:fix/v23-degraded-hero-particles
