    rr.evidence_refs=linked.slice(0,10);
    rr.watch=ensureMinText(rr?.watch,20,"실제 연락 빈도, 답변의 구체성, 약속 제안, 대화 지속처럼 관찰 가능한 신호가 각 방향의 계산과 함께 움직이는지 확인해.");
