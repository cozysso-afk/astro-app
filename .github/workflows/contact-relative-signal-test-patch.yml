name: Contact relative signal test patch

on:
  push:
    branches: [fix/contact-relative-signal-copy]
    paths:
      - 'scripts/patch_contact_relative_signal_tests.py'
      - '.github/workflows/contact-relative-signal-test-patch.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch stale wording contracts
        run: python scripts/patch_contact_relative_signal_tests.py
      - name: Verify targeted tests
        run: |
          grep -q '실제 연락이 오거나 안 온다고 판단하지 않아' web/src/lib/systemReading.test.mjs
          grep -q '이 값만으로 실제 연락이 없다고 보지는 않아' web/src/lib/interpretationUiContract.test.mjs
          git diff --check
      - name: Commit test updates
        run: |
          if git diff --quiet -- web/src/lib/systemReading.test.mjs web/src/lib/interpretationUiContract.test.mjs; then
            echo 'No test diff to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/src/lib/systemReading.test.mjs web/src/lib/interpretationUiContract.test.mjs
          git commit -m 'test: align contact wording contracts'
          git push origin HEAD:fix/contact-relative-signal-copy
