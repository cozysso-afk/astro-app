name: Validate astrology alerts once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/validate-astro-alerts-once.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      ONESIGNAL_APP_ID: "203c25c5-85da-4b51-bd33-b93476622e84"
      ONESIGNAL_APP_API_KEY: ${{ secrets.ONESIGNAL_APP_API_KEY }}
      ASTRO_APP_PIN: ${{ secrets.ASTRO_APP_PIN }}
      ASTRO_ALERT_MODE: "dry_run"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pyswisseph==2.10.3.2" playwright
          python -m playwright install --with-deps chromium
      - name: Compile
        run: |
          python -m py_compile scripts/astro_event_alerts.py
          python -m py_compile scripts/prewarm_streamlit_horoscope.py
          python -m py_compile scripts/send_onesignal_horoscope_push.py
      - name: Run full dry-run
        run: python scripts/astro_event_alerts.py
