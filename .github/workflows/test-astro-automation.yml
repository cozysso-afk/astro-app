name: Test astrology automation end-to-end

on:
  workflow_dispatch:
  issues:
    types: [opened]
  push:
    branches: [main]
    paths:
      - ".automation-trigger/test-20260827.txt"

permissions:
  contents: read

jobs:
  test:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || (github.event.issue.user.login == 'cozysso-afk' && github.event.issue.title == '[automation] test astrology setup')
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      ASTRO_APP_PIN: ${{ secrets.ASTRO_APP_PIN }}
      ONESIGNAL_APP_ID: "203c25c5-85da-4b51-bd33-b93476622e84"
      ONESIGNAL_APP_API_KEY: ${{ secrets.ONESIGNAL_APP_API_KEY }}
      ASTRO_PREGEN_KIND: daily
      ASTRO_PUSH_KIND: daily
    steps:
      - name: Verify required secrets exist
        shell: bash
        run: |
          missing=0
          if [ -z "$ASTRO_APP_PIN" ]; then echo "::error::Missing repository secret: ASTRO_APP_PIN"; missing=1; fi
          if [ -z "$ONESIGNAL_APP_API_KEY" ]; then echo "::error::Missing repository secret: ONESIGNAL_APP_API_KEY"; missing=1; fi
          exit "$missing"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Validate worker syntax
        run: |
          python -m py_compile scripts/prewarm_streamlit_horoscope.py
          python -m py_compile scripts/send_onesignal_horoscope_push.py

      - name: Pre-generate today's AI horoscope
        id: prewarm
        continue-on-error: true
        run: python scripts/prewarm_streamlit_horoscope.py

      - name: Send test daily push
        id: push
        if: always()
        run: python scripts/send_onesignal_horoscope_push.py

      - name: Require full E2E success
        if: always()
        shell: bash
        run: |
          echo "prewarm_outcome=${{ steps.prewarm.outcome }}"
          echo "push_outcome=${{ steps.push.outcome }}"
          if [ "${{ steps.prewarm.outcome }}" != "success" ]; then
            echo "::error::Streamlit pre-generation failed; inspect the diagnostics above."
            exit 1
          fi
          if [ "${{ steps.push.outcome }}" != "success" ]; then
            echo "::error::OneSignal push validation failed."
            exit 1
          fi
