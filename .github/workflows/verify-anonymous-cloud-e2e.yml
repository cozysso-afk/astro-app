name: Verify anonymous cloud archive E2E

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-anonymous-cloud-e2e.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Anonymous auth and archive E2E
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs'
          const source = fs.readFileSync('web/src/lib/supabase.ts', 'utf8')
          const url = source.match(/DEFAULT_SUPABASE_URL = '([^']+)'/)?.[1]
          const key = source.match(/DEFAULT_SUPABASE_PUBLISHABLE_KEY = '([^']+)'/)?.[1]
          if (!url || !key) throw new Error('browser-safe Supabase config not found')

          const authRes = await fetch(`${url}/auth/v1/signup`, {
            method: 'POST',
            headers: { apikey: key, 'Content-Type': 'application/json' },
            body: '{}',
          })
          const auth = await authRes.json()
          if (!authRes.ok || !auth.access_token || !auth.user?.id) {
            throw new Error(`anonymous auth failed ${authRes.status}: ${JSON.stringify(auth)}`)
          }
          const token = auth.access_token
          const userId = auth.user.id
          const headers = {
            apikey: key,
            Authorization: `Bearer ${token}`,
            'Content-Type': 'application/json',
            Prefer: 'return=representation',
          }
          const base = {
            user_id: userId,
            profile_id: null,
            period_start: '2026-08-28',
            period_end: '2026-09-03',
            engine_version: 'cloud-e2e-smoke',
            calculation_json: { archive_v: 1, request: {}, result: {} },
            interpretation_json: { archive_v: 1 },
          }

          async function insert(table, row) {
            const r = await fetch(`${url}/rest/v1/${table}`, { method: 'POST', headers, body: JSON.stringify(row) })
            const body = await r.json().catch(() => null)
            if (!r.ok) throw new Error(`${table} insert failed ${r.status}: ${JSON.stringify(body)}`)
            return Array.isArray(body) ? body[0] : body
          }

          const rows = []
          rows.push(['readings', await insert('readings', { ...base, reading_type: 'integrated', summary: 'ci integrated smoke' })])
          rows.push(['readings', await insert('readings', { ...base, reading_type: 'precision', summary: 'ci precision smoke' })])
          rows.push(['relationship_readings', await insert('relationship_readings', { ...base, counterpart_id: null, reading_type: 'compatibility', relationship_status: 'dating', summary: 'ci compatibility smoke' })])
          rows.push(['relationship_readings', await insert('relationship_readings', { ...base, counterpart_id: null, reading_type: 'marriage', relationship_status: 'dating', summary: 'ci marriage smoke' })])

          const grouped = new Map()
          for (const [table, row] of rows) {
            if (!row?.id || row.user_id !== userId) throw new Error(`${table} RLS/return mismatch`)
            if (!grouped.has(table)) grouped.set(table, [])
            grouped.get(table).push(row.id)
          }

          for (const [table, ids] of grouped) {
            const query = `${url}/rest/v1/${table}?user_id=eq.${userId}&engine_version=eq.cloud-e2e-smoke&select=id,reading_type,user_id`
            const r = await fetch(query, { headers: { apikey: key, Authorization: `Bearer ${token}` } })
            const body = await r.json()
            if (!r.ok) throw new Error(`${table} select failed ${r.status}: ${JSON.stringify(body)}`)
            if (body.length !== ids.length) throw new Error(`${table} own-row select mismatch expected ${ids.length} got ${body.length}`)
          }

          for (const [table, ids] of grouped) {
            for (const id of ids) {
              const r = await fetch(`${url}/rest/v1/${table}?id=eq.${id}`, {
                method: 'DELETE',
                headers: { apikey: key, Authorization: `Bearer ${token}`, Prefer: 'return=minimal' },
              })
              if (!r.ok) throw new Error(`${table} delete failed ${r.status}: ${await r.text()}`)
            }
          }

          console.log('anonymous-cloud-e2e-ok', rows.map(([, row]) => row.reading_type).join(','))
          JS
