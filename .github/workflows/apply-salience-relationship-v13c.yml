name: Apply Salience Relationship V13C

on:
  push:
    branches:
      - work/integrated-interpretation-v2
    paths:
      - .github/workflows/apply-salience-relationship-v13c.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/integrated-interpretation-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Reapply V13 contract and harden relationship timing
        run: |
          python - <<'PY'
          from pathlib import Path
          src=Path('.github/workflows/apply-salience-relationship-v13b.yml').read_text(encoding='utf-8')
          marker="          python - <<'PY'\n"
          start=src.index(marker)+len(marker)
          end=src.index("\n          PY\n",start)
          body=src[start:end]
          body='\n'.join(line[10:] if line.startswith('          ') else line for line in body.splitlines())
          Path('/tmp/apply_v13.py').write_text(body+'\n',encoding='utf-8')
          PY
          python /tmp/apply_v13.py
          python - <<'PY'
          from pathlib import Path

          p=Path('supabase/functions/fortune-interpret-v6-preview/integratedInterpretationV2.ts')
          s=p.read_text(encoding='utf-8')
          s=s.replace('''"decisions","clusters","relationship_reading","contact_flow","investment_reading","systems","priorities","topic_analysis","limits"]};''','''"decisions","clusters","contact_flow","investment_reading","systems","priorities","topic_analysis","limits"]};''',1)
          s=s.replace('''if(!o||typeof o!=="object"||!o.overall||!o.clusters||!o.relationship_reading||!o.contact_flow||!o.investment_reading||!o.systems||!o.topic_analysis)return null;''','''if(!o||typeof o!=="object"||!o.overall||!o.clusters||!o.contact_flow||!o.investment_reading||!o.systems||!o.topic_analysis)return null;''',1)
          p.write_text(s,encoding='utf-8')

          p=Path('supabase/functions/fortune-interpret-v6-preview/qualityV2.ts')
          s=p.read_text(encoding='utf-8')
          old='''  if(!Array.isArray(data?.decisions))s1.push("decisions 누락");\n  if(!data?.relationship_reading||typeof data.relationship_reading!=="object")s1.push("relationship_reading 누락");\n  for(const k of TOPICS){\n'''
          new='''  if(!Array.isArray(data?.decisions))s1.push("decisions 누락");\n  for(const k of TOPICS){\n'''
          if old not in s: raise SystemExit('conditional relationship structure anchor missing')
          s=s.replace(old,new,1)
          old='''  for(const d of uniq(claimStrings(data).flatMap(datesInText)))if(!knownExactDates.has(d))s2.push(`계산근거에서 찾을 수 없는 날짜 언급: ${d}`);\n  stages.push(qualityStage(2,"근거 추적성",uniq(s2).slice(0,35)));\n'''
          new='''  for(const d of uniq(claimStrings(data).flatMap(datesInText)))if(!knownExactDates.has(d))s2.push(`계산근거에서 찾을 수 없는 날짜 언급: ${d}`);\n  const relationshipTimingRefs=(data?.relationship_reading?.evidence_refs??[]).map((r:string)=>map.get(r)).filter(Boolean) as any[];\n  for(const d of uniq(datesInText(String(data?.relationship_reading?.focus_timing??"")))){\n    if(!relationshipTimingRefs.some(row=>isoDate(row?.date)===d))s2.push(`관계·재회 주목 날짜에 직접 날짜 근거 미연결: ${d}`);\n  }\n  stages.push(qualityStage(2,"근거 추적성",uniq(s2).slice(0,35)));\n'''
          if old not in s: raise SystemExit('relationship exact-date grounding anchor missing')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          p=Path('supabase/functions/fortune-interpret-v6-preview/integratedInterpretationV2.test.mjs')
          s=p.read_text(encoding='utf-8')
          s=s.replace('''evidence_refs:[ref("W:overall:수신신호"),ref("W:overall:과거인연접점"),octReconnect]''','''evidence_refs:[ref("W:overall:수신신호"),julyOutgoing,octReconnect]''',1)
          s=s.replace('''assert.match(fabricatedReport.stages[1].issues.join(" "),/찾을 수 없는 날짜/);''','''assert.match(fabricatedReport.stages[1].issues.join(" "),/직접 날짜 근거 미연결/);''',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Full interpretation regression
        run: |
          node --experimental-strip-types --test supabase/functions/fortune-interpret-v6-preview/periodInstruction.test.mjs
          node --experimental-strip-types --test supabase/functions/fortune-interpret-v6-preview/qualityPeriods.test.mjs
          node --experimental-strip-types --test supabase/functions/fortune-interpret-v6-preview/integratedInterpretationV2.test.mjs
          node --experimental-strip-types --test supabase/functions/fortune-interpret-v6-preview/thaiContract.test.mjs
          node --experimental-strip-types --test web/src/lib/fortuneAiJob.test.mjs
      - name: Web production build
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Commit V13 salience relationship contract
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/functions/fortune-interpret-v6-preview/integratedInterpretationV2.ts supabase/functions/fortune-interpret-v6-preview/qualityV2.ts supabase/functions/fortune-interpret-v6-preview/integratedInterpretationV2.test.mjs supabase/functions/fortune-interpret-v6-preview/qualityPeriods.test.mjs web/src/appTypes.ts web/src/PeriodAiInterpretationPanel.tsx web/src/AiInterpretationPanel.tsx web/src/lib/readingCache.ts web/src/lib/fortuneAiJob.ts web/src/lib/fortuneAiJob.test.mjs
          git diff --cached --quiet && exit 0
          git commit -m 'feat(ai): weight interpretation by salience and relationship flow'
          git push origin HEAD:work/integrated-interpretation-v2
