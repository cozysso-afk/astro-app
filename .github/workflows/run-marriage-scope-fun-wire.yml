name: Run marriage scope fun wiring

on:
  push:
    branches:
      - work/ai-cost-guard-v21
    paths:
      - '.github/workflows/run-marriage-scope-fun-wire.yml'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Wire personal vs partner marriage scope
        run: python scripts/patch_marriage_scope_fun_copy.py
      - name: Verify scope contract
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('web/src/AppNext.tsx').read_text()
          assert "const [marriageScope" in s
          assert "marriageScope === 'personal'" in s
          assert "const needsCounterpart" in s
          assert "/v1/marriage/personal" in s
          assert '상대 없음 · 개인 결혼운' in s
          assert '결혼 가능성 · 시기 · 미래 배우자상' in s
          assert '특정 상대 있음 · 결혼궁합' in s
          assert '0~100은 점성 엔터테인먼트 지수' in s
          assert 'isPersonalMarriage?runPersonalMarriage:runRelationship' in s
          assert '{needsCounterpart&&<>' in s
          assert 'PersonalMarriagePanel' in s
          assert '결혼 성사 확률이나 미래 배우자 신원은 예언하지 않아' not in s
          PY
          git diff --check
      - name: Verify web production build
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Commit verified wiring
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/run-marriage-scope-fun-wire.yml scripts/patch_marriage_scope_fun_copy.py
          git add -A
          git commit -m 'feat(marriage): wire personal forecast and partner marriage paths'
          git push origin HEAD:work/ai-cost-guard-v21
