name: Apply Reunion Evidence V2

on:
  push:
    branches: [feat/reunion-evidence-v2]
    paths:
      - 'scripts/apply_reunion_evidence_v2.py'
      - 'supabase/functions/relationship-interpret-v9-preview/reunionEvidenceV2.ts'
      - 'supabase/functions/relationship-interpret-v9-preview/reunionEvidenceV2.test.mjs'
      - 'web/src/lib/relationshipReunionV2.contract.test.mjs'
      - '.github/workflows/apply-reunion-evidence-v2.yml'

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/reunion-evidence-v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Apply patch
        run: python3 scripts/apply_reunion_evidence_v2.py
      - name: Evidence compiler tests
        run: node --experimental-strip-types --test supabase/functions/relationship-interpret-v9-preview/reunionEvidenceV2.test.mjs
      - name: Web contract tests
        run: node --test web/src/lib/relationshipReunionV2.contract.test.mjs
      - name: Install web deps
        working-directory: web
        run: npm ci
      - name: Build web
        working-directory: web
        run: npm run build
      - name: Commit generated integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/functions/relationship-interpret-v9-preview/index.ts supabase/functions/relationship-interpret-v9-preview/publicError.ts web/src/appTypes.ts web/src/RelationshipInterpretationPanel.tsx
          if git diff --cached --quiet; then
            echo 'No integration changes to commit.'
          else
            git commit -m 'Integrate reunion evidence v2'
            git push origin HEAD:feat/reunion-evidence-v2
          fi
