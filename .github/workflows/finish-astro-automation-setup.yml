name: Finish astrology automation setup

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/finish-astro-automation-setup.yml"

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      ONESIGNAL_APP_API_KEY: ${{ secrets.ONESIGNAL_APP_API_KEY }}
      ASTRO_APP_PIN: ${{ secrets.ASTRO_APP_PIN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync current main
        run: git pull --rebase origin main

      - name: Verify required secrets exist
        shell: bash
        run: |
          missing=0
          if [ -z "$ONESIGNAL_APP_API_KEY" ]; then echo "::error::Missing repository secret: ONESIGNAL_APP_API_KEY"; missing=1; fi
          if [ -z "$ASTRO_APP_PIN" ]; then echo "::error::Missing repository secret: ASTRO_APP_PIN"; missing=1; fi
          exit "$missing"

      - name: Verify public OneSignal App ID is configured
        shell: bash
        run: grep -Eq 'oneSignalAppId: "[0-9a-fA-F-]{36}"' push-config.js

      - name: Apply persistent IndexedDB storage hardening
        run: python scripts/upgrade_persistent_storage_v671.py

      - name: Apply IndexedDB archive backup and restore
        run: python scripts/upgrade_archive_resilience_v690.py

      - name: Apply Streamlit push deep-link routing
        run: python scripts/upgrade_push_deeplink_v68.py

      - name: Validate Python workers and app
        run: |
          python -m py_compile app.py
          python -m py_compile scripts/prewarm_streamlit_horoscope.py
          python -m py_compile scripts/send_onesignal_horoscope_push.py
          python -m py_compile scripts/upgrade_archive_resilience_v690.py

      - name: Validate final feature markers
        shell: bash
        run: |
          git diff --check
          grep -Eq 'oneSignalAppId: "[0-9a-fA-F-]{36}"' push-config.js
          grep -q 'def _request_browser_persistent_storage' app.py
          grep -q 'navigator.storage.persist()' app.py
          grep -q 'IndexedDB 오래 보관 요청' app.py
          grep -q 'def _read_browser_archive_backup' app.py
          grep -q 'def _restore_browser_archive_records' app.py
          grep -q '저장함 JSON 백업 다운로드' app.py
          grep -q '백업 JSON 복원' app.py
          grep -q 'PUSH_ROUTE_TO_VIEW=' app.py
          grep -q 'push_date_text=_query_param_text' app.py
          grep -q '_push_monthly_autocalc' app.py
          grep -q '운세 알림에서 해당 리포트로 바로 이동했어' app.py
          grep -q 'OneSignalSDK.sw.js' OneSignalSDKWorker.js
          grep -q 'Notifications.requestPermission' index.html

      - name: Commit setup result
        shell: bash
        run: |
          if git diff --quiet -- app.py; then
            echo "Automation setup is already fully applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git commit -m "feat: finish astrology automation setup"
          git pull --rebase origin main
          git push origin HEAD:main
