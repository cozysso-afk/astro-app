name: Patch V21.3 investment output guard

on:
  push:
    branches:
      - work/ai-cost-guard-v21
    paths:
      - '.github/workflows/patch-v213-investment-output-guard.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python scripts/patch_v213_investment_guard.py
      - name: Run V21 regression
        run: node --experimental-strip-types --test supabase/functions/fortune-interpret-v21-preview/costGuardV21.test.mjs
      - name: Diff sanity
        run: git diff --check
      - name: Commit patch and cleanup helpers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/patch-v213-investment-output-guard.yml scripts/patch_v213_investment_guard.py
          git add supabase/functions/fortune-interpret-v21-preview/costGuardV21.ts supabase/functions/fortune-interpret-v21-preview/costGuardV21.test.mjs
          git commit -m 'fix(ai): neutralize investment timing guidance after generation'
          git push origin HEAD:work/ai-cost-guard-v21
