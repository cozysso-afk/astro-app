name: Apply advanced relationship Western v0.1.7

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-relationship-western-v17.yml"

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Syntax check patcher and engine
        run: python -m py_compile relationship_western_v1.py scripts/upgrade_relationship_western_v17.py

      - name: Apply Fortune Lab integration
        run: python scripts/upgrade_relationship_western_v17.py

      - name: Syntax check integrated app
        run: python -m py_compile app.py fortune_lab_v71.py relationship_western_v1.py

      - name: Install Swiss Ephemeris for smoke test
        run: python -m pip install --disable-pip-version-check -q pyswisseph==2.10.3.2

      - name: Relationship engine smoke test
        shell: bash
        run: |
          python - <<'PY'
          from datetime import date, time
          from relationship_western_v1 import build_relationship_western
          a={"birth_date":date(1991,3,21),"birth_time":time(7,26),"time_known":True,"latitude":34.7604,"longitude":127.6622,"utc_offset_hours":9.0}
          b={"birth_date":date(1992,2,29),"birth_time":time(12,0),"time_known":True,"latitude":35.1595,"longitude":126.8526,"utc_offset_hours":9.0}
          out=build_relationship_western(a,b,[(date(2026,8,1),date(2026,8,31)),(date(2026,9,1),date(2026,9,30))])
          assert out["ok"]
          assert out["natal_synastry"]["available"]
          assert out["davison"]["available"]
          assert out["marks"]["available"]
          assert len(out["months"])==2
          assert out["months"][0]["progressed_synastry"]["available"]
          assert out["months"][0]["progressed_composite"]["available"]
          assert out["months"][0]["marks_tertiary"]["available"]
          print('relationship western smoke OK')
          PY

      - name: Verify integration markers
        shell: bash
        run: |
          grep -q 'FORTUNE_LAB_VERSION = "v0.1.7"' fortune_lab_v71.py
          grep -q 'build_relationship_western' fortune_lab_v71.py
          grep -q '"birth_lat":lat' app.py
          grep -q 'relationship_western' fortune_lab_v71.py
          grep -q '프로그레스드 컴포짓' fortune_lab_v71.py
          grep -q '마크스 3차진행' fortune_lab_v71.py
          grep -q 'Tertiary I' relationship_western_v1.py

      - name: Diff sanity
        run: git diff --check

      - name: Commit integrated files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py fortune_lab_v71.py relationship_western_v1.py scripts/upgrade_relationship_western_v17.py
          git commit -m "feat: add advanced relationship astrology layers"
          git push origin HEAD:main
