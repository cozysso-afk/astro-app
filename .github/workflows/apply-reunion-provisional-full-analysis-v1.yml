name: Apply reunion provisional full analysis v1

on:
  push:
    branches: [fix/reunion-provisional-full-analysis-spacing-v1]

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/reunion-provisional-full-analysis-spacing-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Apply targeted patch
        run: python scripts/patch_reunion_provisional_full_analysis_v1.py
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r api/requirements.txt pytest
      - name: Install web dependencies
        run: npm --prefix web ci
      - name: Birth-time and reunion regressions
        env:
          PYTHONPATH: .
        run: |
          pytest -q tests/test_birth_time_reliability_v12.py tests/test_reunion_dimensions_v14.py
      - name: UI and interpretation contracts
        run: |
          node --experimental-strip-types --check supabase/functions/relationship-interpret-v9-preview/index.ts
          node --test web/src/lib/provisionalFullAnalysisV127.test.mjs
          node --test web/src/lib/relationshipModeContract.test.mjs
          node --test web/src/lib/relationshipEvidencePipeline.test.mjs
          node --test web/src/lib/relationshipReunionV2.contract.test.mjs
          node --test web/src/lib/reunionEditorialV126.test.mjs
      - name: Production web build
        run: npm --prefix web run build
      - name: Commit verified changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add relationship_western_v1.py reunion_dimension_v1.py relationship_reliability_v1.py web/src/RelationshipPrecisionDetails.tsx web/src/mobile-density-v29.css supabase/functions/relationship-interpret-v9-preview/index.ts web/src/lib/readingCache.ts web/src/lib/relationshipModeContract.test.mjs web/src/lib/relationshipEvidencePipeline.test.mjs web/src/lib/relationshipReunionV2.contract.test.mjs web/src/lib/reunionEditorialV126.test.mjs web/src/lib/humanLanguageV25.test.mjs web/src/lib/provisionalFullAnalysisV127.test.mjs tests/test_birth_time_reliability_v12.py tests/test_reunion_dimensions_v14.py
          git diff --cached --quiet && exit 0
          git commit -m 'fix: analyze entered birth time layers with provisional weighting'
          git push origin HEAD:fix/reunion-provisional-full-analysis-spacing-v1
