name: temporary stability verifier v29

on:
  push:
    branches:
      - fix/reunion-hierarchy-v2

permissions:
  contents: write

jobs:
  repair-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Restore intact interpretation contract test and update only stale assertions
        run: |
          git checkout f6f82be7a935ebe7a897268c65f3278d765fe319 -- web/src/lib/interpretationUiContract.test.mjs
          python - <<'PY'
          from pathlib import Path
          p = Path('web/src/lib/interpretationUiContract.test.mjs')
          s = p.read_text()
          old1 = "assert.match(joined,/실제 진도로 옮기는 쪽/)"
          new1 = "assert.match(joined,/실제 진도로 옮기는 것/)"
          old2 = "assert.match(joined,/질문·답장을 이어가는 쪽/)"
          new2 = "assert.match(joined,/질문과 답장이 실제 대화로 이어지는지 보는 것/)"
          for old, new in [(old1,new1),(old2,new2)]:
              if old not in s:
                  raise SystemExit(f'missing stale assertion: {old}')
              s = s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Install web dependencies
        working-directory: web
        run: npm ci
      - name: Run human-language and reunion regressions
        working-directory: web
        run: |
          node --experimental-strip-types --test src/lib/interpretationUiContract.test.mjs
          node --test src/lib/relationshipReunionV2.contract.test.mjs
          node --test src/lib/humanLanguageV25.test.mjs
      - name: Build web
        working-directory: web
        run: npm run build
      - name: Commit verified repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/src/lib/interpretationUiContract.test.mjs
          if git diff --cached --quiet; then
            echo 'No source changes to commit'
          else
            git commit -m 'test: restore full interpretation contract and refresh copy assertions'
            git push origin HEAD:fix/reunion-hierarchy-v2
          fi
