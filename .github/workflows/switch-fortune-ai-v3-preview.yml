name: Switch fortune AI v3 preview

on:
  push:
    branches:
      - ui-reading-overhaul-20260829
    paths:
      - .github/workflows/switch-fortune-ai-v3-preview.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui-reading-overhaul-20260829
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Switch preview function
        run: python scripts/switch_fortune_ai_v3_preview.py
      - name: Build web
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Commit switch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/src/AppNext.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "test: use fortune interpreter v3 preview"
          git push origin HEAD:ui-reading-overhaul-20260829
