name: Contact relative signal patch

on:
  push:
    branches: [fix/contact-relative-signal-copy]
    paths:
      - 'scripts/patch_contact_relative_signal.py'
      - '.github/workflows/contact-relative-signal-patch.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply targeted contact copy patch
        run: python scripts/patch_contact_relative_signal.py
      - name: Verify targeted semantics
        run: |
          grep -q '연락 자체의 강도와 별개로 상대 비교에서는' web/src/lib/fortuneEditorialV3.ts
          grep -q 'displayFlowBand(stat.average' web/src/lib/fortuneUserSummary.ts
          grep -q '이 강약만으로 실제 연락이 오거나 안 온다고 판단하지 않아' web/src/lib/fortuneUserSummary.ts
          ! grep -q '판정상 동률권이야' web/src/lib/fortuneEditorialV3.ts
          git diff --check
      - name: Commit patched files
        run: |
          if git diff --quiet -- web/src/lib/fortuneEditorialV3.ts web/src/lib/fortuneUserSummary.ts web/src/lib/fortuneEditorialV3.test.mjs; then
            echo 'No source diff to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/src/lib/fortuneEditorialV3.ts web/src/lib/fortuneUserSummary.ts web/src/lib/fortuneEditorialV3.test.mjs
          git commit -m 'fix: separate contact strength from relative direction'
          git push origin HEAD:fix/contact-relative-signal-copy
