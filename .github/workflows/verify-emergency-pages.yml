name: Verify Emergency Pages Frontend

on:
  push:
    paths:
      - '.github/workflows/verify-emergency-pages.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify page and API CORS
        shell: bash
        run: |
          set -euo pipefail
          PAGE='https://cozysso-afk.github.io/astro-app/mobile/'
          API='https://astro-app-api-f7fn.onrender.com'

          echo '--- PAGE ---'
          ok=0
          for i in $(seq 1 12); do
            if curl -fsSL --max-time 30 "$PAGE?verify=$i" -o /tmp/page.html \
              && grep -q '별빛의 운명' /tmp/page.html \
              && grep -q '/astro-app/mobile/assets/' /tmp/page.html; then
              ok=1
              break
            fi
            echo "page not propagated yet: $i"
            head -c 700 /tmp/page.html 2>/dev/null || true
            echo
            sleep 10
          done
          [ "$ok" = 1 ] || { echo 'PAGE VERIFY FAILED'; exit 1; }
          echo 'PAGE OK'

          echo '--- API HEALTH ---'
          curl -fsSL --max-time 30 "$API/health"
          echo

          echo '--- CORS ---'
          cors_ok=0
          for i in $(seq 1 12); do
            curl -sS -D /tmp/headers -o /dev/null --max-time 30 -X OPTIONS "$API/v1/fortune/integrated/start" \
              -H 'Origin: https://cozysso-afk.github.io' \
              -H 'Access-Control-Request-Method: POST' \
              -H 'Access-Control-Request-Headers: content-type'
            if grep -qi '^access-control-allow-origin: https://cozysso-afk.github.io' /tmp/headers; then
              cors_ok=1
              break
            fi
            echo "CORS not propagated yet: $i"
            cat /tmp/headers
            sleep 10
          done
          [ "$cors_ok" = 1 ] || { echo 'CORS VERIFY FAILED'; cat /tmp/headers; exit 1; }
          echo 'CORS OK'
