name: Refactor AppNext integrated AI panel once

on:
  push:
    branches:
      - refactor/appnext-integrated-ai-panel-20260901

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/appnext-integrated-ai-panel-20260901
          fetch-depth: 0

      - name: Extract integrated AI result panel
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          app_path = Path('web/src/AppNext.tsx')
          panel_path = Path('web/src/AiInterpretationPanel.tsx')
          workflow_path = Path('.github/workflows/refactor-appnext-integrated-ai-once.yml')

          original = app_path.read_text()
          text = original
          start = text.index('function AiInterpretationPanel')
          end = text.index('const PERIOD_CACHE_TTL_DAYS', start)
          block = text[start:end].rstrip()
          if block.count('function AiInterpretationPanel') != 1:
              raise SystemExit('Unexpected AiInterpretationPanel block')
          block = block.replace(
              'function AiInterpretationPanel({ result, loading, error, onRetry }: {',
              'export function AiInterpretationPanel({ result, loading, error, onRetry, topics }: {',
              1,
          )
          block = block.replace(
              '  onRetry: () => void\n',
              '  onRetry: () => void\n  topics: string[]\n',
              1,
          )
          block = block.replace('topicOrder.map((topic)=>{', 'topics.map((topic)=>{', 1)
          if 'topicOrder.map((topic)=>{' in block or 'topics: string[]' not in block:
              raise SystemExit('Failed to isolate topicOrder dependency')

          panel_path.write_text(
              "import { AlertTriangle, LoaderCircle, Sparkles } from 'lucide-react'\n"
              "import type { AiInterpretationResponse } from './appTypes'\n"
              "import { estimateGeminiUsage } from './lib/aiUsage'\n\n"
              + block + '\n'
          )
          text = text[:start] + text[end:]

          import_anchor = "import { PeriodAiInterpretationPanel } from './PeriodAiInterpretationPanel'\n"
          if import_anchor not in text:
              raise SystemExit('Period panel import anchor missing')
          text = text.replace(import_anchor, import_anchor + "import { AiInterpretationPanel } from './AiInterpretationPanel'\n", 1)

          old_call = '<AiInterpretationPanel result={aiInterpretation} loading={aiLoading} error={aiError} onRetry={()=>void runAiInterpretation()}/>'
          new_call = '<AiInterpretationPanel result={aiInterpretation} loading={aiLoading} error={aiError} onRetry={()=>void runAiInterpretation()} topics={topicOrder}/>'
          if text.count(old_call) != 1:
              raise SystemExit(f'Expected one AiInterpretationPanel call, found {text.count(old_call)}')
          text = text.replace(old_call, new_call, 1)
          app_path.write_text(text)

          workflow_path.unlink()
          print(f'AppNext bytes: {len(original.encode())} -> {len(text.encode())}')
          print(f'AiInterpretationPanel bytes: {len(panel_path.read_bytes())}')
          PY

      - name: Build web
        working-directory: web
        run: npm ci && npm run build

      - name: Commit refactor
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/src/AppNext.tsx web/src/AiInterpretationPanel.tsx .github/workflows/refactor-appnext-integrated-ai-once.yml
          git diff --cached --check
          git commit -m "refactor(web): extract integrated AI panel"
          git push origin HEAD:refactor/appnext-integrated-ai-panel-20260901
