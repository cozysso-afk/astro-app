name: Reunion Candidate Private Replay CI

on:
  pull_request:
    paths:
      - '.github/workflows/reunion-candidate-private-replay-ci.yml'
      - 'reunion_hierarchy_v2.py'
      - 'tests/test_reunion_policy_targeted_candidate_v1.py'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  private-replay:
    name: Final candidate private aggregate replay
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: api/requirements.txt

      - name: Install calculation dependencies
        run: python -m pip install -q -r api/requirements.txt

      - name: Fetch private replay requests with GitHub OIDC
        shell: bash
        run: |
          set -euo pipefail
          oidc_json="$(curl -fsS \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=reunion-audit-supabase")"
          oidc_token="$(python -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<<"${oidc_json}")"
          unset oidc_json
          curl -fsS -X POST \
            -H "Authorization: Bearer ${oidc_token}" \
            -H 'Content-Type: application/json' \
            'https://dbynfabwfcakxayyggzi.supabase.co/functions/v1/reunion-audit-request-v1' \
            -o /tmp/reunion_private_payload.json
          unset oidc_token
          chmod 600 /tmp/reunion_private_payload.json

      - name: Run final candidate aggregate replay
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from api.main import RelationshipRequest, relationship_western
          import reunion_hierarchy_v2 as engine

          payload = json.loads(Path('/tmp/reunion_private_payload.json').read_text())
          requests = payload.get('requests') or []
          if not requests:
              raise SystemExit('no private replay requests returned')
          allowed = (
              'user', 'counterpart', 'start_date', 'end_date', 'as_of_date',
              'query_utc_offset_hours', 'query_timezone_id', 'analysis_mode', 'relationship_status',
          )
          target_stages = ('in_person_meeting', 'relationship_rebuilding')
          output = []
          for index, request in enumerate(requests):
              body = {key: request[key] for key in allowed if key in request}
              result = relationship_western(RelationshipRequest(**body))['result']
              hierarchy = result['reunion_hierarchy']
              selectivity = hierarchy.get('selectivity') or {}
              stages = hierarchy.get('stages') or {}
              stage_rows = {}
              for stage in target_stages:
                  values = selectivity.get(stage) or {}
                  stage_values = stages.get(stage) or {}
                  stage_rows[stage] = {
                      'future_days': int(values.get('future_total_days') or 0),
                      'long_pass': int(values.get('future_long_term_pass_days') or 0),
                      'mid_pass': int(values.get('future_medium_anchor_pass_days') or 0),
                      'trigger_pass': int(values.get('future_semantic_stage_trigger_pass_days') or 0),
                      'hierarchy_pass': int(values.get('future_hierarchy_eligible_days') or 0),
                      'peaks': int(values.get('future_local_peak_days') or 0),
                      'candidate_count': int(stage_values.get('candidate_count') or 0),
                  }
              output.append({
                  'case_index': index + 1,
                  'engine_version': hierarchy.get('version'),
                  'policy_revision': (hierarchy.get('selection_policy') or {}).get('policy_revision'),
                  'rebuilding_medium_gate_keys': sorted(engine._medium_gate_keys('relationship_rebuilding')),
                  'stages': stage_rows,
                  'privacy': 'aggregate counts only; raw profiles, evidence rows, and exact dates omitted',
              })
          print(json.dumps(output, ensure_ascii=False, indent=2))
          PY

      - name: Remove private replay material
        if: always()
        shell: bash
        run: rm -f /tmp/reunion_private_payload.json
