name: Fix Starlight Result Integrity 2026-08-31

on:
  push:
    branches:
      - fix/starlight-result-integrity-20260831
    paths:
      - 'scripts/fix_starlight_result_integrity_20260831.py'
      - '.github/workflows/fix-starlight-result-integrity-20260831.yml'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/starlight-result-integrity-20260831
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: api/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Apply result-integrity patch
        run: python scripts/fix_starlight_result_integrity_20260831.py

      - name: Install calculation dependencies
        run: pip install -r api/requirements.txt

      - name: Compile Python product modules
        run: python -m py_compile api/main.py relationship_western_v1.py relationship_saju_v1.py

      - name: Verify relationship API input safety
        run: |
          python - <<'PY'
          from datetime import date, time
          from fastapi import HTTPException
          from api.main import RelationshipProfile, RelationshipRequest, relationship_western

          def expect_422(req, needle):
              try:
                  relationship_western(req)
              except HTTPException as exc:
                  assert exc.status_code == 422, exc
                  assert needle in str(exc.detail), exc.detail
                  return
              raise AssertionError('expected HTTP 422')

          user_no_place = RelationshipProfile(
              name='A', birth_date=date(1991,3,21), birth_time=time(7,26), time_known=True,
              latitude=None, longitude=None, utc_offset_hours=9,
          )
          cp_unknown = RelationshipProfile(
              name='B', birth_date=date(1992,2,9), birth_time=None, time_known=False,
              latitude=None, longitude=None, utc_offset_hours=9,
          )
          expect_422(RelationshipRequest(
              user=user_no_place, counterpart=cp_unknown,
              start_date=date(2026,8,1), end_date=date(2026,8,7), analysis_mode='compatibility'
          ), 'user birth coordinates')

          user = RelationshipProfile(
              name='A', birth_date=date(1991,3,21), birth_time=time(7,26), time_known=True,
              latitude=34.7604, longitude=127.6622, utc_offset_hours=9,
          )
          cp_known_no_place = RelationshipProfile(
              name='B', birth_date=date(1992,2,9), birth_time=time(10,15), time_known=True,
              latitude=None, longitude=None, utc_offset_hours=9,
          )
          expect_422(RelationshipRequest(
              user=user, counterpart=cp_known_no_place,
              start_date=date(2026,8,1), end_date=date(2026,8,7), analysis_mode='compatibility'
          ), 'counterpart birth coordinates')

          ok = relationship_western(RelationshipRequest(
              user=user, counterpart=cp_unknown,
              start_date=date(2026,8,1), end_date=date(2026,8,7), analysis_mode='reunion'
          ))
          assert ok['ok'] is True
          assert ok['result']['natal_synastry']['partner_time_exact'] is False
          assert ok['result']['house_overlays']['available'] is False
          assert ok['result']['reunion_transits']['available'] is True
          forbidden={'Moon','ASC','DSC','MC','IC'}
          assert not [x for x in ok['result']['natal_synastry']['aspects'] if x.get('b') in forbidden]
          print('RELATIONSHIP_INPUT_SAFETY_PASS')
          PY

      - name: Verify result invalidation and race guards
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('web/src/AppNext.tsx').read_text()
          required=[
              'relationshipRevisionRef = useRef(0)',
              'restoringRelationshipRef = useRef(false)',
              'parseOptionalNumber(counterpart.latitude)',
              'parseOptionalNumber(counterpart.longitude)',
              'revision !== relationshipRevisionRef.current',
              'setRelationshipRequestSnapshot(null)',
              'restoringRelationshipRef.current = true',
              "const snapshotMode = String(relationshipRequestSnapshot?.analysis_mode ?? '')",
          ]
          for token in required:
              assert token in s, token
          assert "counterpart.timeKnown ? Number(counterpart.latitude) : null" not in s
          assert "counterpart.timeKnown ? Number(counterpart.longitude) : null" not in s
          api=Path('api/main.py').read_text()
          for token in [
              'user birth coordinates are required for the precision relationship engine',
              'counterpart birth coordinates are required when time_known=true',
              'self.latitude if exact_time else None',
              'self.longitude if exact_time else None',
          ]:
              assert token in api, token
          print('RESULT_INTEGRITY_STATIC_PASS')
          PY

      - name: Check AI Edge Functions
        run: |
          deno check supabase/functions/relationship-interpret-v9-preview/index.ts
          deno check supabase/functions/fortune-interpret-v6-preview/core.ts
          deno check supabase/functions/fortune-interpret-v6-preview/index.ts

      - name: Build frontend
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Diff safety
        run: |
          git diff --check
          git status --short

      - name: Commit verified product changes only
        run: |
          git rm scripts/fix_starlight_result_integrity_20260831.py .github/workflows/fix-starlight-result-integrity-20260831.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/src/AppNext.tsx api/main.py
          git commit -m 'fix: prevent stale relationship results and invalid coordinates'
          git push origin HEAD:fix/starlight-result-integrity-20260831
