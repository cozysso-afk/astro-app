name: Verify screenshot regression fixes

on:
  push:
    branches:
      - fix/extend-cache-unknown-time-location-20260831
    paths:
      - .github/workflows/fix-screenshot-regressions-20260831.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/extend-cache-unknown-time-location-20260831
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Apply screenshot regression fixes
        run: python scripts/fix_screenshot_regressions_20260831.py

      - name: Regression assertions
        run: |
          python - <<'PY'
          from pathlib import Path
          app=Path('web/src/AppNext.tsx').read_text()
          css=Path('web/src/fortune-ux-v14.css').read_text()
          edge=Path('supabase/functions/relationship-interpret-v9-preview/index.ts').read_text()
          for token in ['today: 180','week: 370','month: 730','year: 1825','<KoreaBirthplaceSelector value={counterpart}','출생지역은 그대로 기록 가능']:
              assert token in app, token
          assert '상대 출생시간·정확 장소가 없어' not in app
          assert '상대 출생시간을 몰라 진행 궁합차트' in app
          assert '.birth-time-field input[type="time"]::-webkit-date-and-time-value' in css
          assert '.birth-time-field input[type="time"]::-webkit-datetime-edit-ampm-field' in css
          assert '@media (display-mode: standalone) and (max-width:600px)' in css
          assert 'relationship-v10.3-unknown-time-resilient' in edge
          assert 'const unknownTime=payload?.precision?.partner_time_exact===false;' in edge
          assert 'grounded(data,payload,purpose,compactMode)' in edge
          print('SCREENSHOT_REGRESSION_STATIC_PASS')
          PY

      - name: Edge function type check
        run: deno check supabase/functions/relationship-interpret-v9-preview/index.ts

      - name: Python engine syntax and unknown-time safety
        run: |
          python -m py_compile api/main.py relationship_western_v1.py relationship_saju_v1.py integrated_fortune_v1.py thai_astrology_v2.py thai_suriyayat_v1.py
          python - <<'PY'
          from pathlib import Path
          rel=Path('relationship_western_v1.py').read_text()
          assert 'include_moon=time_known' in rel
          assert 'include_angles=time_known and profile.get("latitude") is not None' in rel
          assert 'if user_exact and cp_exact:' in rel
          print('UNKNOWN_TIME_ENGINE_GUARD_PASS')
          PY

      - name: Frontend production build
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Diff safety
        run: git diff --check

      - name: Commit verified product changes to work branch
        run: |
          rm -rf __pycache__ api/__pycache__
          git rm -f scripts/fix_screenshot_regressions_20260831.py .github/workflows/fix-screenshot-regressions-20260831.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/src/AppNext.tsx web/src/fortune-ux-v14.css supabase/functions/relationship-interpret-v9-preview/index.ts
          git commit -m 'fix: harden unknown-time relationship AI and iOS layout'
          git push origin HEAD:fix/extend-cache-unknown-time-location-20260831
