name: Verify Urgent Annual and Thai Hardening 2026-08-31

on:
  push:
    branches:
      - work/full-year-thai-hardening-20260831
    paths:
      - thai_astrology_v2.py
      - scripts/patch_urgent_hardening_v2.py
      - .github/workflows/verify-urgent-hardening-20260831.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-hardening:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/full-year-thai-hardening-20260831

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: api/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Apply urgent hardening patch
        run: python scripts/patch_urgent_hardening_v2.py

      - name: Install calculation dependencies
        run: pip install -r api/requirements.txt

      - name: Compile product modules
        run: python -m py_compile integrated_fortune_v1.py thai_astrology_v2.py api/main.py ai_interpret_v1.py relationship_western_v1.py

      - name: Verify Thai weekday boundaries and Mahathaksa wheel
        run: |
          python - <<'PY'
          from datetime import date,time
          import thai_astrology_v2 as t

          assert t._thai_day_key(date(2026,8,26), time(12,0)) == 'wednesday_day'
          assert t._thai_day_key(date(2026,8,26), time(20,0)) == 'wednesday_night'
          assert t._thai_day_key(date(2026,8,27), time(3,0)) == 'wednesday_night'
          assert t._thai_day_key(date(2026,8,27), time(7,0)) == 'thursday'
          wheel=t._wheel('moon')
          assert len(wheel)==8
          assert len({x['bhumi_key'] for x in wheel})==8
          assert len({x['planet']['key'] for x in wheel})==8
          assert [x['planet']['number'] for x in wheel] == [2,3,4,7,5,8,6,1]
          print('THAI_WEEKDAY_AND_MAHATHAKSA_PASS')
          PY

      - name: Verify documented Taksajorn worked example and birthday split
        run: |
          python - <<'PY'
          from datetime import date,time
          import thai_astrology_v2 as t

          planet,center=t._annual_boriwan('moon',47)
          assert planet=='mars' and center is False, (planet,center)

          # Monday-born dummy profile; range crosses birthday so age-in-progress must advance.
          assert date(1980,1,7).weekday()==0
          result=t.build_thai_fortune(date(1980,1,7),time(12,0),date(2026,1,1),date(2026,12,31))
          assert result['thai_day']=='월요일'
          assert result['mahathaksa']['available'] is True
          assert result['taksajorn']['available'] is True
          seg=result['taksajorn']['segments']
          assert len(seg)==2, seg
          assert seg[0]['start']=='2026-01-01' and seg[0]['end']=='2026-01-06'
          assert seg[0]['age_in_progress']==46
          assert seg[1]['start']=='2026-01-07' and seg[1]['end']=='2026-12-31'
          assert seg[1]['age_in_progress']==47
          assert seg[1]['annual_boriwan']['key']=='mars', seg[1]
          assert result['reliability']['suriyayat_transit']=='not_implemented'
          assert result['not_calculated']
          print('THAI_TAKSAJORN_DOCUMENTED_METHOD_PASS',seg)
          PY

      - name: Verify vectorized ephemeris equals scalar lookups
        run: |
          python - <<'PY'
          from datetime import datetime,timezone
          import integrated_fortune_v1 as f

          moments=[
            datetime(2026,1,3,1,0,tzinfo=timezone.utc),
            datetime(2026,4,18,5,30,tzinfo=timezone.utc),
            datetime(2026,8,31,10,0,tzinfo=timezone.utc),
            datetime(2026,12,25,13,0,tzinfo=timezone.utc),
          ]
          f._PLANET_PREWARM_LOCAL.values={}
          max_diff=0.0
          for body in ['Sun','Moon','Mercury','Venus','Mars','Jupiter','Saturn','Uranus','Neptune','Pluto']:
            vec=f._vectorized_planet_longitudes(body,moments)
            for moment in moments:
              scalar=f._planet_lon.__wrapped__(body,moment)
              diff=abs(vec[(body,moment)]-scalar)
              max_diff=max(max_diff,diff)
              assert diff < 1e-10, (body,moment,vec[(body,moment)],scalar,diff)
          print('VECTOR_SCALAR_EPHEMERIS_EQUALITY_PASS max_diff=',max_diff)
          PY

      - name: Produce 31-day scalar reference result
        env:
          ASTRO_DISABLE_VECTOR_PREWARM: '1'
        run: |
          python - <<'PY'
          import json
          from datetime import date,time
          import integrated_fortune_v1 as f
          r=f.build_integrated_fortune(
            birth_date=date(1991,3,21),birth_time=time(7,26),latitude=34.7604,longitude=127.6622,utc_offset_hours=9,gender='female',
            start_date=date(2026,8,1),end_date=date(2026,8,31),
          )
          reduced={
            'overall':r['western']['overall'],
            'relationship_signals':r['western']['relationship_signals'],
            'months':r['western']['months'],
            'market':{k:v for k,v in r['western']['market'].items() if k!='calendar_warning'},
            'saju':r['saju'],
            'thai':r['thai'],
          }
          open('/tmp/scalar.json','w',encoding='utf-8').write(json.dumps(reduced,ensure_ascii=False,sort_keys=True))
          print('SCALAR_31_REFERENCE_READY')
          PY

      - name: Compare 31-day vector result to scalar reference
        run: |
          python - <<'PY'
          import json
          from datetime import date,time
          import integrated_fortune_v1 as f
          r=f.build_integrated_fortune(
            birth_date=date(1991,3,21),birth_time=time(7,26),latitude=34.7604,longitude=127.6622,utc_offset_hours=9,gender='female',
            start_date=date(2026,8,1),end_date=date(2026,8,31),
          )
          reduced={
            'overall':r['western']['overall'],
            'relationship_signals':r['western']['relationship_signals'],
            'months':r['western']['months'],
            'market':{k:v for k,v in r['western']['market'].items() if k!='calendar_warning'},
            'saju':r['saju'],
            'thai':r['thai'],
          }
          scalar=json.loads(open('/tmp/scalar.json',encoding='utf-8').read())
          assert reduced==scalar, 'vector prewarm changed calculation output'
          assert r['western']['performance']['vector_ephemeris_prewarm'] is True
          print('VECTOR_31_FUNCTIONAL_REGRESSION_PASS prewarm=',r['western']['performance'])
          PY

      - name: Benchmark vectorized 365-day engine
        run: |
          python - <<'PY'
          import time,resource
          from datetime import date,time as dt_time
          import integrated_fortune_v1 as f
          profile=dict(birth_date=date(1991,3,21),birth_time=dt_time(7,26),latitude=34.7604,longitude=127.6622,utc_offset_hours=9,gender='female')
          t0=time.perf_counter()
          r=f.build_integrated_fortune(**profile,start_date=date(2026,1,1),end_date=date(2026,12,31))
          elapsed=time.perf_counter()-t0
          rss=resource.getrusage(resource.RUSAGE_SELF).ru_maxrss/1024
          assert r['period']['day_count']==365
          assert r['western']['performance']['vector_ephemeris_prewarm'] is True
          assert len(r['western']['months'])==12
          print(f'VECTOR_ANNUAL_BENCH annual365={elapsed:.3f}s maxrss={rss:.1f}MiB prewarm={r["western"]["performance"]["prewarmed_longitudes"]}')
          PY

      - name: Verify same-request job deduplication
        run: |
          python - <<'PY'
          from datetime import date,time
          import api.main as m

          req=m.IntegratedFortuneRequest(
            profile=m.FortuneProfile(name='A',birth_date=date(1991,3,21),birth_time=time(7,26),latitude=34.7604,longitude=127.6622,utc_offset_hours=9,gender='female'),
            start_date=date(2026,1,1),end_date=date(2026,12,31),
          )
          payload={
            'birth_date':req.profile.birth_date,'birth_time':req.profile.birth_time,'latitude':req.profile.latitude,'longitude':req.profile.longitude,
            'utc_offset_hours':req.profile.utc_offset_hours,'gender':req.profile.gender,'start_date':req.start_date,'end_date':req.end_date,
          }
          key=m._calc_request_key(payload)
          with m._calc_jobs_lock:
            m._calc_jobs.clear(); m._calc_request_index.clear()
            m._calc_jobs['existing']={'created_ts':__import__('time').time(),'status':'running','request_key':key}
            m._calc_request_index[key]='existing'
          out=m.fortune_integrated_start(req)
          assert out['job_id']=='existing' and out['reused'] is True and out['status']=='running',out
          changed=dict(payload); changed['end_date']=date(2026,12,30)
          assert m._calc_request_key(changed)!=key
          print('CALC_JOB_DEDUP_PASS',out)
          PY

      - name: Build frontend
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Verify product markers and production isolation
        run: |
          grep -q 'Mahathaksa(마하탁사)' web/src/AppNext.tsx
          grep -q 'Taksajorn(탁사쫀)' web/src/AppNext.tsx
          grep -q '_install_period_ephemeris_prewarm' integrated_fortune_v1.py
          grep -q '_calc_request_index' api/main.py
          grep -q 'Suriyayat' thai_astrology_v2.py
          echo 'NO_PRODUCTION_CALLS=TRUE'

      - name: Commit verified product files to work branch only
        run: |
          git config user.name "cozysso-afk"
          git config user.email "cozysso@gmail.com"
          git add integrated_fortune_v1.py thai_astrology_v2.py api/main.py ai_interpret_v1.py web/src/AppNext.tsx supabase/functions/fortune-interpret/index.ts
          if git diff --cached --quiet; then
            echo 'No product changes'
            exit 0
          fi
          git commit -m 'feat: harden annual jobs and add verified Thai period layer'
          git push origin HEAD:work/full-year-thai-hardening-20260831
