name: Compact AI Render v1.6

on:
  push:
    paths:
      - '.github/workflows/compact-ai-render-v16.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Apply compact AI patch
        run: python scripts/compact_ai_render_v16.py
      - name: Verify interpreter syntax and safeguards
        run: |
          python -m py_compile ai_interpret_v1.py
          grep -q 'mobile-ai-v2.1-render-safe' ai_interpret_v1.py
          grep -q '_compact_calculation' ai_interpret_v1.py
          grep -q 'timeout_seconds=22.0' ai_interpret_v1.py
          grep -q 'thinking_level="medium"' ai_interpret_v1.py
      - name: Commit AI patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ai_interpret_v1.py
          git diff --cached --quiet && { echo 'No changes'; exit 1; }
          git commit -m 'fix: compact AI payload and bound Gemini calls on Render'
          git push
