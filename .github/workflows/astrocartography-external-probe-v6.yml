name: Astrocartography External Probe V6

on:
  push:
    branches:
      - audit/astrocartography-gold-v6
    paths:
      - 'scripts/astrocartography_external_probe_v6.py'
      - '.github/workflows/astrocartography-external-probe-v6.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: api/requirements.txt
      - name: Install calculation dependencies
        run: python -m pip install -q -r api/requirements.txt
      - name: Fetch JPL RA/DEC and USNO GAST gold candidates
        run: PYTHONPATH=. python scripts/astrocartography_external_probe_v6.py
