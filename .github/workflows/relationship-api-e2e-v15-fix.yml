name: Relationship API E2E V15 Fix

on:
  push:
    branches:
      - audit/relationship-api-e2e-v15
    paths:
      - '.github/workflows/relationship-api-e2e-v15-fix.yml'

permissions:
  contents: write

jobs:
  api-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/relationship-api-e2e-v15
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply V15 API fixes
        run: python scripts/patch_relationship_api_e2e_v15.py
      - name: Install dependencies
        run: python -m pip install -q -r api/requirements.txt pytest httpx
      - name: Run V15 relationship API E2E
        run: |
          python -m py_compile api/main.py
          python -m pytest -q tests/test_relationship_api_e2e_v15.py
      - name: Run prior relationship regressions
        run: |
          python -m pytest -q \
            tests/test_reunion_dimensions_v14.py \
            tests/test_relationship_reliability_v13.py \
            tests/test_birth_time_reliability_v12.py \
            tests/test_relationship_timing_v9.py \
            tests/test_relationship_midpoints_v8.py
      - name: Commit permanent V15 changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add api/main.py tests/test_relationship_api_e2e_v15.py
          git diff --cached --check
          git commit -m 'fix(api): enforce relationship E2E contract V15'
          git push origin HEAD:audit/relationship-api-e2e-v15
