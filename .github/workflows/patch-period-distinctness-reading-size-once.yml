name: Patch period distinctness and reading size once

on:
  push:
    branches:
      - fix/period-distinctness-reading-size
    paths:
      - scripts/patch_period_distinctness_reading_size.py
      - .github/workflows/patch-period-distinctness-reading-size-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/period-distinctness-reading-size
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        working-directory: web
        run: npm ci
      - name: Apply patch
        run: python scripts/patch_period_distinctness_reading_size.py
      - name: Verify focused V23 and typography contracts
        run: |
          node --test supabase/functions/fortune-interpret-v23-preview/promptV23.test.mjs
          node --test web/src/lib/periodLongformLegibility.test.mjs
          npm --prefix web run build
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/fortune-interpret-v23-preview/periodNarrativeV23.ts \
            supabase/functions/fortune-interpret-v23-preview/promptV23.test.mjs \
            web/src/PeriodFortuneResults.tsx \
            web/src/reading-font-fix-v54.css \
            web/src/lib/periodLongformLegibility.test.mjs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Separate day and week narratives and enlarge long-form prose"
          git push origin HEAD:fix/period-distinctness-reading-size
