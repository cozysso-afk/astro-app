name: Finalize Starlight overhaul v8

on:
  push:
    branches:
      - ui-reading-overhaul-20260829
    paths:
      - .github/workflows/finalize-starlight-overhaul-v8.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui-reading-overhaul-20260829
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply v8 overhaul
        run: python scripts/finalize_starlight_overhaul_v8.py
      - name: Python syntax check
        run: python -m py_compile integrated_fortune_v1.py
      - name: Build web
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Commit v8
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add integrated_fortune_v1.py web/src/AppNext.tsx web/src/visual-overhaul-v6.css supabase/functions/fortune-interpret/index.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat: separate contact and market readings"
          git push origin HEAD:ui-reading-overhaul-20260829
