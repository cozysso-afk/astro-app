name: Refactor AppNext result formatters once

on:
  push:
    branches:
      - refactor/appnext-result-formatters-20260901

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/appnext-result-formatters-20260901
          fetch-depth: 0

      - name: Extract result formatters and clipboard helper
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          app_path = Path('web/src/AppNext.tsx')
          formatter_path = Path('web/src/lib/resultFormatters.ts')
          clipboard_path = Path('web/src/lib/clipboard.ts')
          topics_path = Path('web/src/lib/fortuneTopics.ts')
          workflow_path = Path('.github/workflows/refactor-appnext-result-formatters-once.yml')

          original = app_path.read_text()
          text = original

          # Shared fortune topic ordering: move the exact existing constants so UI and copy output stay aligned.
          topics_start = text.index("const coreTopicOrder =")
          topics_end = text.index("const topicEmoji", topics_start)
          topics_block = text[topics_start:topics_end].rstrip()
          if topics_block.count('const coreTopicOrder') != 1 or topics_block.count('const topicOrder') != 1:
              raise SystemExit('Unexpected fortune topic block')
          topics_exported = topics_block.replace('const coreTopicOrder', 'export const coreTopicOrder', 1)
          topics_exported = topics_exported.replace('const marketTopicOrder', 'export const marketTopicOrder', 1)
          topics_exported = topics_exported.replace('const topicOrder', 'export const topicOrder', 1)
          topics_path.write_text('/* Shared fortune topic ordering for UI and copy/result output. */\n\n' + topics_exported + '\n')
          text = text[:topics_start] + text[topics_end:]

          # Aspect labels + formatter are presentation-only and are shared by screen and copy output.
          labels_start = text.index('const planetLabels:')
          labels_end = text.index('const hanjaReading:', labels_start)
          labels_block = text[labels_start:labels_end].rstrip()
          text = text[:labels_start] + text[labels_end:]

          aspect_start = text.index('function aspectText(aspect: Aspect)')
          aspect_end = text.index('function currentDayun', aspect_start)
          aspect_block = text[aspect_start:aspect_end].rstrip()
          aspect_block = aspect_block.replace('function aspectText', 'export function aspectText', 1)
          text = text[:aspect_start] + text[aspect_end:]

          # Clipboard implementation is independent from AppNext state.
          clipboard_start = text.index('async function copyToClipboard')
          clipboard_end = text.index('function compactPlace', clipboard_start)
          clipboard_block = text[clipboard_start:clipboard_end].rstrip()
          clipboard_block = clipboard_block.replace('async function copyToClipboard', 'export async function copyToClipboard', 1)
          clipboard_path.write_text('/* Clipboard helper with iOS/private-browsing fallback. */\n\n' + clipboard_block + '\n')
          text = text[:clipboard_start] + text[clipboard_end:]

          # Move all prompt/result text builders as one contiguous block.
          formatter_start = text.index('function integratedPromptText')
          formatter_end = text.index('export default function AppNext', formatter_start)
          formatter_block = text[formatter_start:formatter_end].rstrip()
          expected = [
              'integratedPromptText', 'integratedResultText', 'relationshipPromptText',
              'relationshipResultText', 'precisionPromptText', 'precisionResultText',
          ]
          for name in expected:
              marker = f'function {name}'
              if formatter_block.count(marker) != 1:
                  raise SystemExit(f'Unexpected formatter block for {name}')
              formatter_block = formatter_block.replace(marker, f'export function {name}', 1)
          text = text[:formatter_start] + text[formatter_end:]

          formatter_path.write_text(
              "import type { Aspect, FortuneStat, IntegratedApiResponse, RelationshipApiResponse, ReunionTimingContext } from '../appTypes'\n"
              "import { topicOrder } from './fortuneTopics'\n\n"
              + labels_block + '\n\n' + aspect_block + '\n\n' + formatter_block + '\n'
          )

          # Reconnect AppNext to the moved helpers without changing any call sites.
          import_anchor = "import { estimateGeminiUsage } from './lib/aiUsage'\n"
          if import_anchor not in text:
              raise SystemExit('AppNext import anchor missing')
          new_imports = (
              "import { copyToClipboard } from './lib/clipboard'\n"
              "import { coreTopicOrder, marketTopicOrder, topicOrder } from './lib/fortuneTopics'\n"
              "import { aspectText, integratedPromptText, integratedResultText, relationshipPromptText, relationshipResultText, precisionPromptText, precisionResultText } from './lib/resultFormatters'\n"
          )
          text = text.replace(import_anchor, import_anchor + new_imports, 1)
          app_path.write_text(text)

          workflow_path.unlink()

          print(f'AppNext bytes: {len(original.encode())} -> {len(text.encode())}')
          print(f'resultFormatters bytes: {len(formatter_path.read_bytes())}')
          print(f'clipboard bytes: {len(clipboard_path.read_bytes())}')
          print(f'fortuneTopics bytes: {len(topics_path.read_bytes())}')
          PY

      - name: Build web
        working-directory: web
        run: npm ci && npm run build

      - name: Commit refactor
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/src/AppNext.tsx web/src/lib/resultFormatters.ts web/src/lib/clipboard.ts web/src/lib/fortuneTopics.ts .github/workflows/refactor-appnext-result-formatters-once.yml
          git diff --cached --check
          git commit -m "refactor(web): extract result formatters and clipboard helper"
          git push origin HEAD:refactor/appnext-result-formatters-20260901
