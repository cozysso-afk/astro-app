name: Run V21.3.2 relationship patch

on:
  push:
    branches:
      - work/ai-cost-guard-v21
    paths:
      - '.github/workflows/run-v2132-relationship-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python scripts/patch_v2132_relationship.py
      - name: Verify
        run: |
          node --experimental-strip-types --test supabase/functions/fortune-interpret-v21-preview/costGuardV21.test.mjs
          node --test web/src/lib/interpretationUiContract.test.mjs
          node --experimental-strip-types --test web/src/lib/fortuneAiJob.test.mjs
          git diff --check
          cd web
          npm ci
          npm run build
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/functions/fortune-interpret-v21-preview/costGuardV21.ts supabase/functions/fortune-interpret-v21-preview/costGuardV21.test.mjs supabase/functions/fortune-interpret-v21-preview/index.ts web/src/AiInterpretationPanel.tsx web/src/PeriodAiInterpretationPanel.tsx web/src/ai-interpret-v2.css web/src/period-ai-v18.css web/src/lib/readingCache.ts web/src/lib/fortuneAiJob.ts web/src/lib/fortuneAiJob.test.mjs web/src/lib/interpretationUiContract.test.mjs
          git commit -m 'fix(v21): deepen directional relationship reading'
          git push origin HEAD:work/ai-cost-guard-v21
