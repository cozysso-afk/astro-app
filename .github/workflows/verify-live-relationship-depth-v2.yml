name: Verify live relationship depth v2
on:
  push:
    branches: [relationship-depth-v2-20260829]
    paths: ['.github/workflows/verify-live-relationship-depth-v2.yml']
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for new Render version
        run: |
          for i in $(seq 1 18); do
            BODY=$(curl -fsS --max-time 20 https://astro-app-api-f7fn.onrender.com/health || true)
            echo "$BODY"
            echo "$BODY" | grep -q 'api-fortune-v4.7-relationship-depth' && exit 0
            sleep 20
          done
          exit 1
      - name: Verify compatibility calculation depth
        run: |
          cat > /tmp/request.json <<'JSON'
          {"user":{"name":"A","birth_date":"1991-03-21","birth_time":"07:26:00","time_known":true,"latitude":34.76,"longitude":127.66,"utc_offset_hours":9},"counterpart":{"name":"B","birth_date":"1992-02-09","birth_time":null,"time_known":false,"latitude":null,"longitude":null,"utc_offset_hours":9},"start_date":"2027-01-01","end_date":"2027-12-31","relationship_status":"dating","analysis_mode":"compatibility"}
          JSON
          curl -fsS --max-time 90 -H 'Content-Type: application/json' --data-binary @/tmp/request.json https://astro-app-api-f7fn.onrender.com/v1/relationship/western > /tmp/out.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/out.json'))
          r=d['result']
          assert d['api_version']=='api-fortune-v4.7-relationship-depth'
          assert r['analysis_mode']=='compatibility'
          assert r['relationship_focus']['available'] is True
          assert 'communication' in r['relationship_focus']['groups']
          assert r['house_overlays']['available'] is False
          assert r['saju_relationship']['available'] is True
          assert r['saju_relationship']['counterpart']['hour'] is None
          assert r['relationship_transits']['period']=={'start':'2027-01-01','end':'2027-12-31'}
          print('LIVE_RELATIONSHIP_DEPTH=PASS')
          PY
