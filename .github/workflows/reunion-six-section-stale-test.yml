name: Align reunion secondary-indicator regression
on:
  push:
    branches:
      - fix/reunion-six-section-ui
permissions:
  contents: write
jobs:
  update-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Update stale reunion assertion
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('web/src/lib/readingExperience.test.mjs')
          s=p.read_text(encoding='utf-8')
          old="""  assert.match(panel,/단계별 활성도 · 보조지표/)\n  assert.match(panel,/연락·재접촉/)\n  assert.match(panel,/현재 감정 세기나 사건 확률이 아니라/)\n"""
          new="""  assert.match(panel,/연락 ≠ 재회/)\n  assert.match(panel,/Math\\.round\\(stage\\.activation as number\\)/)\n  assert.match(panel,/연락·재접촉/)\n  assert.match(panel,/실제 연락·재회 확률이나 현재 감정의 세기가 아니라/)\n  assert.match(panel,/해당 단계 관문을 통과한 후보의 상대 활성도/)\n"""
          if old not in s:
              raise SystemExit('stale reunion assertion block missing')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Install web dependencies
        working-directory: web
        run: npm ci
      - name: Reading experience regression
        working-directory: web
        run: node --test src/lib/readingExperience.test.mjs
      - name: Web build
        working-directory: web
        run: npm run build
      - name: Diff check
        run: git diff --check
      - name: Commit clean test update
        run: |
          git rm .github/workflows/reunion-six-section-stale-test.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add web/src/lib/readingExperience.test.mjs
          git commit -m "test: align reunion activation indicator contract"
          git push origin HEAD:fix/reunion-six-section-ui
