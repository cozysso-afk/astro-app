name: Thai Lagna Duduang JavaScript probe

on:
  push:
    branches:
      - feature/thai-lagna-phase1-real-20260831
    paths:
      - .github/workflows/thai-lagna-duduang-js-probe.yml

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/thai-lagna-phase1-real-20260831
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests
      - name: Inspect Duduang calculation JavaScript
        run: |
          python - <<'PY'
          import re, requests
          base='https://www.duduang.com'
          for path in ['/js/1-horothai.js','/js/1-horothai-2.js','/js/main.js']:
            r=requests.get(base+path,timeout=30,headers={'User-Agent':'Mozilla/5.0'})
            print('\nFILE',path,'HTTP',r.status_code,'BYTES',len(r.content))
            r.raise_for_status()
            text=r.text
            keys=['lat','lng','lon','latitude','longitude','lakna','lagna','asc','unto','อันโต','localtime','timezone','timezoneoffset','sunrise','birth']
            lines=text.splitlines()
            hits=[]
            for i,line in enumerate(lines):
              low=line.lower()
              if any(k in low for k in keys):
                hits.append(i)
            shown=set()
            for i in hits[:120]:
              a=max(0,i-2); b=min(len(lines),i+3)
              key=(a,b)
              if key in shown: continue
              shown.add(key)
              print('--- lines',a+1,'to',b)
              print('\n'.join(lines[a:b])[:5000])
            funcs=re.findall(r'(?:function\s+([A-Za-z0-9_$]+)\s*\([^)]*\)|(?:const|let|var)\s+([A-Za-z0-9_$]+)\s*=\s*\([^)]*\)\s*=>)',text)
            names=[a or b for a,b in funcs]
            print('FUNCTIONS',names[:150])
          PY
      - name: Clean probe workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/thai-lagna-duduang-js-probe.yml
          git commit -m 'chore: clean Duduang JavaScript probe'
          git push origin HEAD:feature/thai-lagna-phase1-real-20260831
