name: Thai Phase 2D1 conservative semantics retry gate

on:
  push:
    branches:
      - feature/thai-lagna-phase1-real-20260831
    paths:
      - .github/workflows/thai-phase2d1-semantics-retry-once.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/thai-lagna-phase1-real-20260831
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Attach conservative semantics as research diagnostics only
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('thai_astrology_v2.py')
          text = path.read_text(encoding='utf-8')
          replacements = {
              'from thai_aspects_v1 import build_aspect_research\n':
                  'from thai_aspects_v1 import build_aspect_research\nfrom thai_semantics_v1 import build_semantics_research\n',
              'ENGINE_VERSION = "thai-mahathaksa-taksajorn-suriyayat-v2.4-phase2c-standards"':
                  'ENGINE_VERSION = "thai-mahathaksa-taksajorn-suriyayat-v2.5-phase2d1-semantics-research"',
              '    dignities_research = build_dignity_research(natal_positions)\n    aspects_research = build_aspect_research(natal_positions)\n    house_lords_research: dict[str, Any] = {':
                  '    dignities_research = build_dignity_research(natal_positions)\n    aspects_research = build_aspect_research(natal_positions)\n    semantics_research = build_semantics_research(\n        houses_research=houses_research,\n        dignities_research=dignities_research,\n    )\n    house_lords_research: dict[str, Any] = {',
              '        "dignities_research": dignities_research,\n        "aspects_research": aspects_research,\n        "interpretation_status": "planetary_position_facts_plus_noninterpreted_lagna_house_dignity_aspect_research",':
                  '        "dignities_research": dignities_research,\n        "aspects_research": aspects_research,\n        "semantics_research": semantics_research,\n        "interpretation_status": "planetary_position_facts_plus_noninterpreted_lagna_house_dignity_aspect_semantics_research",',
              '"consensus_policy": "Mahathaksa/Taksajorn and cross-validated Suriyayat positions remain the interpreted Thai layers. Validated Lagna position plus Whole Sign house labels, house-lord, basic/advanced standard-table and sign-relation facts are research diagnostics only; no house meaning, rank, strength, event judgement, or Western-style probability score is derived from them.",':
                  '"consensus_policy": "Mahathaksa/Taksajorn and cross-validated Suriyayat positions remain the interpreted Thai layers. Cross-source neutral house domains and basic Kaset/Pra/Ucca/Nicha functional directions are now research semantics only. Advanced-standard meanings, aspect meanings, combined judgement, event claims and Western-style probability scores remain disabled.",',
              '            "suriyayat_sign_aspects": "research_only_geometry_facts",\n            "suriyayat_predictive_rules": "not_implemented",':
                  '            "suriyayat_sign_aspects": "research_only_geometry_facts",\n            "suriyayat_semantic_vocabulary": "research_only_neutral_house_domains_and_basic_status_direction",\n            "suriyayat_predictive_rules": "not_implemented",',
              '            "Suriyayat house meanings, standard-table rank/strength/meaning, aspect strength/pair interpretation",':
                  '            "Suriyayat concrete house outcomes, advanced-standard meanings/ranking, aspect strength/pair interpretation, combined judgement",',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit('missing Phase 2D1 anchor: ' + old[:90])
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Install Swiss Ephemeris dependency
        run: python -m pip install --disable-pip-version-check pyswisseph==2.10.3.2
      - name: Run Phase 2D1 semantics tests
        env: {PYTHONPATH: .}
        run: python -m unittest discover -s tests -p 'test_thai_semantics_v1.py' -v
      - name: Run Phase 2C regressions
        env: {PYTHONPATH: .}
        run: python -m unittest discover -s tests -p 'test_thai_phase2c_labels_standards.py' -v
      - name: Run dignity regressions
        env: {PYTHONPATH: .}
        run: python -m unittest discover -s tests -p 'test_thai_dignities_v1.py' -v
      - name: Run aspect regressions
        env: {PYTHONPATH: .}
        run: python -m unittest discover -s tests -p 'test_thai_aspects_v1.py' -v
      - name: Run Phase 2B integration regressions
        env: {PYTHONPATH: .}
        run: python -m unittest discover -s tests -p 'test_thai_rules_phase2b_integration.py' -v
      - name: Run house regressions
        env: {PYTHONPATH: .}
        run: python -m unittest discover -s tests -p 'test_thai_houses*.py' -v
      - name: Run Lagna regressions
        env: {PYTHONPATH: .}
        run: python -m unittest discover -s tests -p 'test_thai_lagna*.py' -v
      - name: Run Gemini research isolation regressions
        env: {PYTHONPATH: .}
        run: python -m unittest discover -s tests -p 'test_ai_thai_research_isolation.py' -v
      - name: Compile Thai modules
        run: python -m py_compile thai_lagna_v1.py thai_houses_v1.py thai_dignities_v1.py thai_aspects_v1.py thai_semantics_v1.py thai_astrology_v2.py ai_interpret_v1.py
      - name: Verify semantic gate remains research-only
        env: {PYTHONPATH: .}
        run: |
          python - <<'PY'
          import json
          from datetime import date,time
          from ai_interpret_v1 import _compact_calculation
          from thai_astrology_v2 import build_thai_fortune
          thai = build_thai_fortune(
              birth_date=date(1991,3,21), birth_time=time(7,26),
              start_date=date(2026,8,31), end_date=date(2026,8,31),
              utc_offset_hours=9.0, latitude=34.7604, longitude=127.6622,
          )
          s = thai['suriyayat']['semantics_research']
          g = s['promotion_gate']
          assert s['research_only'] is True
          assert g['neutral_house_domains_validated'] is True
          assert g['basic_status_direction_validated'] is True
          assert g['advanced_standard_meanings_validated'] is False
          assert g['aspect_pair_meanings_validated'] is False
          assert g['combined_judgement_validated'] is False
          assert g['scores_allowed'] is False
          assert g['event_judgement_allowed'] is False
          assert g['gemini_interpretation_allowed'] is False
          assert thai['suriyayat']['lagna']['available'] is False
          compact = _compact_calculation({'period': {'day_count': 1}, 'thai': thai})
          compact_suri = compact['thai']['suriyayat']
          assert 'semantics_research' not in compact_suri
          encoded = json.dumps(compact_suri, ensure_ascii=False)
          assert 'stable_strong' not in encoded
          assert 'higher_education' not in encoded
          assert thai['engine'] == 'thai-mahathaksa-taksajorn-suriyayat-v2.5-phase2d1-semantics-research'
          print('PHASE2D1_SEMANTIC_VOCABULARY_VALIDATED_PRODUCT_AND_GEMINI_BLOCKED')
          PY
      - name: Check whitespace
        run: git diff --check
      - name: Commit Phase 2D1 state and clean workflows
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add thai_astrology_v2.py thai_semantics_v1.py tests/test_thai_semantics_v1.py
          git rm -f .github/workflows/thai-phase2d1-semantics-once.yml .github/workflows/thai-phase2d1-semantics-retry-once.yml
          git commit -m 'research: validate conservative Thai semantic vocabulary'
          git push origin HEAD:feature/thai-lagna-phase1-real-20260831
