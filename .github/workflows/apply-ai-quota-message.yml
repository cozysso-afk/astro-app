name: Apply AI Quota Message Hotfix

on:
  push:
    branches:
      - hotfix/ai-quota-message

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/ai-quota-message
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Patch quota-aware error messages
        run: |
          python - <<'PY'
          from pathlib import Path

          files = [Path('web/src/PeriodAiInterpretationPanel.tsx'), Path('web/src/AiInterpretationPanel.tsx')]
          old_period = '''  if (error && !result) return <section className="period-ai-card"><span className="period-ai-kicker">GEMINI PERIOD READING</span><h3>자연어 해설을 아직 불러오지 못했어</h3><p className="period-ai-summary">{error}</p><button className="period-ai-retry" type="button" onClick={onRetry}>해설 다시 확인</button></section>'''
          new_period = '''  if (error && !result) {\n    const quotaLimited = /Gemini HTTP 429|RESOURCE_EXHAUSTED/i.test(error)\n    const message = quotaLimited\n      ? '운세 계산은 정상 완료됐어. 지금은 Gemini 해설 서버의 크레딧 또는 사용 한도가 소진돼 자연어 해설만 잠시 만들 수 없어. 크레딧이나 한도가 복구된 뒤 다시 확인하면 계산 결과는 그대로 이어서 해설할 수 있어.'\n      : error\n    return <section className="period-ai-card"><span className="period-ai-kicker">GEMINI PERIOD READING</span><h3>{quotaLimited ? 'AI 해설 서버 한도를 확인해줘' : '자연어 해설을 아직 불러오지 못했어'}</h3><p className="period-ai-summary">{message}</p><button className="period-ai-retry" type="button" onClick={onRetry}>{quotaLimited ? '한도 복구 후 다시 확인' : '해설 다시 확인'}</button></section>\n  }'''
          old_annual = '''  if (error) return <section className="ai-interpret-card is-error"><AlertTriangle size={20}/><div><span className="eyebrow">AI(인공지능) 해설</span><strong>AI 해설을 아직 붙이지 못했어</strong><p>{error}</p><button type="button" onClick={onRetry}>AI 해설 다시 시도</button></div></section>'''
          new_annual = '''  if (error) {\n    const quotaLimited = /Gemini HTTP 429|RESOURCE_EXHAUSTED/i.test(error)\n    const message = quotaLimited\n      ? '운세 계산은 정상 완료됐어. 지금은 Gemini 해설 서버의 크레딧 또는 사용 한도가 소진돼 자연어 해설만 잠시 만들 수 없어. 크레딧이나 한도가 복구된 뒤 다시 시도하면 돼.'\n      : error\n    return <section className="ai-interpret-card is-error"><AlertTriangle size={20}/><div><span className="eyebrow">AI(인공지능) 해설</span><strong>{quotaLimited ? 'AI 해설 서버 한도를 확인해줘' : 'AI 해설을 아직 붙이지 못했어'}</strong><p>{message}</p><button type="button" onClick={onRetry}>{quotaLimited ? '한도 복구 후 다시 시도' : 'AI 해설 다시 시도'}</button></div></section>\n  }'''

          p = files[0]
          text = p.read_text()
          assert old_period in text, 'period error block not found'
          p.write_text(text.replace(old_period, new_period, 1))

          p = files[1]
          text = p.read_text()
          assert old_annual in text, 'annual error block not found'
          p.write_text(text.replace(old_annual, new_annual, 1))
          PY
      - name: Production build
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Commit product patch and remove temporary workflow
        run: |
          rm .github/workflows/apply-ai-quota-message.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add web/src/PeriodAiInterpretationPanel.tsx web/src/AiInterpretationPanel.tsx .github/workflows/apply-ai-quota-message.yml
          git commit -m "fix(web): explain Gemini quota exhaustion clearly"
          git push origin HEAD:hotfix/ai-quota-message
