name: Thai Lagna phase 1C actual sunrise

on:
  push:
    branches:
      - feature/thai-lagna-phase1-real-20260831
    paths:
      - .github/workflows/thai-lagna-phase1c.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/thai-lagna-phase1-real-20260831
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pyswisseph==2.10.3.2 requests beautifulsoup4

      - name: Apply Phase-1C patch
        run: PYTHONPATH=. python scripts/phase1c_patch.py

      - name: Syntax gate
        run: python -m py_compile thai_lagna_v1.py thai_astrology_v2.py integrated_fortune_v1.py api/main.py

      - name: Phase-1C reference tests
        run: python -m unittest discover -s tests -p 'test_thai_lagna_v1.py' -v

      - name: Probe non-Thailand MyHora references
        continue-on-error: true
        run: python scripts/phase1d_non_thai_probe.py

      - name: Product isolation gate
        run: |
          python -c "from pathlib import Path; lagna=Path('thai_lagna_v1.py').read_text(); thai=Path('thai_astrology_v2.py').read_text(); edge=Path('supabase/functions/fortune-interpret-v6-preview/core.ts').read_text(); assert 'common_anto_actual_sunrise_lmt' in lagna; assert '\"available\": False' in thai; assert '\"lagna_research\": lagna_research' in thai; assert 'lagna_research' not in edge; print('PHASE1C_PRODUCT_ISOLATION_PASS')"
          git diff --check

      - name: Commit validated Phase-1C checkpoint
        run: |
          rm -rf __pycache__ tests/__pycache__ api/__pycache__
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/thai-lagna-phase1c.yml .github/workflows/thai-lagna-sunrise-probe.yml scripts/phase1c_patch.py scripts/phase1d_non_thai_probe.py || true
          git add thai_lagna_v1.py tests/test_thai_lagna_v1.py
          git commit -m 'feat: add validated actual-sunrise Thai Lagna research candidate'
          git push origin HEAD:feature/thai-lagna-phase1-real-20260831
