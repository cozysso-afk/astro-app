            r=requests.get(url,timeout=30,headers={'User-Agent':'Mozilla/5.0'})
            print('\nNON_THAI_PROBE',label,'HTTP',r.status_code,'URL',r.url,'BYTES',len(r.content))
            r.encoding=r.apparent_encoding or 'utf-8'
            text=' '.join(BeautifulSoup(r.text,'html.parser').stripped_strings)
            for token in ('ลัคนา เวลา','อันโตนาทีสามัญ สมผุสอาทิตย์อุทัย','อันโตนาทีสามัญ อาทิตย์อุทัย 06:00น.','เวลานักษัตร'):
              i=text.find(token)
              if i>=0:
                print(token, text[i:i+900])
          PY

