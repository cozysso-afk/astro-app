name: Reading Visual QA

on:
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/visual-reading-qa.yml"
  push:
    branches:
      - main
    paths:
      - "web/**"
      - ".github/workflows/visual-reading-qa.yml"
  workflow_dispatch:

concurrency:
  group: reading-visual-qa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  mobile-visual-qa:
    name: iPhone reading + saved-image QA
    runs-on: ubuntu-latest
    timeout-minutes: 18
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install app dependencies
        run: npm ci

      - name: Install pinned Playwright runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Build web app
        run: npm run build

      - name: Start deterministic QA preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/reading-visual-qa-vite.log 2>&1 &
          echo $! > /tmp/reading-visual-qa-vite.pid
          for i in {1..40}; do
            if curl --fail --silent http://127.0.0.1:4173/?qa=visual >/dev/null; then
              exit 0
            fi
            sleep 0.5
          done
          cat /tmp/reading-visual-qa-vite.log
          exit 1

      - name: Capture iPhone screens and saved result images
        run: node scripts/visual-qa.mjs

      - name: Preserve preview log
        if: always()
        run: cp /tmp/reading-visual-qa-vite.log visual-qa-artifacts/vite.log || true

      - name: Upload visual QA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reading-visual-qa-${{ github.sha }}
          path: web/visual-qa-artifacts/
          if-no-files-found: warn
          retention-days: 14
