name: Patch interpretation mobile hierarchy

on:
  push:
    branches: [work/ai-cost-guard-v21]
    paths:
      - '.github/workflows/patch-v2131-ui-hierarchy.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply mobile interpretation hierarchy
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          period = Path('web/src/PeriodAiInterpretationPanel.tsx')
          s = period.read_text()
          s = s.replace('GEMINI PERIOD READING', 'AI(인공지능) 기간 해설')
          anchor = '    <p className="period-ai-summary">{data.overall.summary}</p>\n\n'
          quick = '''    <p className="period-ai-summary">{data.overall.summary}</p>\n\n    {!!keyWindows.length && <section className="period-ai-quick-dates">\n      <div className="period-ai-section-title"><span>가장 먼저 볼 날짜</span><strong>핵심 시기 TOP 3</strong></div>\n      <div className="period-ai-quick-date-list">{keyWindows.slice(0,3).map((item,index)=><article className={`period-ai-quick-date ${signalClass(item.signal)}`} key={`quick-${item.start}-${index}`}><b>{periodLabel(item.start,item.end)}</b><div><strong>{item.label}</strong>{!!item.topics?.length&&<small>{item.topics.slice(0,3).join(' · ')}</small>}</div><span>{item.signal}</span></article>)}</div>\n    </section>}\n\n'''
          if anchor not in s:
              raise SystemExit('period summary anchor not found')
          s = s.replace(anchor, quick, 1)
          old = '<section className="period-ai-window-section"><div className="period-ai-section-title"><span>관계 · 연락 · 재회</span>'
          new = '<section className="period-ai-window-section period-ai-relationship-section"><div className="period-ai-section-title"><span>관계 · 연락 · 재회</span>'
          if old not in s:
              raise SystemExit('period relationship section anchor not found')
          s = s.replace(old, new, 1)
          old = '<section className="period-ai-window-section">\n      <div className="period-ai-section-title"><span>중요 시기</span>'
          new = '<section className="period-ai-window-section period-ai-key-window-section">\n      <div className="period-ai-section-title"><span>중요 시기 상세</span>'
          if old not in s:
              raise SystemExit('period key window section anchor not found')
          s = s.replace(old, new, 1)
          period.write_text(s)

          annual = Path('web/src/AiInterpretationPanel.tsx')
          a = annual.read_text()
          anchor = '    <div className="ai-overall-block"><span className="ai-section-kicker">전체 결론</span><p className="ai-summary">{data.overall.summary}</p></div>\n\n'
          quick = '''    <div className="ai-overall-block"><span className="ai-section-kicker">전체 결론</span><p className="ai-summary">{data.overall.summary}</p></div>\n\n    {hasKeyWindows && <section className="ai-quick-dates"><div className="ai-section-heading"><span>가장 먼저 볼 날짜</span><strong>핵심 시기 TOP 3</strong></div><div className="ai-quick-date-list">{data.key_windows!.slice(0,3).map((item,index)=><button type="button" className={`ai-quick-date ${signalClass(item.signal)}`} key={`quick-${item.start}-${index}`} onClick={()=>inspectAnnualScore(item.start,item.topics?.[0])}><b>{periodLabel(item.start,item.end)}</b><span><strong>{item.label}</strong>{item.topics?.length?<small>{item.topics.slice(0,3).join(' · ')}</small>:null}</span><em>{item.signal}</em></button>)}</div></section>}\n\n'''
          if anchor not in a:
              raise SystemExit('annual overall anchor not found')
          a = a.replace(anchor, quick, 1)
          annual.write_text(a)

          css = Path('web/src/period-ai-v18.css')
          c = css.read_text()
          c += '''\n\n/* V21.3.1 UI audit · dates/actions before secondary interpretation detail */\n.period-ai-v18>.period-ai-head{order:1}\n.period-ai-v18>.period-ai-summary{order:2}\n.period-ai-v18>.period-ai-quick-dates{order:3}\n.period-ai-v18>.period-ai-action-section{order:4}\n.period-ai-v18>.period-ai-key-window-section,.period-ai-v18>.period-ai-chips{order:5}\n.period-ai-v18>.period-ai-relationship-section{order:6}\n.period-ai-v18>.period-ai-cache-note{order:7}\n.period-ai-v18>.period-ai-v21-controls-success{order:8}\n.period-ai-v18>.period-ai-details{order:9}\n.period-ai-v18>.period-ai-meta{order:10}\n.period-ai-v18>.period-ai-validation{order:11}\n.period-ai-quick-dates{display:grid;gap:8px}.period-ai-quick-date-list{display:grid;gap:6px}.period-ai-quick-date{display:grid;grid-template-columns:minmax(88px,auto) minmax(0,1fr) auto;align-items:center;gap:8px;padding:9px 10px;border-radius:13px;border:1px solid rgba(157,151,177,.18);background:rgba(255,255,255,.72)}.period-ai-quick-date.is-use{background:linear-gradient(135deg,rgba(237,249,243,.92),rgba(255,255,255,.8));border-color:rgba(112,157,135,.22)}.period-ai-quick-date.is-caution{background:linear-gradient(135deg,rgba(255,241,243,.92),rgba(255,255,255,.8));border-color:rgba(181,119,128,.2)}.period-ai-quick-date>b{color:#654e74;font-size:.82rem;font-weight:950;font-variant-numeric:tabular-nums}.period-ai-quick-date>div{min-width:0;display:grid;gap:2px}.period-ai-quick-date>div>strong{color:#493d52;font-size:.8rem;line-height:1.35}.period-ai-quick-date>div>small{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#897c8e;font-size:.66rem}.period-ai-quick-date>span{padding:4px 7px;border-radius:999px;background:rgba(115,92,130,.08);color:#705b7b;font-size:.63rem;font-weight:900}.period-ai-window-head>div>b{font-size:.86rem}.period-ai-window>p{font-size:.81rem}.period-ai-window-line{font-size:.79rem}.period-ai-actions article>div>strong{font-size:.87rem}.period-ai-actions article>div>p{font-size:.8rem}\n@media(max-width:430px){.period-ai-quick-date{grid-template-columns:84px minmax(0,1fr) auto;padding:9px}.period-ai-quick-date>b{font-size:.79rem}.period-ai-quick-date>div>strong{font-size:.78rem}}\n'''
          css.write_text(c)

          css = Path('web/src/ai-interpret-v2.css')
          c = css.read_text()
          c += '''\n\n/* V21.3.1 UI audit · important dates visible before long thematic blocks */\n.ai-quick-dates{display:grid;gap:9px}.ai-quick-date-list{display:grid;gap:7px}.ai-quick-date{width:100%;display:grid;grid-template-columns:minmax(92px,auto) minmax(0,1fr) auto;align-items:center;gap:9px;padding:10px 11px;border:1px solid rgba(159,153,177,.2);border-radius:14px;background:rgba(255,255,255,.76);text-align:left;font:inherit;cursor:pointer}.ai-quick-date.is-use{background:linear-gradient(135deg,rgba(239,250,244,.94),rgba(255,255,255,.84));border-color:rgba(116,158,137,.23)}.ai-quick-date.is-caution{background:linear-gradient(135deg,rgba(255,242,244,.94),rgba(255,255,255,.84));border-color:rgba(181,121,129,.22)}.ai-quick-date>b{color:#664f75;font-size:.86rem;font-weight:950;font-variant-numeric:tabular-nums}.ai-quick-date>span{min-width:0;display:grid;gap:2px}.ai-quick-date>span>strong{color:#44394d;font-size:.84rem;line-height:1.35}.ai-quick-date>span>small{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#8a7e90;font-size:.68rem}.ai-quick-date>em{font-style:normal;padding:4px 7px;border-radius:999px;background:rgba(116,93,131,.08);color:#705c7a;font-size:.64rem;font-weight:900}\n@media(max-width:520px){.ai-quick-date{grid-template-columns:88px minmax(0,1fr) auto;padding:10px}.ai-quick-date>b{font-size:.82rem}.ai-quick-date>span>strong{font-size:.81rem}}\n'''
          css.write_text(c)
          PY
      - name: Run web verification
        shell: bash
        run: |
          set -euo pipefail
          cd web
          npm ci
          npm run build
      - name: Diff sanity
        run: git diff --check
      - name: Commit UI patch and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/patch-v2131-ui-hierarchy.yml
          git add web/src/PeriodAiInterpretationPanel.tsx web/src/AiInterpretationPanel.tsx web/src/period-ai-v18.css web/src/ai-interpret-v2.css
          git commit -m 'fix(ui): surface key dates before long interpretation detail'
          git push origin HEAD:work/ai-cost-guard-v21
