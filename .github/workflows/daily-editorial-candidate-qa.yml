name: Daily editorial candidate QA
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
concurrency:
  group: daily-editorial-candidate-qa
  cancel-in-progress: false
jobs:
  connection:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'qa/daily-editorial-v23-11'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Generate one synthetic daily candidate with at most two provider calls
        env:
          QA_SUPABASE_URL: ${{ secrets.QA_SUPABASE_URL }}
          QA_SUPABASE_ANON_KEY: ${{ secrets.QA_SUPABASE_ANON_KEY }}
          QA_USER_EMAIL: ${{ secrets.QA_USER_EMAIL }}
          QA_USER_PASSWORD: ${{ secrets.QA_USER_PASSWORD }}
          QA_CALC_API_URL: ${{ secrets.QA_CALC_API_URL }}
        run: |
          node --input-type=module <<'JS'
          const names=['QA_SUPABASE_URL','QA_SUPABASE_ANON_KEY','QA_USER_EMAIL','QA_USER_PASSWORD','QA_CALC_API_URL'];
          const present=Object.fromEntries(names.map(n=>[n,Boolean(process.env[n]?.trim())]));
          console.log(JSON.stringify({stage:'configuration',present,paid_calls:0}));
          if(Object.values(present).some(v=>!v))process.exit(1);
          const base=process.env.QA_SUPABASE_URL.trim().replace(/\/$/,'');
          if(base!=='https://dbynfabwfcakxayyggzi.supabase.co')throw new Error('Unexpected QA project; stopped');
          const response=await fetch(base+'/auth/v1/token?grant_type=password',{method:'POST',headers:{'Content-Type':'application/json',apikey:process.env.QA_SUPABASE_ANON_KEY},body:JSON.stringify({email:process.env.QA_USER_EMAIL,password:process.env.QA_USER_PASSWORD}),signal:AbortSignal.timeout(30000)});
          const result=await response.json().catch(()=>null);
          const authenticated=response.ok&&Boolean(result?.access_token);
          console.log(JSON.stringify({stage:'login',authenticated,http_status:response.status,paid_calls:0}));
          if(!authenticated)process.exit(1);
          const meta=await fetch(base+'/functions/v1/fortune-daily-editorial-qa',{method:'POST',headers:{'Content-Type':'application/json',apikey:process.env.QA_SUPABASE_ANON_KEY,Authorization:'Bearer '+result.access_token},body:JSON.stringify({action:'meta'}),signal:AbortSignal.timeout(30000)});
          const info=await meta.json().catch(()=>null);
          console.log(JSON.stringify({stage:'generation_service',available:meta.ok,configured:info?.configured===true,version:info?.interpreter_version,paid_calls:0}));
          if(!meta.ok||info?.configured!==true)process.exit(1);

          if(info.interpreter_version!=='supabase-ai-v23.11-daily-editorial-qa-r5'||info.max_gemini_calls_per_job!==2)throw new Error('Unexpected candidate contract');
          const post=async(url,body,headers)=>{const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json',...headers},body:JSON.stringify(body),signal:AbortSignal.timeout(180000)});const d=await r.json().catch(()=>null);if(!r.ok||!d)throw new Error('QA HTTP '+r.status);return d};
          const headers={apikey:process.env.QA_SUPABASE_ANON_KEY,Authorization:'Bearer '+result.access_token};
          const date='2026-11-04';
          const calculation=await post(process.env.QA_CALC_API_URL,{profile:{name:'synthetic-qa-only',birth_date:'1987-06-15',birth_time:'08:30:00',time_known:true,time_source:'official_record',time_confidence:'exact',latitude:37.5665,longitude:126.978,utc_offset_hours:9,gender:'female'},start_date:date,end_date:date},{Authorization:headers.Authorization});
          if(!calculation.ok||calculation.period?.start!==date||calculation.period?.end!==date)throw new Error('Calculation period mismatch');
          const endpoint=base+'/functions/v1/fortune-daily-editorial-qa';
          const budget=await post(endpoint,{action:'inspect',calculation},headers);
          if(!budget.ok||!budget.prompt_budget_ok||budget.estimated_max_job_krw>300)throw new Error('Candidate budget blocked');
          console.log(JSON.stringify({stage:'budget',estimated_max_job_krw:budget.estimated_max_job_krw}));
          const started=await post(endpoint,{action:'start',calculation,model:'gemini-3.7-flash'},headers);
          if(!started.ok||!started.job_id)throw new Error('Candidate start failed');
          console.log(JSON.stringify({stage:'started',job_id:started.job_id,reused:started.reused}));
          let status;
          for(let attempt=0;attempt<90;attempt++){status=await post(endpoint,{action:'status',job_id:started.job_id},headers);if(['done','failed'].includes(status.status))break;await new Promise(r=>setTimeout(r,2000))}
          const fs=await import('node:fs/promises');
          await fs.mkdir('candidate-artifacts',{recursive:true});
          await fs.writeFile('candidate-artifacts/candidate.json',JSON.stringify({synthetic_profile:true,calculation,status,budget,candidate_revision:'r5'},null,2));
          console.log(JSON.stringify({stage:'completed',job_id:started.job_id,status:status.status,verified:status.provenance_verified===true,model:status.model}));
          if(status.status!=='done'||status.provenance_verified!==true)process.exitCode=1;
          JS
      - name: Save synthetic calculation and actual provider output for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-editorial-candidate
          path: candidate-artifacts/
          retention-days: 7
          if-no-files-found: warn
