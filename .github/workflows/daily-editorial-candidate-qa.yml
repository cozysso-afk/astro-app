name: Daily editorial candidate QA
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
concurrency:
  group: daily-editorial-candidate-qa
  cancel-in-progress: false
jobs:
  connection:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'qa/daily-editorial-v23-11'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Verify existing QA login without generating a reading
        env:
          QA_SUPABASE_URL: ${{ secrets.QA_SUPABASE_URL }}
          QA_SUPABASE_ANON_KEY: ${{ secrets.QA_SUPABASE_ANON_KEY }}
          QA_USER_EMAIL: ${{ secrets.QA_USER_EMAIL }}
          QA_USER_PASSWORD: ${{ secrets.QA_USER_PASSWORD }}
          QA_CALC_API_URL: ${{ secrets.QA_CALC_API_URL }}
        run: |
          node --input-type=module <<'JS'
          const names=['QA_SUPABASE_URL','QA_SUPABASE_ANON_KEY','QA_USER_EMAIL','QA_USER_PASSWORD','QA_CALC_API_URL'];
          const present=Object.fromEntries(names.map(n=>[n,Boolean(process.env[n]?.trim())]));
          console.log(JSON.stringify({stage:'configuration',present,paid_calls:0}));
          if(Object.values(present).some(v=>!v))process.exit(1);
          const base=process.env.QA_SUPABASE_URL.trim().replace(/\/$/,'');
          if(base!=='https://dbynfabwfcakxayyggzi.supabase.co')throw new Error('Unexpected QA project; stopped');
          const response=await fetch(base+'/auth/v1/token?grant_type=password',{method:'POST',headers:{'Content-Type':'application/json',apikey:process.env.QA_SUPABASE_ANON_KEY},body:JSON.stringify({email:process.env.QA_USER_EMAIL,password:process.env.QA_USER_PASSWORD}),signal:AbortSignal.timeout(30000)});
          const result=await response.json().catch(()=>null);
          const authenticated=response.ok&&Boolean(result?.access_token);
          console.log(JSON.stringify({stage:'login',authenticated,http_status:response.status,paid_calls:0}));
          if(!authenticated)process.exit(1);
          const meta=await fetch(base+'/functions/v1/fortune-interpret-v23-preview',{method:'POST',headers:{'Content-Type':'application/json',apikey:process.env.QA_SUPABASE_ANON_KEY,Authorization:'Bearer '+result.access_token},body:JSON.stringify({action:'meta'}),signal:AbortSignal.timeout(30000)});
          const info=await meta.json().catch(()=>null);
          console.log(JSON.stringify({stage:'generation_service',available:meta.ok,configured:info?.configured===true,version:info?.interpreter_version,paid_calls:0}));
          if(!meta.ok||info?.configured!==true)process.exit(1);
          JS
