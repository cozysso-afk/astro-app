            const cautionMap={금전:keys[4],학업:keys[0],시험:keys[0],컨디션:keys[4],신규진입:keys[4]}
            const overall=Object.fromEntries(TOPICS.map((t,i)=>[t,stat(base[t],bestMap[t]??keys[i%5],cautionMap[t]??keys[(i+3)%5],16)]))
            const relationship_signals={수신신호:stat(57,keys[3],keys[0]),발신적합:stat(61,keys[2],keys[4]),과거인연접점:stat(54,keys[3],keys[0])}
            const daily_scores=dates.map(date=>{const special={};if(date===keys[2])Object.assign(special,{직장:88,이직:84,발신적합:77});if(date===keys[3])Object.assign(special,{대인관계:82,연애:79,연락:76,과거인연접점:73});if(date===keys[4])Object.assign(special,{투자주의:86,금전:28,컨디션:31});return {date,label:date,market_open:true,scores:scoreRow(date,base,special),evidence:keys.includes(date)?evidence(date,`Actual daily aspect/house evidence for ${date}`,date===keys[2]?['직장','이직']:date===keys[3]?['대인관계','연애','연락']:['금전','투자주의']):[]}})
            const months=[];for(let m=1;m<=12;m++){const mm=String(m).padStart(2,'0'),mdays=new Date(Date.UTC(2026,m,0)).getUTCDate(),startm=`2026-${mm}-01`,endm=`2026-${mm}-${String(mdays).padStart(2,'0')}`,shift=Math.sin(m*.8)*7;const topics=Object.fromEntries(TOPICS.map(t=>[t,stat(clamp(base[t]+shift),startm,endm,12)]));const rs=Object.fromEntries(REL.map(t=>[t,stat(clamp(base[t]+shift/2),startm,endm,10)]));months.push({calendar_month:`2026-${mm}`,start:startm,end:endm,topics,relationship_signals:rs})}
            return {api_version:'smoke-v14',engine:'synthetic-smoke',period:{start,end,day_count:365,month_segments:12},western:{engine:'western-smoke',ephemeris:'synthetic-365',score_policy:'relative activation only',natal:{asc:120,mc:35},overall,relationship_signals,market:{has_open_session:true,session_count:245},months,daily_scores,detail_days:[],key_dates:keys.map((date,i)=>({date,salience:95-i*6,evidence:[`actual daily evidence ${i+1}`]}))},saju:{engine:'saju-smoke',pillars:{year:'甲子',month:'壬申',day:'丙午',hour:'辛卯'},day_master:'丙',elements:{wood:2,fire:2,earth:1,metal:2,water:1},annual:[{year:2026,ganzhi:'丙午',stem_ten_god:'비견',branch_links:['午午'],segment_start:'2026-02-04T05:00:00+09:00',segment_end_exclusive:'2027-02-04T11:00:00+09:00',start_jie:'立春',start_jie_ko:'입춘'}],monthly:[{calendar_month:'2026-07',ganzhi:'乙未',stem_ten_god:'정인',branch_links:[],segment_start:'2026-07-07T00:00:00+09:00',segment_end_exclusive:'2026-08-07T00:00:00+09:00',jie_name:'小暑',jie_name_ko:'소서'}],not_calculated:['용신','희신','기신']},thai:{engine:'thai-smoke',thai_day:'Thursday',predictive_status:'descriptive only',consensus_policy:'independent context',mahathaksa:{available:true,method:'smoke-baseline',wheel:[]},taksajorn:{available:true,method:'smoke-context',method_variance_note:'school variance exists',segments:[{start:'2026-01-01T00:00:00Z',end:'2026-06-30T23:59:59Z',age_in_progress:35,annual_boriwan:{key:'jupiter',label:'Jupiter',thai_name:'พฤหัสบดี'},landed_center:false,wheel:[]},{start:'2026-07-01T00:00:00Z',end:'2026-12-31T23:59:59Z',age_in_progress:35,annual_boriwan:{key:'venus',label:'Venus',thai_name:'ศุกร์'},landed_center:false,wheel:[]}]},not_calculated:[]}}
          }

          function reunionCase(){
            const start='2026-10-01',end='2026-10-31',dates=allDates(start,end),keys=['2026-10-08','2026-10-21','2026-10-27']
            const base={금전:45,학업:42,시험:40,직장:51,이직:48,대인관계:60,연애:72,연락:78,재회:84,소식:63,컨디션:47,투자심리:44,수익실현:43,신규진입:39,투자주의:55,수신신호:69,발신적합:73,과거인연접점:86}
            const overall=Object.fromEntries(TOPICS.map((t,i)=>[t,stat(base[t],['연애','연락','재회','소식'].includes(t)?keys[1]:keys[i%3],keys[(i+1)%3],15)]))
            const relationship_signals={수신신호:stat(69,keys[2],keys[0],14),발신적합:stat(73,keys[0],keys[2],14),과거인연접점:stat(86,keys[1],keys[0],16)}
            const daily_scores=dates.map(date=>{const special={};if(date===keys[0])Object.assign(special,{발신적합:88,연락:80,과거인연접점:76});if(date===keys[1])Object.assign(special,{과거인연접점:94,재회:91,연애:84,연락:82});if(date===keys[2])Object.assign(special,{수신신호:85,연락:88,재회:80});return {date,label:date,market_open:true,scores:scoreRow(date,base,special),evidence:keys.includes(date)?evidence(date,`Actual relationship aspect/house evidence ${date}`,date===keys[1]?['재회','연애','연락']:['연락']):[]}})
            const monthTopics=Object.fromEntries(TOPICS.map(t=>[t,stat(base[t],keys[1],keys[0],14)]))
            return {api_version:'smoke-v14',engine:'synthetic-smoke',period:{start,end,day_count:31,month_segments:1},western:{engine:'western-smoke',ephemeris:'synthetic-month',score_policy:'relative activation only',natal:{asc:120,mc:35},overall,relationship_signals,market:{has_open_session:true,session_count:22},months:[{calendar_month:'2026-10',start,end,topics:monthTopics,relationship_signals}],daily_scores,detail_days:[],key_dates:keys.map((date,i)=>({date,salience:98-i*5,evidence:[`relationship evidence ${i+1}`]}))},saju:{engine:'saju-smoke',pillars:{year:'甲子',month:'壬申',day:'丙午',hour:'辛卯'},day_master:'丙',monthly:[{calendar_month:'2026-10',ganzhi:'戊戌',stem_ten_god:'식신',branch_links:[],segment_start:'2026-10-08T00:00:00+09:00',segment_end_exclusive:'2026-11-07T00:00:00+09:00',jie_name:'寒露',jie_name_ko:'한로'}],not_calculated:['용신']},thai:{engine:'thai-smoke',thai_day:'Thursday',predictive_status:'descriptive only',consensus_policy:'independent context',not_calculated:[]}}
          }

          async function anonymousSession(){
            const r=await fetch(`${process.env.SUPABASE_URL}/auth/v1/signup`,{method:'POST',headers:{apikey:process.env.SUPABASE_KEY,'content-type':'application/json'},body:JSON.stringify({data:{purpose:'v14-live-smoke'}})})
            const text=await r.text();if(!r.ok)throw new Error(`anonymous signup ${r.status}: ${text}`);const j=JSON.parse(text);if(!j.access_token)throw new Error('anonymous signup returned no access_token');return j.access_token
          }
          async function invoke(token,calculation){
            const r=await fetch(process.env.FUNCTION_URL,{method:'POST',headers:{apikey:process.env.SUPABASE_KEY,authorization:`Bearer ${token}`,'content-type':'application/json'},body:JSON.stringify({calculation,model:'gemini-3.7-flash'})})
            const text=await r.text();let j;try{j=JSON.parse(text)}catch{throw new Error(`non-json response ${r.status}: ${text.slice(0,800)}`)};return {status:r.status,body:j}
          }
          function summarize(name,result){
            const b=result.body,d=b.data??{},ta=d.topic_analysis??{};const groups={핵심:[],주목:[],참고:[]};for(const t of TOPICS)(groups[ta[t]?.importance]??groups.참고).push(t)
            const lens={핵심:groups.핵심.map(t=>String(ta[t]?.reason??'').length),주목:groups.주목.map(t=>String(ta[t]?.reason??'').length),참고:groups.참고.map(t=>String(ta[t]?.reason??'').length)}
            const avg=a=>a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length):0
            const digest={name,http:result.status,ok:b.ok,model:b.model,fallback_from:b.fallback_from,quality:b.usage?.quality_validation,attempt_count:b.attempt_count??b.usage?.attempt_count??1,headline:d.headline,summary:d.overall?.summary,importance:groups,reason_length_avg:{핵심:avg(lens.핵심),주목:avg(lens.주목),참고:avg(lens.참고)},priorities:d.priorities,decisions:d.decisions,key_windows:d.key_windows,relationship_reading:d.relationship_reading,contact_flow:d.contact_flow,year_phases:name==='annual'?d.year_phases:undefined,cross_checks:name==='annual'?d.cross_checks:undefined,limits:d.limits,error:b.error,quality_report:b.quality_report}
            console.log(`\n===== ${name.toUpperCase()} LIVE SMOKE =====`);console.log(JSON.stringify(digest,null,2));return digest
          }

          const token=await anonymousSession();console.log('anonymous auth: OK')
          const cases=[['day',dayCase()],['annual',annualCase()],['reunion',reunionCase()]];const all=[]
          for(const [name,calc] of cases){const result=await invoke(token,calc);const d=summarize(name,result);all.push(d);if(!d.ok)process.exitCode=1}
          const day=all.find(x=>x.name==='day'),annual=all.find(x=>x.name==='annual'),reunion=all.find(x=>x.name==='reunion')
          const timed=(day?.decisions??[]).some(x=>/\d{2}:\d{2}.*\d{2}:\d{2}/.test(String(x.timing??'')))
          const reunionSalient=(reunion?.importance?.핵심??[]).concat(reunion?.importance?.주목??[]).some(t=>['연애','연락','재회'].includes(t))
          const checks={all_quality_100:all.every(x=>x.quality?.score===100),core_cap:all.every(x=>(x.importance?.핵심?.length??0)<=5),day_has_timed_decision:timed,annual_has_four_phases:(annual?.year_phases?.length??0)>=4,annual_has_cross_checks:(annual?.cross_checks?.length??0)>=3,adaptive_length:all.every(x=>!x.reason_length_avg.참고||!x.reason_length_avg.핵심||x.reason_length_avg.핵심>x.reason_length_avg.참고),reunion_salient:reunionSalient,reunion_flow:Boolean(reunion?.relationship_reading?.flow&&reunion?.relationship_reading?.focus_timing&&reunion?.contact_flow?.incoming&&reunion?.contact_flow?.outgoing&&reunion?.contact_flow?.reconnection)}
          console.log('\n===== ACCEPTANCE CHECKS =====');console.log(JSON.stringify(checks,null,2))
          if(!Object.values(checks).every(Boolean))process.exitCode=1
