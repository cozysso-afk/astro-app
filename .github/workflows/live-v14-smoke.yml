            const base={금전:44,학업:39,시험:47,직장:74,이직:70,대인관계:66,연애:61,연락:58,재회:53,소식:49,컨디션:45,투자심리:64,수익실현:56,신규진입:52,투자주의:67,수신신호:57,발신적합:61,과거인연접점:54}
