          const band=n=>n>=70?'강함':n>=58?'다소 강함':n>=43?'보통':n>=30?'다소 약함':'약함'
          const point=(date,score,label)=>({date,label,score:clamp(score)})
          const stat=(avg,bestDate,cautionDate,spread=14)=>({average:avg,band:band(avg),spread,best_days:[point(bestDate,avg+12,'상위')],caution_days:[point(cautionDate,avg-12,'하위')]})
          const allDates=(start,end)=>{const out=[];for(let d=new Date(start+'T00:00:00Z'),e=new Date(end+'T00:00:00Z');d<=e;d=new Date(d.getTime()+86400000))out.push(d.toISOString().slice(0,10));return out}
          const seeded=(date)=>{let x=0;for(const c of date)x=(x*33+c.charCodeAt(0))%997;return x/997}
          const scoreRow=(date,base,special={})=>{const r={};for(let i=0;i<TOPICS.length;i++){const t=TOPICS[i],wave=Math.sin((new Date(date+'T00:00:00Z').getUTCDate()+i*3)*0.43)*5+(seeded(date+t)*4-2);r[t]=clamp((base[t]??50)+wave)}for(const k of REL){const wave=Math.sin((new Date(date+'T00:00:00Z').getUTCDate()+k.length)*0.38)*5;r[k]=clamp((base[k]??50)+wave)}return {...r,...special}}
          const evidence=(date,text,topics=[])=>[{kind:'aspect_house',sample_time:'12:00',source_topics:topics,contribution:1,text}]

          function dayCase(){
