name: temporary topic scope hotfix

on:
  push:
    branches:
      - fix/daily-topic-scope-hotfix

permissions:
  contents: write

jobs:
  patch-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Patch topic-scoped headlines
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('web/src/lib/fortuneUserSummary.ts')
          s=p.read_text()
          anchor='function dayEvidenceHeadline(context: FortuneUserSummaryContext, bestFlow: string[], cautionFlow: string[]): string {'
          helper="function focusedDayFallback(context: FortuneUserSummaryContext, bestFlow: string[], cautionFlow: string[]): string {\n  const focus = (context.focusTopics ?? []).find(topic => DAILY_HEADLINE_SCENE[topic])\n  if (!focus) return fallbackDayHeadline(context, bestFlow, cautionFlow)\n  const scene = DAILY_HEADLINE_SCENE[focus]\n  const level = flowLevel(topicStat(context, focus))\n  if (level === 'high') return `${focus}만 놓고 보면 오늘은 ${scene.use}`\n  if (level === 'low') return `${focus}만 놓고 보면 오늘은 ${scene.caution}`\n  const followThrough = DAILY_FOLLOW_THROUGH[focus] ?? '실제 반응이 어떻게 이어지는지 확인해.'\n  return `${focus}만 놓고 보면 오늘은 강하게 밀거나 피해야 할 신호가 뚜렷하지 않아. ${followThrough}`\n}\n\n"
          if anchor not in s: raise SystemExit('missing daily function anchor')
          s=s.replace(anchor,helper+anchor,1)
          old='  const wanted = new Set([...bestFlow, ...cautionFlow])'
          new='  const scopedTopics = new Set(context.focusTopics ?? [])\n  const wanted = new Set([...bestFlow, ...cautionFlow, ...scopedTopics])'
          if old not in s: raise SystemExit('missing wanted anchor')
          s=s.replace(old,new,1)
          old="    const topics = Array.isArray(item.source_topics) ? item.source_topics.filter(topic => DAILY_HEADLINE_SCENE[topic]) : []"
          new="    const topics = Array.isArray(item.source_topics) ? item.source_topics.filter(topic => DAILY_HEADLINE_SCENE[topic] && (!scopedTopics.size || scopedTopics.has(topic))) : []"
          if old not in s: raise SystemExit('missing daily topic filter anchor')
          s=s.replace(old,new,1)
          old='  if (!lead) return fallbackDayHeadline(context, bestFlow, cautionFlow)'
          new='  if (!lead) return focusedDayFallback(context, bestFlow, cautionFlow)'
          if old not in s: raise SystemExit('missing daily fallback anchor')
          s=s.replace(old,new,1)
          anchor="  const variant = [...context.calculation.period.start].reduce((sum,ch)=>sum+ch.charCodeAt(0),0) % 3"
          overall="  if (!scopedTopics.size) {\n    const secondary = [...bestFlow, ...cautionFlow].find(topic => topic !== lead.topic && DAILY_HEADLINE_SCENE[topic])\n    const secondaryText = secondary ? ` ${secondary} 쪽은 ${cautionFlow.includes(secondary) ? DAILY_HEADLINE_SCENE[secondary].caution : DAILY_HEADLINE_SCENE[secondary].use}` : ''\n    return `오늘 전체 흐름에서 가장 먼저 볼 건 ${lead.topic}이야. ${sceneText} ${phase}${secondaryText}`\n  }\n"
          if anchor not in s: raise SystemExit('missing overall variant anchor')
          s=s.replace(anchor,overall+anchor,1)
          old='function weeklyEvidenceHeadline(context: FortuneUserSummaryContext): string {\n  const startMs = Date.parse(`${context.calculation.period.start}T00:00:00Z`)'
          new='function weeklyEvidenceHeadline(context: FortuneUserSummaryContext): string {\n  const scopedTopics = new Set(context.focusTopics ?? [])\n  const startMs = Date.parse(`${context.calculation.period.start}T00:00:00Z`)'
          if old not in s: raise SystemExit('missing weekly function anchor')
          s=s.replace(old,new,1)
          old='        if (!WEEKLY_HEADLINE_SCENE[topic]) continue'
          new='        if (!WEEKLY_HEADLINE_SCENE[topic] || (scopedTopics.size && !scopedTopics.has(topic))) continue'
          if old not in s: raise SystemExit('missing weekly filter anchor')
          s=s.replace(old,new,1)
          p.write_text(s)

          t=Path('web/src/lib/systemReading.test.mjs')
          s=t.read_text()
          anchor="test('crosswalk accepts exact engine names only and never creates missing meanings',()=>{"
          tests="test('today topic headlines stay inside the selected field and overall is not copied from love',()=>{\n const f=fixture('today')\n const day=f.calculation.western.daily_scores.find(row=>row.date===f.calculation.period.start)\n day.evidence=[{source_topics:['연락'],transit:'Mercury',target:'Moon',aspect:'trine',contribution:99,polarity:1,motion:'Applying'}]\n const overall=summary.buildFortuneUserSummary(f.data,{...f.context,topicEntries:Object.entries(f.data.topic_analysis)})\n const loveTopics=['연애','연락','재회']\n const love=summary.buildFortuneUserSummary(f.data,{...f.context,focusTopics:loveTopics,topicEntries:Object.entries(f.data.topic_analysis).filter(([topic])=>loveTopics.includes(topic))})\n const condition=summary.buildFortuneUserSummary(f.data,{...f.context,focusTopics:['컨디션'],topicEntries:Object.entries(f.data.topic_analysis).filter(([topic])=>topic==='컨디션')})\n assert.notEqual(overall.headline,love.headline)\n assert.match(overall.headline,/전체 흐름/)\n assert.match(condition.headline,/컨디션/)\n assert.doesNotMatch(condition.headline,/연락|답장|대화/)\n})\n\ntest('weekly focused headlines ignore evidence from other life topics',()=>{\n const f=fixture('week')\n for(const day of f.calculation.western.daily_scores) day.evidence=[{source_topics:['연락'],transit:'Mercury',target:'Moon',aspect:'trine',contribution:99,polarity:1,motion:'Applying'}]\n const condition=summary.buildFortuneUserSummary(f.data,{...f.context,focusTopics:['컨디션'],topicEntries:Object.entries(f.data.topic_analysis).filter(([topic])=>topic==='컨디션')})\n assert.doesNotMatch(condition.headline,/연락|답장|대화/)\n})\n\n"
          if anchor not in s: raise SystemExit('missing test anchor')
          t.write_text(s.replace(anchor,tests+anchor,1))
          PY
      - name: Install web dependencies
        working-directory: web
        run: npm ci
      - name: Run focused regression tests
        working-directory: web
        run: |
          node --test src/lib/systemReading.test.mjs
          node --experimental-strip-types --test src/lib/interpretationUiContract.test.mjs
      - name: Build web
        working-directory: web
        run: npm run build
      - name: Commit source after tests pass
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/src/lib/fortuneUserSummary.ts web/src/lib/systemReading.test.mjs
          git diff --cached --check
          git commit -m 'fix: keep fortune topic headlines scoped' || exit 0
          git push origin HEAD:fix/daily-topic-scope-hotfix
