name: Apply Targeted Quality Repair V19

on:
  push:
    branches: [work/integrated-interpretation-v2]
    paths: [.github/workflows/apply-v19-targeted-repair.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/integrated-interpretation-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Apply targeted quality repair
        run: |
          python - <<'PY'
          from pathlib import Path

          base=Path('supabase/functions/fortune-interpret-v6-preview')
          helper=base/'repairV19.ts'
          helper.write_text('''import { TOPICS } from "./integratedInterpretationV2.ts";\n\nfunction issuesOf(report:any){\n  return (Array.isArray(report?.stages)?report.stages:[]).flatMap((stage:any)=>(Array.isArray(stage?.issues)?stage.issues:[]).map((issue:any)=>String(issue??""))).filter(Boolean);\n}\n\nfunction topicSpecificIssue(issue:string,candidate:any){\n  if(/^topic_analysis\\./.test(issue))return true;\n  if(TOPICS.some(topic=>issue.startsWith(`${topic} 확신도 `)||issue.startsWith(`${topic} 핵심인데 `)||issue.startsWith(`${topic} 핵심 근거 설명이 얕음`)||issue.startsWith(`${topic} 주목 근거 설명이 얕음`)||issue.startsWith(`${topic} 참고 설명이 과도하게 김`)))return true;\n  const ref=issue.match(/^존재하지 않는 근거 ID:\\s*(.+)$/)?.[1]?.trim();\n  if(ref&&Object.values(candidate?.topic_analysis??{}).some((row:any)=>Array.isArray(row?.evidence_refs)&&row.evidence_refs.map(String).includes(ref)))return true;\n  const date=issue.match(/^계산근거에서 찾을 수 없는 날짜 언급:\\s*(\\d{4}-\\d{2}-\\d{2})$/)?.[1];\n  if(date&&JSON.stringify(candidate?.topic_analysis??{}).includes(date))return true;\n  return false;\n}\n\nexport function classifyQualityRepair(report:any,candidate:any){\n  const issues=issuesOf(report);\n  let core=false,topics=false;\n  for(const issue of issues){\n    if(topicSpecificIssue(issue,candidate))topics=true;\n    else core=true;\n  }\n  if(!issues.length)core=true;\n  return {core,topics};\n}\n''',encoding='utf-8')

          p=base/'integratedInterpretationV2.ts'
          s=p.read_text(encoding='utf-8')
          old='export const VERSION = "supabase-ai-v18-grounded-split-reliability";'
          new='export const VERSION = "supabase-ai-v19-targeted-quality-repair";'
          if old not in s: raise SystemExit('version anchor missing')
          p.write_text(s.replace(old,new,1),encoding='utf-8')

          p=base/'index.ts'
          s=p.read_text(encoding='utf-8')
          import_anchor='''import { addGeminiUsage, inspectThaiOutputSafety, runWithThaiOutputSafety, strictThaiRetryInstruction, thaiOutputGuardRequired, THAI_CONTRACT_VERSION } from "./thaiContract.ts";\n'''
          if import_anchor not in s: raise SystemExit('import anchor missing')
          s=s.replace(import_anchor,import_anchor+'import { classifyQualityRepair } from "./repairV19.ts";\n',1)

          anchor='''async function generateWithThaiSafety(payload:any,model:string,key:string,compactMode=false,qualityRetry=""){\n'''
          targeted='''async function repairCandidate(payload:any,candidate:any,report:any,model:string,key:string,compactMode=true,strictThai=false){\n  const repair=classifyQualityRepair(report,candidate);\n  const qualityRetry=strictQualityRetryInstruction(report);\n  const [core,topics]=await Promise.all([\n    repair.core?generatePart(payload,model,key,"core",CORE_SCHEMA,compactMode,strictThai,qualityRetry):Promise.resolve({ok:true,partial:null,usage:null}),\n    repair.topics?generatePart(payload,model,key,"topics",TOPIC_SCHEMA,compactMode,strictThai,qualityRetry):Promise.resolve({ok:true,partial:null,usage:null}),\n  ]);\n  const combinedUsage=addGeminiUsage(core.usage,topics.usage);\n  if(!core.ok||!topics.ok)return {ok:false,error:[core.ok?"":core.error,topics.ok?"":topics.error].filter(Boolean).join("; "),model,usage:combinedUsage,targeted_repair:repair};\n  try{\n    const merged={...candidate,...(core.partial??{}),...(topics.partial??{})};\n    const validated=validateOutput(merged);\n    if(!validated)return {ok:false,error:"타깃 재생성 후 구조 검증 실패",model,usage:combinedUsage,targeted_repair:repair};\n    const data=normalizeDirectionalWindows(validated,payload);\n    const thaiGuard=inspectThaiOutputSafety(data,thaiOutputGuardRequired(payload));\n    if(!thaiGuard.safe)return {ok:false,error:"Thai 출력 안전검증에서 금지된 예측 표현을 감지했어.",model,usage:combinedUsage,output_guard_failed:true,guard_violations:thaiGuard.violations,guard_engine:thaiGuard.guard_engine,unsafe_data:data,targeted_repair:repair};\n    const quality=inspectInterpretationQuality(data,payload);\n    if(!quality.ok)return qualityFailure({model,usage:combinedUsage,data,targeted_repair:repair},quality);\n    return {ok:true,data,model,interpreter_version:VERSION,validation:quality,targeted_repair:repair,usage:{...combinedUsage,quality_validation:qualitySummary(quality)}};\n  }catch{return {ok:false,error:"타깃 재생성 병합에 실패했어",model,usage:combinedUsage,targeted_repair:repair};}\n}\n\nasync function repairCandidateWithThaiSafety(payload:any,candidate:any,report:any,model:string,key:string){\n  const result=await runWithThaiOutputSafety(payload,(strictThai)=>repairCandidate(payload,candidate,report,model,key,true,strictThai),validateOutput);\n  if(!result.ok)return result;\n  const quality=result.validation?.ok===true?result.validation:inspectInterpretationQuality(result.data,payload);\n  if(!quality.ok)return qualityFailure(result,quality);\n  return {...result,model:result.model??model,interpreter_version:VERSION,validation:quality,usage:{...(result.usage??{}),quality_validation:qualitySummary(quality)}};\n}\n\n'''
          if anchor not in s: raise SystemExit('generateWithThaiSafety anchor missing')
          s=s.replace(anchor,targeted+anchor,1)

          old_calc='''async function calculate(payload:any,preferred:string,key:string){\n  const first:any=await generateWithThaiSafety(payload,preferred,key,false,"");\n  if(first.ok)return first;\n  const secondModel=preferred===FALLBACK_MODEL?preferred:FALLBACK_MODEL;\n  const qualityRetry=first?.quality_guard_failed?strictQualityRetryInstruction(first.quality_report):"";\n  const second:any=await generateWithThaiSafety(payload,secondModel,key,true,qualityRetry);\n  const combinedUsageBase=addGeminiUsage(first.usage,second.usage);\n  const combinedUsage=second?.validation?{...combinedUsageBase,quality_validation:qualitySummary(second.validation)}:combinedUsageBase;\n  const attemptCount=Number(first.attempt_count??1)+Number(second.attempt_count??1);\n  if(second.ok)return preferred===secondModel?{...second,usage:combinedUsage,attempt_count:attemptCount}:{...second,usage:combinedUsage,attempt_count:attemptCount,fallback_from:preferred};\n  const qualityDetail=second?.quality_guard_failed?` · 최종 품질점수 ${second?.quality_report?.score??0}/100`:"";\n  return {ok:false,error:`AI 해설이 검증을 완료하지 못했어. 1차=${first.error}; 2차=${second.error}${qualityDetail}`,model:preferred,usage:combinedUsage,attempt_count:attemptCount,quality_report:second?.quality_report??first?.quality_report};\n}\n'''
          new_calc='''async function calculate(payload:any,preferred:string,key:string){\n  const first:any=await generateWithThaiSafety(payload,preferred,key,false,"");\n  if(first.ok)return first;\n  const secondModel=preferred===FALLBACK_MODEL?preferred:FALLBACK_MODEL;\n  const canTarget=first?.quality_guard_failed===true&&first?.candidate_data&&first?.quality_report;\n  const second:any=canTarget\n    ?await repairCandidateWithThaiSafety(payload,first.candidate_data,first.quality_report,secondModel,key)\n    :await generateWithThaiSafety(payload,secondModel,key,true,"");\n  const combinedUsageBase=addGeminiUsage(first.usage,second.usage);\n  const combinedUsage=second?.validation?{...combinedUsageBase,quality_validation:qualitySummary(second.validation)}:combinedUsageBase;\n  const attemptCount=Number(first.attempt_count??1)+Number(second.attempt_count??1);\n  if(second.ok)return preferred===secondModel?{...second,usage:combinedUsage,attempt_count:attemptCount}:{...second,usage:combinedUsage,attempt_count:attemptCount,fallback_from:preferred};\n  const qualityDetail=second?.quality_guard_failed?` · 최종 품질점수 ${second?.quality_report?.score??0}/100`:"";\n  const repairLabel=canTarget?"타깃 재생성":"전체 재생성";\n  return {ok:false,error:`AI 해설이 검증을 완료하지 못했어. 1차=${first.error}; 2차(${repairLabel})=${second.error}${qualityDetail}`,model:preferred,usage:combinedUsage,attempt_count:attemptCount,quality_report:second?.quality_report??first?.quality_report};\n}\n'''
          if old_calc not in s: raise SystemExit('calculate anchor missing')
          s=s.replace(old_calc,new_calc,1)
          p.write_text(s,encoding='utf-8')

          p=Path('web/src/lib/readingCache.ts')
          s=p.read_text(encoding='utf-8').replace("const FORTUNE_AI_CACHE_CONTRACT = 'grounded-split-reliability-contract-v18'","const FORTUNE_AI_CACHE_CONTRACT = 'targeted-quality-repair-contract-v19'",1)
          p.write_text(s,encoding='utf-8')

          p=Path('web/src/lib/fortuneAiJob.ts')
          s=p.read_text(encoding='utf-8').replace("export const FORTUNE_AI_JOB_CONTRACT = 'fortune-ai-job-grounded-split-v18'","export const FORTUNE_AI_JOB_CONTRACT = 'fortune-ai-job-targeted-repair-v19'",1)
          p.write_text(s,encoding='utf-8')

          p=Path('web/src/lib/fortuneAiJob.test.mjs')
          s=p.read_text(encoding='utf-8').replace('assert.match(FORTUNE_AI_JOB_CONTRACT, /v18$/)','assert.match(FORTUNE_AI_JOB_CONTRACT, /v19$/)',1)
          p.write_text(s,encoding='utf-8')

          test=base/'repairV19.test.mjs'
          test.write_text('''import assert from "node:assert/strict";\nimport test from "node:test";\nimport { classifyQualityRepair } from "./repairV19.ts";\n\nconst report=(...issues)=>({stages:[{stage:4,issues}]});\nconst candidate={topic_analysis:{직장:{evidence_refs:["BAD:REF"],reason:"2026-09-04 언급"}}};\n\ntest("decision and cross-check failures repair core only",()=>{\n  assert.deepEqual(classifyQualityRepair(report("핵심 시기와 연결되지 않은 결정 조언: 시험 학습 집중"),candidate),{core:true,topics:false});\n  assert.deepEqual(classifyQualityRepair(report("교차검증 종합이 너무 짧음: 관계 피크"),candidate),{core:true,topics:false});\n});\n\ntest("topic depth and topic evidence failures repair topics only",()=>{\n  assert.deepEqual(classifyQualityRepair(report("직장 핵심 근거 설명이 얕음"),candidate),{core:false,topics:true});\n  assert.deepEqual(classifyQualityRepair(report("존재하지 않는 근거 ID: BAD:REF"),candidate),{core:false,topics:true});\n  assert.deepEqual(classifyQualityRepair(report("계산근거에서 찾을 수 없는 날짜 언급: 2026-09-04"),candidate),{core:false,topics:true});\n});\n\ntest("mixed failures repair both parts",()=>{\n  assert.deepEqual(classifyQualityRepair(report("직장 핵심 근거 설명이 얕음","핵심 시기와 연결되지 않은 결정 조언: 시험"),candidate),{core:true,topics:true});\n});\n''',encoding='utf-8')

          source_test=base/'v19TargetedRepair.test.mjs'
          source_test.write_text('''import assert from "node:assert/strict";\nimport test from "node:test";\nimport fs from "node:fs";\nconst source=fs.readFileSync(new URL("./index.ts",import.meta.url),"utf8");\n\ntest("quality failures preserve the first candidate and regenerate only selected parts",()=>{\n  assert.match(source,/first\\?\\.candidate_data/);\n  assert.match(source,/repairCandidateWithThaiSafety/);\n  assert.match(source,/repair\\.core\\?generatePart/);\n  assert.match(source,/repair\\.topics\\?generatePart/);\n  assert.match(source,/const merged=\\{\\.\\.\\.candidate,\\.\\.\\.\\(core\\.partial/);\n  assert.match(source,/inspectInterpretationQuality\\(data,payload\\)/);\n});\n''',encoding='utf-8')
          PY
      - name: Full interpretation regression
        run: |
          node --experimental-strip-types --test supabase/functions/fortune-interpret-v6-preview/periodInstruction.test.mjs
          node --experimental-strip-types --test supabase/functions/fortune-interpret-v6-preview/qualityPeriods.test.mjs
          node --experimental-strip-types --test supabase/functions/fortune-interpret-v6-preview/integratedInterpretationV2.test.mjs
          node --experimental-strip-types --test supabase/functions/fortune-interpret-v6-preview/thaiContract.test.mjs
          node --experimental-strip-types --test supabase/functions/fortune-interpret-v6-preview/splitStructuredOutput.test.mjs
          node --experimental-strip-types --test supabase/functions/fortune-interpret-v6-preview/groundedSplitPrompt.test.mjs
          node --experimental-strip-types --test supabase/functions/fortune-interpret-v6-preview/v18Reliability.test.mjs
          node --experimental-strip-types --test supabase/functions/fortune-interpret-v6-preview/repairV19.test.mjs
          node --experimental-strip-types --test supabase/functions/fortune-interpret-v6-preview/v19TargetedRepair.test.mjs
          node --experimental-strip-types --test web/src/lib/fortuneAiJob.test.mjs
      - name: Web production build
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Commit V19 targeted repair
        run: |
          git config user.name "cozysso-afk"
          git config user.email "cozysso@gmail.com"
          git add supabase/functions/fortune-interpret-v6-preview/integratedInterpretationV2.ts \
                  supabase/functions/fortune-interpret-v6-preview/index.ts \
                  supabase/functions/fortune-interpret-v6-preview/repairV19.ts \
                  supabase/functions/fortune-interpret-v6-preview/repairV19.test.mjs \
                  supabase/functions/fortune-interpret-v6-preview/v19TargetedRepair.test.mjs \
                  web/src/lib/readingCache.ts web/src/lib/fortuneAiJob.ts web/src/lib/fortuneAiJob.test.mjs
          git commit -m "fix(ai): retry only failing interpretation sections"
          git push origin HEAD:work/integrated-interpretation-v2
