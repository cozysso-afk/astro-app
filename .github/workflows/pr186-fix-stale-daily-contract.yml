name: PR186 stale daily contract fix

on:
  push:
    branches:
      - fix/reunion-hierarchy-v2
    paths:
      - '.github/workflows/pr186-fix-stale-daily-contract.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/reunion-hierarchy-v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Align stale daily headline contract
        run: >-
          python -c "from pathlib import Path; p=Path('web/src/lib/interpretationUiContract.test.mjs'); s=p.read_text(); old=\"  assert.match(summary.headline,/^오늘은 공부와 업무/)\\n  assert.ok(summary.headline.indexOf('공부') < summary.headline.indexOf('연애'))\"; new=\"  assert.match(summary.headline,/^오늘의 중심은 학업 쪽이야\\./)\\n  assert.ok(summary.headline.indexOf('학업') < summary.headline.indexOf('연애'))\"; assert old in s; p.write_text(s.replace(old,new,1))"
      - name: Verify contract
        run: node --experimental-strip-types --test web/src/lib/interpretationUiContract.test.mjs
      - name: Commit verified test alignment
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/src/lib/interpretationUiContract.test.mjs
          git commit -m 'test: align daily headline contract with scene-first copy'
          git push origin HEAD:fix/reunion-hierarchy-v2
