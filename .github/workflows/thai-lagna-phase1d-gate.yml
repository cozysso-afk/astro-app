name: Thai Lagna phase 1D world-coordinate gate

on:
  push:
    branches:
      - feature/thai-lagna-phase1-real-20260831
    paths:
      - .github/workflows/thai-lagna-phase1d-gate.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/thai-lagna-phase1-real-20260831
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Swiss Ephemeris
        run: python -m pip install --disable-pip-version-check pyswisseph==2.10.3.2
      - name: Syntax gate
        run: python -m py_compile thai_lagna_v1.py thai_astrology_v2.py integrated_fortune_v1.py api/main.py tests/test_thai_lagna_v1.py tests/test_thai_lagna_phase1d.py
      - name: Bangkok gold-standard regression
        run: python -m unittest discover -s tests -p 'test_thai_lagna_v1.py' -v
      - name: World-coordinate and boundary invariants
        run: python -m unittest discover -s tests -p 'test_thai_lagna_phase1d.py' -v
      - name: Product isolation gate
        run: |
          python - <<'PY'
          from pathlib import Path
          lagna=Path('thai_lagna_v1.py').read_text()
          thai=Path('thai_astrology_v2.py').read_text()
          edge=Path('supabase/functions/fortune-interpret-v6-preview/core.ts').read_text()
          assert '"global_coordinates_independently_validated": False' in lagna
          assert '"available": False' in thai
          assert '"lagna_research": lagna_research' in thai
          assert 'lagna_research' not in edge
          print('PHASE1D_PRODUCT_ISOLATION_PASS')
          PY
          git diff --check
      - name: Clean validation workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/thai-lagna-phase1d-gate.yml
          git commit -m 'test: pass Thai Lagna phase 1D world-coordinate gate'
          git push origin HEAD:feature/thai-lagna-phase1-real-20260831
