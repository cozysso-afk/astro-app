          const hierarchy:any={validation:{status:'PASS'},as_of_date:'2026-09-30',score_meaning:'단계별 상대 활성도 참고값이며 사건 확률이 아니야.',stages:{emotional_reactivation:{label:'감정 재활성화',activation:68},contact_recontact:{label:'연락·재접촉',activation:57},in_person_meeting:{label:'실제 만남',activation:34},relationship_rebuilding:{label:'관계 재구축',activation:29}},current_windows:[{stage:'emotional_reactivation',start:'2026-09-28',end:'2026-10-02',label:'현재 감정 재활성화'}],top_periods:[{stage:'contact_recontact',start:'2026-10-21',end:'2026-10-24',label:'연락·대화 재개'},{stage:'emotional_reactivation',start:'2027-01-20',end:'2027-01-23',label:'다시 의식하기'}],limitations:['실제 행동과 상대의 속마음은 확정하지 않아.']}
          const directions:any[]=[{kind:'incoming',label:'상대 → 나',score:52,band:'보통',text:'상대가 먼저 오는 흐름은 보통이야.',timing:'2026-10-21 전후'},{kind:'outgoing',label:'나 → 상대',score:49,band:'보통',text:'내가 먼저 움직이는 흐름도 보통이야.',timing:'2026-10-21 전후'}]
