                {action:'사람과 관련된 결정은 말보다 다음 약속과 역할 분담이 실제로 이어지는지 본 뒤 확정해.',timing:'중순 이후 후속 행동이 확인될 때 다시 판단해.',reason:'초기 반응 하나만으로 관계 전체를 읽지 않기 위해서야.',watch:'질문과 답이 이어지고 구체적인 일정이 잡히는지 확인해.',avoid:'답장 속도 하나로 관계를 단정하지 마.',evidence_refs:[]}
              ]:[],
