          const evaluated=await send('Runtime.evaluate',{expression:`(async()=>{await document.fonts.ready;await new Promise(r=>setTimeout(r,160));return window.__qaCollect?window.__qaCollect():{status:'FAIL',failures:['collector-missing']}})()`,awaitPromise:true,returnByValue:true})
          const data=evaluated?.result?.value
          console.log(`BROWSER_QA_${label.toUpperCase()}_${mode.toUpperCase()}=${JSON.stringify(data)}`)
          try{await send('Page.close')}catch{}
          ws.close()
          if(!data||data.status!=='PASS')process.exitCode=1
