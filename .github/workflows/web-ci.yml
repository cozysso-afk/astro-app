              ]:[],
              cross_checks:[{label:'중요한 선택을 실제 조건과 함께 확인할 시기',start:f.calculation.period.start,end:f.calculation.period.end,mode:'복수체계',western:'일정과 선택지의 상대적 강약을 비교해 우선순위를 좁혀.',saju:'맡은 역할과 돈·시간의 배분이 실제 생활에서 어떻게 정리되는지 확인해.',thai:'부탁과 책임이 한쪽에 몰리지 않도록 쉬는 시간과 결정 범위를 먼저 확보해.',synthesis:'세 체계가 같은 결론을 강요하는 것이 아니라, 실제 일정·책임·자원 조건을 확인한 뒤 결정하라는 공통점을 참고해.',evidence_refs:[]}],
