name: Web CI

on:
  pull_request:
    paths:
      - "web/**"
      - "api/private_app.py"
      - "supabase/migrations/20260905_private_app*.sql"
      - "tests/test_private_app_auth_contract.py"
      - "vercel.json"
      - ".github/workflows/web-ci.yml"
  push:
    branches:
      - main
    paths:
      - "web/**"
      - "api/private_app.py"
      - "supabase/migrations/20260905_private_app*.sql"
      - "tests/test_private_app_auth_contract.py"
      - "vercel.json"
      - ".github/workflows/web-ci.yml"
  workflow_dispatch:

concurrency:
  group: web-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Private auth contract + TypeScript/Vite build
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify private email frontend contract
        run: node src/lib/authContract.test.mjs

      - name: Verify private API and DB contract
        run: python ../tests/test_private_app_auth_contract.py

      - name: Type-check and build
        run: npm run build
