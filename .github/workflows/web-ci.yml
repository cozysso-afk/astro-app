          const target=await fetch('http://127.0.0.1:9222/json/new?about:blank',{method:'PUT'}).then(r=>r.json())
          const ws=new WebSocket(target.webSocketDebuggerUrl)
          await new Promise((resolve,reject)=>{ws.addEventListener('open',resolve,{once:true});ws.addEventListener('error',reject,{once:true})})
          let nextId=1
          const pending=new Map(),eventWaiters=new Map()
          ws.addEventListener('message',event=>{
            const msg=JSON.parse(String(event.data))
            if(msg.id&&pending.has(msg.id)){const {resolve,reject}=pending.get(msg.id);pending.delete(msg.id);msg.error?reject(new Error(JSON.stringify(msg.error))):resolve(msg.result);return}
            const waiters=eventWaiters.get(msg.method);if(waiters?.length){const fn=waiters.shift();fn(msg.params);if(!waiters.length)eventWaiters.delete(msg.method)}
          })
          const send=(method,params={})=>new Promise((resolve,reject)=>{const id=nextId++;pending.set(id,{resolve,reject});ws.send(JSON.stringify({id,method,params}))})
          const once=method=>new Promise(resolve=>{const list=eventWaiters.get(method)||[];list.push(resolve);eventWaiters.set(method,list)})
          await send('Page.enable');await send('Runtime.enable')
          await send('Emulation.setDeviceMetricsOverride',{width,height,deviceScaleFactor:1,mobile:width<=600,screenWidth:width,screenHeight:height})
          const loaded=once('Page.loadEventFired')
