name: Apply V21 Frontend Wiring
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/apply_v21_frontend_wiring.py'
      - '.github/workflows/apply-v21-frontend-wiring.yml'
permissions:
  contents: write
jobs:
  apply:
    if: github.head_ref == 'work/ai-cost-guard-v21'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/ai-cost-guard-v21
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply guarded patch
        run: python scripts/apply_v21_frontend_wiring.py
      - name: V21 cost guard fixture tests
        run: node --test supabase/functions/fortune-interpret-v21-preview/costGuardV21.test.mjs
      - name: Web production build
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Commit product changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/src supabase/functions/fortune-interpret-v21-preview/index.ts
          if git diff --cached --quiet; then
            echo 'No product changes to commit.'
            exit 0
          fi
          git commit -m 'feat(ai): wire V21 cost guard into fortune UI'
          git push origin HEAD:work/ai-cost-guard-v21
