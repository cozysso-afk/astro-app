name: Apply Horary Prashna Entry V1 Once

on:
  push:
    branches:
      - feature/horary-prashna-classifier-location-v1
    paths:
      - '.github/workflows/apply-horary-prashna-entry-v1-once.yml'

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/horary-prashna-classifier-location-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Apply entry patches
        run: python scripts/patch_horary_prashna_entry_v1.py
      - name: Install API test dependencies
        run: python -m pip install -q -r api/requirements.txt pytest
      - name: Run router and API contracts
        run: |
          python -m py_compile horary_prashna_router_v1.py api/horary_prashna_v1.py api/main.py
          python -m pytest -q tests/test_horary_prashna_question_router_v1.py tests/test_horary_prashna_api_v1.py
      - name: Web typecheck and production build
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Commit permanent entry changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add api/main.py web/src/appTypes.ts web/src/HomeControls.tsx web/src/AppNext.tsx web/src/main.tsx
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No permanent entry changes to commit.'
          else
            git commit -m 'feat(horary): connect classifier API and current-location UI V1'
            git push origin HEAD:feature/horary-prashna-classifier-location-v1
          fi
