name: Apply AI cost preview V47

on:
  push:
    branches: [fix/ai-cost-preview-v47]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[ai-cost-preview-v47-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ai-cost-preview-v47
          fetch-depth: 0
      - name: Patch preflight cost UI
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p=Path(path); s=p.read_text()
              if old not in s:
                  raise SystemExit(f'anchor missing: {path}: {old[:80]!r}')
              p.write_text(s.replace(old,new,1))

          replace_once('web/src/PeriodAiInterpretationPanel.tsx',
              "import { estimateGeminiUsage } from './lib/aiUsage'\n",
              "import { estimateGeminiUsage } from './lib/aiUsage'\nimport { periodAiCostPreview } from './lib/aiCostPreview'\n")
          replace_once('web/src/PeriodAiInterpretationPanel.tsx',
              "  const technicalFallback = technicalDetails ? <details className=\"period-ai-details\"><summary>계산 근거 자세히 보기</summary>{technicalDetails}</details> : null\n",
              "  const costPreview = periodAiCostPreview(period)\n  const technicalFallback = technicalDetails ? <details className=\"period-ai-details\"><summary>계산 근거 자세히 보기</summary>{technicalDetails}</details> : null\n")
          replace_once('web/src/PeriodAiInterpretationPanel.tsx',
              "<p className=\"period-ai-summary\">계산은 끝났어. 해설이 자동으로 시작되지 않았거나 저장본이 없으면 여기서 불러올 수 있어.</p><div className=\"period-ai-v21-controls period-ai-ready-controls\">",
              "<p className=\"period-ai-summary\">계산은 끝났어. 해설이 자동으로 시작되지 않았거나 저장본이 없으면 여기서 불러올 수 있어.</p><p className=\"ai-preflight-cost\">{costPreview}</p><div className=\"period-ai-v21-controls period-ai-ready-controls\">")
          replace_once('web/src/PeriodAiInterpretationPanel.tsx',
              "<p className=\"period-ai-summary\">잠시만 기다려줘. 오래 걸리면 자동으로 중단하고 다시 시도할 수 있게 알려줄게.</p><div className=\"period-ai-v21-controls\">",
              "<p className=\"period-ai-summary\">잠시만 기다려줘. 오래 걸리면 자동으로 중단하고 다시 시도할 수 있게 알려줄게.</p><p className=\"ai-preflight-cost\">{costPreview}</p><div className=\"period-ai-v21-controls\">")

          replace_once('web/src/RelationshipInterpretationPanel.tsx',
              "import { buildRelationshipUserSummary, type RelationshipPattern } from './lib/relationshipUserSummary'\n",
              "import { buildRelationshipUserSummary, type RelationshipPattern } from './lib/relationshipUserSummary'\nimport { relationshipAiCostPreview } from './lib/aiCostPreview'\n")
          replace_once('web/src/RelationshipInterpretationPanel.tsx',
              "<p>계산은 끝났어. 저장된 자연어 해설이 없으면 한 번 생성해. 생성한 해설은 다시 비용이 들지 않도록 저장해둘게.</p><button type=\"button\" onClick={onAi}",
              "<p>계산은 끝났어. 저장된 자연어 해설이 없으면 한 번 생성해. 생성한 해설은 다시 비용이 들지 않도록 저장해둘게.</p><p className=\"ai-preflight-cost\">{relationshipAiCostPreview(analysisMode)}</p><button type=\"button\" onClick={onAi}")

          css=Path('web/src/ai-cost-preview-v47.css')
          css.write_text('''/* V47 · preflight Gemini cost disclosure */\nhtml body .app-shell .ai-preflight-cost{margin:10px 0 12px!important;padding:9px 11px!important;border:1px solid rgba(118,104,143,.12)!important;border-radius:12px!important;background:rgba(255,255,255,.58)!important;font-size:11.5px!important;line-height:1.55!important;font-weight:600!important;color:#786d7d!important;word-break:keep-all!important;overflow-wrap:anywhere!important}\nhtml body .app-shell .is-loading .ai-preflight-cost{margin-top:8px!important}\n''')
          replace_once('web/src/main.tsx',
              "import './basic-fortune-v43.css'\nimport './reading-experience.css'",
              "import './basic-fortune-v43.css'\nimport './ai-cost-preview-v47.css'\nimport './reading-experience.css'")
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/src/PeriodAiInterpretationPanel.tsx web/src/RelationshipInterpretationPanel.tsx web/src/ai-cost-preview-v47.css web/src/main.tsx
          git commit -m "feat: show AI cost before generation [ai-cost-preview-v47-applied]"
          git push origin HEAD:fix/ai-cost-preview-v47
