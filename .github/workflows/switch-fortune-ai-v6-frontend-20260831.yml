name: Switch Fortune AI v6 Frontend 2026-08-31

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/patch_fortune_ai_v6_frontend.py'
      - '.github/workflows/switch-fortune-ai-v6-frontend-20260831.yml'

permissions:
  contents: write

jobs:
  switch-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/full-year-thai-hardening-20260831
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Apply frontend AI v6 switch
        run: python scripts/patch_fortune_ai_v6_frontend.py
      - name: Build frontend
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Verify only v6 fortune AI is referenced
        run: |
          ! grep -Fq 'fortune-interpret-v5-preview' web/src/AppNext.tsx
          grep -Fq 'fortune-interpret-v6-preview' web/src/AppNext.tsx
          grep -Fq "data.interpreter_version || 'supabase-ai-v6-exact-jie-suriyayat-safe'" web/src/AppNext.tsx
          echo FRONTEND_V6_REFERENCE_PASS
      - name: Verify production isolation
        run: |
          test "$GITHUB_REF_NAME" = 'work/full-year-thai-hardening-20260831'
          echo PRODUCTION_ISOLATION_PASS
      - name: Commit verified frontend switch
        run: |
          if git diff --quiet -- web/src/AppNext.tsx; then
            echo 'No frontend diff to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/src/AppNext.tsx
          git commit -m 'feat: route integrated AI to v6 preview'
          git push origin HEAD:work/full-year-thai-hardening-20260831
