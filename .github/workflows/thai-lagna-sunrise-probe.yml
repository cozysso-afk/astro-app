name: Thai Lagna actual sunrise probe

on:
  push:
    branches:
      - feature/thai-lagna-phase1-real-20260831
    paths:
      - .github/workflows/thai-lagna-sunrise-probe.yml

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/thai-lagna-phase1-real-20260831
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pyswisseph==2.10.3.2
      - name: Compare Swiss sunrise definitions and Sun anchors
        run: |
          python - <<'PY'
          import swisseph as swe
          from datetime import date,time,datetime,timedelta,timezone
          from thai_suriyayat_v1 import calculate_positions_for_instant
          from thai_lagna_v1 import COMMON_SIGN_DURATIONS_MINUTES,angular_delta_deg
          lat,lon,utc=13.752555,100.494066,7.0
          def d(s,x,m): return s*30+x+m/60
          refs=[
            ('1777',date(1777,5,14),time(6,42),d(1,19,8),d(1,13,30)),
            ('2026-mar',date(2026,3,24),time(14,15),d(3,26,9),d(3,21,39)),
            ('2026-apr',date(2026,4,20),time(23,49),d(8,15,9),d(8,10,37)),
          ]
          tz=timezone(timedelta(hours=utc))
          def jd0(day):
            utc0=datetime.combine(day,time(0,0),tzinfo=tz).astimezone(timezone.utc)
            h=utc0.hour+utc0.minute/60+utc0.second/3600
            return swe.julday(utc0.year,utc0.month,utc0.day,h,swe.GREG_CAL)
          def jd_to_local(jd):
            y,m,dd,h=swe.revjul(jd,swe.GREG_CAL)
            hh=int(h); mm=int((h-hh)*60); ss=int(round((((h-hh)*60)-mm)*60))
            if ss==60: ss=59
            return datetime(y,m,dd,hh,mm,ss,tzinfo=timezone.utc).astimezone(tz)
          def walk(sun,elapsed):
            sign=int((sun%360)//30); within=(sun%30)
            target=(sum(COMMON_SIGN_DURATIONS_MINUTES[:sign])+COMMON_SIGN_DURATIONS_MINUTES[sign]*(within/30)+elapsed)%1440
            c=0
            for i,dur in enumerate(COMMON_SIGN_DURATIONS_MINUTES):
              if target<c+dur or i==11: return (i*30+(target-c)*30/dur)%360
              c+=dur
          variants={
            'default':swe.CALC_RISE,
            'disc_center':swe.CALC_RISE|swe.BIT_DISC_CENTER,
            'no_refract':swe.CALC_RISE|swe.BIT_NO_REFRACTION,
            'center_no_refract':swe.CALC_RISE|swe.BIT_DISC_CENTER|swe.BIT_NO_REFRACTION,
          }
          for variant,flags in variants.items():
            print('\nVARIANT',variant)
            for anchor_mode in ('birth_sun','sunrise_sun'):
              errs=[]; errs_l=[]
              for label,day,tm,ref,ref_l in refs:
                res,tret=swe.rise_trans(jd0(day),swe.SUN,flags,(lon,lat,0.0),0.0,15.0,swe.FLG_SWIEPH)
                rise=jd_to_local(tret[0])
                birth=datetime.combine(day,tm,tzinfo=tz)
                sun_instant=birth if anchor_mode=='birth_sun' else rise
                sun=float(calculate_positions_for_instant(sun_instant)['positions']['sun']['longitude_deg'])
                elapsed=(birth-rise).total_seconds()/60
                actual=walk(sun,elapsed)
                lmt=walk(sun,elapsed+4*(lon-15*utc))
                e=abs(angular_delta_deg(actual,ref))*60; el=abs(angular_delta_deg(lmt,ref_l))*60
                errs.append(e);errs_l.append(el)
                print(anchor_mode,label,'sunrise',rise.strftime('%H:%M:%S'),'err',round(e,3),'lmt_err',round(el,3))
              print(anchor_mode,'SUMMARY max/mean=',round(max(errs),3),round(sum(errs)/len(errs),3),'LMT=',round(max(errs_l),3),round(sum(errs_l)/len(errs_l),3))
          PY
