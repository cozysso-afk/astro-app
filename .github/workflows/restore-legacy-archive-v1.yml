name: Restore legacy archive support v1

on:
  push:
    branches: [main]
    paths:
      - 'scripts/patch_legacy_archive_v1.py'

permissions:
  contents: write

jobs:
  patch-build-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply legacy archive patch
        run: python scripts/patch_legacy_archive_v1.py
      - name: Verify markers
        run: |
          grep -q "'daily' | 'outcome'" web/src/lib/archive.ts
          grep -q "이전 일일운세" web/src/AppNext.tsx
          grep -q "Legacy archive restore v1" web/src/archive.css
      - name: Build frontend
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Commit legacy archive support
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/src/lib/archive.ts web/src/AppNext.tsx web/src/archive.css
          git commit -m 'feat: restore legacy daily and outcome archive records'
          git push
