name: Audit Full-Year Fortune 2026-08-31

on:
  push:
    branches:
      - audit/full-year-fortune-20260831
    paths:
      - .github/workflows/audit-full-year-fortune-20260831.yml
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/full-year-fortune-20260831
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: api/requirements.txt
      - name: Install calculation dependencies
        run: pip install -r api/requirements.txt
      - name: Benchmark current 365-day engine without Gemini or production calls
        run: |
          python - <<'PY'
          import resource
          import time
          from datetime import date, time as dt_time
          from integrated_fortune_v1 import build_integrated_fortune, ENGINE_VERSION

          profile = dict(
              birth_date=date(1991, 3, 21),
              birth_time=dt_time(7, 26),
              latitude=34.7604,
              longitude=127.6622,
              utc_offset_hours=9,
              gender='female',
          )

          def run(label, start, end):
              t0 = time.perf_counter()
              result = build_integrated_fortune(**profile, start_date=start, end_date=end)
              elapsed = time.perf_counter() - t0
              rss = resource.getrusage(resource.RUSAGE_SELF).ru_maxrss / 1024
              print(f'BENCH {label}: {elapsed:.3f}s | maxrss={rss:.1f}MiB | engine={result.get("engine")}')
              assert result['ok'] is True
              return elapsed, result

          # Load ephemeris/module caches without pre-caching any annual day.
          run('warmup-single-day', date(2025, 12, 31), date(2025, 12, 31))
          t31, r31 = run('31-day-first', date(2026, 1, 1), date(2026, 1, 31))
          t365, r365 = run('365-day-first', date(2026, 1, 1), date(2026, 12, 31))
          t365_cached, r365_cached = run('365-day-repeat-cache', date(2026, 1, 1), date(2026, 12, 31))

          assert r365['period']['day_count'] == 365
          assert len(r365['western']['months']) == 12
          for topic in ['금전','학업','시험','직장','이직','대인관계','연애','연락','재회','소식','컨디션','투자심리','수익실현','신규진입','투자주의']:
              assert topic in r365['western']['overall'], topic
              assert r365['western']['overall'][topic] is not None, topic
          print(f'BENCH SUMMARY: 31d={t31:.3f}s 365d={t365:.3f}s cached365d={t365_cached:.3f}s ratio365to31={t365/max(t31,0.001):.2f}x')
          print('NO_GEMINI_CALLS=TRUE')
          PY
