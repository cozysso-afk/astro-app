name: Astrocartography world map guard
on:
  push:
    branches: [astrocartography-worldmap-v3-20260829]
    paths:
      - '.github/workflows/astrocartography-worldmap-v3-guard.yml'
permissions:
  contents: read
jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: astrocartography-worldmap-v3-20260829
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify rolling-deploy guard exists
        run: |
          grep -q 'map?: {' web/src/AppNext.tsx
          grep -q 'locationResult.map && <AstrocartographyWorldMap' web/src/AppNext.tsx
      - name: Build current web source
        working-directory: web
        run: npm ci && npm run build
