name: Starlight fixpack v12b
on:
  push:
    branches: [starlight-fixpack-20260829-v2]
    paths:
      - 'scripts/starlight_fixpack_v12b.py'
      - '.github/workflows/starlight-fixpack-v12b.yml'
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: starlight-fixpack-20260829-v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply v12b
        run: python scripts/starlight_fixpack_v12b.py
      - name: Python syntax
        run: python -m py_compile integrated_fortune_v1.py relationship_western_v1.py astrocartography_v1.py api/main.py
      - name: Install runtime test dependency
        run: pip install -q pyswisseph==2.10.3.2
      - name: Runtime smoke test relationship and location engines
        run: |
          python - <<'PY'
          from datetime import date, time
          from relationship_western_v1 import build_relationship_western
          from astrocartography_v1 import build_location_fit
          user={'birth_date':date(1991,3,21),'birth_time':time(7,26),'time_known':True,'latitude':34.7604,'longitude':127.6622,'utc_offset_hours':9}
          cp={'birth_date':date(1992,2,9),'birth_time':None,'time_known':False,'latitude':None,'longitude':None,'utc_offset_hours':9}
          rel=build_relationship_western(user,cp,[(date(2026,8,29),date(2026,9,28))])
          assert rel['natal_synastry']['available']
          assert rel['reunion_transits']['available']
          assert rel['reunion_transits']['top_days']
          assert not any(x['a']=='Moon' or x['b']=='Moon' for x in rel['natal_synastry']['aspects'])
          loc=build_location_fit(birth_date=date(1991,3,21),birth_time=time(7,26),utc_offset_hours=9)
          assert loc['ok'] and len(loc['countries'])>=10 and len(loc['purposes']['overall']['cities'])>=5
          print('relationship top trigger',rel['reunion_transits']['top_days'][0]['date'],rel['reunion_transits']['top_days'][0]['score'])
          print('location top',loc['countries'][0]['country'],loc['countries'][0]['best_city'],loc['countries'][0]['score'])
          PY
      - name: Web build
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Commit correction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/src/AppNext.tsx
          git diff --cached --quiet && exit 0
          git commit -m 'fix: correct integrated period and validate fixpack engines'
          git push origin HEAD:starlight-fixpack-20260829-v2
