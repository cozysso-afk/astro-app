name: Thread reunion evidence contract internal v1

on:
  push:
    branches:
      - feat/reunion-evidence-contract-v1

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/reunion-evidence-contract-v1
          fetch-depth: 0
      - name: Apply internal packet patch
        run: python scripts/thread_reunion_evidence_contract_internal_v1.py
      - name: Contract syntax checks
        run: |
          node --test web/src/lib/relationshipEvidencePipeline.test.mjs
          git diff --check
      - name: Remove temporary patcher
        run: |
          rm scripts/thread_reunion_evidence_contract_internal_v1.py
          rm .github/workflows/thread-reunion-evidence-contract-internal-v1.yml
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "test: enforce reunion evidence packet continuity"
          git push origin HEAD:feat/reunion-evidence-contract-v1
