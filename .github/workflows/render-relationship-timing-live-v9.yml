name: Render Relationship Timing Live V9

on:
  push:
    branches:
      - audit/relationship-timing-v9
    paths:
      - '.github/workflows/render-relationship-timing-live-v9.yml'

permissions:
  contents: read

jobs:
  relationship-timing-live:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify live V9 timing contract
        run: |
          python - <<'PY'
          import json
          import time
          import urllib.request

          base = 'https://astro-app-api-f7fn.onrender.com'
          expected_engine = 'relationship-western-v1.8-timing-timezone-contract'
          payload = {
              'user': {
                  'name': 'v9-utc-user',
                  'birth_date': '1990-01-01',
                  'birth_time': '12:00:00',
                  'time_known': True,
                  'latitude': 51.5074,
                  'longitude': -0.1278,
                  'utc_offset_hours': 0,
              },
              'counterpart': {
                  'name': 'v9-counterpart',
                  'birth_date': '1992-06-15',
                  'birth_time': '18:20:00',
                  'time_known': True,
                  'latitude': 37.5665,
                  'longitude': 126.9780,
                  'utc_offset_hours': 9,
              },
              'start_date': '2026-09-05',
              'end_date': '2026-09-05',
              'relationship_status': 'dating',
              'analysis_mode': 'reunion',
          }

          for attempt in range(1, 13):
              try:
                  with urllib.request.urlopen(base + '/v1/meta', timeout=60) as response:
                      meta = json.load(response)
                  if meta.get('relationship_engine') != expected_engine:
                      raise AssertionError(f"relationship engine not ready: {meta.get('relationship_engine')}")

                  req = urllib.request.Request(
                      base + '/v1/relationship/western',
                      data=json.dumps(payload).encode('utf-8'),
                      headers={'Content-Type': 'application/json'},
                      method='POST',
                  )
                  with urllib.request.urlopen(req, timeout=120) as response:
                      top = json.load(response)

                  assert top['ok'] is True, top
                  assert top['engine'] == expected_engine, top.get('engine')
                  result = top['result']
                  assert result['engine'] == expected_engine, result.get('engine')
                  policy = result['timing_timezone_policy']
                  assert 'local noon' in policy, policy
                  assert 'numeric 0 is preserved' in policy, policy
                  assert 'IANA/DST inference is not performed' in policy, policy

                  reunion = result['reunion_transits']
                  assert reunion['period'] == {'start': '2026-09-05', 'end': '2026-09-05'}, reunion
                  assert result['analysis_mode'] == 'reunion'
                  assert result['months'][0]['progressed_composite']['available'] is True
                  assert result['months'][0]['marks_tertiary']['available'] is True

                  print('render-relationship-timing-live-ok')
                  print('engine=', result['engine'])
                  print('policy=', policy)
                  print('reunion-period=', reunion['period'])
                  break
              except Exception as exc:
                  print(f'attempt {attempt}/12 failed: {type(exc).__name__}: {exc}')
                  if attempt == 12:
                      raise
                  time.sleep(10)
          PY
