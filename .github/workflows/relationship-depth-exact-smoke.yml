name: Relationship depth exact smoke
on:
  push:
    branches: [relationship-depth-v2-20260829]
    paths: ['.github/workflows/relationship-depth-exact-smoke.yml']
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: relationship-depth-v2-20260829}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r api/requirements.txt
      - name: Exact-time engine smoke
        run: |
          python - <<'PY'
          from datetime import date,time
          from relationship_western_v1 import build_relationship_western
          from relationship_saju_v1 import build_relationship_saju
          a={'birth_date':date(1991,3,21),'birth_time':time(7,26),'time_known':True,'latitude':34.76,'longitude':127.66,'utc_offset_hours':9}
          b={'birth_date':date(1992,2,9),'birth_time':time(12,0),'time_known':True,'latitude':35.16,'longitude':126.85,'utc_offset_hours':9}
          r=build_relationship_western(a,b,[(date(2027,1,1),date(2027,1,31))])
          assert r['house_overlays']['available'] is True
          assert r['house_overlays']['user_in_counterpart']['relationship_houses'] is not None
          assert r['davison']['available'] is True and r['marks']['available'] is True
          assert r['relationship_transits']['period']['start']=='2027-01-01'
          s=build_relationship_saju(a,b)
          assert s['user']['hour'] and s['counterpart']['hour']
          print('EXACT_RELATIONSHIP_DEPTH=PASS')
          PY
