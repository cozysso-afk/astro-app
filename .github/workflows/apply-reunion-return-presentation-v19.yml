name: Apply Reunion Return Presentation v19

on:
  push:
    branches:
      - feat/reunion-return-presentation-v19
    paths:
      - 'scripts/upgrade_reunion_return_presentation_v19.py'
      - '.github/workflows/apply-reunion-return-presentation-v19.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/reunion-return-presentation-v19
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply v19 upgrade
        run: python scripts/upgrade_reunion_return_presentation_v19.py
      - name: Check generated diff
        run: git diff --check
      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add relationship_return_v1.py \
            supabase/functions/relationship-interpret-v9-preview/index.ts \
            supabase/functions/relationship-interpret-v9-preview/reunionEvidenceV2.ts \
            supabase/functions/relationship-interpret-v9-preview/reunionEvidenceV2.test.mjs \
            web/src/lib/readingCache.ts \
            web/src/lib/resultFormatters.ts \
            web/src/appTypes.ts \
            web/src/AppNext.tsx \
            web/src/RelationshipInterpretationPanel.tsx \
            web/src/reunion-reading-product-v13.css \
            web/src/lib/relationshipReunionV2.contract.test.mjs \
            web/src/lib/relationshipEvidencePipeline.test.mjs \
            web/src/lib/relationshipModeContract.test.mjs \
            tests/test_relationship_returns_v18.py
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "feat: apply return background presentation v19"
          git push origin HEAD:feat/reunion-return-presentation-v19
