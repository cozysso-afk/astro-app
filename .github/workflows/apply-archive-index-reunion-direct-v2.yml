name: Apply archive index reunion direct v2

on:
  push:
    branches:
      - fix/archive-index-reunion-direct-v2
    paths:
      - scripts/patch_archive_index_reunion_direct_v2.py
      - tests/test_archive_index_reunion_direct_v2.py
      - .github/workflows/apply-archive-index-reunion-direct-v2.yml
      - supabase/migrations/20260924_archive_index_v1.sql

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/archive-index-reunion-direct-v2
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: api/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install API runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r api/requirements.txt
          pip install pytest httpx

      - name: Apply targeted patch
        run: python scripts/patch_archive_index_reunion_direct_v2.py

      - name: Focused regression contracts
        run: |
          python -m pytest -q tests/test_archive_index_reunion_direct_v2.py tests/test_reunion_runtime_v29.py tests/test_reunion_hierarchy_v2.py
          python tests/test_relationship_async_contract.py

      - name: Frontend typecheck and build
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Commit verified source changes
        run: |
          git config user.name "cozysso-afk"
          git config user.email "cozysso@gmail.com"
          git add web/src/lib/auth.ts web/src/lib/archive.ts web/src/AppNext.tsx tests/test_archive_index_reunion_direct_v2.py supabase/migrations/20260924_archive_index_v1.sql
          if git diff --cached --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git commit -m "fix: restore archive index and direct reunion request"
          git push origin HEAD:fix/archive-index-reunion-direct-v2
