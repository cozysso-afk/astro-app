name: Apply Period Daily Evidence Guard

on:
  push:
    branches:
      - work/integrated-interpretation-v2
    paths:
      - .github/workflows/apply-period-daily-evidence-v12.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/integrated-interpretation-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Enforce daily evidence for week and month
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('supabase/functions/fortune-interpret-v6-preview/qualityV2.ts')
          s=p.read_text(encoding='utf-8')
          anchor='''  if(kind==="day"){\n    const detailDays=Array.isArray(payload?.western?.detail_days)?payload.western.detail_days:[];\n'''
          insert='''  if(kind==="week"||kind==="month"){\n    const dailyRefsAvailable=Array.from(map.keys()).filter((ref:any)=>String(ref).startsWith("W:daily:"));\n    if(dailyRefsAvailable.length){\n      const required=kind==="month"?Math.min(2,data?.key_windows?.length??0):Math.min(1,data?.key_windows?.length??0);\n      const dailyBacked=(data?.key_windows??[]).filter((w:any)=>(w?.evidence_refs??[]).some((ref:string)=>ref.startsWith("W:daily:"))).length;\n      if(dailyBacked<required)s5.push(`${kind==="month"?"월간":"주간"} 실제 일별 계산근거가 연결된 핵심 시기 부족: ${dailyBacked}/${required}`);\n    }\n  }\n'''+anchor
          if '월간 실제 일별 계산근거가 연결된 핵심 시기 부족' not in s:
              if anchor not in s: raise SystemExit('period daily evidence anchor missing')
              s=s.replace(anchor,insert,1)
              p.write_text(s,encoding='utf-8')

          p=Path('supabase/functions/fortune-interpret-v6-preview/qualityPeriods.test.mjs')
          s=p.read_text(encoding='utf-8')
          marker='week and month require available W:daily evidence in key windows'
          if marker not in s:
              s += '''\n\ntest("week and month require available W:daily evidence in key windows",()=>{\n  for(const kind of ["week","month"]){\n    const {data,payload}=buildCase(kind);\n    const needed=kind==="month"?2:1;\n    const dailyRefs=[];\n    for(let i=0;i<needed;i++){\n      const date=data.key_windows[i].start;\n      const ref=`W:daily:${date}:${i+1}`;\n      dailyRefs.push(ref);\n      payload.evidence_ledger.push({id:ref,system:"western",scope:"daily_actual_aspect_house",direction:"context",date,text:`${date} 실제 일별 트랜짓 테스트 근거`});\n    }\n    const missing=inspectInterpretationQuality(data,payload);\n    assert.equal(missing.ok,false);\n    const issues=missing.stages.flatMap(stage=>stage.issues??[]).join(" / ");\n    assert.match(issues,kind==="month"?/월간 실제 일별 계산근거/:/주간 실제 일별 계산근거/);\n\n    for(let i=0;i<needed;i++)data.key_windows[i].evidence_refs.push(dailyRefs[i]);\n    const fixed=inspectInterpretationQuality(data,payload);\n    assert.equal(fixed.ok,true,JSON.stringify(fixed,null,2));\n    assert.equal(fixed.score,100);\n  }\n});\n'''
              p.write_text(s,encoding='utf-8')
          PY
      - name: Make period timing visually prominent
        run: |
          cat >> web/src/period-ai-v18.css <<'CSS'

/* v19 · make actionable clock/date timing visually scannable. */
.period-ai-action-time{display:inline-flex!important;align-items:center;width:max-content;max-width:100%;margin-top:2px;padding:5px 8px;border-radius:999px;background:linear-gradient(135deg,rgba(238,230,249,.92),rgba(233,245,248,.9));border:1px solid rgba(124,101,145,.15);color:#725c80!important;font-size:.72rem!important;font-weight:900!important;line-height:1.25;letter-spacing:.005em;font-variant-numeric:tabular-nums lining-nums;box-shadow:inset 0 1px 0 rgba(255,255,255,.82)}
.period-ai-action-time::before{content:'⏱';margin-right:5px;font-size:.68rem;opacity:.72}
@media(max-width:430px){.period-ai-action-time{font-size:.71rem!important;padding:5px 7px}}
CSS
      - name: Full interpretation regression
        run: |
          node --experimental-strip-types --test supabase/functions/fortune-interpret-v6-preview/periodInstruction.test.mjs
          node --experimental-strip-types --test supabase/functions/fortune-interpret-v6-preview/qualityPeriods.test.mjs
          node --experimental-strip-types --test supabase/functions/fortune-interpret-v6-preview/integratedInterpretationV2.test.mjs
          node --experimental-strip-types --test supabase/functions/fortune-interpret-v6-preview/thaiContract.test.mjs
      - name: Web production build
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Commit period evidence guard
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/functions/fortune-interpret-v6-preview/qualityV2.ts supabase/functions/fortune-interpret-v6-preview/qualityPeriods.test.mjs web/src/period-ai-v18.css
          git diff --cached --quiet && exit 0
          git commit -m 'feat(ai): require daily evidence in week and month readings'
          git push origin HEAD:work/integrated-interpretation-v2
