name: Starlight v9 UI precision
on:
  push:
    branches: [ui-reading-overhaul-20260829]
    paths:
      - 'scripts/starlight_v9_ui_precision.py'
      - '.github/workflows/starlight-v9-ui-precision.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui-reading-overhaul-20260829
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply v9 UI precision patch
        run: python scripts/starlight_v9_ui_precision.py
      - name: Build web
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Commit v9 UI precision
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/src/AppNext.tsx web/src/visual-overhaul-v6.css
          git diff --cached --quiet && exit 0
          git commit -m 'fix: clarify reunion range and glossary typography'
          git push origin HEAD:ui-reading-overhaul-20260829
