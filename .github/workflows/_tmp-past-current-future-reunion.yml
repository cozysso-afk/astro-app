name: temporary reunion past-current-future timeline patch

on:
  push:
    branches:
      - fix/reunion-hierarchy-v2

permissions:
  contents: write

jobs:
  patch-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Patch reunion timeline presentation
        run: |
          python - <<'PY'
          from pathlib import Path

          h=Path('web/src/lib/reunionHierarchy.ts')
          s=h.read_text()
          old='  top_periods:ReunionPeriod[]; nearest_window:ReunionPeriod|null; past_windows:ReunionPeriod[];'
          new='  top_periods:ReunionPeriod[]; nearest_window:ReunionPeriod|null; past_windows:ReunionPeriod[]; current_windows:ReunionPeriod[];'
          if old not in s: raise SystemExit('missing hierarchy type anchor')
          s=s.replace(old,new,1)
          anchor='''  const nearest = value.nearest_window && futurePeriod(value.nearest_window,asOf)\n    ? value.nearest_window\n    : [...topPeriods].sort((a,b)=>a.date.localeCompare(b.date) || b.final-a.final)[0] ?? null\n  return {'''
          repl='''  const nearest = value.nearest_window && futurePeriod(value.nearest_window,asOf)\n    ? value.nearest_window\n    : [...topPeriods].sort((a,b)=>a.date.localeCompare(b.date) || b.final-a.final)[0] ?? null\n  const pastWindows = Array.isArray(value.past_windows)\n    ? value.past_windows.filter((row)=>!asOf || row.date < asOf).sort((a,b)=>b.final-a.final || b.date.localeCompare(a.date)).slice(0,3)\n    : []\n  const currentWindows = Array.isArray(value.current_windows)\n    ? value.current_windows.filter((row)=>!asOf || (row.start <= asOf && row.end >= asOf)).sort((a,b)=>b.final-a.final || a.date.localeCompare(b.date)).slice(0,3)\n    : []\n  return {'''
          if anchor not in s: raise SystemExit('missing hierarchy nearest anchor')
          s=s.replace(anchor,repl,1)
          old='''    past_windows: Array.isArray(value.past_windows)\n      ? value.past_windows.filter((row)=>!asOf || row.date < asOf)\n      : [],'''
          new='''    past_windows: pastWindows,\n    current_windows: currentWindows,'''
          if old not in s: raise SystemExit('missing hierarchy past return anchor')
          h.write_text(s.replace(old,new,1))

          p=Path('web/src/RelationshipInterpretationPanel.tsx')
          s=p.read_text()
          if '<h3>지금부터의 재회 흐름</h3>' not in s: raise SystemExit('missing reunion heading anchor')
          s=s.replace('<h3>지금부터의 재회 흐름</h3>','<h3>재회 흐름 타임라인</h3>',1)
          anchor='''        <h4>오늘 이후 후보 시기</h4>\n        {hierarchyData.top_periods.map((w)=><article className="relationship-pattern reunion-future-window" key={`${w.start}:${w.stage}`}>'''
          insert='''        <h4>지난 활성기 · 사후 확인용</h4>\n        <p className="reunion-score-meaning">기준일 이전에 같은 관문을 통과했던 구간이야. 실제 메시지·만남·관계 변화 기록과 비교하는 개인 사후 확인용이며, 과거와 맞아 보인다는 사실만으로 엔진 정확도가 증명되는 것은 아니야.</p>\n        {hierarchyData.past_windows.map((w)=><article className="relationship-pattern reunion-past-window" key={`past:${w.start}:${w.stage}`}>\n          <b>{w.start} ~ {w.end} · {w.label}</b><p>{reunionStageHuman(w.stage, w.label)}</p><small>대표 날짜 {w.date} · 이미 지난 구간 · 보조지표 활성도 {w.final}</small>\n        </article>)}\n        {!hierarchyData.past_windows.length && <p>조회 범위 안에서 따로 비교할 지난 활성기가 없어.</p>}\n\n        <h4>현재 흐름</h4>\n        {hierarchyData.current_windows.map((w)=><article className="relationship-pattern reunion-current-window" key={`current:${w.start}:${w.stage}`}>\n          <b>{w.start} ~ {w.end} · {w.label}</b><p>{reunionStageHuman(w.stage, w.label)}</p><small>기준일 {hierarchyData.as_of_date} 포함 · 사건 확정 아님 · 보조지표 활성도 {w.final}</small>\n        </article>)}\n        {!hierarchyData.current_windows.length && <p>기준일이 포함된 공개 활성창은 없어. 현재 감정이나 행동이 없다는 뜻이 아니라, 계층 관문을 통과한 현재 후보가 없다는 뜻이야.</p>}\n\n        <h4>앞으로의 후보 시기</h4>\n        {hierarchyData.top_periods.map((w)=><article className="relationship-pattern reunion-future-window" key={`${w.start}:${w.stage}`}>'''
          if anchor not in s: raise SystemExit('missing future timeline anchor')
          s=s.replace(anchor,insert,1)
          old='<details className="reading-more reunion-past-audit"><summary>지난 활성기 · 사후검증용</summary>{hierarchyData.past_windows.length ? hierarchyData.past_windows.map((w)=><p key={`${w.start}:${w.stage}`}>{w.start} ~ {w.end} · {w.label} · {w.final}점</p>) : <p>분리해 표시할 지난 활성기가 없어.</p>}</details>'
          if old not in s: raise SystemExit('missing old collapsed past audit')
          s=s.replace(old,'',1)
          p.write_text(s)

          q=Path('web/src/EditorialQaPreview.tsx')
          s=q.read_text()
          anchor='''    <section className="period-ai-window-section"><div className="period-ai-section-title"><span>오늘 이후 후보 시기</span></div><p><strong>2026-10-21 전후</strong>는 연락·재접촉 단계가 실제로 열리는지 살피는 예시 후보 창이야.'''
          insert='''    <section className="period-ai-window-section"><div className="period-ai-section-title"><span>지난 활성기 · 사후 확인용</span></div><p><strong>2026-07-18 전후</strong>는 감정 재활성화 단계가 강했던 예시 과거 구간이야. <strong>2026-08-09 전후</strong>는 연락·재접촉 관문까지 통과했던 예시 구간이야. 실제 당시 메시지·답장·만남 기록과 비교해 볼 수 있지만, 과거와 맞아 보인다는 사실만으로 엔진 정확도가 증명되는 것은 아니야.</p></section>\n    <section className="period-ai-window-section"><div className="period-ai-section-title"><span>현재 흐름</span></div><p>이 예시의 기준일에는 감정 재활성화 단계만 현재 창에 걸쳐 있고, 연락·만남·재구축 단계는 현재 창으로 열려 있지 않아. 현재 창이 없거나 약하다는 말과 실제 감정이 없다는 말은 구분해서 읽어야 해.</p></section>\n    <section className="period-ai-window-section"><div className="period-ai-section-title"><span>앞으로의 후보 시기</span></div><p><strong>2026-10-21 전후</strong>는 연락·재접촉 단계가 실제로 열리는지 살피는 예시 후보 창이야.'''
          if anchor not in s: raise SystemExit('missing QA future section anchor')
          q.write_text(s.replace(anchor,insert,1))

          t=Path('web/src/lib/relationshipReunionV2.contract.test.mjs')
          s=t.read_text()
          s=s.replace("assert.match(panel,/지금부터의 재회 흐름/)","assert.match(panel,/재회 흐름 타임라인/)")
          s=s.replace("assert.match(panel,/지난 활성기 · 사후검증용/)","assert.match(panel,/지난 활성기 · 사후 확인용/)\n  assert.match(panel,/실제 메시지·만남·관계 변화 기록과 비교하는 개인 사후 확인용/)\n  assert.match(panel,/현재 흐름/)\n  assert.match(panel,/앞으로의 후보 시기/)")
          s=s.replace("assert.match(hierarchy,/top_periods: topPeriods/)","assert.match(hierarchy,/top_periods: topPeriods/)\n  assert.match(hierarchy,/past_windows: pastWindows/)\n  assert.match(hierarchy,/current_windows: currentWindows/)\n  assert.match(hierarchy,/slice\\(0,3\\)/)")
          t.write_text(s)
          PY
      - name: Install web dependencies
        working-directory: web
        run: npm ci
      - name: Run reunion presentation regressions
        run: |
          node --test web/src/lib/relationshipReunionV2.contract.test.mjs
          node --experimental-strip-types --test web/src/lib/interpretationUiContract.test.mjs
          node --test web/src/lib/relationshipModeContract.test.mjs
      - name: Production web build
        working-directory: web
        run: npm run build
      - name: Commit source only after tests pass
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/src/lib/reunionHierarchy.ts web/src/RelationshipInterpretationPanel.tsx web/src/EditorialQaPreview.tsx web/src/lib/relationshipReunionV2.contract.test.mjs
          git diff --cached --check
          git commit -m 'feat: show past current and future reunion timing' || exit 0
          git push origin HEAD:fix/reunion-hierarchy-v2
