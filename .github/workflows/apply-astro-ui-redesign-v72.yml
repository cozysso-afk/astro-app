name: Apply Astro UI redesign v7.2

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-astro-ui-redesign-v72.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply redesign patch
        run: python scripts/redesign_astro_ui_v72.py
      - name: Syntax check
        run: python -m py_compile app.py fortune_lab_v71.py scripts/redesign_astro_ui_v72.py
      - name: Verify redesign markers
        run: |
          grep -q 'ASTRO_DESIGN_V72_CSS' app.py
          grep -q 'CELESTIAL TIMING LAB' app.py
          grep -q '"궁합운"' app.py
          grep -q '출생 시·도' app.py
          grep -q '"birthplace_options":KOREA_BIRTHPLACES' app.py
          grep -q 'FORTUNE_LAB_VERSION = "v0.1.5"' fortune_lab_v71.py
          grep -q '_select_birthplace_from_options' fortune_lab_v71.py
          grep -q '상대 출생 시·도' fortune_lab_v71.py
          grep -q '운의 흐름 계산하기' fortune_lab_v71.py
      - name: Diff sanity
        run: git diff --check
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py fortune_lab_v71.py
          git commit -m "feat: redesign 별빛 UI and add selectable regions"
          git push origin HEAD:main
