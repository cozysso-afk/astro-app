name: Apply Interpretation Depth UI V10

on:
  push:
    branches:
      - work/integrated-interpretation-v2
    paths:
      - .github/workflows/apply-interpretation-depth-ui-v10.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/integrated-interpretation-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Add cross-system and decision-condition UI
        run: |
          python - <<'PY'
          from pathlib import Path

          def rep(path, old, new):
              p=Path(path); s=p.read_text(encoding='utf-8')
              if old not in s: raise SystemExit(f'anchor missing: {path}: {old[:120]}')
              p.write_text(s.replace(old,new,1),encoding='utf-8')

          p='web/src/appTypes.ts'
          rep(p,
              '''export type AiDecision = {\n  action: string\n  timing: string\n  reason: string\n  evidence_refs: string[]\n}\n''',
              '''export type AiCrossCheck = {\n  label: string\n  start: string\n  end: string\n  mode: '복수체계' | '상반맥락' | 'Western단독'\n  western: string\n  saju: string\n  thai: string\n  synthesis: string\n  evidence_refs: string[]\n}\n\nexport type AiDecision = {\n  action: string\n  timing: string\n  reason: string\n  watch: string\n  avoid: string\n  evidence_refs: string[]\n}\n''')
          rep(p,
              '    year_phases?: AiYearPhase[]\n    decisions?: AiDecision[]',
              '    year_phases?: AiYearPhase[]\n    cross_checks?: AiCrossCheck[]\n    decisions?: AiDecision[]')

          p='web/src/AiInterpretationPanel.tsx'
          rep(p,
              '  const hasYearPhases = !!data.year_phases?.length\n',
              '  const hasYearPhases = !!data.year_phases?.length\n  const hasCrossChecks = !!data.cross_checks?.length\n')
          rep(p,
              '<p>{item.reason}</p><small>계산 근거 {item.evidence_refs?.length ?? 0}개 연결</small>',
              '<p>{item.reason}</p>{item.watch&&<div className="ai-decision-condition"><b>확인</b><span>{item.watch}</span></div>}{item.avoid&&<div className="ai-decision-condition is-avoid"><b>피할 것</b><span>{item.avoid}</span></div>}<small>계산 근거 {item.evidence_refs?.length ?? 0}개 연결</small>')
          anchor='''    {hasYearPhases && <section className="ai-year-phase-section"><div className="ai-section-heading"><span>연간 흐름 지도</span><strong>한 해를 4구간으로 보면</strong></div><div className="ai-year-phase-list">{data.year_phases!.map((phase,index)=><article key={`${phase.label}-${index}`}><div><b>{phase.label}</b><span>{periodLabel(phase.start,phase.end)}</span></div><strong>{phase.theme}</strong><p>{phase.change}</p></article>)}</div></section>}\n\n'''
          insertion=anchor+'''    {hasCrossChecks && <section className="ai-cross-check-section"><div className="ai-section-heading"><span>체계 교차검증</span><strong>같은 시기를 세 체계가 어떻게 다르게 말하는지</strong></div><p className="ai-cross-check-note">점수를 합산하거나 다수결하지 않고, Western(서양점성술)·사주·Thai(태국점성술)의 독립 근거를 나란히 비교해.</p><div className="ai-cross-check-list">{data.cross_checks!.map((item,index)=><article className={`ai-cross-check ${item.mode==='상반맥락'?'is-tension':item.mode==='Western단독'?'is-western-only':'is-multi'}`} key={`${item.start}-${item.label}-${index}`}><div className="ai-cross-check-head"><div><span>{periodLabel(item.start,item.end)}</span><strong>{item.label}</strong></div><b>{item.mode}</b></div><div className="ai-cross-system-lines"><p><b>Western</b><span>{item.western}</span></p><p><b>사주</b><span>{item.saju}</span></p><p><b>Thai</b><span>{item.thai}</span></p></div><div className="ai-cross-synthesis"><strong>그래서</strong><p>{item.synthesis}</p></div><small>독립 계산 근거 {item.evidence_refs?.length ?? 0}개 연결</small></article>)}</div></section>}\n\n'''
          if anchor not in Path(p).read_text(encoding='utf-8'): raise SystemExit('cross-check UI anchor missing')
          rep(p,anchor,insertion)

          p='web/src/ai-interpret-v2.css'
          s=Path(p).read_text(encoding='utf-8')
          extra='''\n\n/* V10: explicit cross-system comparison and executable decision conditions. */\n.ai-decision-condition{display:grid;grid-template-columns:48px minmax(0,1fr);gap:7px;padding:7px 9px;border-radius:11px;background:rgba(239,247,243,.78);font-size:.74rem;line-height:1.55}.ai-decision-condition b{color:#5f7769}.ai-decision-condition span{color:#6c6470}.ai-decision-condition.is-avoid{background:rgba(252,242,243,.78)}.ai-decision-condition.is-avoid b{color:#91656a}.ai-cross-check-section{display:grid;gap:10px}.ai-cross-check-note{margin:0;color:#7a707d;font-size:.75rem;line-height:1.6}.ai-cross-check-list{display:grid;gap:10px}.ai-cross-check{display:grid;gap:10px;padding:14px;border:1px solid rgba(170,174,192,.25);border-radius:18px;background:linear-gradient(145deg,rgba(255,255,255,.9),rgba(247,245,251,.84))}.ai-cross-check.is-multi{border-color:rgba(126,162,148,.28);background:linear-gradient(145deg,rgba(242,250,247,.92),rgba(250,248,253,.9))}.ai-cross-check.is-tension{border-color:rgba(184,139,143,.28);background:linear-gradient(145deg,rgba(255,246,246,.92),rgba(249,247,253,.9))}.ai-cross-check-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}.ai-cross-check-head>div{display:grid;gap:3px;min-width:0}.ai-cross-check-head span{color:#8b7a92;font-size:.68rem;font-weight:800}.ai-cross-check-head strong{color:#473d4d;font-size:.86rem;line-height:1.4}.ai-cross-check-head>b{flex:0 0 auto;padding:4px 8px;border-radius:999px;background:rgba(116,94,130,.08);color:#725f7d;font-size:.65rem}.ai-cross-system-lines{display:grid;gap:7px}.ai-cross-system-lines p{display:grid;grid-template-columns:58px minmax(0,1fr);gap:8px;margin:0;padding:8px 9px;border-radius:11px;background:rgba(255,255,255,.67);font-size:.74rem;line-height:1.57}.ai-cross-system-lines b{color:#6b5976}.ai-cross-system-lines span{color:#706775}.ai-cross-synthesis{display:grid;grid-template-columns:48px minmax(0,1fr);gap:8px;padding:9px 10px;border-radius:12px;background:rgba(115,91,130,.07)}.ai-cross-synthesis strong{color:#665273;font-size:.74rem}.ai-cross-synthesis p{margin:0;color:#655d69;font-size:.77rem;line-height:1.62}.ai-cross-check>small{color:#9b909f;font-size:.66rem}@media(max-width:520px){.ai-cross-system-lines p{grid-template-columns:1fr;gap:3px}.ai-cross-synthesis{grid-template-columns:1fr;gap:3px}}\n'''
          if 'V10: explicit cross-system comparison' not in s:
              Path(p).write_text(s+extra,encoding='utf-8')
          PY
      - name: Web typecheck and production build
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Commit depth UI
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/src/appTypes.ts web/src/AiInterpretationPanel.tsx web/src/ai-interpret-v2.css
          git diff --cached --quiet && exit 0
          git commit -m 'feat(web): show cross-system checks and action conditions'
          git push origin HEAD:work/integrated-interpretation-v2
