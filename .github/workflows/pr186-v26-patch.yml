name: PR186 v2.6 source archive

on:
  push:
    branches:
      - fix/reunion-hierarchy-v2
    paths:
      - .github/workflows/pr186-v26-patch.yml

permissions:
  contents: read

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: fix/reunion-hierarchy-v2
          fetch-depth: 1

      - name: Archive source
        uses: actions/upload-artifact@v4
        with:
          name: pr186-v26-source
          path: |
            .
            !.git
          include-hidden-files: true
          retention-days: 1
