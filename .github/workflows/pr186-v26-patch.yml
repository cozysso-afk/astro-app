name: PR186 v2.6 guarded patch

on:
  push:
    branches:
      - fix/reunion-hierarchy-v2
    paths:
      - scripts/apply_reunion_v26_patch.py
      - .github/workflows/pr186-v26-patch.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: fix/reunion-hierarchy-v2
          fetch-depth: 0

      - name: Apply guarded patch
        run: python scripts/apply_reunion_v26_patch.py

      - name: Syntax and diff checks
        run: |
          python -m py_compile api/main.py relationship_return_v1.py tests/test_return_relocation_v26.py
          git diff --check

      - name: Commit and push v2.6 code/tests
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/main.py relationship_return_v1.py tests/test_return_relocation_v26.py
          git commit -m "fix(reunion): add explicit return relocation provenance"
          git push origin HEAD:fix/reunion-hierarchy-v2
