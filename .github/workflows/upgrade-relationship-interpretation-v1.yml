dding:14px 16px;border-radius:18px;background:rgba(255,255,255,.74);font-size:14px;line-height:1.5}.relationship-ai-usage b{font-size:16px;color:#6a4b74}.relationship-ai-advice{margin:15px 0;padding:16px;border-radius:20px;background:rgba(247,241,255,.78)}.relationship-ai-advice strong{font-size:17px}.relationship-ai-advice p{font-size:16px;line-height:1.65;margin:8px 0}.relationship-ai-card details{margin-top:16px}.relationship-ai-card summary{font-size:17px;font-weight:800;cursor:pointer}.relationship-ai-aspect{padding:14px 0;border-bottom:1px solid rgba(120,105,130,.12)}.relationship-ai-aspect b{font-size:16px}.relationship-ai-aspect p,.relationship-ai-limits{font-size:15px;line-height:1.7;color:#665e67}.aspect-row>div>strong{font-size:17px}.aspect-row>div>span{font-size:14px}.result-note{font-size:16px!important;line-height:1.65!important}
