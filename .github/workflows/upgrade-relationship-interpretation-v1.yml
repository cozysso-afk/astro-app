name: Upgrade Relationship Interpretation v1

on:
  push:
    paths:
      - '.github/workflows/upgrade-relationship-interpretation-v1.yml'

permissions:
  contents: write

jobs:
  patch-build-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Patch relationship interpretation UI
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('web/src/AppNext.tsx')
          s=p.read_text(encoding='utf-8')

          type_anchor='type FortunePoint = { date: string; label: string; score: number }\n'
          type_block='''type RelationshipAiResponse = {\n  ok: boolean\n  error?: string\n  model?: string\n  fallback_from?: string\n  interpreter_version?: string\n  usage?: { prompt_tokens?: number; candidate_tokens?: number; thought_tokens?: number; total_tokens?: number; estimated_usd?: number; estimated_krw?: number }\n  data?: {\n    headline: string\n    overview: string\n    chemistry: string\n    communication: string\n    stability: string\n    tensions: string\n    timing: string\n    reunion_context: string\n    practical_advice: string[]\n    top_aspects: Array<{ label: string; meaning: string }>\n    limits: string\n  }\n}\n\ntype RelationshipInstantSummary = {\n  headline: string\n  overview: string\n  communication: string\n  chemistry: string\n  stability: string\n  timing: string\n  supportive: number\n  challenging: number\n  mixed: number\n  tight: Aspect[]\n}\n\n'''
          assert type_anchor in s, 'type anchor missing'
          s=s.replace(type_anchor,type_block+type_anchor,1)

          helper_anchor="const relationshipSignalOrder = ['수신신호','발신적합','과거인연접점']\n"
          helpers=r'''const relationshipSignalOrder = ['수신신호','발신적합','과거인연접점']

function hasPair(aspect: Aspect, a: string, b: string) {
  return (aspect.a === a && aspect.b === b) || (aspect.a === b && aspect.b === a)
}
function relationshipAspectMeaning(aspect: Aspect) {
  const tense = aspect.tone === 'challenging'
  const supportive = aspect.tone === 'supportive'
  if (hasPair(aspect,'Mercury','Mars')) return tense ? '말의 속도와 반응성이 빨라져 논쟁·반박이 쉽게 붙는 접점이야. 핵심은 누가 맞는지보다 말의 강도를 조절하는 거야.' : '생각을 행동으로 옮기는 속도가 잘 맞기 쉬워. 대화를 실제 움직임으로 연결하는 데 힘이 실리는 접점이야.'
  if (hasPair(aspect,'Mercury','Uranus')) return tense ? '대화가 갑자기 튀거나 예상 밖의 말로 흐름이 끊길 수 있어. 신선함은 크지만 안정적인 소통 규칙이 필요해.' : '서로의 생각을 깨우는 자극이 강해. 평범한 대화보다 새로운 관점과 아이디어가 잘 살아나는 접점이야.'
  if (hasPair(aspect,'Mars','Pluto')) return '관계의 추진력과 힘겨루기가 동시에 커질 수 있는 강한 접점이야. 끌림보다 경계·통제·주도권을 어떻게 다루는지가 중요해.'
  if ((aspect.a === 'Neptune' || aspect.b === 'Neptune') && ['ASC','DSC'].some((p)=>aspect.a===p||aspect.b===p)) return tense ? '상대를 보는 이미지와 실제 관계 방식 사이에 흐림이나 이상화가 생기기 쉬워. 추측보다 확인이 중요한 접점이야.' : '말로 설명하기 어려운 분위기·공감이 생기기 쉬운 대신, 현실 확인을 같이 해줘야 안정적으로 쓰이는 접점이야.'
  if ((aspect.a === 'Sun' || aspect.b === 'Sun') && ['MC','IC'].some((p)=>aspect.a===p||aspect.b===p)) return supportive ? '한 사람의 핵심 방향성이 다른 사람의 진로·생활축과 자연스럽게 연결되는 접점이야. 함께 있을 때 방향을 정리하는 힘으로 쓰일 수 있어.' : '개인의 방향성과 생활·진로축이 부딪힐 수 있어. 관계와 각자의 목표를 분리해 조율하는 게 중요해.'
  if (hasPair(aspect,'Venus','Mars')) return supportive ? '호감 표현 방식과 추진력이 자연스럽게 맞물리는 전형적인 끌림 접점이야. 다만 이것만으로 관계 지속이나 재회를 뜻하진 않아.' : '끌림은 강할 수 있지만 원하는 속도나 표현 방식이 달라 마찰도 같이 생길 수 있어.'
  if (aspect.a === 'Saturn' || aspect.b === 'Saturn') return tense ? '책임·거리·기준이 무겁게 느껴질 수 있는 접점이야. 오래 가려면 의무감이 아니라 합의된 규칙으로 바꾸는 과정이 필요해.' : '관계에 구조와 지속성을 더해주는 접점이야. 현실적인 약속과 꾸준함으로 쓸 때 힘이 생겨.'
  if (aspect.a === 'Jupiter' || aspect.b === 'Jupiter') return supportive ? '서로의 시야를 넓히고 격려하는 방향으로 쓰이기 쉬워. 관계가 성장 경험이 되는 쪽의 접점이야.' : '기대나 낙관이 과해질 수 있어. 실제 상황보다 크게 해석하지 않는 게 중요해.'
  if (aspect.a === 'True Node' || aspect.b === 'True Node') return '익숙함이나 의미 부여가 강해질 수 있는 접점이지만, 운명·재회 확정의 증거는 아니야. 반복되는 관계 패턴을 살피는 근거로 보는 게 맞아.'
  if (aspect.a === 'Moon' || aspect.b === 'Moon') return tense ? '감정 반응의 리듬이 어긋날 수 있어. 한쪽의 즉각 반응과 다른 쪽의 처리 방식 차이를 조율해야 해.' : '정서적 반응이 비교적 자연스럽게 이어질 수 있는 접점이야. 편안함을 만드는 데 도움이 될 수 있어.'
  return aspect.tone === 'supportive'
    ? '이 영역은 서로의 기능이 비교적 자연스럽게 연결되는 조화 접점이야. 관계 전체가 좋다는 뜻이 아니라 이 기능이 협력적으로 작동하기 쉽다는 뜻이야.'
    : aspect.tone === 'challenging'
      ? '이 영역은 자극과 마찰이 반복되기 쉬운 긴장 접점이야. 나쁘다는 뜻보다 조율이 필요한 힘이 강하다는 의미야.'
      : '강한 결합이나 혼합 효과가 나타나는 접점이야. 상황과 다른 애스펙트에 따라 협력과 부담이 함께 나타날 수 있어.'
}
function buildRelationshipInstantSummary(aspects: Aspect[], partnerExact: boolean): RelationshipInstantSummary {
  const supportive = aspects.filter((a)=>a.tone==='supportive').length
  const challenging = aspects.filter((a)=>a.tone==='challenging').length
  const mixed = aspects.filter((a)=>a.tone==='mixed').length
  const tight = [...aspects].sort((a,b)=>a.orb-b.orb).slice(0,6)
  const communication = aspects.filter((a)=>a.a==='Mercury'||a.b==='Mercury')
  const chemistry = aspects.filter((a)=>['Venus','Mars','Pluto'].includes(a.a)||['Venus','Mars','Pluto'].includes(a.b))
  const structure = aspects.filter((a)=>['Saturn','Jupiter','True Node'].includes(a.a)||['Saturn','Jupiter','True Node'].includes(a.b))
  const headline = challenging > supportive + 3
    ? '강한 자극과 마찰이 함께 있는 관계 구조'
    : supportive > challenging + 3
      ? '조화 접점이 상대적으로 많은 관계 구조'
      : '끌림·조화·긴장이 섞여 있는 복합 관계 구조'
  const overview = `출생 시너스트리에서 ${aspects.length}개 접점이 잡혔고, 조화 ${supportive}개 · 긴장 ${challenging}개 · 혼합 ${mixed}개야. 이 숫자는 궁합 점수나 재회 확률이 아니라 두 차트가 어디에서 반복적으로 맞물리는지 보여주는 구조값이야. 특히 오브가 좁은 접점일수록 관계에서 체감되는 주제가 강해질 수 있어.`
  const communicationText = communication.length
    ? `소통 관련 접점이 ${communication.length}개 보여. ${communication.slice(0,2).map(relationshipAspectMeaning).join(' ')}`
    : '수성 관련 주요 접점이 상위권에 많지 않아. 대화 패턴은 다른 행성 접점과 실제 경험을 같이 봐야 해.'
  const chemistryText = chemistry.length
    ? `끌림·추진력·강도와 관련된 접점이 ${chemistry.length}개야. ${chemistry.slice(0,2).map(relationshipAspectMeaning).join(' ')}`
    : '금성·화성·명왕성 관련 강한 접점이 상위권에 적어, 끌림 하나만으로 관계 전체를 설명하기는 어려워.'
  const stabilityText = structure.length
    ? `지속성·성장·반복 패턴과 관련된 접점이 ${structure.length}개야. ${structure.slice(0,2).map(relationshipAspectMeaning).join(' ')}`
    : '토성·목성·노드 관련 상위 접점이 적어, 장기 지속성은 현재 계산만으로 강하게 단정하기 어려워.'
  const timing = partnerExact
    ? '두 사람의 정확한 출생시간·좌표가 있어 진행 시너스트리·데이비슨·마크스 타이밍까지 계산할 수 있어. 아래 기간별 접점은 사건 확률이 아니라 독립 타이밍 레이어의 반복 접점이야.'
    : '상대 출생시간/장소가 없어서 진행 시너스트리·진행 컴포지트·데이비슨·마크스 타이밍은 계산에서 제외됐어. 따라서 아래에서 0으로 보이던 값은 “활성도 0”이 아니라 “정밀 타이밍 미계산”이 맞아.'
  return { headline, overview, communication: communicationText, chemistry: chemistryText, stability: stabilityText, timing, supportive, challenging, mixed, tight }
}
function relationshipLimitKo(text: string) {
  if (text.includes('Partner exact birth time/place missing')) return '상대의 정확한 출생시간·장소가 없어 데이비슨·마크스·마크스 3차 진행은 추정하지 않고 제외했어.'
  if (text.includes('Exact partner birth time')) return '상대의 정확한 출생시간이 없어 해당 정밀 진행 레이어는 계산하지 않았어.'
  return text
}
'''
          assert helper_anchor in s, 'helper anchor missing'
          s=s.replace(helper_anchor,helpers,1)

          state_anchor="  const [relationshipError, setRelationshipError] = useState('')\n"
          state_block="""  const [relationshipError, setRelationshipError] = useState('')\n  const [relationshipAi, setRelationshipAi] = useState<RelationshipAiResponse | null>(null)\n  const [relationshipAiLoading, setRelationshipAiLoading] = useState(false)\n  const [relationshipAiError, setRelationshipAiError] = useState('')\n"""
          assert state_anchor in s, 'state anchor missing'
          s=s.replace(state_anchor,state_block,1)

          run_reset="    setRelationshipError(''); setRelationshipResult(null); setRelationshipRequestSnapshot(null)\n"
          assert run_reset in s, 'run reset anchor missing'
          s=s.replace(run_reset,"    setRelationshipError(''); setRelationshipResult(null); setRelationshipRequestSnapshot(null); setRelationshipAi(null); setRelationshipAiError('')\n",1)

          func_anchor='\n\n  async function handleCopy(label: string, text: string) {'
          ai_func=r'''

  const runRelationshipAi = async () => {
    if (!relationshipResult) return
    setRelationshipAiLoading(true); setRelationshipAiError('')
    try {
      await ensureSupabaseSession()
      const { data, error } = await supabase.functions.invoke('relationship-interpret', {
        body: { calculation: relationshipResult, model: aiModel },
      })
      if (error) throw error
      const payload = data as RelationshipAiResponse
      if (!payload?.ok || !payload.data) throw new Error(payload?.error || '관계 AI 해설 응답이 비어 있어.')
      setRelationshipAi(payload)
    } catch (error) {
      setRelationshipAiError(error instanceof Error ? error.message : '관계 AI 해설을 불러오지 못했어.')
    } finally { setRelationshipAiLoading(false) }
  }
'''
          assert func_anchor in s, 'handleCopy anchor missing'
          s=s.replace(func_anchor,ai_func+func_anchor,1)

          computed_anchor='  const natalAspects = relationshipResult?.result?.natal_synastry?.aspects ?? []\n'
          computed='''  const natalAspects = relationshipResult?.result?.natal_synastry?.aspects ?? []\n  const partnerTimeExact = relationshipResult?.result?.natal_synastry?.partner_time_exact ?? false\n  const relationshipSnapshot = buildRelationshipInstantSummary(natalAspects, partnerTimeExact)\n'''
          assert computed_anchor in s, 'computed anchor missing'
          s=s.replace(computed_anchor,computed,1)

          insert_anchor='              {archiveStatus && <div className="status-banner subtle"><Cloud size={16}/><span>{archiveStatus}</span></div>}\n              <section className="result-card">\n'
          interpretation=r'''              {archiveStatus && <div className="status-banner subtle"><Cloud size={16}/><span>{archiveStatus}</span></div>}
              <section className="relationship-reading-card">
                <div className="relationship-reading-head"><span className="eyebrow">RELATIONSHIP READING</span><h3>{relationshipSnapshot.headline}</h3></div>
                <p className="relationship-overview">{relationshipSnapshot.overview}</p>
                <div className="relationship-reading-grid">
                  <article><strong>대화 · 소통</strong><p>{relationshipSnapshot.communication}</p></article>
                  <article><strong>끌림 · 자극</strong><p>{relationshipSnapshot.chemistry}</p></article>
                  <article><strong>지속성 · 성장</strong><p>{relationshipSnapshot.stability}</p></article>
                  <article className="timing"><strong>타이밍 정밀도</strong><p>{relationshipSnapshot.timing}</p></article>
                </div>
                <div className="relationship-key-aspects"><strong>가장 강한 접점 해석</strong>{relationshipSnapshot.tight.slice(0,4).map((aspect,index)=><div key={`${aspect.a}-${aspect.aspect}-${aspect.b}-${index}`}><b>{aspectText(aspect)} · 오브 {aspect.orb.toFixed(2)}°</b><p>{relationshipAspectMeaning(aspect)}</p></div>)}</div>
              </section>
              <div className="relationship-ai-toolbar">
                <button type="button" onClick={runRelationshipAi} disabled={relationshipAiLoading}><Sparkles size={17}/><span>{relationshipAiLoading?'Gemini 관계 해석 중…':'Gemini 관계 정밀해석'}</span></button>
                <small>원할 때만 AI 호출 · 완료 후 토큰/예상비용 표시</small>
              </div>
              {relationshipAiError && <div className="status-banner error"><AlertTriangle size={16}/><span>{relationshipAiError}</span></div>}
              {relationshipAi?.ok && relationshipAi.data && <section className="relationship-ai-card">
                <span className="eyebrow">GEMINI RELATIONSHIP INTERPRETATION</span><h3>{relationshipAi.data.headline}</h3>
                {relationshipAi.usage?.total_tokens ? <div className="relationship-ai-usage"><span>입력 {(relationshipAi.usage.prompt_tokens??0).toLocaleString()} · 출력 {(relationshipAi.usage.candidate_tokens??0).toLocaleString()} · 사고 {(relationshipAi.usage.thought_tokens??0).toLocaleString()} tokens</span><b>예상비용 ${Number(relationshipAi.usage.estimated_usd??0).toFixed(4)} ≈ {Math.round(relationshipAi.usage.estimated_krw??0).toLocaleString()}원</b></div> : null}
                <p className="relationship-ai-overview">{relationshipAi.data.overview}</p>
                <div className="relationship-ai-grid"><article><strong>끌림 · 자극</strong><p>{relationshipAi.data.chemistry}</p></article><article><strong>대화 · 소통</strong><p>{relationshipAi.data.communication}</p></article><article><strong>지속성</strong><p>{relationshipAi.data.stability}</p></article><article><strong>긴장 포인트</strong><p>{relationshipAi.data.tensions}</p></article><article><strong>타이밍</strong><p>{relationshipAi.data.timing}</p></article><article><strong>재회 맥락</strong><p>{relationshipAi.data.reunion_context}</p></article></div>
                {!!relationshipAi.data.practical_advice?.length && <div className="relationship-ai-advice"><strong>현실 조언</strong>{relationshipAi.data.practical_advice.map((x,i)=><p key={`${i}-${x}`}>{i+1}. {x}</p>)}</div>}
                {!!relationshipAi.data.top_aspects?.length && <details open><summary>핵심 애스펙트 상세</summary>{relationshipAi.data.top_aspects.map((x,i)=><div className="relationship-ai-aspect" key={`${i}-${x.label}`}><b>{x.label}</b><p>{x.meaning}</p></div>)}</details>}
                {relationshipAi.data.limits && <p className="relationship-ai-limits">{relationshipAi.data.limits}</p>}
              </section>}
              {!partnerTimeExact && <section className="result-card timing-unavailable"><div className="result-card-title"><span>TIMING</span><strong>정밀 타이밍 계산 제외</strong></div><p>상대 출생시간·장소가 없어서 진행 시너스트리, 진행 컴포지트, 데이비슨, 마크스 계열은 추정하지 않았어. 이전 화면의 0/0/0은 “아무 접점 없음”이 아니라 계산 불가를 잘못 표시한 거였어.</p></section>}
              <section className="result-card">
'''
          assert insert_anchor in s, 'relationship render insert anchor missing'
          s=s.replace(insert_anchor,interpretation,1)

          s=s.replace('<div className="result-card-title"><span>STATIC</span><strong>기본 관계 구조</strong></div>','<div className="result-card-title"><span>RAW STRUCTURE</span><strong>계산 근거 · 시너스트리</strong></div>',1)
          old_metrics="<div className=\"metric-grid\"><div className=\"metric\"><strong>{natalAspects.length}</strong><span>시너스트리 접점</span></div><div className=\"metric\"><strong>{relationshipResult.result.davison?.available?'ON':'OFF'}</strong><span>다빈슨</span></div><div className=\"metric\"><strong>{relationshipResult.result.marks?.available?'ON':'OFF'}</strong><span>마크스</span></div></div>"
