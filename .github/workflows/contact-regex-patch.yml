name: Contact regex patch

on:
  push:
    branches: [fix/contact-relative-signal-copy]
    paths:
      - 'scripts/patch_contact_regex_once.py'
      - '.github/workflows/contact-regex-patch.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python scripts/patch_contact_regex_once.py
      - run: |
          grep -q "먼저 말을 꺼낼" web/src/lib/systemReading.test.mjs
          git diff --check
      - run: |
          if git diff --quiet -- web/src/lib/systemReading.test.mjs; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/src/lib/systemReading.test.mjs
          git commit -m 'test: match updated contact wording'
          git push origin HEAD:fix/contact-relative-signal-copy
