name: Apply Interpretation Depth V10

on:
  push:
    branches:
      - work/integrated-interpretation-v2
    paths:
      - .github/workflows/apply-interpretation-depth-v10.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/integrated-interpretation-v2
          fetch-depth: 0
      - name: Strengthen cross-system and action contracts
        run: |
          python - <<'PY'
          from pathlib import Path

          def rep(path, old, new):
              p=Path(path); s=p.read_text(encoding='utf-8')
              if old not in s: raise SystemExit(f'anchor missing: {path}: {old[:100]}')
              p.write_text(s.replace(old,new,1),encoding='utf-8')

          p='supabase/functions/fortune-interpret-v6-preview/integratedInterpretationV2.ts'
          rep(p,'export const VERSION = "supabase-ai-v9-full-daily-trajectory-five-stage-guard";','export const VERSION = "supabase-ai-v10-cross-system-action-contract";')
          rep(p,'export const QUALITY_VERSION = "fortune-interpretation-quality-v1";','export const QUALITY_VERSION = "fortune-interpretation-quality-v2-cross-system";')
          rep(p,
              '- annual이면 key_windows 5~8개, year_phases 4개, decisions 3~5개를 만든다. 다른 기간이면 중요도에 맞춰 더 적게 만든다.\n- topic_analysis는 분야마다 verdict만 쓰지 말고 reason에 기간 평균과 월별 변화 또는 날짜 피크를 연결한다.',
              '- annual이면 key_windows 5~8개, year_phases 4개, cross_checks 3~6개, decisions 3~5개를 만든다. 다른 기간이면 중요도에 맞춰 더 적게 만든다.\n- cross_checks는 체계를 억지로 합산하지 않고 같은 시기의 Western·사주·Thai 근거를 나란히 대조한다. mode=복수체계/상반맥락이면 Western 근거와 최소 1개의 비Western 근거를 함께 붙이고, mode=Western단독이면 다른 체계가 확인하지 않았다는 사실을 명확히 쓴다. Thai는 방향성 투표가 아니라 허용된 맥락만 기술한다.\n- decisions는 행동만 쓰지 말고 timing, reason, watch(실행 전에 확인할 현실 신호), avoid(피할 행동)를 모두 구체적으로 쓴다.\n- topic_analysis는 분야마다 verdict만 쓰지 말고 reason에 기간 평균과 월별 변화 또는 날짜 피크를 연결한다.')
          rep(p,
              'const decisionSchema={type:"OBJECT",properties:{action:S,timing:S,reason:S,evidence_refs:refs},required:["action","timing","reason","evidence_refs"]};\nexport const SCHEMA:any={type:"OBJECT",properties:{headline:S,overall:{type:"OBJECT",properties:{summary:S,dominant_pattern:S,best_phase:S,caution_phase:S,evidence_refs:refs},required:["summary","dominant_pattern","best_phase","caution_phase","evidence_refs"]},key_windows:{type:"ARRAY",items:windowSchema},year_phases:{type:"ARRAY",items:phaseSchema},decisions:{type:"ARRAY",items:decisionSchema},clusters:',
              'const crossCheckSchema={type:"OBJECT",properties:{label:S,start:S,end:S,mode:{type:"STRING",enum:["복수체계","상반맥락","Western단독"]},western:S,saju:S,thai:S,synthesis:S,evidence_refs:refs},required:["label","start","end","mode","western","saju","thai","synthesis","evidence_refs"]};\nconst decisionSchema={type:"OBJECT",properties:{action:S,timing:S,reason:S,watch:S,avoid:S,evidence_refs:refs},required:["action","timing","reason","watch","avoid","evidence_refs"]};\nexport const SCHEMA:any={type:"OBJECT",properties:{headline:S,overall:{type:"OBJECT",properties:{summary:S,dominant_pattern:S,best_phase:S,caution_phase:S,evidence_refs:refs},required:["summary","dominant_pattern","best_phase","caution_phase","evidence_refs"]},key_windows:{type:"ARRAY",items:windowSchema},year_phases:{type:"ARRAY",items:phaseSchema},cross_checks:{type:"ARRAY",items:crossCheckSchema},decisions:{type:"ARRAY",items:decisionSchema},clusters:')
          rep(p,
              'required:["headline","overall","key_windows","year_phases","decisions","clusters","contact_flow","investment_reading","systems","priorities","topic_analysis","limits"]};',
              'required:["headline","overall","key_windows","year_phases","cross_checks","decisions","clusters","contact_flow","investment_reading","systems","priorities","topic_analysis","limits"]};')
          rep(p,
              '  const decisions=Array.isArray(o.decisions)?o.decisions.slice(0,6).map((x:any)=>({action:txt(x?.action,900),timing:txt(x?.timing,500),reason:txt(x?.reason,1200),evidence_refs:cleanRefs(x?.evidence_refs)})):[];\n  return deep({headline:txt(o.headline,300),overall:{summary:txt(o?.overall?.summary,3600),dominant_pattern:txt(o?.overall?.dominant_pattern,2200),best_phase:txt(o?.overall?.best_phase,1500),caution_phase:txt(o?.overall?.caution_phase,1500),evidence_refs:cleanRefs(o?.overall?.evidence_refs)},key_windows:keyWindows,year_phases:yearPhases,decisions,clusters:',
              '  const crossChecks=Array.isArray(o.cross_checks)?o.cross_checks.slice(0,8).map((x:any)=>({label:txt(x?.label,180),start:txt(x?.start,40),end:txt(x?.end,40),mode:["복수체계","상반맥락","Western단독"].includes(txt(x?.mode,30))?txt(x?.mode,30):"Western단독",western:txt(x?.western,1400),saju:txt(x?.saju,1400),thai:txt(x?.thai,1400),synthesis:txt(x?.synthesis,1800),evidence_refs:cleanRefs(x?.evidence_refs)})):[];\n  const decisions=Array.isArray(o.decisions)?o.decisions.slice(0,6).map((x:any)=>({action:txt(x?.action,900),timing:txt(x?.timing,500),reason:txt(x?.reason,1200),watch:txt(x?.watch,800),avoid:txt(x?.avoid,800),evidence_refs:cleanRefs(x?.evidence_refs)})):[];\n  return deep({headline:txt(o.headline,300),overall:{summary:txt(o?.overall?.summary,3600),dominant_pattern:txt(o?.overall?.dominant_pattern,2200),best_phase:txt(o?.overall?.best_phase,1500),caution_phase:txt(o?.overall?.caution_phase,1500),evidence_refs:cleanRefs(o?.overall?.evidence_refs)},key_windows:keyWindows,year_phases:yearPhases,cross_checks:crossChecks,decisions,clusters:')

          p='supabase/functions/fortune-interpret-v6-preview/qualityV2.ts'
          rep(p,'export const QUALITY_VERSION = "fortune-interpretation-quality-v1.2-daily-evidence";','export const QUALITY_VERSION = "fortune-interpretation-quality-v2-cross-system-action";')
          rep(p,
              '  for(const p of data?.year_phases??[]){add(p?.theme);add(p?.change);}\n  for(const d of data?.decisions??[]){add(d?.action);add(d?.timing);add(d?.reason);}',
              '  for(const p of data?.year_phases??[]){add(p?.theme);add(p?.change);}\n  for(const x of data?.cross_checks??[]){add(x?.label);add(x?.western);add(x?.saju);add(x?.thai);add(x?.synthesis);}\n  for(const d of data?.decisions??[]){add(d?.action);add(d?.timing);add(d?.reason);add(d?.watch);add(d?.avoid);}')
          rep(p,
              '  if(!Array.isArray(data?.decisions))s1.push("decisions 누락");',
              '  if(!Array.isArray(data?.cross_checks))s1.push("cross_checks 누락");\n  if(!Array.isArray(data?.decisions))s1.push("decisions 누락");')
          rep(p,
              '  const windowRefs=new Set((data?.key_windows??[]).flatMap((x:any)=>x?.evidence_refs??[]));',
              '  for(const x of data?.cross_checks??[]){\n    const rows=(x?.evidence_refs??[]).map((r:string)=>map.get(r)).filter(Boolean) as any[];\n    const systems=new Set(rows.map((r:any)=>String(r?.system??"")).filter(Boolean));\n    if(!rows.length)s4.push(`근거 없는 교차검증: ${x?.label||""}`);\n    if(x?.mode==="Western단독"&&!systems.has("western"))s4.push(`Western단독인데 Western 근거 없음: ${x?.label||""}`);\n    if(x?.mode!=="Western단독"&&(!systems.has("western")||systems.size<2))s4.push(`복수체계/상반맥락인데 독립 체계 2개 미만: ${x?.label||""}`);\n  }\n  const windowRefs=new Set((data?.key_windows??[]).flatMap((x:any)=>x?.evidence_refs??[]));')
          rep(p,
              '  if(kind==="annual"&&(data?.year_phases?.length??0)<4)s5.push("연간 4개 phase 미완성");',
              '  if(kind==="annual"&&(data?.year_phases?.length??0)<4)s5.push("연간 4개 phase 미완성");\n  if(kind==="annual"&&(data?.cross_checks?.length??0)<3)s5.push("연간 교차검증 3개 미만");\n  if(kind==="annual"&&Array.from(map.values() as any).some((r:any)=>r?.system&&r.system!=="western")){\n    const multi=(data?.cross_checks??[]).filter((x:any)=>{const systems=new Set((x?.evidence_refs??[]).map((r:string)=>map.get(r)?.system).filter(Boolean));return systems.has("western")&&systems.size>=2;}).length;\n    if(multi<2)s5.push(`복수체계 교차검증 부족: ${multi}/2`);\n  }')
          rep(p,
              '  for(const w of data?.key_windows??[]){\n    if(String(w?.summary??"").length<45)s5.push(`핵심 시기 설명이 너무 짧음: ${w?.label}`);',
              '  for(const x of data?.cross_checks??[]){\n    if(String(x?.synthesis??"").length<45)s5.push(`교차검증 종합이 너무 짧음: ${x?.label}`);\n    if(String(x?.western??"").length<25)s5.push(`교차검증 Western 설명이 너무 짧음: ${x?.label}`);\n  }\n  for(const d of data?.decisions??[]){\n    if(String(d?.watch??"").length<14)s5.push(`결정 가이드 확인조건이 너무 짧음: ${txt(d?.action,45)}`);\n    if(String(d?.avoid??"").length<14)s5.push(`결정 가이드 회피조건이 너무 짧음: ${txt(d?.action,45)}`);\n  }\n  for(const w of data?.key_windows??[]){\n    if(String(w?.summary??"").length<45)s5.push(`핵심 시기 설명이 너무 짧음: ${w?.label}`);')

          p='supabase/functions/fortune-interpret-v6-preview/integratedInterpretationV2.test.mjs'
          rep(p,
              '    ],\n    decisions:[\n      {action:"7월 실행창에는 준비된 업무 결정과 중요한 연락을 실제 행동으로 옮겨.",timing:"2026-07-21~2026-07-24",reason:"직장 상위 날짜와 발신적합 상위 날짜가 같은 구간에 있어.",evidence_refs:[julyWork,julyOutgoing]},\n      {action:"5월 점검창에는 관계 결론보다 메시지와 사실관계를 다시 확인해.",timing:"2026-05-14~2026-05-15",reason:"연애와 발신 관련 하위 날짜가 연속으로 잡혀 있어.",evidence_refs:[mayLove,mayOutgoing]},\n      {action:"10월 재접점 신호는 실제 상대 행동이 있을 때만 해석 범위를 넓혀.",timing:"2026-10-21",reason:"과거인연접점의 상위 날짜와 월간 근거가 함께 있어.",evidence_refs:[octReconnect,octMonth]},\n    ],',
              '    ],\n    cross_checks:[\n      {label:"7월 실행창 교차검증",start:"2026-07-21",end:"2026-07-24",mode:"복수체계",western:"Western에서는 직장·발신 상위 날짜와 실제 일별 트랜짓 근거가 같은 주간에 모여 있어.",saju:"사주 월운은 같은 기간을 포함하는 절입 구간 맥락을 제공하지만 Western 점수와 합산하지 않아.",thai:"Thai는 이 교차검증에서 방향성 투표로 쓰지 않고 해당 기간층이 있다는 사실만 별도로 유지해.",synthesis:"Western의 실행 피크를 중심 근거로 삼고 사주는 같은 시기 배경을 독립적으로 겹쳐 보되, 두 체계가 같은 사건을 예언한다고 해석하지 않는 구간이야.",evidence_refs:[julyWork,julyDaily,ref("S:month:")]},\n      {label:"10월 재접점 교차검증",start:"2026-10-21",end:"2026-10-21",mode:"복수체계",western:"Western에서는 과거인연접점 상위 날짜와 실제 일별 근거가 동시에 잡혀 있어.",saju:"해당 날짜를 직접 지지하는 별도 사주 월운 근거가 없으므로 사주로 재회 방향을 보강하지 않아.",thai:"Taksajorn 기간층은 이 날짜를 포함하지만 사건 방향이나 재회 확률을 뜻하지 않는 독립 맥락이야.",synthesis:"재접점 해석의 방향은 Western 근거에 두고 Thai는 같은 기간에 존재하는 비예측 배경층으로만 나란히 표시해야 해.",evidence_refs:[octReconnect,octDaily,ref("T:taksajorn:")]},\n      {label:"5월 점검창 단독신호",start:"2026-05-14",end:"2026-05-15",mode:"Western단독",western:"Western에서 연애·발신 하위 날짜와 실제 일별 근거가 함께 잡혀 있어 점검 신호가 명확해.",saju:"같은 결론을 독립적으로 확인하는 직접 근거는 이 교차항목에 연결되지 않았어.",thai:"같은 결론을 독립적으로 확인하는 예측 근거로 사용하지 않아.",synthesis:"이 구간은 여러 체계가 같은 방향을 말한다고 포장하지 말고 Western 계산에서만 강하게 잡힌 주의 신호로 제한해서 읽어야 해.",evidence_refs:[mayLove,mayOutgoing,mayDaily]},\n    ],\n    decisions:[\n      {action:"7월 실행창에는 준비된 업무 결정과 중요한 연락을 실제 행동으로 옮겨.",timing:"2026-07-21~2026-07-24",reason:"직장 상위 날짜와 발신적합 상위 날짜가 같은 구간에 있어.",watch:"지원서·협상안·메시지 초안이 이미 준비됐는지와 상대의 실제 응답 가능 시간을 먼저 확인해.",avoid:"준비 없이 즉흥적으로 범위를 넓히거나 높은 점수를 성공 보장으로 해석하지 마.",evidence_refs:[julyWork,julyOutgoing]},\n      {action:"5월 점검창에는 관계 결론보다 메시지와 사실관계를 다시 확인해.",timing:"2026-05-14~2026-05-15",reason:"연애와 발신 관련 하위 날짜가 연속으로 잡혀 있어.",watch:"상대가 실제로 한 말과 행동, 일정 변경 같은 확인 가능한 사실을 감정 해석과 분리해 봐.",avoid:"답장 속도나 한 번의 반응만으로 관계 전체를 확정하거나 연속 메시지를 보내지 마.",evidence_refs:[mayLove,mayOutgoing]},\n      {action:"10월 재접점 신호는 실제 상대 행동이 있을 때만 해석 범위를 넓혀.",timing:"2026-10-21",reason:"과거인연접점의 상위 날짜와 월간 근거가 함께 있어.",watch:"실제 연락·만남 제안·우연한 재접촉처럼 관찰 가능한 사건이 생기는지 먼저 확인해.",avoid:"접점 지수만 보고 상대 속마음이나 재회 의사를 미리 확정하지 마.",evidence_refs:[octReconnect,octMonth]},\n    ],')
          rep(p,
              'test("high confidence without enough evidence fails consistency",()=>{',
              'test("cross-system mode without an independent second system fails consistency",()=>{\n  const packet=compactCalculation(calculation());\n  const raw=output(packet);\n  raw.cross_checks[0].evidence_refs=raw.cross_checks[0].evidence_refs.filter((ref)=>ref.startsWith("W:"));\n  const report=inspectInterpretationQuality(validateOutput(raw),packet);\n  assert.equal(report.stages[3].passed,false);\n  assert.match(report.stages[3].issues.join(" "),/독립 체계 2개 미만/);\n});\n\ntest("high confidence without enough evidence fails consistency",()=>{')

          PY
      - name: Run interpretation contract tests
        run: |
          node --experimental-strip-types --test supabase/functions/fortune-interpret-v6-preview/integratedInterpretationV2.test.mjs
          node --experimental-strip-types --test supabase/functions/fortune-interpret-v6-preview/thaiContract.test.mjs
      - name: Commit depth contract
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/functions/fortune-interpret-v6-preview/integratedInterpretationV2.ts supabase/functions/fortune-interpret-v6-preview/qualityV2.ts supabase/functions/fortune-interpret-v6-preview/integratedInterpretationV2.test.mjs
          git diff --cached --quiet && exit 0
          git commit -m 'feat(ai): require cross-system checks and action conditions'
          git push origin HEAD:work/integrated-interpretation-v2
