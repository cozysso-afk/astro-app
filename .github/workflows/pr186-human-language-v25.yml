name: PR186 human-language v2.5 patch

on:
  push:
    branches:
      - fix/reunion-hierarchy-v2
    paths:
      - '.github/workflows/pr186-human-language-v25.yml'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/reunion-hierarchy-v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Apply patch
        run: |
          python scripts/pr186_human_language_v25.py
          python scripts/pr186_human_language_v25_fix.py
      - name: Install web dependencies
        working-directory: web
        run: npm ci
      - name: Targeted tests
        run: |
          node --test web/src/lib/humanLanguageV25.test.mjs
          node --experimental-strip-types --test web/src/lib/basicFortuneReading.test.mjs
          node --experimental-strip-types --test web/src/lib/readingExperience.test.mjs
          node --experimental-strip-types --test web/src/lib/narrativeDepth.test.mjs
          node --test web/src/lib/relationshipReunionV2.contract.test.mjs
          node --test web/src/lib/relationshipEvidencePipeline.test.mjs
          node --experimental-strip-types --test supabase/functions/relationship-interpret-v9-preview/reunionGroundingV2.test.mjs
          node --experimental-strip-types --check supabase/functions/relationship-interpret-v9-preview/index.ts
      - name: Web build
        working-directory: web
        run: npm run build
      - name: Commit verified patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/src/lib/fortuneUserSummary.ts web/src/lib/basicFortuneReading.ts web/src/RelationshipInterpretationPanel.tsx web/src/lib/readingCache.ts web/src/lib/humanLanguageV25.test.mjs web/src/lib/*.mjs supabase/functions/relationship-interpret-v9-preview/index.ts supabase/functions/relationship-interpret-v9-preview/*.mjs
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git commit -m 'feat: deepen daily and reunion human-language readings'
          git push origin HEAD:fix/reunion-hierarchy-v2
