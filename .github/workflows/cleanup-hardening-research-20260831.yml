name: Cleanup Hardening Research 2026-08-31

on:
  push:
    paths:
      - '.github/workflows/cleanup-hardening-research-20260831.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/full-year-thai-hardening-20260831
      - name: Remove one-shot research and patch artifacts
        run: |
          git rm --ignore-unmatch \
            .github/workflows/research-saju-jieqi-boundary-20260831.yml \
            .github/workflows/research-suriyayat-crosscheck-20260831.yml \
            .github/workflows/switch-fortune-ai-v6-frontend-20260831.yml \
            .github/workflows/verify-fortune-ai-v6-preview-20260831.yml \
            .github/workflows/verify-memory-job-hardening-20260831.yml \
            .github/workflows/verify-relationship-scope-thai-copy-20260831.yml \
            .github/workflows/verify-saju-jie-exact-20260831.yml \
            .github/workflows/verify-suriyayat-integration-20260831.yml \
            .github/workflows/verify-suriyayat-python-port-20260831.yml \
            .github/workflows/verify-urgent-hardening-20260831.yml \
            scripts/patch_fortune_ai_v6_frontend.py \
            scripts/patch_memory_job_hardening_v3.py \
            scripts/patch_relationship_scope_thai_copy_v4.py \
            scripts/patch_saju_jie_exact_v1.py \
            scripts/patch_suriyayat_integration_v1.py \
            scripts/patch_urgent_hardening_v2.py \
            .github/workflows/cleanup-hardening-research-20260831.yml
      - name: Verify product candidates remain
        run: |
          test -f thai_astrology_v2.py
          test -f thai_suriyayat_v1.py
          test -f integrated_fortune_v1.py
          test -f supabase/functions/fortune-interpret-v6-preview/core.ts
          test -f supabase/functions/fortune-interpret-v6-preview/index.ts
          grep -Fq 'fortune-interpret-v6-preview' web/src/AppNext.tsx
          ! git diff --cached --name-only | grep -Eq '^(thai_astrology_v2.py|thai_suriyayat_v1.py|integrated_fortune_v1.py|api/main.py|relationship_western_v1.py|web/src/AppNext.tsx)$'
          echo PRODUCT_TREE_PRESERVED
      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: remove one-shot hardening research artifacts'
          git push origin HEAD:work/full-year-thai-hardening-20260831
