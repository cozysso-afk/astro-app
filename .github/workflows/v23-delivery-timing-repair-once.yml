name: V23 delivery timing repair once

on:
  push:
    branches:
      - fix/v23-delivery-pipeline
    paths:
      - scripts/apply_v23_delivery_timing_repair_once.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v23-delivery-pipeline
          fetch-depth: 0
      - name: Apply evidence timing repair patch
        run: python scripts/apply_v23_delivery_timing_repair_once.py
      - name: Run focused timing repair test
        run: node --test supabase/functions/fortune-interpret-v6-preview/qualityV23TimingRepair.test.mjs
      - name: Commit generated patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/fortune-interpret-v6-preview/qualityV2.ts supabase/functions/fortune-interpret-v6-preview/qualityV23TimingRepair.test.mjs
          if git diff --cached --quiet; then
            echo "No patch changes"
            exit 0
          fi
          git commit -m "Repair unsupported V23 timing claims locally"
          git push origin HEAD:fix/v23-delivery-pipeline
