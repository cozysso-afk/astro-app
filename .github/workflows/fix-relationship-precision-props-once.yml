name: Fix relationship precision props once

on:
  push:
    branches:
      - refactor/relationship-precision-details-20260901

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/relationship-precision-details-20260901
          fetch-depth: 0
      - name: Preserve evidence prop and build
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('web/src/AppNext.tsx')
          w=Path('.github/workflows/fix-relationship-precision-props-once.yml')
          s=p.read_text()
          old="<RelationshipPrecisionDetails result={relationshipResult} partnerTimeExact={partnerTimeExact} formatLimit={relationshipLimitKo} />"
          new="<RelationshipPrecisionDetails result={relationshipResult} partnerTimeExact={partnerTimeExact} aspects={natalAspects} formatLimit={relationshipLimitKo} />"
          if old not in s:
              raise SystemExit('precision component call missing')
          p.write_text(s.replace(old,new,1))
          w.unlink()
          PY
          cd web
          npm ci
          npm run build
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/src/AppNext.tsx web/src/RelationshipPrecisionDetails.tsx .github/workflows/fix-relationship-precision-props-once.yml
          git diff --cached --check
          git commit -m "fix(web): preserve relationship evidence in precision panel"
          git push origin HEAD:refactor/relationship-precision-details-20260901
