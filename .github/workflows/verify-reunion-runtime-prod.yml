name: Verify reunion runtime production

on:
  push:
    branches:
      - fix/reunion-runtime-contract-v1

permissions:
  contents: read

jobs:
  verify:
    if: ${{ !contains(github.event.head_commit.message, '[prod-verify-cleanup]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify Render meta contract and SHA
        shell: bash
        run: |
          set -euo pipefail
          META=$(curl -fsS --retry 5 --retry-delay 3 --max-time 30 https://astro-app-api-f7fn.onrender.com/v1/meta)
          echo "$META"
          META="$META" python - <<'PY'
          import json, os
          data=json.loads(os.environ['META'])
          assert data.get('reunion_evidence_contract') == 'reunion-evidence-contract-v1', data
          assert data.get('runtime_git_sha') == '7f3a79dd0dd5054790638d7440fde036ee4a8fd2', data
          print('RENDER_CONTRACT_OK')
          PY
      - name: Verify Vercel production responds
        shell: bash
        run: |
          set -euo pipefail
          STATUS=$(curl -L -sS -o /dev/null -w '%{http_code}' --max-time 30 https://astro-app-9makxx449-cozysso.vercel.app)
          test "$STATUS" = "200"
          echo "VERCEL_HTTP_OK=$STATUS"
