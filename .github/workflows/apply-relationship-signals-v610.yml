name: Apply relationship signals v6.10

on:
  push:
    branches: [main]
    paths:
      - "scripts/upgrade_relationship_signals_v610.py"
      - ".github/workflows/apply-relationship-signals-v610.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: astro-app-write-main
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync main before patch
        run: git pull --rebase origin main

      - name: Apply relationship direction + calibration upgrade
        run: python scripts/upgrade_relationship_signals_v610.py

      - name: Python syntax check
        run: python -m py_compile app.py

      - name: Diff sanity check
        run: git diff --check

      - name: Feature marker check
        shell: bash
        run: |
          grep -q 'RELATIONSHIP_SIGNAL_VERSION = "v1.0"' app.py
          grep -q 'def relationship_direction_scores' app.py
          grep -q '연락·교류 활성도' app.py
          grep -q '수신 보조신호' app.py
          grep -q '발신 적합도' app.py
          grep -q '과거인연 접점' app.py
          grep -q 'def _write_relationship_outcome' app.py
          grep -q '개인보정 기록' app.py
          grep -q 'AI_INTERPRETER_VERSION = "v6.10.0"' app.py
          grep -q '"outcome":"outcome:"' app.py

      - name: Commit and push patched app safely
        shell: bash
        run: |
          if git diff --quiet -- app.py; then
            echo "No app.py changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git commit -m "feat: split contact direction signals and add personal calibration"
          git pull --rebase origin main
          git push origin HEAD:main
