name: Apply fortune archive v6.3

on:
  push:
    branches: [main]
    paths:
      - "scripts/upgrade_fortune_archive_v63.py"
      - ".github/workflows/apply-fortune-archive-v63.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply archive upgrade
        run: python scripts/upgrade_fortune_archive_v63.py

      - name: Python syntax check
        run: python -m py_compile app.py

      - name: Diff sanity check
        run: git diff --check

      - name: Commit patched app
        shell: bash
        run: |
          if git diff --quiet -- app.py; then
            echo "No app.py changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git commit -m "feat: add long-term fortune archive and API cost meter"
          git push origin HEAD:main
