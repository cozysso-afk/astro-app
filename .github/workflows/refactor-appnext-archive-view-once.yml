name: Refactor AppNext archive view once

on:
  push:
    branches:
      - refactor/appnext-archive-view-20260901

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/appnext-archive-view-20260901
          fetch-depth: 0

      - name: Extract archive history view
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          app_path = Path('web/src/AppNext.tsx')
          workflow_path = Path('.github/workflows/refactor-appnext-archive-view-once.yml')
          original = app_path.read_text()
          text = original

          start_marker = "        {mainView === 'history' && <section className=\"form-card archive-view\">"
          end_marker = "        {mainView === 'settings' && <section className=\"form-card settings-view\">"
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          old_block = text[start:end]
          if old_block.count('archive-list') != 1 or old_block.count('legacyArchiveOpen') < 1:
              raise SystemExit('Unexpected archive view block')

          new_block = "        {mainView === 'history' && <ArchiveView items={archiveItems} loading={archiveLoading} status={archiveStatus} error={archiveError} legacyOpen={legacyArchiveOpen} onRefresh={refreshArchive} onCloseLegacy={setLegacyArchiveOpen.bind(null, null)} onGoHome={switchMainView.bind(null, 'home')} onRestore={restoreArchive} onCopy={copyArchiveResult} onRemove={removeArchive} />}\n\n"
          text = text[:start] + new_block + text[end:]

          import_anchor = "import { ReunionTimingPanel, ReunionTransitPanel } from './ReunionPanels'\n"
          if import_anchor not in text:
              raise SystemExit('ArchiveView import anchor missing')
          text = text.replace(import_anchor, import_anchor + "import { ArchiveView } from './ArchiveView'\n", 1)

          app_path.write_text(text)
          workflow_path.unlink()
          print(f'AppNext bytes: {len(original.encode())} -> {len(text.encode())}')
          PY

      - name: Build web
        working-directory: web
        run: npm ci && npm run build

      - name: Commit refactor
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/src/AppNext.tsx web/src/ArchiveView.tsx .github/workflows/refactor-appnext-archive-view-once.yml
          git diff --cached --check
          git commit -m "refactor(web): extract archive history view"
          git push origin HEAD:refactor/appnext-archive-view-20260901
