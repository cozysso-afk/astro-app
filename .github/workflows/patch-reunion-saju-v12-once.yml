name: Patch reunion Saju V12 once

on:
  push:
    branches:
      - fix/reunion-depth-saju-layout-v12
    paths:
      - .github/workflows/patch-reunion-saju-v12-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/reunion-depth-saju-layout-v12
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply product patch
        run: python scripts/patch_reunion_saju_v12.py
      - name: Install web dependencies
        working-directory: web
        run: npm ci
      - name: Focused regression tests
        run: |
          node --experimental-strip-types --test web/src/lib/reunionSajuExperienceV12.test.mjs
          node --experimental-strip-types --test supabase/functions/fortune-interpret-v23-preview/cacheIdentityV23.test.mjs
          node --experimental-strip-types --test web/src/lib/v23NarrativeTransport.test.mjs
          node --experimental-strip-types --test web/src/lib/readingExperience.test.mjs
          node --experimental-strip-types --check supabase/functions/relationship-interpret-v9-preview/index.ts
          npm --prefix web run build
      - name: Commit product patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/fortune-interpret-v23-preview/cacheIdentityV23.ts supabase/functions/fortune-interpret-v23-preview/cacheIdentityV23.test.mjs supabase/functions/relationship-interpret-v9-preview/index.ts web/src/lib/readingCache.ts web/src/lib/v23NarrativeTransport.test.mjs web/src/lib/reunionSajuExperienceV12.test.mjs web/src/SystemReadingViews.tsx web/src/RelationshipInterpretationPanel.tsx web/src/reading-experience.css
          git commit -m "Fix reunion depth Saju topics and mobile layout"
          git push origin HEAD:fix/reunion-depth-saju-layout-v12
