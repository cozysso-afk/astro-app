name: Reunion Analysis v2

on:
  push:
    paths:
      - 'scripts/patch_reunion_analysis_v2.py'
      - '.github/workflows/reunion-analysis-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply reunion patch
        run: python scripts/patch_reunion_analysis_v2.py
      - name: Build web
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Commit patched files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/src/AppNext.tsx web/src/visual-overhaul-v5.css
          git diff --cached --quiet || git commit -m 'feat: add reunion timing and directional contact analysis'
          git push
