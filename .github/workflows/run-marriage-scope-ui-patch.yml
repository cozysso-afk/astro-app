name: Run marriage scope UI patch

on:
  push:
    branches:
      - work/ai-cost-guard-v21
    paths:
      - '.github/workflows/run-marriage-scope-ui-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply UI patch
        run: python scripts/patch_marriage_scope_ui.py
      - name: Verify marriage scope contract
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('web/src/AppNext.tsx').read_text()
          panel=Path('web/src/PersonalMarriagePanel.tsx').read_text()
          assert "marriageScope === 'personal'" in s
          assert "const needsCounterpart" in s
          assert "/v1/marriage/personal" in s
          assert '상대 없음 · 개인 결혼운' in s
          assert '특정 상대 있음 · 결혼궁합' in s
          assert 'isPersonalMarriage?runPersonalMarriage:runRelationship' in s
          assert '{needsCounterpart&&<>' in s
          assert '결혼 성사 확률' in panel and '미래 배우자 신원' in panel
          assert 'PersonalMarriagePanel' in s
          PY
          git diff --check
          cd web
          npm ci
          npm run build
      - name: Commit verified UI
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/src/AppNext.tsx web/src/PersonalMarriagePanel.tsx
          git commit -m 'feat(marriage): split unmarried scope by counterpart'
          git push origin HEAD:work/ai-cost-guard-v21
