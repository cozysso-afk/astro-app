name: Verify Fortune AI v6 Preview 2026-08-31

on:
  workflow_dispatch:
  push:
    paths:
      - 'supabase/functions/fortune-interpret-v6-preview/**'
      - '.github/workflows/verify-fortune-ai-v6-preview-20260831.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/full-year-thai-hardening-20260831
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: api/requirements.txt
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Install calculation dependencies
        run: pip install -r api/requirements.txt
      - name: Check Edge Function TypeScript
        run: |
          deno check supabase/functions/fortune-interpret-v6-preview/core.ts
          deno check supabase/functions/fortune-interpret-v6-preview/index.ts
      - name: Generate real 365-day calculation without AI
        run: |
          python - <<'PY'
          import json
          from datetime import date,time
          from integrated_fortune_v1 import build_integrated_fortune
          out=build_integrated_fortune(
            birth_date=date(1990,1,1),birth_time=time(12,0),latitude=37.5665,longitude=126.9780,
            utc_offset_hours=9,gender='female',start_date=date(2026,1,1),end_date=date(2026,12,31))
          with open('/tmp/annual-calc.json','w',encoding='utf-8') as f: json.dump(out,f,ensure_ascii=False)
          print('ANNUAL_CALC_PASS',out['engine'],out['period']['day_count'],len(out['saju']['monthly']))
          PY
      - name: Verify annual compact payload and cache key
        run: |
          cat > .verify-fortune-ai-v6.ts <<'TS'
          import {compactCalculation,payloadHash,SYSTEM,VERSION} from './supabase/functions/fortune-interpret-v6-preview/core.ts';
          const calc=JSON.parse(await Deno.readTextFile('/tmp/annual-calc.json'));
          const p=compactCalculation(calc);
          const bytes=new TextEncoder().encode(JSON.stringify(p)).byteLength;
          const h1=await payloadHash(p),h2=await payloadHash(p);
          console.log('V6_VERSION',VERSION);
          console.log('ANNUAL_COMPACT_BYTES',bytes,'DETAIL_DAYS',p.western.detail_days.length,'SAJU_MONTH_SEGMENTS',p.saju.monthly.length);
          if(bytes>=90000) throw new Error(`annual compact payload too large: ${bytes}`);
          if(p.western.detail_days.length>18) throw new Error('detail day cap failed');
          if('session_dates' in p.western.market) throw new Error('raw KRX session_dates leaked into AI payload');
          if(!p.thai.mahathaksa?.available||!p.thai.taksajorn?.available||!p.thai.suriyayat?.available) throw new Error('Thai layers missing');
          if(p.thai.suriyayat?.lagna?.available!==false) throw new Error('unvalidated Suriyayat Lagna enabled');
          if(!p.thai.suriyayat?.validation||Number(p.thai.suriyayat.validation.max_delta_arcmin)!==4) throw new Error('Suriyayat validation metadata missing');
          if(p.saju.monthly.length<12||!p.saju.monthly.every((x:any)=>x.segment_start&&x.segment_end_exclusive)) throw new Error('exact Jie month segments missing');
          if(!p.saju.annual.length||!p.saju.annual.every((x:any)=>x.segment_start&&x.segment_end_exclusive)) throw new Error('exact LiChun year segments missing');
          if(h1!==h2||h1.length!==64) throw new Error('payload hash unstable');
          if(SYSTEM.includes('출생요일 기준만 구현')) throw new Error('stale Thai weekday-only prompt survived');
          if(!SYSTEM.includes('Suriyayat Lagna(라그나)가 available=false')) throw new Error('Lagna guard missing');
          if(!SYSTEM.includes('segment_start와 segment_end_exclusive')) throw new Error('exact Jie guard missing');
          console.log('ANNUAL_AI_PAYLOAD_PASS',h1.slice(0,16));
          TS
          deno run --allow-read .verify-fortune-ai-v6.ts
          rm .verify-fortune-ai-v6.ts
      - name: Verify cache design uses no schema change
        run: |
          grep -Fq 'const kind=`${VERSION}:${hash.slice(0,32)}`' supabase/functions/fortune-interpret-v6-preview/index.ts
          grep -Fq 'period_start:periodStart,period_end:periodEnd' supabase/functions/fortune-interpret-v6-preview/index.ts
          grep -Fq 'fallback_from.eq.${preferred}' supabase/functions/fortune-interpret-v6-preview/index.ts
          grep -Fq '.in("status",["queued","running"])' supabase/functions/fortune-interpret-v6-preview/index.ts
          grep -Fq 'reused:true,inflight:true' supabase/functions/fortune-interpret-v6-preview/index.ts
          grep -Fq 'reused:true,inflight:false' supabase/functions/fortune-interpret-v6-preview/index.ts
          echo CACHE_REUSE_STATIC_PASS
      - name: Verify no Gemini call in CI
        run: |
          test -z "${GEMINI_API_KEY:-}"
          echo GEMINI_CREDIT_ZERO_PASS
      - name: Verify production isolation
        run: |
          test "$GITHUB_REF_NAME" = 'work/full-year-thai-hardening-20260831'
          echo PRODUCTION_ISOLATION_PASS
