name: Finalize Release Candidate 2026-08-31

on:
  push:
    branches:
      - work/full-year-thai-hardening-20260831
    paths:
      - '.github/workflows/finalize-release-candidate-20260831.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/full-year-thai-hardening-20260831
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Apply already-verified minimal release state
        run: |
          git fetch origin main
          git checkout origin/main -- supabase/functions/fortune-interpret/index.ts
          python - <<'PY'
          from pathlib import Path
          p=Path('ai_interpret_v1.py')
          s=p.read_text(encoding='utf-8')
          old='Thai 출생요일·Mahathaksa·Taksajorn의 실제 계산 범위와 Suriyayat 미구현 한계'
          new='Thai 출생요일·Mahathaksa·Taksajorn과 검증된 Suriyayat 10행성 위치 사실층, Suriyayat Lagna 미구현 한계'
          if old in s:
              s=s.replace(old,new)
          assert 'Suriyayat 미구현 한계' not in s
          p.write_text(s,encoding='utf-8')
          PY
          git rm .github/workflows/final-release-candidate-gate-20260831.yml
          git rm .github/workflows/final-release-candidate-gate-v2-20260831.yml
          git rm .github/workflows/finalize-release-candidate-20260831.yml

      - name: Verify exact product markers
        run: |
          ! grep -q 'fortune-interpret-v5-preview' web/src/AppNext.tsx
          grep -q 'fortune-interpret-v6-preview' web/src/AppNext.tsx
          grep -q 'whole_house(홀사인)' supabase/functions/relationship-interpret-v9-preview/index.ts
          grep -q 'placidus_house(플라시두스)' supabase/functions/relationship-interpret-v9-preview/index.ts
          grep -q 'Suriyayat 10행성 위치 사실층' ai_interpret_v1.py
          grep -q 'Suriyayat Lagna' web/src/AppNext.tsx
          grep -q 'fortune_integrated' .github/workflows/api-integrated-smoke.yml
          grep -q "meta()\['routes'\]" .github/workflows/api-integrated-smoke.yml
          echo FINAL_PRODUCT_MARKERS_PASS

      - name: Recheck changed interpreters
        run: |
          python -m py_compile ai_interpret_v1.py api/main.py integrated_fortune_v1.py relationship_western_v1.py thai_astrology_v2.py thai_suriyayat_v1.py
          deno check supabase/functions/fortune-interpret-v6-preview/core.ts
          deno check supabase/functions/fortune-interpret-v6-preview/index.ts
          deno check supabase/functions/relationship-interpret-v9-preview/index.ts

      - name: Rebuild frontend
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Stage and verify exact 11-file release diff
        run: |
          git add -A
          git diff --cached --name-only origin/main | sort -u > /tmp/all.txt
          cat >/tmp/allowed.txt <<'EOF'
          .github/workflows/api-integrated-smoke.yml
          ai_interpret_v1.py
          api/main.py
          integrated_fortune_v1.py
          relationship_western_v1.py
          supabase/functions/fortune-interpret-v6-preview/core.ts
          supabase/functions/fortune-interpret-v6-preview/index.ts
          supabase/functions/relationship-interpret-v9-preview/index.ts
          thai_astrology_v2.py
          thai_suriyayat_v1.py
          web/src/AppNext.tsx
          EOF
          sort -u /tmp/allowed.txt -o /tmp/allowed.txt
          echo 'FINAL_RELEASE_DIFF:'; cat /tmp/all.txt
          test -z "$(comm -23 /tmp/all.txt /tmp/allowed.txt)"
          test -z "$(comm -13 /tmp/all.txt /tmp/allowed.txt)"
          echo FINAL_11_FILE_ALLOWLIST_PASS

      - name: Commit final RC to work branch only
        run: |
          git config user.name "cozysso-afk"
          git config user.email "cozysso@gmail.com"
          git commit -m 'candidate: finalize annual Thai and AI v6 release'
          git push origin HEAD:work/full-year-thai-hardening-20260831
          echo FINAL_RC_READY_NO_PRODUCTION_CALLS
