name: Relationship v7 precision guard

on:
  push:
    branches:
      - ui-reading-overhaul-20260829
    paths:
      - .github/workflows/relationship-v7-precision-guard.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui-reading-overhaul-20260829
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply precision guard
        run: python scripts/patch_relationship_v7_precision_guard.py
      - name: Build web
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Commit guard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/src/AppNext.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: hide unreliable relationship points without birth time"
          git push origin HEAD:ui-reading-overhaul-20260829
