name: Apply Compact Schema V15B

on:
  push:
    branches: [work/integrated-interpretation-v2]
    paths: [.github/workflows/apply-compact-schema-v15b.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/integrated-interpretation-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Compact Gemini structured-output schema
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('supabase/functions/fortune-interpret-v6-preview/integratedInterpretationV2.ts')
          s=p.read_text(encoding='utf-8')
          s=s.replace('export const VERSION = "supabase-ai-v14-adaptive-length";','export const VERSION = "supabase-ai-v15-compact-schema";',1)
          old='''- topic_analysis는 분야마다 verdict만 쓰지 말고 reason에 기간 평균과 월별 변화 또는 날짜 피크를 연결하되 importance=참고인 분야는 핵심 판단에 필요한 최소 설명만 쓴다.\n'''
          new='''- topic_analysis는 15개 분야를 배열에 정확히 한 번씩 모두 넣고, 각 항목의 topic 필드에는 TOPICS의 분야명을 그대로 쓴다. 분야마다 verdict만 쓰지 말고 reason에 기간 평균과 월별 변화 또는 날짜 피크를 연결하되 importance=참고인 분야는 핵심 판단에 필요한 최소 설명만 쓴다.\n'''
          if old not in s: raise SystemExit('prompt topic anchor missing')
          s=s.replace(old,new,1)
          old='''const topicSchema={type:"OBJECT",properties:{importance:{type:"STRING",enum:["핵심","주목","참고"]},verdict:S,reason:S,timing:S,action:S,avoid:S,confidence:{type:"STRING",enum:["높음","보통","낮음"]},confidence_reason:S,evidence_refs:refs},required:["importance","verdict","reason","timing","action","avoid","confidence","confidence_reason","evidence_refs"]};'''
          new='''const topicSchema={type:"OBJECT",properties:{topic:{type:"STRING",enum:[...TOPICS]},importance:{type:"STRING",enum:["핵심","주목","참고"]},verdict:S,reason:S,timing:S,action:S,avoid:S,confidence:{type:"STRING",enum:["높음","보통","낮음"]},confidence_reason:S,evidence_refs:refs},required:["topic","importance","verdict","reason","timing","action","avoid","confidence","confidence_reason","evidence_refs"]};'''
          if old not in s: raise SystemExit('topic schema anchor missing')
          s=s.replace(old,new,1)
          old='''topic_analysis:{type:"OBJECT",properties:Object.fromEntries(TOPICS.map(k=>[k,topicSchema])),required:[...TOPICS]}'''
          new='''topic_analysis:{type:"ARRAY",items:topicSchema,minItems:TOPICS.length,maxItems:TOPICS.length}'''
          if old not in s: raise SystemExit('schema topic_analysis anchor missing')
          s=s.replace(old,new,1)
          old='''  const analyses:any={};\n  for(const k of TOPICS){const x=o.topic_analysis[k];if(!x||typeof x!=="object")return null;const c=txt(x.confidence,20),importance=txt(x.importance,20);analyses[k]={importance:["핵심","주목","참고"].includes(importance)?importance:"참고",verdict:txt(x.verdict,900),reason:txt(x.reason,2200),timing:txt(x.timing,1200),action:txt(x.action,900),avoid:txt(x.avoid,900),confidence:["높음","보통","낮음"].includes(c)?c:"보통",confidence_reason:txt(x.confidence_reason,900),evidence_refs:cleanRefs(x.evidence_refs)};}'''
          new='''  const analyses:any={};\n  const topicRows=Array.isArray(o.topic_analysis)?o.topic_analysis:Object.entries(o.topic_analysis??{}).map(([topic,x]:any)=>({...x,topic}));\n  if(topicRows.length!==TOPICS.length)return null;\n  const topicMap=new Map<string,any>();\n  for(const row of topicRows){const topic=txt(row?.topic,80);if(!TOPICS.includes(topic as any)||topicMap.has(topic))return null;topicMap.set(topic,row);}\n  for(const k of TOPICS){const x=topicMap.get(k);if(!x||typeof x!=="object")return null;const c=txt(x.confidence,20),importance=txt(x.importance,20);analyses[k]={importance:["핵심","주목","참고"].includes(importance)?importance:"참고",verdict:txt(x.verdict,900),reason:txt(x.reason,2200),timing:txt(x.timing,1200),action:txt(x.action,900),avoid:txt(x.avoid,900),confidence:["높음","보통","낮음"].includes(c)?c:"보통",confidence_reason:txt(x.confidence_reason,900),evidence_refs:cleanRefs(x.evidence_refs)};}'''
          if old not in s: raise SystemExit('validator topic anchor missing')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          p=Path('web/src/lib/readingCache.ts')
          s=p.read_text(encoding='utf-8').replace("const FORTUNE_AI_CACHE_CONTRACT = 'adaptive-length-contract-v14'","const FORTUNE_AI_CACHE_CONTRACT = 'compact-schema-contract-v15'",1)
          p.write_text(s,encoding='utf-8')
          p=Path('web/src/lib/fortuneAiJob.ts')
          s=p.read_text(encoding='utf-8').replace("export const FORTUNE_AI_JOB_CONTRACT = 'fortune-ai-job-adaptive-length-v14'","export const FORTUNE_AI_JOB_CONTRACT = 'fortune-ai-job-compact-schema-v15'",1)
          p.write_text(s,encoding='utf-8')
          p=Path('web/src/lib/fortuneAiJob.test.mjs')
          s=p.read_text(encoding='utf-8').replace('assert.match(FORTUNE_AI_JOB_CONTRACT, /v14$/)','assert.match(FORTUNE_AI_JOB_CONTRACT, /v15$/)',1)
          p.write_text(s,encoding='utf-8')

          p=Path('supabase/functions/fortune-interpret-v6-preview/integratedInterpretationV2.test.mjs')
          s=p.read_text(encoding='utf-8')
          s=s.replace('import { PACKET_VERSION, TOPICS, compactCalculation, validateOutput } from "./integratedInterpretationV2.ts";','import { PACKET_VERSION, SCHEMA, TOPICS, compactCalculation, validateOutput } from "./integratedInterpretationV2.ts";',1)
          insert='''\n\ntest("Gemini compact topic array schema normalizes back to the stable topic map",()=>{\n  const packet=compactCalculation(calculation());\n  const objectForm=output(packet);\n  const arrayForm={...objectForm,topic_analysis:Object.entries(objectForm.topic_analysis).map(([topic,row])=>({topic,...row}))};\n  const validated=validateOutput(arrayForm);\n  assert.ok(validated);\n  assert.deepEqual(Object.keys(validated.topic_analysis),TOPICS);\n  assert.equal(SCHEMA.properties.topic_analysis.type,"ARRAY");\n  assert.equal(SCHEMA.properties.topic_analysis.minItems,TOPICS.length);\n  const duplicate={...arrayForm,topic_analysis:[...arrayForm.topic_analysis.slice(0,-1),arrayForm.topic_analysis[0]]};\n  assert.equal(validateOutput(duplicate),null);\n});\n'''
          if 'Gemini compact topic array schema normalizes back' not in s: s += insert
          p.write_text(s,encoding='utf-8')
          PY
      - name: Full interpretation regression
        run: |
          node --experimental-strip-types --test supabase/functions/fortune-interpret-v6-preview/periodInstruction.test.mjs
          node --experimental-strip-types --test supabase/functions/fortune-interpret-v6-preview/qualityPeriods.test.mjs
          node --experimental-strip-types --test supabase/functions/fortune-interpret-v6-preview/integratedInterpretationV2.test.mjs
          node --experimental-strip-types --test supabase/functions/fortune-interpret-v6-preview/thaiContract.test.mjs
          node --experimental-strip-types --test web/src/lib/fortuneAiJob.test.mjs
      - name: Web production build
        working-directory: web
        run: npm ci && npm run build
      - name: Commit V15 compact schema contract
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add supabase/functions/fortune-interpret-v6-preview/integratedInterpretationV2.ts supabase/functions/fortune-interpret-v6-preview/integratedInterpretationV2.test.mjs web/src/lib/readingCache.ts web/src/lib/fortuneAiJob.ts web/src/lib/fortuneAiJob.test.mjs
          git commit -m "fix(ai): compact Gemini structured output schema v15"
          git push origin HEAD:work/integrated-interpretation-v2
