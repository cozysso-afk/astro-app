name: Thai Lagna Duduang bounded exact retry

on:
  push:
    branches:
      - feature/thai-lagna-phase1-real-20260831
    paths:
      - .github/workflows/thai-lagna-duduang-retry-once.yml

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/thai-lagna-phase1-real-20260831
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Retry Yeosu at most eight times and extract paired position
        run: |
          python - <<'PY'
          import json, re, time, requests
          from bs4 import BeautifulSoup

          base='https://www.duduang.com'
          page=base+'/%E0%B9%82%E0%B8%AB%E0%B8%A3%E0%B8%B2%E0%B8%A8%E0%B8%B2%E0%B8%AA%E0%B8%95%E0%B8%A3%E0%B9%8C%E0%B9%84%E0%B8%97%E0%B8%A2/'
          ua='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124 Safari/537.36'
          session=requests.Session()
          headers={'User-Agent':ua,'Referer':page,'Origin':base,'X-Requested-With':'XMLHttpRequest'}
          payload={
            'day':'21','month':'3','year':'1991','hour':'7','minute':'26',
            'location':'2','country':'','province':'','districts':'',
            'lat':'34.7604','long':'127.6622',
            'jday':'0','jmonth':'0','jyear':'0','t':'0','ca':'1',
          }

          found=False
          for attempt in range(1,9):
            # Fresh warm-up each attempt to avoid reusing a stale partial AJAX state.
            warm=session.get(page,params={'probe':str(attempt)},timeout=30,headers={'User-Agent':ua,'Cache-Control':'no-cache'})
            print('ATTEMPT',attempt,'WARM',warm.status_code,'COOKIES',session.cookies.get_dict())
            warm.raise_for_status()
            r=session.post(base+'/ajax/2-thai.php',data=payload,headers={**headers,'Cache-Control':'no-cache'},timeout=30)
            print('ATTEMPT',attempt,'POST',r.status_code,'BYTES',len(r.content))
            r.raise_for_status(); r.encoding=r.apparent_encoding or 'utf-8'
            soup=BeautifulSoup(r.text,'html.parser')
            names_ul=None
            for candidate in soup.select('ul.star-name'):
              names=[li.get_text(' ',strip=True) for li in candidate.find_all('li',recursive=False)]
              if 'ลัคนา' in names:
                names_ul=candidate
                break
            if names_ul is None:
              sign_match=re.search(r'ลัคนาราศี\s*([ก-๙]+)', ' '.join(soup.stripped_strings))
              print('NO_STAR_BLOCK','SIGN_ONLY',sign_match.group(1) if sign_match else None)
              time.sleep(1.5)
              continue

            names=[li.get_text(' ',strip=True) for li in names_ul.find_all('li',recursive=False)]
            idx=names.index('ลัคนา')
            box=names_ul.find_parent('div',class_=lambda value: value and 'box' in (value if isinstance(value,list) else str(value).split()))
            pos_ul=None
            search=box
            while search is not None:
              search=search.find_next_sibling()
              if search is None: break
              pos_ul=search.select_one('ul.star-position') if hasattr(search,'select_one') else None
              if pos_ul is not None: break
            if pos_ul is None:
              # fallback: pair by ordinal among all star-name/star-position lists in response
              all_names=soup.select('ul.star-name')
              all_pos=soup.select('ul.star-position')
              ordinal=all_names.index(names_ul)
              if ordinal < len(all_pos): pos_ul=all_pos[ordinal]
            positions=[li.get_text(' ',strip=True) for li in pos_ul.find_all('li',recursive=False)] if pos_ul else []
            raw=positions[idx] if idx < len(positions) else None
            full=' '.join(soup.stripped_strings)
            sm=re.search(r'ลัคนาราศี\s*([ก-๙]+)',full)
            sign=sm.group(1) if sm else None
            print('FOUND_ATTEMPT',attempt)
            print('STAR_NAMES',json.dumps(names,ensure_ascii=False))
            print('STAR_POSITIONS',json.dumps(positions,ensure_ascii=False))
            print('LAGNA_INDEX',idx)
            print('LAGNA_POSITION_RAW',repr(raw))
            print('LAGNA_SIGN',sign)
            if raw is not None:
              nums=re.findall(r'\d+',raw)
              print('LAGNA_POSITION_NUMBERS',json.dumps(nums))
            found=True
            break

          print('BOUNDED_RETRY_RESULT', 'FOUND' if found else 'NO_STABLE_NUMERIC_BLOCK')
          PY
      - name: Clean bounded probe workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/thai-lagna-duduang-retry-once.yml
          git commit -m 'chore: clean bounded Duduang retry'
          git push origin HEAD:feature/thai-lagna-phase1-real-20260831
