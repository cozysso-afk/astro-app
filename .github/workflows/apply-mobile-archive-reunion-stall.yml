name: Apply mobile archive reunion stall fix

on:
  push:
    branches:
      - fix/mobile-archive-reunion-stall
    paths:
      - scripts/patch_mobile_archive_reunion_stall_v1.py
      - tests/test_mobile_archive_reunion_stall.py
      - .github/workflows/apply-mobile-archive-reunion-stall.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mobile-archive-reunion-stall
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Apply targeted patch
        run: python scripts/patch_mobile_archive_reunion_stall_v1.py

      - name: Backend syntax and focused contracts
        run: |
          python -m py_compile api/relationship_async_v1.py
          python -m pip install pytest
          python -m pytest -q tests/test_mobile_archive_reunion_stall.py tests/test_reunion_runtime_v29.py tests/test_reunion_hierarchy_v2.py
          python tests/test_relationship_async_contract.py

      - name: Frontend typecheck and build
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Commit verified source changes
        run: |
          git config user.name "cozysso-afk"
          git config user.email "cozysso@gmail.com"
          git add api/relationship_async_v1.py web/src/lib/auth.ts web/src/lib/archive.ts web/src/AppNext.tsx tests/test_mobile_archive_reunion_stall.py
          if git diff --cached --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git commit -m "fix: unblock mobile archive and reunion flows"
          git push origin HEAD:fix/mobile-archive-reunion-stall
