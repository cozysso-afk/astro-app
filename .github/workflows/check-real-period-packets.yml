name: Check Real Period Packets

on:
  push:
    branches:
      - work/integrated-interpretation-v2
    paths:
      - .github/workflows/check-real-period-packets.yml

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/integrated-interpretation-v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: api/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install calculation dependencies
        run: pip install -r api/requirements.txt
      - name: Build real day week month calculations
        run: |
          python - <<'PY'
          import json
          from datetime import date, time
          from integrated_fortune_v1 import build_integrated_fortune
          cases={
              'day':(date(2026,9,3),date(2026,9,3)),
              'week':(date(2026,9,1),date(2026,9,7)),
              'month':(date(2026,9,1),date(2026,9,30)),
          }
          for name,(start,end) in cases.items():
              result=build_integrated_fortune(
                  birth_date=date(1990,1,1),birth_time=time(12,0),
                  latitude=37.5665,longitude=126.9780,utc_offset_hours=9,
                  gender='female',start_date=start,end_date=end,
              )
              with open(f'/tmp/{name}.json','w',encoding='utf-8') as f:
                  json.dump(result,f,ensure_ascii=False,default=str,separators=(',',':'))
          PY
      - name: Inspect V11 evidence coverage
        run: |
          node --experimental-strip-types --input-type=module <<'JS'
          import fs from 'node:fs';
          import { compactCalculation } from './supabase/functions/fortune-interpret-v6-preview/integratedInterpretationV2.ts';
          for (const name of ['day','week','month']) {
            const calc=JSON.parse(fs.readFileSync(`/tmp/${name}.json`,'utf8'));
            const packet=compactCalculation(calc);
            const refs=(packet.evidence_ledger??[]).map((x)=>String(x.id??''));
            const detailRefs=refs.filter((x)=>x.startsWith('W:detail:'));
            const dailyRefs=refs.filter((x)=>x.startsWith('W:daily:'));
            const detailDays=packet.western?.detail_days??[];
            const windows=detailDays.reduce((count,day)=>count+Object.values(day.topics??{}).filter((topic)=>topic?.best_window||topic?.caution_window).length,0);
            const report={
              kind:name,
              period_kind:packet.period_kind,
              daily_rows:packet.western?.daily_score_matrix?.rows?.length??0,
              key_dates:packet.key_dates?.length??0,
              daily_refs:dailyRefs.length,
              detail_days:detailDays.length,
              intraday_topic_windows:windows,
              detail_refs:detailRefs.length,
              ledger_size:packet.evidence_ledger?.length??0,
            };
            console.log('REAL_PERIOD_PACKET '+JSON.stringify(report));
            if(name==='day' && windows>0 && detailRefs.length===0) throw new Error('day has intraday windows but no W:detail evidence');
            if((name==='week'||name==='month') && dailyRefs.length===0) throw new Error(`${name} has no W:daily evidence`);
          }
          JS
