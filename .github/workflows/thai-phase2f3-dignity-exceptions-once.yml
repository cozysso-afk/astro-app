name: Thai Phase 2F3 dignity exception candidates

on:
  push:
    branches:
      - feature/thai-lagna-phase1-real-20260831
    paths:
      - '.github/workflows/thai-phase2f3-dignity-exceptions-once.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/thai-lagna-phase1-real-20260831
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Attach research-only dignity exception candidate registry
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('thai_astrology_v2.py')
          text = path.read_text(encoding='utf-8')
          replacements = {
              'from thai_descriptive_synthesis_v1 import build_descriptive_synthesis_research\n':
                  'from thai_descriptive_synthesis_v1 import build_descriptive_synthesis_research\nfrom thai_dignity_exceptions_v1 import build_dignity_exception_research\n',
              'ENGINE_VERSION = "thai-mahathaksa-taksajorn-suriyayat-v2.10-phase2f2-descriptive-synthesis-research"':
                  'ENGINE_VERSION = "thai-mahathaksa-taksajorn-suriyayat-v2.11-phase2f3-dignity-exception-candidates"',
              '    dignities_research = build_dignity_research(natal_positions)\n    aspects_research = build_aspect_research(natal_positions)\n    planet_pairs_research = build_planet_pair_research(aspects_research)':
                  '    dignities_research = build_dignity_research(natal_positions)\n    aspects_research = build_aspect_research(natal_positions)\n    dignity_exceptions_research = build_dignity_exception_research(\n        dignities_research=dignities_research,\n        aspects_research=aspects_research,\n        houses_research=houses_research,\n    )\n    planet_pairs_research = build_planet_pair_research(aspects_research)',
              '        "descriptive_synthesis_research": descriptive_synthesis_research,\n        "dignities_research": dignities_research,':
                  '        "descriptive_synthesis_research": descriptive_synthesis_research,\n        "dignities_research": dignities_research,\n        "dignity_exceptions_research": dignity_exceptions_research,',
              '            "suriyayat_descriptive_synthesis": "research_only_nonpredictive_composition",\n            "suriyayat_predictive_rules": "not_implemented",':
                  '            "suriyayat_descriptive_synthesis": "research_only_nonpredictive_composition",\n            "suriyayat_dignity_exception_candidates": "research_only_school_variant_candidates_not_applied",\n            "suriyayat_predictive_rules": "not_implemented",',
              '            "Suriyayat predictive/final synthesis into outcomes, concrete house outcomes, advanced-standard meanings/ranking, canonical aspect strength, net pair valence, pair-event interpretation, combined good/bad judgement",':
                  '            "Suriyayat predictive/final synthesis into outcomes, application of school-variant dignity exceptions, concrete house outcomes, advanced-standard meanings/ranking, canonical aspect strength, net pair valence, pair-event interpretation, combined good/bad judgement",',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit('missing Phase 2F3 anchor: ' + old[:180])
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Install Swiss Ephemeris dependency
        run: python -m pip install --disable-pip-version-check pyswisseph==2.10.3.2

      - name: Run Phase 2F3 full 146-test regression matrix
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          for pattern in \
            test_thai_dignity_exceptions_v1.py \
            test_thai_dignity_exceptions_integration.py \
            test_thai_descriptive_synthesis_v1.py \
            test_thai_descriptive_synthesis_integration.py \
            test_thai_context_graph_v1.py \
            test_thai_context_graph_integration.py \
            test_thai_house_lord_routes_v1.py \
            test_thai_house_lord_routes_integration.py \
            test_thai_planet_pairs_v1.py \
            test_thai_planet_pairs_integration.py \
            test_thai_interpretation_policy_v1.py \
            test_thai_interpretation_policy_integration.py \
            test_thai_semantics_v1.py \
            test_thai_phase2c_labels_standards.py \
            test_thai_dignities_v1.py \
            test_thai_aspects_v1.py \
            test_thai_rules_phase2b_integration.py \
            'test_thai_houses*.py' \
            'test_thai_lagna*.py' \
            test_ai_thai_research_isolation.py
          do
            python -m unittest discover -s tests -p "$pattern" -v
          done

      - name: Compile Thai modules
        run: python -m py_compile thai_lagna_v1.py thai_houses_v1.py thai_dignities_v1.py thai_aspects_v1.py thai_semantics_v1.py thai_interpretation_policy_v1.py thai_planet_pairs_v1.py thai_house_lord_routes_v1.py thai_context_graph_v1.py thai_descriptive_synthesis_v1.py thai_dignity_exceptions_v1.py thai_astrology_v2.py ai_interpret_v1.py

      - name: Verify candidates never rewrite base dignities or enter Gemini
        env:
          PYTHONPATH: .
        run: |
          python - <<'PY'
          import json
          from datetime import date, time
          from ai_interpret_v1 import _compact_calculation
          from thai_astrology_v2 import build_thai_fortune

          thai = build_thai_fortune(
              birth_date=date(1991,3,21), birth_time=time(7,26),
              start_date=date(2026,8,31), end_date=date(2026,8,31),
              utc_offset_hours=9.0, latitude=34.7604, longitude=127.6622,
          )
          suri = thai['suriyayat']
          layer = suri['dignity_exceptions_research']
          assert layer['available'] is True and layer['research_only'] is True
          assert layer['base_dignities_unchanged'] is True
          assert layer['school_policy']['required'] is True
          assert layer['school_policy']['selected_school'] is None
          for row in layer['candidates']:
              assert row['detected'] is True
              assert row['applied'] is False
              assert row['base_status_overridden'] is False
              assert row['replacement_status'] is None
              assert row['net_valence'] is None
              assert row['prediction'] is None
              assert row['score'] is None
          gate = layer['promotion_gate']
          assert gate['candidate_detection_validated'] is True
          assert gate['source_variance_preserved'] is True
          assert gate['exception_application_allowed'] is False
          assert gate['base_status_rewrite_allowed'] is False
          assert gate['advanced_standard_exception_application_allowed'] is False
          assert gate['net_valence_allowed'] is False
          assert gate['final_interpretation_allowed'] is False
          assert gate['event_judgement_allowed'] is False
          assert gate['scores_allowed'] is False
          assert gate['gemini_interpretation_allowed'] is False
          assert suri['lagna']['available'] is False
          compact_suri = _compact_calculation({'period': {'day_count': 1}, 'thai': thai})['thai']['suriyayat']
          assert 'dignity_exceptions_research' not in compact_suri
          encoded = json.dumps(compact_suri, ensure_ascii=False)
          assert 'pra_opposition_to_kaset' not in encoded
          assert 'reciprocal_kaset_exchange' not in encoded
          assert thai['engine'] == 'thai-mahathaksa-taksajorn-suriyayat-v2.11-phase2f3-dignity-exception-candidates'
          print('PHASE2F3_EXCEPTION_CANDIDATES_PASS_BASE_DIGNITIES_UNCHANGED_APPLICATION_SCORE_GEMINI_BLOCKED')
          PY

      - name: Check whitespace
        run: git diff --check

      - name: Commit Phase 2F3 state and clean workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add thai_astrology_v2.py thai_dignity_exceptions_v1.py tests/test_thai_dignity_exceptions_v1.py tests/test_thai_dignity_exceptions_integration.py
          git rm -f .github/workflows/thai-phase2f3-dignity-exceptions-once.yml
          git commit -m 'research: validate Thai dignity exception candidates'
          git push origin HEAD:feature/thai-lagna-phase1-real-20260831
