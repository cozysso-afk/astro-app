name: Validate automation target semantics

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/validate-automation-targets.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lightweight Playwright package
        run: python -m pip install playwright

      - name: Compile automation workers
        run: |
          python -m py_compile scripts/prewarm_streamlit_horoscope.py
          python -m py_compile scripts/send_onesignal_horoscope_push.py

      - name: Validate target dates without sending anything
        shell: bash
        run: |
          python - <<'PY'
          from datetime import datetime
          from zoneinfo import ZoneInfo
          from scripts.prewarm_streamlit_horoscope import target_url
          from scripts.send_onesignal_horoscope_push import build_message

          kst=ZoneInfo('Asia/Seoul')
          thu=datetime(2026,8,27,12,0,tzinfo=kst)
          sun=datetime(2026,8,30,20,30,tzinfo=kst)
          month_end=datetime(2026,8,31,19,30,tzinfo=kst)

          weekly_manual=target_url('weekly',thu,manual=True)
          assert 'push_date=2026-08-31' in weekly_manual, weekly_manual
          weekly_scheduled=target_url('weekly',sun,manual=False)
          assert 'push_date=2026-08-31' in weekly_scheduled, weekly_scheduled

          assert target_url('monthly',thu,manual=False) is None
          monthly_manual=target_url('monthly',thu,manual=True)
          assert 'push_year=2026' in monthly_manual and 'push_month=9' in monthly_manual, monthly_manual
          monthly_scheduled=target_url('monthly',month_end,manual=False)
          assert 'push_year=2026' in monthly_scheduled and 'push_month=9' in monthly_scheduled, monthly_scheduled

          msg_weekly=build_message('weekly',thu,manual=True)
          assert 'date=2026-08-31' in msg_weekly['url'], msg_weekly
          assert build_message('monthly',thu,manual=False) is None
          msg_monthly=build_message('monthly',thu,manual=True)
          assert 'year=2026' in msg_monthly['url'] and 'month=9' in msg_monthly['url'], msg_monthly
          print('automation target semantics: OK')
          PY
