name: Apply counterpart top-level route v0.1.4

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-counterpart-topnav-v714.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python scripts/upgrade_counterpart_topnav_v714.py
      - name: Syntax check
        run: python -m py_compile app.py fortune_lab_v71.py scripts/upgrade_counterpart_topnav_v714.py
      - name: Diff sanity
        run: git diff --check
      - name: Verify markers
        run: |
          grep -q 'FORTUNE_LAB_VERSION = "v0.1.4"' fortune_lab_v71.py
          grep -q '💞 상대재회' app.py
          grep -q 'forced_mode":"💞 특정 상대"' app.py
          grep -q '특정 상대 재회 분석 · 상대 정보를 바로 입력해' fortune_lab_v71.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py fortune_lab_v71.py scripts/upgrade_counterpart_topnav_v714.py
          git commit -m "fix: expose counterpart reunion as top-level tab"
          git push origin HEAD:main
