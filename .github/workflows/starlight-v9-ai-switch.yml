name: Starlight v9 AI switch
on:
  push:
    branches: [ui-reading-overhaul-20260829]
    paths:
      - 'scripts/starlight_v9_ai_switch.py'
      - '.github/workflows/starlight-v9-ai-switch.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui-reading-overhaul-20260829
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Switch preview AI
        run: python scripts/starlight_v9_ai_switch.py
      - name: Build web
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Commit switch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/src/AppNext.tsx
          git diff --cached --quiet && exit 0
          git commit -m 'feat: use v4 daily and v8 reunion interpreters'
          git push origin HEAD:ui-reading-overhaul-20260829
