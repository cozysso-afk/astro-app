name: Apply Quality Guard Single Source

on:
  push:
    branches:
      - work/integrated-interpretation-v2
    paths:
      - .github/workflows/apply-quality-single-source.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/integrated-interpretation-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Remove obsolete embedded quality guard
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('supabase/functions/fortune-interpret-v6-preview/integratedInterpretationV2.ts')
          s=p.read_text(encoding='utf-8')
          marker='\nfunction strings(v:any,out:string[]=[]):string[]{'
          if marker not in s:
              raise SystemExit('obsolete quality guard marker missing')
          s=s.split(marker,1)[0].rstrip()+'\n'
          p.write_text(s,encoding='utf-8')
          PY
      - name: Verify quality guard has one source
        run: |
          ! grep -q 'export function inspectInterpretationQuality' supabase/functions/fortune-interpret-v6-preview/integratedInterpretationV2.ts
          ! grep -q 'export function strictQualityRetryInstruction' supabase/functions/fortune-interpret-v6-preview/integratedInterpretationV2.ts
          grep -q 'export function inspectInterpretationQuality' supabase/functions/fortune-interpret-v6-preview/qualityV2.ts
          grep -q 'export function strictQualityRetryInstruction' supabase/functions/fortune-interpret-v6-preview/qualityV2.ts
      - name: Interpretation and web regression
        run: |
          node --experimental-strip-types --test supabase/functions/fortune-interpret-v6-preview/integratedInterpretationV2.test.mjs
          node --experimental-strip-types --test supabase/functions/fortune-interpret-v6-preview/thaiContract.test.mjs
          cd web
          npm ci
          npm run build
      - name: Commit single-source guard cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/functions/fortune-interpret-v6-preview/integratedInterpretationV2.ts
          git diff --cached --quiet && exit 0
          git commit -m 'refactor(ai): keep quality guard in one module'
          git push origin HEAD:work/integrated-interpretation-v2
