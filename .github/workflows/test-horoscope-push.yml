name: Test horoscope push

on:
  workflow_dispatch:
    inputs:
      kind:
        description: "Push kind"
        required: true
        default: "daily"
        type: choice
        options:
          - daily
          - weekly
          - monthly

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ONESIGNAL_APP_ID: "203c25c5-85da-4b51-bd33-b93476622e84"
      ONESIGNAL_APP_API_KEY: ${{ secrets.ONESIGNAL_APP_API_KEY }}
      ASTRO_PUSH_KIND: ${{ inputs.kind }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify OneSignal API key
        shell: bash
        run: |
          if [ -z "$ONESIGNAL_APP_API_KEY" ]; then
            echo "::error::Missing ONESIGNAL_APP_API_KEY"
            exit 1
          fi

      - name: Validate sender syntax
        run: python -m py_compile scripts/send_onesignal_horoscope_push.py

      - name: Send test push
        run: python scripts/send_onesignal_horoscope_push.py
