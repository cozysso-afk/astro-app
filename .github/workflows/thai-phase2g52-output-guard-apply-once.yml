name: Thai Phase 2G5.2 commit verified AI patch

on:
  push:
    branches:
      - feature/thai-lagna-phase1-real-20260831
    paths:
      - '.github/workflows/thai-phase2g52-output-guard-apply-once.yml'

permissions:
  contents: write

jobs:
  verify-and-commit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/thai-lagna-phase1-real-20260831
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply deterministic G5.2 patch
        run: python scripts/apply_thai_g52.py

      - name: Compile patched AI
        run: python -m py_compile thai_ai_output_guard_v1.py ai_interpret_v1.py thai_lagna_product_v1.py

      - name: Run G5.2 output guard tests
        env:
          PYTHONPATH: .
        run: |
          python -m unittest discover -s tests -p 'test_thai_ai_output_guard_v1.py' -v
          python -m unittest discover -s tests -p 'test_thai_ai_output_guard_integration.py' -v

      - name: Check patch whitespace
        run: git diff --check

      - name: Commit only verified AI integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ai_interpret_v1.py
          git commit -m 'feat: enforce Thai Gemini output safety retry and fallback'
          git push origin HEAD:feature/thai-lagna-phase1-real-20260831
