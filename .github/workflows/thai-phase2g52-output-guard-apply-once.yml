name: Thai Phase 2G5.2 output guard apply once

on:
  push:
    branches:
      - feature/thai-lagna-phase1-real-20260831
    paths:
      - '.github/workflows/thai-phase2g52-output-guard-apply-once.yml'

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/thai-lagna-phase1-real-20260831
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply G5.2 integration patch
        run: python scripts/apply_thai_g52.py

      - name: Compile patched AI before test discovery
        run: python -m py_compile thai_ai_output_guard_v1.py ai_interpret_v1.py thai_lagna_product_v1.py

      - name: Install Swiss Ephemeris dependency
        run: python -m pip install --disable-pip-version-check pyswisseph==2.10.3.2

      - name: Run exact 239-test Thai regression matrix
        env:
          PYTHONPATH: .
        run: |
          python - <<'PY'
          import sys
          import unittest

          patterns = [
              'test_thai_ai_output_guard_v1.py', 'test_thai_ai_output_guard_integration.py',
              'test_thai_lagna_product_v1.py', 'test_thai_lagna_product_integration.py',
              'test_thai_lagna_promotion_audit_v1.py', 'test_thai_lagna_promotion_audit_integration.py',
              'test_thai_ai_safe_packet_v1.py', 'test_thai_ai_safe_packet_integration.py',
              'test_thai_ai_safe_packet_compaction.py', 'test_thai_phase2g2_profile_differential.py',
              'test_thai_phase2g2_profile_differential_integration.py', 'test_thai_school_policy_v1.py',
              'test_thai_school_policy_integration.py', 'test_thai_dignity_exceptions_v1.py',
              'test_thai_dignity_exceptions_integration.py', 'test_thai_descriptive_synthesis_v1.py',
              'test_thai_descriptive_synthesis_integration.py', 'test_thai_context_graph_v1.py',
              'test_thai_context_graph_integration.py', 'test_thai_house_lord_routes_v1.py',
              'test_thai_house_lord_routes_integration.py', 'test_thai_planet_pairs_v1.py',
              'test_thai_planet_pairs_integration.py', 'test_thai_interpretation_policy_v1.py',
              'test_thai_interpretation_policy_integration.py', 'test_thai_semantics_v1.py',
              'test_thai_phase2c_labels_standards.py', 'test_thai_dignities_v1.py',
              'test_thai_aspects_v1.py', 'test_thai_rules_phase2b_integration.py',
              'test_thai_houses*.py', 'test_thai_lagna_boundary_gold.py', 'test_thai_lagna_phase1d.py',
              'test_thai_lagna_v1.py', 'test_thai_lagna_world_gold.py', 'test_ai_thai_research_isolation.py',
          ]
          loader = unittest.defaultTestLoader
          suite = unittest.TestSuite()
          total = 0
          for pattern in patterns:
              found = loader.discover('tests', pattern=pattern)
              count = found.countTestCases()
              print(f'{pattern}: {count}')
              total += count
              suite.addTests(found)
          print(f'PHASE2G52_DISCOVERED_TESTS={total}')
          if total != 239:
              raise SystemExit(f'expected 239 tests, discovered {total}')
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          print(f'PHASE2G52_RESULT={result.testsRun}/{total}')
          if not result.wasSuccessful():
              sys.exit(1)
          PY

      - name: Compile full touched stack
        run: python -m py_compile thai_ai_output_guard_v1.py ai_interpret_v1.py thai_astrology_v2.py thai_lagna_product_v1.py

      - name: Verify malicious-output fallback
        env:
          PYTHONPATH: .
        run: |
          python - <<'PY'
          from thai_ai_output_guard_v1 import build_thai_output_fallback, inspect_thai_output_safety

          bad = {
              'headline': '점검',
              'overall': {
                  'summary': 'Western은 점검이 필요해. Thai Lagna상 반드시 연락이 온다.',
                  'dominant_pattern': '', 'best_phase': '', 'caution_phase': '',
              },
              'clusters': {
                  'relationship': '재회 확률 90%야.', 'work_study': '',
                  'money_news': '', 'investment': '', 'condition': '',
              },
              'systems': {
                  'western': 'Western 근거', 'saju': '',
                  'thai': 'Suriyayat 기준 9월 3일 반드시 재회한다.',
              },
              'priorities': [], 'topic_analysis': {}, 'limits': '',
          }
          guard = inspect_thai_output_safety(bad, thai_packet_present=True)
          assert guard['safe'] is False
          codes = {item['code'] for item in guard['violations']}
          assert {'numeric_probability', 'deterministic_event', 'thai_exact_timing'} <= codes
          fallback = build_thai_output_fallback(bad)
          assert fallback['systems']['thai'] == ''
          assert 'Western은 점검이 필요해' in fallback['overall']['summary']
          assert inspect_thai_output_safety(fallback, thai_packet_present=True)['safe'] is True
          print('PHASE2G52_MALICIOUS_OUTPUT_FALLBACK_PASS')
          PY

      - name: Check whitespace
        run: git diff --check

      - name: Commit verified G5.2 and clean temporary files
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ai_interpret_v1.py .github/workflows/thai-phase2g5-product-promotion-once.yml
          git rm -f .github/workflows/thai-phase2g52-output-guard-apply-once.yml scripts/apply_thai_g52.py
          git commit -m 'feat: enforce Thai Gemini output safety retry and fallback'
          git push origin HEAD:feature/thai-lagna-phase1-real-20260831
