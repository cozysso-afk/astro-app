name: Golden V1 CI patch

on:
  push:
    paths:
      - "scripts/patch_golden_v1_ci_once.py"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/prose-golden-regression-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/patch_golden_v1_ci_once.py
      - run: git diff --check
      - name: Commit patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/interpretation-v3-ci.yml
          git commit -m "ci: run prose golden regression v1"
          git push origin HEAD:test/prose-golden-regression-v1
