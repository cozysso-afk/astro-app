name: Astrocartography world map v3
on:
  push:
    branches: [astrocartography-worldmap-v3-20260829]
    paths:
      - 'scripts/apply_astrocartography_worldmap_v3.py'
      - 'web/src/AstrocartographyWorldMap.tsx'
      - 'web/src/astrocartography-map.css'
      - '.github/workflows/astrocartography-worldmap-v3.yml'
permissions:
  contents: write
jobs:
  patch-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: astrocartography-worldmap-v3-20260829
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Python dependencies
        run: pip install -r api/requirements.txt
      - name: Apply world map patch
        run: python scripts/apply_astrocartography_worldmap_v3.py
      - name: Compile location engine
        run: python -m py_compile astrocartography_v1.py api/main.py
      - name: Deterministic world line smoke
        run: |
          python - <<'PY'
          from datetime import date,time
          from astrocartography_v1 import build_location_fit
          r=build_location_fit(birth_date=date(1991,3,21),birth_time=time(7,26),utc_offset_hours=9)
          assert r['ok'] is True
          assert r['engine']=='astrocartography-world-lines-v2.0'
          m=r['map']; lines=m['lines']
          assert len(lines)==40, len(lines)
          assert {x['planet'] for x in lines}=={'Sun','Moon','Mercury','Venus','Mars','Jupiter','Saturn','Uranus','Neptune','Pluto'}
          for planet in {x['planet'] for x in lines}:
              assert {x['angle'] for x in lines if x['planet']==planet}=={'ASC','DC','MC','IC'}
          for line in lines:
              assert line['segments'], (line['planet'],line['angle'])
              for seg in line['segments']:
                  assert len(seg)>=2
                  for p in seg:
                      assert -85.1 <= p['latitude'] <= 85.1
                      assert -180 <= p['longitude'] <= 180
          assert all('latitude' in x and 'longitude' in x for x in r['purposes']['overall']['cities'])
          print('WORLD_LINES_OK',len(lines),'top=',r['purposes']['overall']['cities'][0]['city'])
          PY
      - name: Build web
        working-directory: web
        run: npm ci && npm run build
      - name: Verify portable prompt copy
        run: |
          grep -q 'CALCULATED_DATA · 원본 관계 계산 JSON' web/src/AppNext.tsx
          grep -q 'AstrocartographyWorldMap' web/src/AppNext.tsx
          grep -q 'OpenStreetMap contributors' web/src/AstrocartographyWorldMap.tsx
      - name: Commit implementation
        run: |
          git config user.name 'cozysso-afk'
          git config user.email 'cozysso@gmail.com'
          git add astrocartography_v1.py web/src/AppNext.tsx
          if ! git diff --cached --quiet; then
            git commit -m 'feat: add world astrocartography map and portable prompts'
            git push origin HEAD:astrocartography-worldmap-v3-20260829
          fi
