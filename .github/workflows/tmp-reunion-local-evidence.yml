name: Temporary reunion local evidence patch
on:
  push:
    branches:
      - feat/reunion-local-evidence-reading
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/reunion-local-evidence-reading
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Reuse patch script and fix generated test
        shell: bash
        run: |
          python - <<'PY'
          import base64, re, subprocess
          previous = subprocess.check_output([
              'git','show','840e5202b0df22e7b675f925595869758faf1f56:.github/workflows/tmp-reunion-local-evidence.yml'
          ], text=True)
          match = re.search(r"echo '([^']+)' \| base64 -d > /tmp/patch\.py", previous)
          assert match, 'previous patch payload not found'
          script = base64.b64decode(match.group(1)).decode('utf-8')
          duplicate = "import test from 'node:test'\nimport test from 'node:test'\n"
          assert duplicate in script, 'duplicate test import not found in patch script'
          script = script.replace(duplicate, "import test from 'node:test'\n", 1)
          open('/tmp/patch.py','w',encoding='utf-8').write(script)
          PY
          python /tmp/patch.py
      - name: Test targeted reunion UI
        working-directory: web
        run: node --test src/lib/reunionUiVnext.test.mjs src/lib/relationshipReunionV2.contract.test.mjs src/lib/reunionLocalEvidenceUi.test.mjs
      - name: Build web
        working-directory: web
        run: npm ci && npm run build
      - name: Commit product changes and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/tmp-reunion-local-evidence.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add web/src/AppNext.tsx web/src/RelationshipInterpretationPanel.tsx web/src/ReunionHierarchyPanel.tsx web/src/lib/reunionLocalEvidenceUi.test.mjs .github/workflows/tmp-reunion-local-evidence.yml
          git commit -m 'feat: show local reunion progression evidence'
          git push origin HEAD:feat/reunion-local-evidence-reading
