name: Apply V18 Live Smoke Reliability

on:
  push:
    branches: [work/integrated-interpretation-v2]
    paths: [.github/workflows/apply-v18-live-smoke-reliability.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/integrated-interpretation-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Apply V18 reliability patch
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('supabase/functions/fortune-interpret-v6-preview/integratedInterpretationV2.ts')
          s=p.read_text(encoding='utf-8')
          old='export const VERSION = "supabase-ai-v17-grounded-split-output";'
          new='export const VERSION = "supabase-ai-v18-grounded-split-reliability";'
          if old not in s: raise SystemExit('version anchor missing')
          p.write_text(s.replace(old,new,1),encoding='utf-8')

          p=Path('supabase/functions/fortune-interpret-v6-preview/index.ts')
          s=p.read_text(encoding='utf-8')

          old='''    ? "[OUTPUT PART: CORE] topic_analysis는 출력하지 말고, 총평·핵심시기·연간구간·교차검증·행동·관계/연락/재회·투자·체계별 해설·한계만 이 스키마에 맞춰 작성해."'''
          # V17 uses template literal, so patch stable fragments instead.
          old_fragment='''- 관계·연애·연락·재회 근거가 두드러지면 relationship_reading의 flow/focus_timing/watch를 충분히 구체적으로 쓰되, focus_timing의 정확한 날짜는 relationship_reading.evidence_refs가 직접 뒷받침하는 날짜만 써.\n- annual이면 year_phases 4개 이상, cross_checks 3개 이상, key_windows 5개 이상을 유지하고 각 항목의 근거를 실제 evidence_refs로 연결해.`;'''
          new_fragment='''- 관계·연애·연락·재회 근거가 두드러지면 relationship_reading의 flow/focus_timing/watch를 충분히 구체적으로 써. focus_timing은 최소 35자 정도로 시기 + 흐름 + 현실 확인 방식을 함께 설명하고, 정확한 날짜는 relationship_reading.evidence_refs가 직접 뒷받침하는 날짜만 써.\n- cross_checks의 synthesis는 최소 60자 정도로 Western과 다른 체계가 같은 시기를 어떻게 보완하거나 다르게 설명하는지 구체적으로 종합해. western 설명도 최소 35자 정도로 근거의 의미를 풀어 써.\n- annual이면 year_phases 4개 이상, cross_checks 3개 이상, key_windows 5개 이상을 유지하고 각 항목의 근거를 실제 evidence_refs로 연결해.`;'''
          if old_fragment not in s: raise SystemExit('core prompt anchor missing')
          s=s.replace(old_fragment,new_fragment,1)

          old_tokens='''    const maxOutputTokens=part==="core"?(compactMode?7600:11000):(compactMode?5600:8200);'''
          new_tokens='''    const maxOutputTokens=part==="core"?(compactMode?10000:12000):(compactMode?6500:8200);'''
          if old_tokens not in s: raise SystemExit('token anchor missing')
          s=s.replace(old_tokens,new_tokens,1)

          anchor='''function splitPartInstruction(part:"core"|"topics"){'''
          normalize='''function normalizeDirectionalWindows(data:any,payload:any){\n  const ledger=new Map<string,any>((Array.isArray(payload?.evidence_ledger)?payload.evidence_ledger:[]).map((row:any)=>[String(row?.id??""),row]));\n  for(const window of Array.isArray(data?.key_windows)?data.key_windows:[]){\n    const rows=(Array.isArray(window?.evidence_refs)?window.evidence_refs:[]).map((ref:any)=>ledger.get(String(ref))).filter(Boolean);\n    const supportive=rows.some((row:any)=>row?.direction==="supportive");\n    const caution=rows.some((row:any)=>row?.direction==="caution");\n    if(supportive&&caution)window.signal="혼합";\n  }\n  return data;\n}\n\n'''
          if 'function normalizeDirectionalWindows' not in s:
              if anchor not in s: raise SystemExit('splitPartInstruction anchor missing')
              s=s.replace(anchor,normalize+anchor,1)

          old_validate='''    const data=validateOutput(merged);\n    if(!data)return {ok:false,error:"1단계 구조 검증 실패",model,usage:combinedUsage,split_generation:true};\n    const thaiGuard=inspectThaiOutputSafety(data,thaiOutputGuardRequired(payload));'''
          new_validate='''    const validated=validateOutput(merged);\n    if(!validated)return {ok:false,error:"1단계 구조 검증 실패",model,usage:combinedUsage,split_generation:true};\n    const data=normalizeDirectionalWindows(validated,payload);\n    const thaiGuard=inspectThaiOutputSafety(data,thaiOutputGuardRequired(payload));'''
          if old_validate not in s: raise SystemExit('validate merge anchor missing')
          s=s.replace(old_validate,new_validate,1)
          p.write_text(s,encoding='utf-8')

          p=Path('supabase/functions/fortune-interpret-v6-preview/qualityV2.ts')
          s=p.read_text(encoding='utf-8')
          old='''- 관계·재회 주목 시기 설명 부족이면 focus_timing을 실제 관계 evidence_refs가 직접 지지하는 날짜/구간과 현실 확인 방식까지 포함해 보강해라.\n- 오늘 시간대 행동 누락이면 W:window의 정확한 HH:MM~HH:MM과 같은 분야 W:detail 근거를 decision에 함께 연결해라.'''
          new='''- 관계·재회 주목 시기 설명 부족이면 focus_timing을 최소 35자 정도로 실제 관계 evidence_refs가 직접 지지하는 날짜/구간 + 흐름 + 현실 확인 방식까지 포함해 보강해라.\n- 교차검증 종합이 너무 짧으면 해당 synthesis를 최소 60자 정도로 Western과 다른 체계의 공통점/차이를 구체적으로 풀어라.\n- 오늘 시간대 행동 누락이면 W:window의 정확한 HH:MM~HH:MM과 같은 분야 W:detail 근거를 decision에 함께 연결해라.'''
          if old not in s: raise SystemExit('retry prompt anchor missing')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          p=Path('web/src/lib/readingCache.ts')
          s=p.read_text(encoding='utf-8').replace("const FORTUNE_AI_CACHE_CONTRACT = 'grounded-split-output-contract-v17'","const FORTUNE_AI_CACHE_CONTRACT = 'grounded-split-reliability-contract-v18'",1)
          p.write_text(s,encoding='utf-8')

          p=Path('web/src/lib/fortuneAiJob.ts')
          s=p.read_text(encoding='utf-8').replace("export const FORTUNE_AI_JOB_CONTRACT = 'fortune-ai-job-grounded-split-v17'","export const FORTUNE_AI_JOB_CONTRACT = 'fortune-ai-job-grounded-split-v18'",1)
          p.write_text(s,encoding='utf-8')

          p=Path('web/src/lib/fortuneAiJob.test.mjs')
          s=p.read_text(encoding='utf-8').replace('assert.match(FORTUNE_AI_JOB_CONTRACT, /v17$/)','assert.match(FORTUNE_AI_JOB_CONTRACT, /v18$/)',1)
          p.write_text(s,encoding='utf-8')

          test=Path('supabase/functions/fortune-interpret-v6-preview/v18Reliability.test.mjs')
          test.write_text('''import assert from "node:assert/strict";\nimport test from "node:test";\nimport fs from "node:fs";\n\nconst source=fs.readFileSync(new URL("./index.ts",import.meta.url),"utf8");\nconst quality=fs.readFileSync(new URL("./qualityV2.ts",import.meta.url),"utf8");\n\ntest("mixed evidence is normalized deterministically before quality validation",()=>{\n  assert.match(source,/function normalizeDirectionalWindows/);\n  assert.match(source,/supportive&&caution\)window\.signal="혼합"/);\n  assert.match(source,/const data=normalizeDirectionalWindows\(validated,payload\)/);\n});\n\ntest("fallback core has enough structured-output headroom",()=>{\n  assert.match(source,/part==="core"\?\(compactMode\?10000:12000\)/);\n});\n\ntest("core and retry prompts require relationship and cross-check depth",()=>{\n  assert.match(source,/focus_timing은 최소 35자/);\n  assert.match(source,/synthesis는 최소 60자/);\n  assert.match(quality,/교차검증 종합이 너무 짧으면 해당 synthesis를 최소 60자/);\n});\n''',encoding='utf-8')
          PY
      - name: Full interpretation regression
        run: |
          node --experimental-strip-types --test supabase/functions/fortune-interpret-v6-preview/periodInstruction.test.mjs
          node --experimental-strip-types --test supabase/functions/fortune-interpret-v6-preview/qualityPeriods.test.mjs
          node --experimental-strip-types --test supabase/functions/fortune-interpret-v6-preview/integratedInterpretationV2.test.mjs
          node --experimental-strip-types --test supabase/functions/fortune-interpret-v6-preview/thaiContract.test.mjs
          node --experimental-strip-types --test supabase/functions/fortune-interpret-v6-preview/splitStructuredOutput.test.mjs
          node --experimental-strip-types --test supabase/functions/fortune-interpret-v6-preview/groundedSplitPrompt.test.mjs
          node --experimental-strip-types --test supabase/functions/fortune-interpret-v6-preview/v18Reliability.test.mjs
          node --experimental-strip-types --test web/src/lib/fortuneAiJob.test.mjs
      - name: Web production build
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Commit V18 reliability fixes
        run: |
          git config user.name "cozysso-afk"
          git config user.email "cozysso@gmail.com"
          git add supabase/functions/fortune-interpret-v6-preview/integratedInterpretationV2.ts \
                  supabase/functions/fortune-interpret-v6-preview/index.ts \
                  supabase/functions/fortune-interpret-v6-preview/qualityV2.ts \
                  supabase/functions/fortune-interpret-v6-preview/v18Reliability.test.mjs \
                  web/src/lib/readingCache.ts web/src/lib/fortuneAiJob.ts web/src/lib/fortuneAiJob.test.mjs
          git commit -m "fix(ai): stabilize split interpretation retries and grounding"
          git push origin HEAD:work/integrated-interpretation-v2
