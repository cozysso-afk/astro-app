name: Apply Release Cache V20

on:
  pull_request:
    types: [synchronize]
    paths:
      - '.github/workflows/apply-release-cache-v20.yml'

permissions:
  contents: write

jobs:
  apply-release-cache-v20:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/integrated-interpretation-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Break V19 caches for final release
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              'supabase/functions/fortune-interpret-v6-preview/integratedInterpretationV2.ts': (
                  'export const VERSION = "supabase-ai-v19-targeted-quality-repair";',
                  'export const VERSION = "supabase-ai-v20-release-cache-break";',
              ),
              'web/src/lib/readingCache.ts': (
                  "const FORTUNE_AI_CACHE_CONTRACT = 'targeted-quality-repair-contract-v19'",
                  "const FORTUNE_AI_CACHE_CONTRACT = 'release-contract-v20'",
              ),
              'web/src/lib/fortuneAiJob.ts': (
                  "export const FORTUNE_AI_JOB_CONTRACT = 'fortune-ai-job-targeted-repair-v19'",
                  "export const FORTUNE_AI_JOB_CONTRACT = 'fortune-ai-job-release-v20'",
              ),
              'web/src/lib/fortuneAiJob.test.mjs': (
                  'assert.match(FORTUNE_AI_JOB_CONTRACT, /v19$/)',
                  'assert.match(FORTUNE_AI_JOB_CONTRACT, /v20$/)',
              ),
          }
          for filename, (old, new) in replacements.items():
              p = Path(filename)
              s = p.read_text(encoding='utf-8')
              if old not in s:
                  raise SystemExit(f'missing release cache anchor: {filename}')
              p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Release regression
        run: |
          node --experimental-strip-types --test supabase/functions/fortune-interpret-v6-preview/periodInstruction.test.mjs
          node --experimental-strip-types --test supabase/functions/fortune-interpret-v6-preview/qualityPeriods.test.mjs
          node --experimental-strip-types --test supabase/functions/fortune-interpret-v6-preview/integratedInterpretationV2.test.mjs
          node --experimental-strip-types --test supabase/functions/fortune-interpret-v6-preview/groundedSplitPrompt.test.mjs
          node --experimental-strip-types --test supabase/functions/fortune-interpret-v6-preview/splitStructuredOutput.test.mjs
          node --experimental-strip-types --test supabase/functions/fortune-interpret-v6-preview/v18Reliability.test.mjs
          node --experimental-strip-types --test supabase/functions/fortune-interpret-v6-preview/v19TargetedRepair.test.mjs
          node --experimental-strip-types --test supabase/functions/fortune-interpret-v6-preview/repairV19.test.mjs
          node --experimental-strip-types --test supabase/functions/fortune-interpret-v6-preview/thaiContract.test.mjs
          node --experimental-strip-types --test web/src/lib/fortuneAiJob.test.mjs
      - name: Web production build
        working-directory: web
        run: npm ci && npm run build
      - name: Commit release cache contract and remove helper workflow
        run: |
          git rm .github/workflows/apply-release-cache-v20.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add supabase/functions/fortune-interpret-v6-preview/integratedInterpretationV2.ts web/src/lib/readingCache.ts web/src/lib/fortuneAiJob.ts web/src/lib/fortuneAiJob.test.mjs
          git commit -m "chore(ai): break pre-release caches for v20"
          git push origin HEAD:work/integrated-interpretation-v2

# trigger synchronize after workflow registration
