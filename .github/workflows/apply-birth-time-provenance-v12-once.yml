name: Apply Birth Time Provenance V12 Once

on:
  push:
    branches:
      - fix/birth-time-provenance-v12
    paths:
      - '.github/workflows/apply-birth-time-provenance-v12-once.yml'

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/birth-time-provenance-v12
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Apply provenance patches
        run: |
          python scripts/patch_birth_time_provenance_v12.py
          python scripts/patch_birth_time_provenance_v12_test_contracts.py
      - name: Install calculation dependencies
        run: python -m pip install -q -r api/requirements.txt pytest httpx
      - name: Run provenance and relationship calculation regressions
        run: |
          python -m py_compile birth_time_reliability_v1.py relationship_western_v1.py relationship_saju_v1.py api/main.py
          python -m pytest -q tests/test_birth_time_reliability_v12.py tests/test_relationship_midpoints_v8.py tests/test_relationship_timing_v9.py tests/test_saju_calculation_gold_v1.py tests/test_saju_natal_boundary_v5.py
      - name: Check relationship interpreter source
        run: node --experimental-strip-types --check supabase/functions/relationship-interpret-v9-preview/index.ts
      - name: Web typecheck and production build
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Commit permanent V12 changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add birth_time_reliability_v1.py relationship_western_v1.py relationship_saju_v1.py api/main.py \
            tests/test_birth_time_reliability_v12.py tests/test_relationship_midpoints_v8.py tests/test_relationship_timing_v9.py \
            tests/test_saju_calculation_gold_v1.py tests/test_saju_natal_boundary_v5.py \
            web/src/appTypes.ts web/src/ProfileView.tsx web/src/BirthTimeReliabilityFields.tsx web/src/AppNext.tsx \
            web/src/RelationshipPrecisionDetails.tsx web/src/lib/resultFormatters.ts web/src/lib/readingCache.ts \
            supabase/functions/relationship-interpret-v9-preview/index.ts
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No permanent V12 changes to commit.'
          else
            git commit -m 'fix(calc): distinguish entered from exact birth time V12'
            git push origin HEAD:fix/birth-time-provenance-v12
          fi
