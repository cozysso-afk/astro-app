name: Validate celestial detectors once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/validate-astro-detectors-once.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install lightweight runtime
        run: python -m pip install "pyswisseph==2.10.3.2" playwright
      - name: Compile
        run: python -m py_compile scripts/astro_event_alerts.py
      - name: Positive detector self-test
        shell: bash
        run: |
          python - <<'PY'
          import sys
          from datetime import datetime
          from zoneinfo import ZoneInfo
          sys.path.insert(0,'scripts')
          import astro_event_alerts as a
          kst=ZoneInfo('Asia/Seoul')

          phases=a.detect_moon_phases(datetime(2026,8,1,tzinfo=kst),datetime(2026,9,10,tzinfo=kst))
          assert len(phases)>=2, phases

          stations=a.detect_stations(datetime(2026,8,1,tzinfo=kst),datetime(2026,12,31,23,59,tzinfo=kst))
          mercury=[x for x in stations if '수성' in x['label']]
          assert mercury, stations

          eclipses=a.detect_eclipses(datetime(2026,1,1,tzinfo=kst),datetime(2026,12,31,23,59,tzinfo=kst))
          assert eclipses, eclipses

          print('moon_phase_count=',len(phases))
          print('station_count=',len(stations),'mercury_station_count=',len(mercury))
          print('eclipse_count=',len(eclipses))
          print('celestial detector positive self-test: OK')
          PY
