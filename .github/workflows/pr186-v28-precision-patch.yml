name: PR186 v2.8 precision audit patch

on:
  push:
    branches:
      - fix/reunion-hierarchy-v2
    paths:
      - scripts/apply_reunion_v28_precision_audit.py
      - .github/workflows/pr186-v28-precision-patch.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: fix/reunion-hierarchy-v2
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply guarded v2.8 patch
        run: python scripts/apply_reunion_v28_precision_audit.py

      - name: Install focused dependencies
        run: python -m pip install -q -r api/requirements.txt pytest httpx

      - name: Syntax and reunion regression
        run: |
          python -m py_compile reunion_hierarchy_v2.py
          python -m pytest -q tests/test_reunion_hierarchy_v2.py tests/test_return_relocation_v27.py
          git diff --check

      - name: Commit and push source/tests
        run: |
          if git diff --quiet; then
            echo "No source changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reunion_hierarchy_v2.py tests/test_reunion_hierarchy_v2.py
          git commit -m "feat(reunion): audit provisional lunar-return gate dependency"
          git push origin HEAD:fix/reunion-hierarchy-v2
