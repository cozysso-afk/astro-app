name: PR186 v2.11 presentation patch

on:
  push:
    branches:
      - fix/reunion-hierarchy-v2
    paths:
      - 'scripts/apply_reunion_v211_presentation.py'
      - '.github/workflows/pr186-v211-presentation-patch.yml'

permissions:
  contents: write

jobs:
  guarded-patch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/reunion-hierarchy-v2
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Apply guarded presentation patch
        run: |
          touch scripts/apply_reunion_v211_presentation.py
          python scripts/apply_reunion_v211_presentation.py

      - name: Prove calculation engines are untouched
        run: |
          git diff --exit-code -- \
            reunion_hierarchy_v2.py \
            relationship_return_v1.py \
            relationship_western_v1.py \
            relationship_saju_v1.py

      - name: Contract tests
        run: node --test web/src/lib/relationshipReunionV2.contract.test.mjs

      - name: Web build
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Commit presentation-only changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            web/src/RelationshipInterpretationPanel.tsx \
            web/src/lib/readingCache.ts \
            web/src/lib/relationshipReunionV2.contract.test.mjs \
            supabase/functions/relationship-interpret-v9-preview/index.ts \
            supabase/functions/relationship-interpret-v9-preview/reunionGroundingV2.ts
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'fix(reunion): make hierarchy the primary reading presentation'
            git push origin HEAD:fix/reunion-hierarchy-v2
          fi
