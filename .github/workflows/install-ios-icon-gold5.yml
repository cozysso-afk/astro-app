name: Install iOS icon gold5

on:
  push:
    branches: [main]
    paths:
      - 'web/public/.icon-gold5/03.txt'
      - '.github/workflows/install-ios-icon-gold5.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild and fully verify PNG
        shell: bash
        run: |
          set -euo pipefail
          cat web/public/.icon-gold5/00.txt web/public/.icon-gold5/01.txt web/public/.icon-gold5/02.txt web/public/.icon-gold5/03.txt > /tmp/icon.b64
          python - <<'PY'
          from pathlib import Path
          import base64, struct, zlib, binascii
          s=''.join(Path('/tmp/icon.b64').read_text().split())
          b=base64.b64decode(s, validate=True)
          assert b[:8] == b'\x89PNG\r\n\x1a\n'
          pos=8; idat=[]; width=height=bit_depth=color_type=None; saw_iend=False
          while pos < len(b):
              n=struct.unpack('>I', b[pos:pos+4])[0]; pos += 4
              typ=b[pos:pos+4]; pos += 4
              data=b[pos:pos+n]; pos += n
              crc=struct.unpack('>I', b[pos:pos+4])[0]; pos += 4
              assert (binascii.crc32(typ+data) & 0xffffffff) == crc, typ
              if typ == b'IHDR':
                  width,height,bit_depth,color_type,_,_,_=struct.unpack('>IIBBBBB', data)
              elif typ == b'IDAT': idat.append(data)
              elif typ == b'IEND': saw_iend=True; break
          assert saw_iend and pos == len(b), (saw_iend, pos, len(b))
          assert (width,height)==(180,180), (width,height)
          assert bit_depth == 8 and color_type == 3, (bit_depth,color_type)
          raw=zlib.decompress(b''.join(idat))
          assert len(raw) == height*(1+width), (len(raw), height*(1+width))
          Path('web/public/apple-touch-icon-gold5.png').write_bytes(b)
          Path('web/public/apple-touch-icon.png').write_bytes(b)
          Path('web/public/apple-touch-icon-precomposed.png').write_bytes(b)
          print('FULL PNG VERIFIED', width, height, len(b), len(raw))
          PY
      - name: Update icon references
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          p=Path('web/index.html')
          s=p.read_text()
          import re
          s=re.sub(r'href="/apple-touch-icon-gold\d+\.png"', 'href="/apple-touch-icon-gold5.png"', s)
          s=s.replace('20260828-pastel4','20260828-pastel5')
          p.write_text(s)
          m=Path('web/public/manifest.webmanifest')
          data=json.loads(m.read_text())
          data['icons']=[{'src':'/apple-touch-icon-gold5.png','sizes':'180x180','type':'image/png','purpose':'any'}]
          m.write_text(json.dumps(data, ensure_ascii=False, indent=2)+'\n')
          PY
      - name: Commit verified icon
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/public/apple-touch-icon-gold5.png web/public/apple-touch-icon.png web/public/apple-touch-icon-precomposed.png web/index.html web/public/manifest.webmanifest
          git commit -m 'fix: install fully verified iOS icon gold5'
          git push
