name: Apply V21 Local Quality Stabilizer

on:
  push:
    branches:
      - work/ai-cost-guard-v21
    paths:
      - '.github/workflows/apply-v21-local-quality-stabilizer.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/ai-cost-guard-v21
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply local deterministic quality stabilization
        run: python .github/v21_apply_local_stabilizer.py
      - name: V21 fixture tests
        run: node --experimental-strip-types --test supabase/functions/fortune-interpret-v21-preview/costGuardV21.test.mjs
      - name: Pending job regression
        run: node --experimental-strip-types --test web/src/lib/fortuneAiJob.test.mjs
      - name: Commit product changes
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add supabase/functions/fortune-interpret-v21-preview/costGuardV21.ts supabase/functions/fortune-interpret-v21-preview/index.ts supabase/functions/fortune-interpret-v21-preview/costGuardV21.test.mjs
          git commit -m 'fix(ai): stabilize V21 quality locally before retry'
          git push origin HEAD:work/ai-cost-guard-v21
