name: Starlight calendar year selector
on:
  push:
    branches: [relationship-year-map-overhaul-20260829]
    paths:
      - 'scripts/starlight_calendar_year_v1.py'
      - '.github/workflows/starlight-calendar-year-v1.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: relationship-year-map-overhaul-20260829
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply calendar-year selector patch
        run: python scripts/starlight_calendar_year_v1.py
      - name: Build web
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Commit implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/src/AppNext.tsx web/src/mobile-spacing-v11.css
          git diff --cached --quiet && exit 0
          git commit -m 'feat: add exact calendar year fortune ranges'
          git push origin HEAD:relationship-year-map-overhaul-20260829
