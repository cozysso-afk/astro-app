name: Relationship depth v2
on:
  push:
    branches: [relationship-depth-v2-20260829]
    paths:
      - 'scripts/relationship_depth_v2_patch.py'
      - 'relationship_saju_v1.py'
      - '.github/workflows/relationship-depth-v2.yml'
permissions:
  contents: write
jobs:
  patch-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: relationship-depth-v2-20260829
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Python dependencies
        run: pip install -r api/requirements.txt
      - name: Apply relationship patch
        run: python scripts/relationship_depth_v2_patch.py
      - name: Compile engines
        run: python -m py_compile relationship_western_v1.py relationship_saju_v1.py api/main.py
      - name: Run deterministic relationship smoke
        run: |
          python - <<'PY'
          from datetime import date,time
          from relationship_western_v1 import build_relationship_western
          from relationship_saju_v1 import build_relationship_saju
          a={'birth_date':date(1991,3,21),'birth_time':time(7,26),'time_known':True,'latitude':34.76,'longitude':127.66,'utc_offset_hours':9}
          b={'birth_date':date(1992,2,9),'birth_time':None,'time_known':False,'latitude':None,'longitude':None,'utc_offset_hours':9}
          r=build_relationship_western(a,b,[(date(2026,9,1),date(2026,9,30))])
          assert r['relationship_focus']['available']
          assert 'communication' in r['relationship_focus']['groups']
          assert not r['house_overlays']['available']
          assert r['relationship_transits']['available']
          s=build_relationship_saju(a,b)
          assert s['available'] and s['spouse_palace']['relations']
          assert s['counterpart']['hour'] is None
          print('RELATIONSHIP_DEPTH_SMOKE=PASS')
          PY
      - name: Build web
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Commit implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add relationship_western_v1.py api/main.py
          git diff --cached --quiet && exit 0
          git commit -m 'feat: deepen compatibility and marriage calculations'
          git push origin HEAD:relationship-depth-v2-20260829
