name: Apply reunion evidence contract v1

on:
  push:
    branches:
      - feat/reunion-evidence-contract-v1

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/reunion-evidence-contract-v1
          fetch-depth: 0
      - name: Apply patch
        run: python scripts/apply_reunion_evidence_contract_v1.py
      - name: Install focused test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Syntax and focused contract test
        run: |
          python -m py_compile relationship_western_v1.py relationship_evidence_contract_v1.py
          python -m pytest -q tests/test_relationship_evidence_contract_v1.py
      - name: Remove temporary runner
        run: |
          rm scripts/apply_reunion_evidence_contract_v1.py
          rm .github/workflows/apply-reunion-evidence-contract-v1.yml
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: thread normalized reunion evidence contract"
          git push origin HEAD:feat/reunion-evidence-contract-v1
