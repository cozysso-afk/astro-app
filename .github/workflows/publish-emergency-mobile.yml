name: Publish Emergency Mobile Build

on:
  push:
    branches:
      - main
    paths:
      - 'web/**'
      - '.github/workflows/publish-emergency-mobile.yml'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build latest mobile app
        working-directory: web
        run: |
          npm ci
          npm run build -- --base=/astro-app/mobile/
      - name: Publish generated mobile build to the single review branch
        shell: bash
        run: |
          set -euo pipefail
          BRANCH="deploy/mobile-pages-latest"
          rm -rf mobile
          mkdir -p mobile
          cp -R web/dist/. mobile/
          touch mobile/.nojekyll
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f mobile
          git checkout -B "$BRANCH"
          git commit --allow-empty -m 'deploy: refresh mobile frontend on GitHub Pages [skip render]'
          git push --force origin "HEAD:refs/heads/$BRANCH"
          echo "Mobile review branch: $BRANCH"

      - name: Remove superseded generated and merged work branches
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapfile -t LEGACY_DEPLOY_BRANCHES < <(
            git ls-remote --heads origin 'refs/heads/deploy/mobile-pages-*' |
              awk '{sub("refs/heads/", "", $2); print $2}' |
              grep -E '^deploy/mobile-pages-[0-9a-f]{12}$' || true
          )
          mapfile -t MERGED_WORK_BRANCHES < <(
            gh pr list --state merged --limit 1000 --json headRefName \
              --jq '.[].headRefName' | sort -u
          )
          declare -A SEEN=()
          TO_DELETE=()
          for branch in "${LEGACY_DEPLOY_BRANCHES[@]}" "${MERGED_WORK_BRANCHES[@]}"; do
            case "$branch" in
              ''|'main'|'deploy/mobile-pages-latest') continue ;;
            esac
            if [[ -n "${SEEN[$branch]:-}" ]]; then
              continue
            fi
            SEEN[$branch]=1
            if git ls-remote --exit-code --heads origin "refs/heads/$branch" >/dev/null; then
              TO_DELETE+=("$branch")
            fi
          done
          for ((offset=0; offset<${#TO_DELETE[@]}; offset+=25)); do
            git push origin --delete "${TO_DELETE[@]:offset:25}"
          done
          echo "Removed ${#TO_DELETE[@]} superseded branches."
