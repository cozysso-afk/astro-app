name: Publish Emergency Mobile Build

on:
  push:
    branches:
      - main
    paths:
      - 'web/**'
      - '.github/workflows/publish-emergency-mobile.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build latest mobile app
        working-directory: web
        run: |
          npm ci
          npm run build -- --base=/astro-app/mobile/
      - name: Publish generated mobile build to review branch
        shell: bash
        run: |
          set -euo pipefail
          BRANCH="deploy/mobile-pages-${GITHUB_SHA:0:12}"
          rm -rf mobile
          mkdir -p mobile
          cp -R web/dist/. mobile/
          touch mobile/.nojekyll
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f mobile
          if git diff --cached --quiet; then
            echo 'Mobile build is already current.'
            exit 0
          fi
          git checkout -B "$BRANCH"
          git commit -m 'deploy: refresh mobile frontend on GitHub Pages [skip render]'
          git push --force-with-lease origin "HEAD:refs/heads/$BRANCH"
          echo "Mobile review branch: $BRANCH"
