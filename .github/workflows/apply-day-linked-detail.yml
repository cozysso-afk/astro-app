name: Apply Linked Day Detail Guard

on:
  push:
    branches:
      - work/integrated-interpretation-v2
    paths:
      - .github/workflows/apply-day-linked-detail.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/integrated-interpretation-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Link clock timing to W detail evidence
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('supabase/functions/fortune-interpret-v6-preview/qualityV2.ts')
          s=p.read_text(encoding='utf-8')
          old='''      const timedDecision=(data?.decisions??[]).some((d:any)=>/(?:[01]\\d|2[0-3]):[0-5]\\d/.test(String(d?.timing??"")));\n      if(!timedDecision)s5.push("오늘 시간대 행동 가이드 누락");\n      const detailEvidenceAvailable=Array.from(map.keys()).some((ref:any)=>String(ref).startsWith("W:detail:"));\n      if(detailEvidenceAvailable&&!refsUsed.some((ref:string)=>ref.startsWith("W:detail:")))s5.push("오늘 실제 시간대 계산근거 W:detail:* 미사용");\n'''
          new='''      const timedDecisions=(data?.decisions??[]).filter((d:any)=>/(?:[01]\\d|2[0-3]):[0-5]\\d/.test(String(d?.timing??"")));\n      if(!timedDecisions.length)s5.push("오늘 시간대 행동 가이드 누락");\n      const detailEvidenceAvailable=Array.from(map.keys()).some((ref:any)=>String(ref).startsWith("W:detail:"));\n      if(detailEvidenceAvailable&&timedDecisions.length&&!timedDecisions.some((d:any)=>(d?.evidence_refs??[]).some((ref:string)=>ref.startsWith("W:detail:"))))s5.push("오늘 시간대 행동 가이드에 실제 W:detail:* 근거 미연결");\n'''
          if old not in s: raise SystemExit('linked detail quality anchor missing')
          p.write_text(s.replace(old,new,1),encoding='utf-8')

          p=Path('supabase/functions/fortune-interpret-v6-preview/qualityPeriods.test.mjs')
          s=p.read_text(encoding='utf-8')
          s=s.replace('''  assert.match(missingIssues,/오늘 시간대 행동 가이드 누락/);\n  assert.match(missingIssues,/W:detail/);\n''','''  assert.match(missingIssues,/오늘 시간대 행동 가이드 누락/);\n''',1)
          old='''  data.decisions[0].timing="2026-09-03 08:00~09:30";\n  data.decisions[0].evidence_refs.push(detailRef);\n  const fixed=inspectInterpretationQuality(data,payload);\n'''
          new='''  data.decisions[0].timing="2026-09-03 08:00~09:30";\n  const unlinked=inspectInterpretationQuality(data,payload);\n  assert.equal(unlinked.ok,false);\n  const unlinkedIssues=unlinked.stages.flatMap(stage=>stage.issues??[]).join(" / ");\n  assert.match(unlinkedIssues,/시간대 행동 가이드에 실제 W:detail/);\n\n  data.decisions[0].evidence_refs.push(detailRef);\n  const fixed=inspectInterpretationQuality(data,payload);\n'''
          if old not in s: raise SystemExit('linked detail test anchor missing')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Full interpretation regression
        run: |
          node --experimental-strip-types --test supabase/functions/fortune-interpret-v6-preview/periodInstruction.test.mjs
          node --experimental-strip-types --test supabase/functions/fortune-interpret-v6-preview/qualityPeriods.test.mjs
          node --experimental-strip-types --test supabase/functions/fortune-interpret-v6-preview/integratedInterpretationV2.test.mjs
          node --experimental-strip-types --test supabase/functions/fortune-interpret-v6-preview/thaiContract.test.mjs
      - name: Web production build
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Commit linked day evidence guard
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/functions/fortune-interpret-v6-preview/qualityV2.ts supabase/functions/fortune-interpret-v6-preview/qualityPeriods.test.mjs
          git diff --cached --quiet && exit 0
          git commit -m 'feat(ai): tie day timing to intraday evidence'
          git push origin HEAD:work/integrated-interpretation-v2
