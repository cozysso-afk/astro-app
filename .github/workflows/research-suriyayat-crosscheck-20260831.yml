name: Research Suriyayat Crosscheck 2026-08-31

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/research-suriyayat-crosscheck-20260831.yml'

jobs:
  crosscheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Prepare exact-arcminute Suriyayat reference engine
        run: |
          # Pin the public MIT implementation source by commit/blob rather than npm latest.
          curl -fsSL 'https://raw.githubusercontent.com/kongesque/thai-astrology/main/dist/engine/astro-calculation.js' -o /tmp/astro-suriyayat-debug.js
          python - <<'PY'
          from pathlib import Path
          p=Path('/tmp/astro-suriyayat-debug.js')
          s=p.read_text(encoding='utf-8')
          old='''function getSignIndex(finalPos) {\n    const signIndex = Math.floor(Math.trunc(finalPos / 1800));\n    return signIndex === 12 ? 0 : signIndex;\n}'''
          new='''function getSignIndex(finalPos) {\n    return ((Math.trunc(finalPos) % 21600) + 21600) % 21600;\n}'''
          assert old in s, 'getSignIndex anchor changed upstream'
          s=s.replace(old,new,1)
          # Moon bypasses getSignIndex in this implementation; expose its wrapped arcminutes too.
          old_moon='''    const signIndex = Math.floor(wrappedLongitude / 1800);\n    const finalSignIndex = signIndex < 12 ? signIndex : 0;\n    return finalSignIndex;'''
          assert old_moon in s, 'moon return anchor changed upstream'
          s=s.replace(old_moon,'    return Math.trunc(wrappedLongitude);',1)
          p.write_text(s,encoding='utf-8')
          print('REFERENCE_ENGINE_INSTRUMENTED_EXACT_ARCMIN_PASS')
          PY

      - name: Compare myhora August 2026 Suriyayat vectors
        run: |
          node - <<'JS'
          const ref=require('/tmp/astro-suriyayat-debug.js')
          const planets=['sun','moon','mars','mercury','jupiter','venus','saturn','rahu','ketu','uranus']
          const fn={sun:ref.calculateSun,moon:ref.calculateMoon,mars:ref.calculateMars,mercury:ref.calculateMercury,jupiter:ref.calculateJupiter,venus:ref.calculateVenus,saturn:ref.calculateSaturn,rahu:ref.calculateRahu,ketu:ref.calculateKetu,uranus:ref.calculateUranus}
          const arc=(sign,deg,min)=>sign*1800+deg*60+min
          // myhora.com: Thai Suriyayat, August BE2569/2026, 24:00 Bangkok local mean time UTC+06:42.
          // Table legend explicitly defines each planet as sign / degree / arcminute.
          // Vectors were transcribed from the public August 2026 table and checked against ingress events.
          const vectors=[
            {label:'2026-08-01 24:00',day:1,expected:{sun:arc(3,14,49),moon:arc(10,23,11),mars:arc(1,28,36),mercury:arc(3,2,7),jupiter:arc(3,13,44),venus:arc(5,0,43),saturn:arc(11,14,42),rahu:arc(10,5,56),ketu:arc(8,9,12),uranus:arc(1,17,48)}},
            {label:'2026-08-02 24:00',day:2,expected:{sun:arc(3,15,45),moon:arc(11,6,13),mars:arc(1,29,18),mercury:arc(3,3,36),jupiter:arc(3,13,58),venus:arc(5,1,37),saturn:arc(11,14,40),rahu:arc(10,5,53),ketu:arc(8,8,40),uranus:arc(1,17,50)}},
            {label:'2026-08-04 24:00',day:4,expected:{sun:arc(3,17,40),moon:arc(0,3,1),mars:arc(2,0,38),mercury:arc(3,6,36),jupiter:arc(3,14,27),venus:arc(5,3,36),saturn:arc(11,14,35),rahu:arc(10,5,47),ketu:arc(8,7,36),uranus:arc(1,17,52)}},
          ]
          const fmt=x=>`${Math.floor(x/1800)}:${String(Math.floor((x%1800)/60)).padStart(2,'0')}:${String(x%60).padStart(2,'0')}`
          const dist=(a,b)=>{const d=Math.abs(a-b)%21600;return Math.min(d,21600-d)}
          for(const v of vectors){
            console.log('VECTOR',v.label)
            for(const mode of ['same-day-24','next-day-00']){
              const inputDay=mode==='same-day-24'?v.day:v.day+1
              const hour=mode==='same-day-24'?24:0
              const actual={}
              for(const p of planets) actual[p]=fn[p](8,2569,inputDay,hour,0)
              const deltas=Object.fromEntries(planets.map(p=>[p,dist(actual[p],v.expected[p])]))
              const exact=planets.filter(p=>deltas[p]<=1).length
              const near=planets.filter(p=>deltas[p]<=5).length
              const max=Math.max(...Object.values(deltas))
              console.log('MODE',mode,'exact<=1',exact,'near<=5',near,'max_delta_arcmin',max)
              for(const p of planets) console.log('POS',p,'actual',fmt(actual[p]),'expected',fmt(v.expected[p]),'delta',deltas[p])
            }
          }
          console.log('CROSSCHECK_COMPLETED_NO_PRODUCT_PROMOTION')
          JS

      - name: Verify published library sample remains stable
        run: |
          mkdir -p /tmp/thai-ref-package && cd /tmp/thai-ref-package
          npm init -y >/dev/null 2>&1
          npm install thai-astrology@latest >/dev/null 2>&1
          node - <<'JS'
          const ta=require('thai-astrology')
          const out=ta.generateThaiAstrologyChart({day:15,monthTh:9,yearBe:2566,hour:14,minute:45,province:'กรุงเทพมหานคร'})
          if(JSON.stringify(out.sunPosition)!==JSON.stringify([27,29])) throw new Error('published sample sun vector changed')
          console.log('PUBLISHED_SAMPLE_VECTOR_PASS',JSON.stringify(out.sunPosition))
          JS

      - name: Mark research only
        run: |
          echo 'RESEARCH_ONLY_NO_PRODUCT_WRITE_PASS'
          test "$GITHUB_REF_NAME" = 'work/full-year-thai-hardening-20260831'
