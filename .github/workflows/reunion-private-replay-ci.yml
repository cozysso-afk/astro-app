name: Reunion Private Replay CI

on:
  pull_request:
    paths:
      - '.github/workflows/reunion-private-replay-ci.yml'
      - 'scripts/reunion_long_policy_audit.py'
      - 'tests/test_reunion_long_policy_audit_v1.py'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  private-replay:
    name: Private aggregate reunion replay
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: api/requirements.txt

      - name: Install calculation dependencies
        run: python -m pip install -q -r api/requirements.txt

      - name: Fetch private replay requests with GitHub OIDC
        shell: bash
        run: |
          set -euo pipefail
          oidc_json="$(curl -fsS \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=reunion-audit-supabase")"
          oidc_token="$(python -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<<"${oidc_json}")"
          unset oidc_json
          curl -fsS -X POST \
            -H "Authorization: Bearer ${oidc_token}" \
            -H 'Content-Type: application/json' \
            'https://dbynfabwfcakxayyggzi.supabase.co/functions/v1/reunion-audit-request-v1' \
            -o /tmp/reunion_private_payload.json
          unset oidc_token
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('/tmp/reunion_private_payload.json').read_text())
          requests = payload.get('requests') or []
          if not requests:
              raise SystemExit('no private replay requests returned')
          Path('/tmp/reunion_private_requests.json').write_text(
              json.dumps(requests, ensure_ascii=False), encoding='utf-8'
          )
          print(f'private replay request count: {len(requests)}')
          PY
          chmod 600 /tmp/reunion_private_payload.json /tmp/reunion_private_requests.json

      - name: Run aggregate-only long-policy replay
        shell: bash
        run: |
          set -euo pipefail
          python scripts/reunion_long_policy_audit.py . \
            < /tmp/reunion_private_requests.json \
            > /tmp/reunion_private_result.json
          python - <<'PY'
          import json
          from pathlib import Path
          rows = json.loads(Path('/tmp/reunion_private_result.json').read_text())
          allowed_top = {
              'case_index', 'engine_version', 'policy_revision', 'baseline', 'variants',
              'determinism_digest', 'privacy',
          }
          for row in rows:
              extra = set(row) - allowed_top
              if extra:
                  raise SystemExit(f'unsafe replay output keys: {sorted(extra)}')
          print(json.dumps(rows, ensure_ascii=False, indent=2))
          PY

      - name: Remove private replay material
        if: always()
        shell: bash
        run: rm -f /tmp/reunion_private_payload.json /tmp/reunion_private_requests.json /tmp/reunion_private_result.json
