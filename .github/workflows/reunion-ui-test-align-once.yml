name: Align reunion UI regression test once

on:
  push:
    branches: [feat/reunion-ui-vnext]
    paths:
      - '.github/workflows/reunion-ui-test-align-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/reunion-ui-vnext
          fetch-depth: 0
      - name: Align stale activation UI assertion
        run: |
          python -c "from pathlib import Path; import base64; p=Path('web/src/lib/readingExperience.test.mjs'); s=p.read_text(); old=base64.b64decode('').decode(); new=base64.b64decode('').decode(); assert old in s, 'stale assertion block not found'; p.write_text(s.replace(old,new,1))"
      - name: Verify focused tests
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          node --test src/lib/readingExperience.test.mjs src/lib/reunionUiVnext.test.mjs
      - name: Commit test alignment
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/src/lib/readingExperience.test.mjs
          git commit -m 'test: align reunion activation UI contract'
          git push origin HEAD:feat/reunion-ui-vnext
