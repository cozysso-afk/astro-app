name: Apply Relationship E2E V10 Once

on:
  push:
    branches:
      - audit/relationship-e2e-v10
    paths:
      - '.github/workflows/apply-relationship-e2e-v10.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/relationship-e2e-v10
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Apply evidence pipeline patch
        run: python scripts/patch_relationship_e2e_v10.py
      - name: Contract tests
        run: |
          node --test web/src/lib/relationshipModeContract.test.mjs
          node --test web/src/lib/relationshipEvidencePipeline.test.mjs
          node --experimental-strip-types --check supabase/functions/relationship-interpret-v9-preview/index.ts
      - name: Web typecheck and production build
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Commit permanent V10 changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            supabase/functions/relationship-interpret-v9-preview/index.ts \
            web/src/lib/resultFormatters.ts \
            web/src/appTypes.ts \
            web/src/lib/readingCache.ts \
            web/src/lib/relationshipModeContract.test.mjs \
            web/src/lib/relationshipEvidencePipeline.test.mjs
          git diff --cached --check
          git commit -m 'fix(ai): preserve relationship calculation evidence end to end V10'
          git push origin HEAD:audit/relationship-e2e-v10
