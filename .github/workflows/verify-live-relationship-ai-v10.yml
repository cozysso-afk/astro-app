name: Verify live relationship AI v10
on:
  push:
    branches: [relationship-depth-v2-20260829]
    paths: ['.github/workflows/verify-live-relationship-ai-v10.yml']
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Build live calculations and authenticate
        run: |
          API='https://astro-app-api-f7fn.onrender.com'
          SUPA='https://dbynfabwfcakxayyggzi.supabase.co'
          KEY='sb_publishable_IEf9R9oJ5kbn513DdeqODQ_DwLeF35r'
          cat > /tmp/base.json <<'JSON'
          {"user":{"name":"A","birth_date":"1991-03-21","birth_time":"07:26:00","time_known":true,"latitude":34.76,"longitude":127.66,"utc_offset_hours":9},"counterpart":{"name":"B","birth_date":"1992-02-09","birth_time":null,"time_known":false,"latitude":null,"longitude":null,"utc_offset_hours":9},"start_date":"2027-01-01","end_date":"2027-12-31","relationship_status":"dating","analysis_mode":"compatibility"}
          JSON
          curl -fsS --max-time 90 -H 'Content-Type: application/json' --data-binary @/tmp/base.json "$API/v1/relationship/western" > /tmp/compat_calc.json
          python - <<'PY'
          import json
          b=json.load(open('/tmp/base.json')); b['analysis_mode']='marriage_unmarried'
          json.dump(b,open('/tmp/marriage.json','w'))
          PY
          curl -fsS --max-time 90 -H 'Content-Type: application/json' --data-binary @/tmp/marriage.json "$API/v1/relationship/western" > /tmp/marriage_calc.json
          curl -fsS --max-time 30 -X POST "$SUPA/auth/v1/signup" -H "apikey: $KEY" -H 'Content-Type: application/json' -d '{}' > /tmp/auth.json
          python - <<'PY'
          import json
          a=json.load(open('/tmp/auth.json')); assert a.get('access_token'),a
          open('/tmp/token','w').write(a['access_token'])
          PY
      - name: Verify compatibility AI depth
        run: |
          SUPA='https://dbynfabwfcakxayyggzi.supabase.co'; KEY='sb_publishable_IEf9R9oJ5kbn513DdeqODQ_DwLeF35r'; TOKEN=$(cat /tmp/token)
          python - <<'PY'
          import json
          calc=json.load(open('/tmp/compat_calc.json'))
          json.dump({'calculation':calc,'purpose':'compatibility','model':'gemini-3.7-flash'},open('/tmp/compat_ai_req.json','w'),ensure_ascii=False)
          PY
          curl -fsS --max-time 150 -H "apikey: $KEY" -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' --data-binary @/tmp/compat_ai_req.json "$SUPA/functions/v1/relationship-interpret-v9-preview" > /tmp/compat_ai.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/compat_ai.json')); assert d.get('ok') is True,d
          x=d['data']; assert len(x.get('overview',''))>=350
          for k in ['chemistry','emotional_dynamic','communication','conflict_pattern','power_boundaries','long_term']:
            assert len(x.get(k,'').strip())>=120,(k,x.get(k))
          assert len(x.get('felt_scenarios') or [])>=3
          assert len(x.get('top_aspects') or [])>=3
          assert d.get('interpreter_version')=='relationship-v10-compat-marriage-depth'
          print('LIVE_COMPAT_AI_V10=PASS',len(x['overview']))
          PY
      - name: Verify unmarried marriage AI depth
        run: |
          SUPA='https://dbynfabwfcakxayyggzi.supabase.co'; KEY='sb_publishable_IEf9R9oJ5kbn513DdeqODQ_DwLeF35r'; TOKEN=$(cat /tmp/token)
          python - <<'PY'
          import json
          calc=json.load(open('/tmp/marriage_calc.json'))
          json.dump({'calculation':calc,'purpose':'marriage_unmarried','model':'gemini-3.7-flash'},open('/tmp/marriage_ai_req.json','w'),ensure_ascii=False)
          PY
          curl -fsS --max-time 150 -H "apikey: $KEY" -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' --data-binary @/tmp/marriage_ai_req.json "$SUPA/functions/v1/relationship-interpret-v9-preview" > /tmp/marriage_ai.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/marriage_ai.json')); assert d.get('ok') is True,d
          x=d['data']; m=x.get('marriage_reading') or {}
          for k in ['bottom_line','bond','emotional_home','daily_life','conflict_repair','commitment_or_current_cycle','timing','caution']:
            assert len(m.get(k,'').strip())>=120,(k,m.get(k))
          assert d.get('interpreter_version')=='relationship-v10-compat-marriage-depth'
          print('LIVE_MARRIAGE_AI_V10=PASS',len(m['bottom_line']))
          PY
