name: PR186 period hero priority patch

on:
  push:
    branches: [fix/reunion-hierarchy-v2]
    paths:
      - scripts/pr186_fix_period_hero_priority.py
      - .github/workflows/pr186-period-hero-priority.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/reunion-hierarchy-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply guarded patch
        run: python scripts/pr186_fix_period_hero_priority.py
      - name: Install web dependencies
        run: npm --prefix web ci
      - name: Run interpretation contract tests
        run: node --experimental-strip-types --test web/src/lib/interpretationUiContract.test.mjs web/src/lib/humanLanguageV25.test.mjs
      - name: Build web
        run: npm --prefix web run build
      - name: Commit verified source changes
        run: |
          if git diff --quiet -- web/src/PeriodAiInterpretationPanel.tsx web/src/lib/fortuneUserSummary.ts web/src/lib/interpretationUiContract.test.mjs; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/src/PeriodAiInterpretationPanel.tsx web/src/lib/fortuneUserSummary.ts web/src/lib/interpretationUiContract.test.mjs
          git commit -m 'fix: keep daily and weekly semantic hero copy stable'
          git push origin HEAD:fix/reunion-hierarchy-v2
