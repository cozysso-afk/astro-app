name: Audit Integrated Fortune E2E V11 Once
# rerun after legacy version assertion fix
on:
  push:
    branches:
      - audit/integrated-fortune-e2e-v11
    paths:
      - '.github/workflows/audit-integrated-e2e-v11-once.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/integrated-fortune-e2e-v11
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Apply V11 evidence patch
        run: python scripts/patch_integrated_fortune_e2e_v11.py
      - name: Run V21/V11 interpretation contracts
        run: |
          node --experimental-strip-types --test supabase/functions/fortune-interpret-v21-preview/costGuardV21.test.mjs
          node --experimental-strip-types --check supabase/functions/fortune-interpret-v21-preview/index.ts
      - name: Build production web
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Commit permanent V11 files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            supabase/functions/fortune-interpret-v21-preview/index.ts \
            supabase/functions/fortune-interpret-v21-preview/costGuardV21.ts \
            supabase/functions/fortune-interpret-v21-preview/costGuardV21.test.mjs \
            web/src/lib/readingCache.ts
          git diff --cached --check
          git commit -m 'fix(ai): preserve integrated fortune evidence end to end V11'
          git push origin HEAD:audit/integrated-fortune-e2e-v11
