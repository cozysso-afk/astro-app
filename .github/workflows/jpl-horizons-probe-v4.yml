name: JPL Horizons V4 Probe

on:
  push:
    branches:
      - audit/planet-jpl-gold-v4
    paths:
      - 'scripts/jpl_horizons_probe_v4.py'
      - '.github/workflows/jpl-horizons-probe-v4.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: api/requirements.txt
      - name: Install calculation dependencies
        run: python -m pip install -q -r api/requirements.txt
      - name: Fetch JPL Horizons gold candidates
        run: PYTHONPATH=. python scripts/jpl_horizons_probe_v4.py
