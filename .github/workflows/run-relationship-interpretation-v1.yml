name: Run Relationship Interpretation v1

on:
  push:
    paths:
      - '.github/workflows/run-relationship-interpretation-v1.yml'

permissions:
  contents: write

jobs:
  patch-build-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Apply patch
        run: python scripts/upgrade_relationship_interpretation_v1.py
      - name: Build mobile
        working-directory: web
        run: |
          npm ci
          npm run build -- --base=/astro-app/mobile/
      - name: Publish emergency mobile and commit source
        shell: bash
        run: |
          rm -rf mobile
          mkdir -p mobile
          cp -R web/dist/. mobile/
          touch mobile/.nojekyll
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/src/AppNext.tsx web/src/main.tsx web/src/relationship-analysis.css mobile
          git commit -m 'feat: add real relationship interpretation layer'
          git push
