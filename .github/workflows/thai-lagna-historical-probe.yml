name: Thai Lagna historical probe

on:
  push:
    branches:
      - feature/thai-lagna-phase1-real-20260831
    paths:
      - .github/workflows/thai-lagna-historical-probe.yml

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/thai-lagna-phase1-real-20260831
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pyswisseph==2.10.3.2
      - name: Compare seven independent MyHora vectors
        run: |
          python - <<'PY'
          from datetime import date,time
          from thai_lagna_v1 import calculate_common_anto_0600,calculate_astronomical_suriyayat_candidate,angular_delta_deg
          lat,lon,utc=13.752555,100.494066,7.0
          def d(s,x,m): return s*30+x+m/60
          refs=[
            ('1777-05-14 06:42',date(1777,5,14),time(6,42),d(1,16,19),d(1,10,41),d(1,14,40)),
            ('1862-03-06 00:00',date(1862,3,6),time(0,0),d(7,10,31),d(7,6,45),d(7,13,14)),
            ('1871-01-22 23:41',date(1871,1,22),time(23,41),d(6,14,3),d(6,10,50),d(6,0,4)),
            ('1959-07-01 00:18',date(1959,7,1),time(0,18),d(11,7,21),d(11,2,51),d(11,16,28)),
            ('2026-01-07 08:09',date(2026,1,7),time(8,9),d(10,8,17),d(10,2,39),d(9,13,17)),
            ('2026-03-24 14:15',date(2026,3,24),time(14,15),d(4,0,59),d(3,26,41),d(3,9,25)),
            ('2026-04-20 23:42',date(2026,4,20),time(23,42),d(8,14,5),d(8,9,35),d(8,18,44)),
          ]
          allc=[]; alll=[]; alla=[]
          for label,day,tm,rc,rl,ra in refs:
            c=calculate_common_anto_0600(birth_date=day,birth_time=tm,longitude=lon,utc_offset_hours=utc,adjust_local_mean_time=False)
            l=calculate_common_anto_0600(birth_date=day,birth_time=tm,longitude=lon,utc_offset_hours=utc,adjust_local_mean_time=True)
            a=calculate_astronomical_suriyayat_candidate(birth_date=day,birth_time=tm,latitude=lat,longitude=lon,utc_offset_hours=utc)
            ec=abs(angular_delta_deg(c['longitude_deg'],rc))*60
            el=abs(angular_delta_deg(l['longitude_deg'],rl))*60
            ea=abs(angular_delta_deg(a['longitude_deg'],ra))*60
            allc.append(ec);alll.append(el);alla.append(ea)
            print(label,'common=',round(ec,3),'lmt=',round(el,3),'astro=',round(ea,3),'arcmin')
          for name,arr in [('COMMON',allc),('LMT',alll),('ASTRO',alla)]:
            print(name,'max=',round(max(arr),3),'mean=',round(sum(arr)/len(arr),3),'errors=',[round(x,3) for x in arr])
          PY
