name: Quality pure validator patch

on:
  push:
    paths:
      - "scripts/patch_quality_pure_validator_once.py"
      - ".github/workflows/quality-pure-validator-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/quality-v6-pure-validator
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/patch_quality_pure_validator_once.py
      - run: git diff --check
      - name: Commit patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/fortune-interpret-v6-preview/qualityV2.ts supabase/functions/fortune-interpret-v6-preview/qualityV23TimingRepair.test.mjs supabase/functions/fortune-interpret-v23-preview/index.ts
          git commit -m "refactor: make Quality V6 validation non-mutating"
          git push origin HEAD:refactor/quality-v6-pure-validator
