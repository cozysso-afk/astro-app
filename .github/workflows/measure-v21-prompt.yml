name: Measure V21 Prompt Cost

on:
  pull_request:
    paths:
      - 'supabase/functions/fortune-interpret-v21-preview/**'
      - '.github/workflows/measure-v21-prompt.yml'

permissions:
  contents: write

jobs:
  measure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install deterministic calculation dependencies
        run: pip install -q -r requirements.txt
      - name: Build real 365-day fixture without Gemini
        run: |
          python - <<'PY'
          import json
          from datetime import date, time
          from integrated_fortune_v1 import build_integrated_fortune
          calc = build_integrated_fortune(
              birth_date=date(1990,1,1), birth_time=time(12,0),
              latitude=37.5665, longitude=126.9780, utc_offset_hours=9.0,
              gender='female', start_date=date(2026,9,3), end_date=date(2027,9,2),
          )
          with open('/tmp/v21-real-calc.json','w',encoding='utf-8') as f:
              json.dump(calc,f,ensure_ascii=False,separators=(',',':'))
          PY
      - name: Measure V20 packet vs V21 prompt packet
        run: |
          node --experimental-strip-types --input-type=module <<'JS'
          import fs from 'node:fs';
          import { compactCalculation } from './supabase/functions/fortune-interpret-v6-preview/integratedInterpretationV2.ts';
          import { buildPromptPacket, promptBudget, buildExternalPrompt } from './supabase/functions/fortune-interpret-v21-preview/costGuardV21.ts';
          const calc=JSON.parse(fs.readFileSync('/tmp/v21-real-calc.json','utf8'));
          const v20=compactCalculation(calc);
          const v21=buildPromptPacket(v20);
          const budget=promptBudget(v20);
          const external=buildExternalPrompt(v20);
          const bytes=(x)=>Buffer.byteLength(JSON.stringify(x));
          const report={
            measured_at:'2026-09-03',fixture:'1990-01-01 12:00 Seoul / 2026-09-03~2027-09-02',
            raw_calculation_bytes:bytes(calc),v20_packet_bytes:bytes(v20),v21_prompt_packet_bytes:bytes(v21),
            reduction_vs_v20_pct:Number(((1-bytes(v21)/bytes(v20))*100).toFixed(1)),
            reduction_vs_raw_pct:Number(((1-bytes(v21)/bytes(calc))*100).toFixed(1)),
            estimated_v21_input_tokens:budget.estimated_input_tokens,max_prompt_bytes:budget.max_bytes,budget_ok:budget.ok,
            v20_daily_rows:v20?.western?.daily_score_matrix?.rows?.length??0,v21_has_daily_matrix:Boolean(v21?.western?.daily_score_matrix),
            v20_evidence_rows:v20?.evidence_ledger?.length??0,v21_evidence_rows:v21?.evidence_ledger?.length??0,
            external_prompt_bytes:Buffer.byteLength(external.text),
          };
          fs.writeFileSync('.github/v21-measurement-result.json',JSON.stringify(report,null,2)+'\n');
          if(!report.budget_ok||report.v21_has_daily_matrix||report.reduction_vs_v20_pct<55)process.exit(4);
          JS
      - name: Persist one-time measurement result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/v21-measurement-result.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore(ai): record one-time V21 prompt measurement'
          git push origin HEAD:${{ github.head_ref }}
