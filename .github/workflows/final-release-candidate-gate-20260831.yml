name: Final Release Candidate Gate 2026-08-31

on:
  push:
    branches:
      - work/full-year-thai-hardening-20260831
    paths:
      - '.github/workflows/final-release-candidate-gate-20260831.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  final-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/full-year-thai-hardening-20260831
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: api/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Minimize release diff
        run: |
          git fetch origin main
          git checkout origin/main -- supabase/functions/fortune-interpret/index.ts
          python - <<'PY'
          from pathlib import Path
          p=Path('ai_interpret_v1.py')
          s=p.read_text(encoding='utf-8')
          old='Thai 출생요일·Mahathaksa·Taksajorn의 실제 계산 범위와 Suriyayat 미구현 한계'
          new='Thai 출생요일·Mahathaksa·Taksajorn과 검증된 Suriyayat 10행성 위치 사실층, Suriyayat Lagna 미구현 한계'
          if old in s:
              s=s.replace(old,new)
          if 'Suriyayat 미구현 한계' in s:
              raise SystemExit('stale Suriyayat wording survived')
          p.write_text(s,encoding='utf-8')
          PY
          git rm .github/workflows/final-release-candidate-gate-20260831.yml

      - name: Install calculation dependencies
        run: pip install -r api/requirements.txt

      - name: Compile Python product modules
        run: |
          python -m py_compile integrated_fortune_v1.py relationship_western_v1.py thai_astrology_v2.py thai_suriyayat_v1.py ai_interpret_v1.py api/main.py

      - name: Check AI Edge Function TypeScript
        run: |
          deno check supabase/functions/fortune-interpret-v6-preview/core.ts
          deno check supabase/functions/fortune-interpret-v6-preview/index.ts
          deno check supabase/functions/relationship-interpret-v9-preview/index.ts

      - name: Verify scalar and vector ephemeris equivalence
        run: |
          python - <<'PY'
          from datetime import datetime, timezone
          import integrated_fortune_v1 as f
          moments=[
            datetime(2026,1,3,1,0,tzinfo=timezone.utc),
            datetime(2026,4,18,5,30,tzinfo=timezone.utc),
            datetime(2026,8,31,10,0,tzinfo=timezone.utc),
            datetime(2026,12,25,13,0,tzinfo=timezone.utc),
          ]
          f._PLANET_PREWARM_LOCAL.values={}
          max_diff=0.0
          for body in ['Sun','Moon','Mercury','Venus','Mars','Jupiter','Saturn','Uranus','Neptune','Pluto']:
              vec=f._vectorized_planet_longitudes(body,moments)
              for moment in moments:
                  scalar=f._planet_lon.__wrapped__(body,moment)
                  diff=abs(vec[(body,moment)]-scalar)
                  max_diff=max(max_diff,diff)
                  assert diff < 1e-10,(body,moment,diff)
          print('EPHEMERIS_EQUIVALENCE_PASS',max_diff)
          PY

      - name: Verify full 365-day integrated fortune
        run: |
          python - <<'PY'
          import json,time,resource
          from datetime import date,time as dt_time
          import integrated_fortune_v1 as f
          t0=time.perf_counter()
          r=f.build_integrated_fortune(
            birth_date=date(1991,3,21),birth_time=dt_time(7,26),latitude=34.7604,longitude=127.6622,
            utc_offset_hours=9,gender='female',start_date=date(2026,1,1),end_date=date(2026,12,31))
          elapsed=time.perf_counter()-t0
          rss=resource.getrusage(resource.RUSAGE_SELF).ru_maxrss/1024
          assert r['period']['day_count']==365
          assert len(r['western']['months'])==12
          assert r['western']['overall']['대인관계']['average'] is not None
          assert r['western']['overall']['연락']['average'] is not None
          for key in ['수신신호','발신적합','과거인연접점']:
              assert r['western']['relationship_signals'][key]['average'] is not None
          assert r['western']['performance']['vector_ephemeris_prewarm'] is True
          assert r['saju']['ok'] is True
          assert len(r['saju']['monthly']) >= 12
          assert all(x.get('segment_start') and x.get('segment_end_exclusive') for x in r['saju']['monthly'])
          assert all(x.get('segment_start') and x.get('segment_end_exclusive') for x in r['saju']['annual'])
          th=r['thai']
          assert th['mahathaksa']['available'] is True
          assert th['taksajorn']['available'] is True
          assert th['suriyayat']['available'] is True
          assert th['suriyayat']['lagna']['available'] is False
          assert int(th['suriyayat']['validation']['max_delta_arcmin'])==4
          with open('/tmp/annual-calc.json','w',encoding='utf-8') as out: json.dump(r,out,ensure_ascii=False)
          print(f'ANNUAL_365_PASS elapsed={elapsed:.3f}s maxrss={rss:.1f}MiB engine={r["engine"]}')
          PY

      - name: Verify exact Jie and LiChun boundaries
        run: |
          python - <<'PY'
          from datetime import date,time
          import integrated_fortune_v1 as f
          r=f.build_integrated_fortune(
            birth_date=date(1991,3,21),birth_time=time(7,26),latitude=34.7604,longitude=127.6622,
            utc_offset_hours=9,gender='female',start_date=date(2026,8,1),end_date=date(2026,8,31))
          seg=r['saju']['monthly']
          assert len(seg)>=2,seg
          assert any(x['ganzhi']=='乙未' for x in seg),seg
          assert any(x['ganzhi']=='丙申' for x in seg),seg
          boundary=[x for x in seg if x['ganzhi']=='丙申'][0]['segment_start']
          assert boundary.startswith('2026-08-07T20:42:43'),boundary
          print('SAJU_EXACT_JIE_PASS',boundary)
          PY

      - name: Verify Thai weekday Mahathaksa Taksajorn
        run: |
          python - <<'PY'
          from datetime import date,time
          import thai_astrology_v2 as t
          assert t._thai_day_key(date(2026,8,26),time(12,0))=='wednesday_day'
          assert t._thai_day_key(date(2026,8,26),time(20,0))=='wednesday_night'
          assert t._thai_day_key(date(2026,8,27),time(3,0))=='wednesday_night'
          assert t._thai_day_key(date(2026,8,27),time(7,0))=='thursday'
          wheel=t._wheel('moon')
          assert len(wheel)==8 and len({x['bhumi_key'] for x in wheel})==8
          planet,center=t._annual_boriwan('moon',47)
          assert planet=='mars' and center is False
          print('THAI_TRADITIONAL_LAYERS_PASS')
          PY

      - name: Verify relationship purpose scope and Whole Sign plus Placidus
        run: |
          python - <<'PY'
          from datetime import date,time
          from relationship_western_v1 import build_relationship_western
          from api.main import _month_segments
          a={'name':'A','birth_date':date(1991,3,21),'birth_time':time(7,26),'time_known':True,'latitude':34.7604,'longitude':127.6622,'utc_offset_hours':9}
          b={'name':'B','birth_date':date(1992,2,9),'birth_time':time(10,15),'time_known':True,'latitude':35.1595,'longitude':126.8526,'utc_offset_hours':9}
          seg=_month_segments(date(2026,1,1),date(2026,12,31))
          c=build_relationship_western(a,b,seg,analysis_mode='compatibility')
          assert c['ok'] is True
          assert c['daily_transit_policy']['reunion_scan']=='skipped'
          assert 'reunion_transits' not in c and 'relationship_transits' not in c
          h=c['house_overlays']
          assert h['available'] is True
          for direction in ['user_in_counterpart','counterpart_in_user']:
              d=h[direction]
              assert d['available'] is True
              assert d['systems']==['Whole Sign','Placidus']
              assert d['all']
              assert all(x.get('whole_house') and x.get('placidus_house') for x in d['all'])
          rr=build_relationship_western(a,b,seg,analysis_mode='reunion')
          assert rr['daily_transit_policy']['reunion_scan']=='enabled'
          assert rr['reunion_transits']['available'] is True
          assert rr['reunion_transits']['directional_context']['period']=={'start':'2026-01-01','end':'2026-12-31'}
          assert rr['reunion_transits']['top_days']
          print('RELATIONSHIP_SCOPE_AND_DUAL_HOUSE_PASS')
          PY

      - name: Verify unknown-time relationship safety
        run: |
          python - <<'PY'
          from datetime import date,time
          from relationship_western_v1 import build_relationship_western
          from api.main import _month_segments
          a={'name':'A','birth_date':date(1991,3,21),'birth_time':time(7,26),'time_known':True,'latitude':34.7604,'longitude':127.6622,'utc_offset_hours':9}
          b={'name':'B','birth_date':date(1992,2,9),'birth_time':None,'time_known':False,'latitude':None,'longitude':None,'utc_offset_hours':9}
          r=build_relationship_western(a,b,_month_segments(date(2026,8,1),date(2027,7,31)),analysis_mode='reunion')
          assert r['ok'] is True
          assert r['natal_synastry']['partner_time_exact'] is False
          assert r['house_overlays']['available'] is False
          assert r['reunion_transits']['available'] is True
          cp_sensitive=[x for x in r['natal_synastry']['aspects'] if x.get('b') in {'Moon','ASC','DSC','MC','IC'}]
          assert not cp_sensitive,cp_sensitive[:3]
          print('UNKNOWN_TIME_RELATIONSHIP_SAFE_PASS')
          PY

      - name: Verify calculation job dedupe and public response hygiene
        run: |
          python - <<'PY'
          import time as tm
          from datetime import date,time
          import api.main as m
          req=m.IntegratedFortuneRequest(
            profile=m.FortuneProfile(name='A',birth_date=date(1991,3,21),birth_time=time(7,26),latitude=34.7604,longitude=127.6622,utc_offset_hours=9,gender='female'),
            start_date=date(2026,1,1),end_date=date(2026,12,31))
          payload={'birth_date':req.profile.birth_date,'birth_time':req.profile.birth_time,'latitude':req.profile.latitude,'longitude':req.profile.longitude,'utc_offset_hours':req.profile.utc_offset_hours,'gender':req.profile.gender,'start_date':req.start_date,'end_date':req.end_date}
          key=m._calc_request_key(payload)
          with m._calc_jobs_lock:
              m._calc_jobs.clear();m._calc_request_index.clear()
              m._calc_jobs['existing']={'created_ts':tm.time(),'status':'running','request_key':key,'progress':{'completed':10,'total':365,'percent':3}}
              m._calc_request_index[key]='existing'
          out=m.fortune_integrated_start(req)
          assert out['job_id']=='existing' and out['reused'] is True
          public=m.fortune_integrated_job('existing')
          assert 'request_key' not in public
          print('JOB_DEDUPE_AND_HYGIENE_PASS')
          PY

      - name: Verify annual AI compact payload without Gemini
        run: |
          cat > /tmp/verify-v6.ts <<'TS'
          import {compactCalculation,payloadHash,SYSTEM,VERSION} from './supabase/functions/fortune-interpret-v6-preview/core.ts';
          const calc=JSON.parse(await Deno.readTextFile('/tmp/annual-calc.json'));
          const p=compactCalculation(calc);
          const bytes=new TextEncoder().encode(JSON.stringify(p)).byteLength;
          const h=await payloadHash(p);
          if(bytes>=90000) throw new Error(`payload too large ${bytes}`);
          if(!p.thai.mahathaksa?.available||!p.thai.taksajorn?.available||!p.thai.suriyayat?.available) throw new Error('Thai layers missing');
          if(p.thai.suriyayat?.lagna?.available!==false) throw new Error('unvalidated Lagna enabled');
          if(!p.saju.monthly.every((x:any)=>x.segment_start&&x.segment_end_exclusive)) throw new Error('Jie segments missing');
          if(SYSTEM.includes('출생요일 기준만 구현')) throw new Error('stale Thai prompt');
          console.log('AI_V6_PAYLOAD_PASS',VERSION,bytes,h.slice(0,16));
          TS
          deno run --allow-read /tmp/verify-v6.ts
          test -z "${GEMINI_API_KEY:-}"
          echo GEMINI_CREDIT_ZERO_PASS

      - name: Build frontend
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Verify frontend and interpretation markers
        run: |
          ! grep -q 'fortune-interpret-v5-preview' web/src/AppNext.tsx
          grep -q 'fortune-interpret-v6-preview' web/src/AppNext.tsx
          grep -q 'Whole Sign(홀사인)' supabase/functions/relationship-interpret-v9-preview/index.ts
          grep -q 'Suriyayat 10행성 위치 사실층' ai_interpret_v1.py
          grep -q 'Suriyayat Lagna' web/src/AppNext.tsx
          echo FRONTEND_AND_PROMPT_MARKERS_PASS

      - name: Verify final minimal diff allowlist
        run: |
          git diff --name-only origin/main...HEAD > /tmp/committed.txt
          git diff --name-only >> /tmp/working.txt
          cat /tmp/committed.txt /tmp/working.txt | sort -u | grep -v '^$' > /tmp/all.txt
          cat >/tmp/allowed.txt <<'EOF'
          .github/workflows/api-integrated-smoke.yml
          ai_interpret_v1.py
          api/main.py
          integrated_fortune_v1.py
          relationship_western_v1.py
          supabase/functions/fortune-interpret-v6-preview/core.ts
          supabase/functions/fortune-interpret-v6-preview/index.ts
          supabase/functions/relationship-interpret-v9-preview/index.ts
          thai_astrology_v2.py
          thai_suriyayat_v1.py
          web/src/AppNext.tsx
          EOF
          sort -u /tmp/allowed.txt -o /tmp/allowed.txt
          echo 'FINAL_DIFF:'; cat /tmp/all.txt
          extra=$(comm -23 /tmp/all.txt /tmp/allowed.txt || true)
          missing=$(comm -13 /tmp/all.txt /tmp/allowed.txt || true)
          test -z "$extra" || { echo "Unexpected files: $extra"; exit 1; }
          test -z "$missing" || { echo "Expected files missing: $missing"; exit 1; }
          echo FINAL_MINIMAL_DIFF_PASS

      - name: Commit final release candidate to work branch only
        run: |
          git config user.name "cozysso-afk"
          git config user.email "cozysso@gmail.com"
          git add -A
          git commit -m 'candidate: finalize annual Thai and AI v6 release'
          git push origin HEAD:work/full-year-thai-hardening-20260831
          echo FINAL_RC_COMMITTED_NO_PRODUCTION_CALLS
