name: Refactor AppNext reunion panels once

on:
  push:
    branches:
      - refactor/appnext-reunion-panels-20260901

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/appnext-reunion-panels-20260901
          fetch-depth: 0

      - name: Extract reunion timing and transit panels
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          app_path = Path('web/src/AppNext.tsx')
          panel_path = Path('web/src/ReunionPanels.tsx')
          workflow_path = Path('.github/workflows/refactor-appnext-reunion-panels-once.yml')

          original = app_path.read_text()
          text = original

          timing_start = text.index('function reunionScoreBand')
          timing_end = text.index('async function copyToClipboard', timing_start)
          timing_block = text[timing_start:timing_end].rstrip()
          if timing_block.count('function ReunionTimingPanel') != 1:
              raise SystemExit('Unexpected ReunionTimingPanel block')
          timing_block = timing_block.replace('function ReunionTimingPanel', 'export function ReunionTimingPanel', 1)
          text = text[:timing_start] + text[timing_end:]

          transit_start = text.index('function ReunionTransitPanel')
          transit_end = text.index('export default function AppNext', transit_start)
          transit_block = text[transit_start:transit_end].rstrip()
          if transit_block.count('function ReunionTransitPanel') != 1:
              raise SystemExit('Unexpected ReunionTransitPanel block')
          transit_block = transit_block.replace('function ReunionTransitPanel', 'export function ReunionTransitPanel', 1)
          text = text[:transit_start] + text[transit_end:]

          panel_path.write_text(
              "import { AlertTriangle, LoaderCircle } from 'lucide-react'\n"
              "import type { RelationshipApiResponse, ReunionTimingContext } from './appTypes'\n\n"
              + timing_block + '\n\n' + transit_block + '\n'
          )

          import_anchor = "import { RelationshipInterpretationPanel } from './RelationshipInterpretationPanel'\n"
          if import_anchor not in text:
              raise SystemExit('Relationship panel import anchor missing')
          text = text.replace(import_anchor, import_anchor + "import { ReunionTimingPanel, ReunionTransitPanel } from './ReunionPanels'\n", 1)

          app_path.write_text(text)
          workflow_path.unlink()

          print(f'AppNext bytes: {len(original.encode())} -> {len(text.encode())}')
          print(f'ReunionPanels bytes: {len(panel_path.read_bytes())}')
          PY

      - name: Build web
        working-directory: web
        run: npm ci && npm run build

      - name: Commit refactor
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/src/AppNext.tsx web/src/ReunionPanels.tsx .github/workflows/refactor-appnext-reunion-panels-once.yml
          git diff --cached --check
          git commit -m "refactor(web): extract reunion timing and transit panels"
          git push origin HEAD:refactor/appnext-reunion-panels-20260901
