name: Fix and apply Fortune Lab v0.1.6 refinement

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-fortune-ui-v716-fix.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair patcher quoting
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/refine_fortune_ui_v716.py')
          s=p.read_text(encoding='utf-8')
          old1="cards.append(f'''<div class=\"fortune-month-card\">"
          new1='cards.append(f"""<div class="fortune-month-card">'
          old2="</div>''')\n    st.markdown('<div class=\"fortune-month-stack\">'"
          new2='</div>""")\n    st.markdown(\'<div class="fortune-month-stack">\''
          if old1 not in s or old2 not in s:
              raise SystemExit('quote markers not found')
          s=s.replace(old1,new1,1).replace(old2,new2,1)
          p.write_text(s,encoding='utf-8')
          PY
          python -m py_compile scripts/refine_fortune_ui_v716.py

      - name: Apply UI refinement
        run: python scripts/refine_fortune_ui_v716.py

      - name: Syntax check
        run: python -m py_compile app.py fortune_lab_v71.py scripts/refine_fortune_ui_v716.py

      - name: Verify navigation and compatibility markers
        shell: bash
        run: |
          grep -q 'main_nav_period_' app.py
          grep -q 'main_nav_tool_' app.py
          ! grep -q 'main_view=st.radio("메뉴"' app.py
          grep -q '"mode":"compatibility" if main_view=="궁합운" else "general"' app.py
          grep -q 'FORTUNE_LAB_VERSION = "v0.1.6"' fortune_lab_v71.py
          grep -q 'COMPATIBILITY_TOPICS' fortune_lab_v71.py
          grep -q '궁합운에서 볼 것' fortune_lab_v71.py
          grep -q 'def _render_month_timeline' fortune_lab_v71.py
          ! grep -q '분석 방식' fortune_lab_v71.py

      - name: Diff sanity
        run: git diff --check

      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py fortune_lab_v71.py scripts/refine_fortune_ui_v716.py
          git commit -m "feat: clarify navigation and compatibility UI"
          git push origin HEAD:main
