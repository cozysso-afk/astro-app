name: PR186 interpretation v24 patch

on:
  push:
    branches:
      - fix/reunion-hierarchy-v2
    paths:
      - scripts/apply_interpretation_v24_human_language.py
      - scripts/apply_interpretation_v24_provisional_time.py
      - .github/workflows/pr186-interpretation-v24-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/reunion-hierarchy-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Apply guarded patches
        run: |
          python scripts/apply_interpretation_v24_human_language.py
          if grep -q "partnerExact, angleTimeAvailable, ai" web/src/RelationshipInterpretationPanel.tsx \
            && grep -q "timePrecisionNote" web/src/lib/relationshipUserSummary.ts \
            && grep -q "angleTimeAvailable=" web/src/AppNext.tsx; then
            echo 'Provisional-time source patch already applied; skipping.'
          else
            python scripts/apply_interpretation_v24_provisional_time.py
          fi
      - name: Install web dependencies
        working-directory: web
        run: npm ci
      - name: Targeted reading tests
        working-directory: web
        run: |
          node --experimental-strip-types --test src/lib/readingExperience.test.mjs
          node --experimental-strip-types --test src/lib/readingExperience.render.test.mjs
      - name: Web build
        working-directory: web
        run: npm run build
      - name: Commit patched sources
        run: |
          FILES=(
            web/src/appTypes.ts
            web/src/AppNext.tsx
            web/src/RelationshipInterpretationPanel.tsx
            web/src/lib/relationshipUserSummary.ts
            web/src/lib/fortuneUserSummary.ts
            web/src/lib/readingExperience.test.mjs
          )
          if git diff --quiet -- "${FILES[@]}"; then
            echo 'No patch changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "${FILES[@]}"
          git commit -m 'feat: improve human-language fortune and provisional-time reading'
          git push origin HEAD:fix/reunion-hierarchy-v2
