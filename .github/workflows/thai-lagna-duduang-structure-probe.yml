name: Thai Lagna Duduang structure probe

on:
  push:
    branches:
      - feature/thai-lagna-phase1-real-20260831
    paths:
      - .github/workflows/thai-lagna-duduang-structure-probe.yml

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/thai-lagna-phase1-real-20260831
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Inspect exact Lagna HTML and chart container
        run: |
          python - <<'PY'
          import json, re, requests
          from bs4 import BeautifulSoup, NavigableString, Tag

          base='https://www.duduang.com'
          page=base+'/%E0%B9%82%E0%B8%AB%E0%B8%A3%E0%B8%B2%E0%B8%A8%E0%B8%B2%E0%B8%AA%E0%B8%95%E0%B8%A3%E0%B9%8C%E0%B9%84%E0%B8%97%E0%B8%A2/'
          session=requests.Session()
          ua='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124 Safari/537.36'
          warm=session.get(page,timeout=30,headers={'User-Agent':ua})
          warm.raise_for_status()
          headers={'User-Agent':ua,'Referer':page,'Origin':base,'X-Requested-With':'XMLHttpRequest'}
          payload={
            'day':'21','month':'3','year':'1991','hour':'7','minute':'26',
            'location':'2','country':'','province':'','districts':'',
            'lat':'34.7604','long':'127.6622','jday':'0','jmonth':'0','jyear':'0','t':'0','ca':'1',
          }
          r=session.post(base+'/ajax/2-thai.php',data=payload,headers=headers,timeout=30)
          print('POST',r.status_code,'BYTES',len(r.content),'CT',r.headers.get('content-type'))
          r.raise_for_status()
          r.encoding=r.apparent_encoding or 'utf-8'
          html=r.text
          soup=BeautifulSoup(html,'html.parser')

          print('\n=== RAW OCCURRENCES ===')
          for n,m in enumerate(re.finditer('ลัคนา',html)):
            if n>=12: break
            i=m.start()
            print('\nOCC',n,'INDEX',i)
            print(html[max(0,i-1800):min(len(html),i+2600)])

          print('\n=== TEXT NODE STRUCTURE ===')
          nodes=[]
          for text in soup.find_all(string=lambda s: s and 'ลัคนา' in s):
            tag=text.parent
            nodes.append(tag)
          print('COUNT',len(nodes))
          for idx,tag in enumerate(nodes[:12]):
            print('\nNODE',idx,'TAG',tag.name,'ATTRS',json.dumps(tag.attrs,ensure_ascii=False,default=str))
            print('OUTER',str(tag)[:5000])
            current=tag
            for level in range(1,6):
              current=current.parent
              if not isinstance(current,Tag): break
              print('ANCESTOR',level,'TAG',current.name,'ATTRS',json.dumps(current.attrs,ensure_ascii=False,default=str))
              print('ANCESTOR_HTML',str(current)[:9000])
            parent=tag.parent
            if isinstance(parent,Tag):
              print('SIBLINGS')
              for j,child in enumerate(parent.children):
                if isinstance(child,Tag):
                  print(' SIB',j,child.name,json.dumps(child.attrs,ensure_ascii=False,default=str),str(child)[:2500])

          print('\n=== ALL LI ITEMS WITH INDEX/ANCESTOR ===')
          for idx,li in enumerate(soup.find_all('li')):
            txt=li.get_text(' ',strip=True)
            if txt or li.attrs:
              anc=li.parent
              print('LI',idx,'TXT',repr(txt[:240]),'ATTRS',json.dumps(li.attrs,ensure_ascii=False,default=str),'PARENT',anc.name if isinstance(anc,Tag) else None,json.dumps(anc.attrs if isinstance(anc,Tag) else {},ensure_ascii=False,default=str))

          print('\n=== DATA / STYLE / DEGREE / TRANSFORM CANDIDATES ===')
          for tag in soup.find_all(True):
            attrs=tag.attrs or {}
            serialized=' '.join(f'{k}={v}' for k,v in attrs.items())
            text=tag.get_text(' ',strip=True)
            hay=(serialized+' '+text).lower()
            if any(k in hay for k in ['degree','deg','องศา','rotate','transform','left:','top:','data-','planet','lakna','lagna','asc']):
              print('CAND',tag.name,json.dumps(attrs,ensure_ascii=False,default=str),'TXT',repr(text[:320]))

          print('\n=== RESPONSE SCRIPTS ===')
          for idx,script in enumerate(soup.find_all('script')):
            print('SCRIPT',idx,'SRC',script.get('src'),'ATTRS',json.dumps(script.attrs,ensure_ascii=False,default=str))
            body=script.string or script.get_text('\n',strip=False)
            if body.strip(): print(body[:12000])

          print('\n=== SIGN WORD CONTEXT ===')
          signs=['เมษ','พฤษภ','มิถุน','กรกฎ','สิงห์','กันย์','ตุล','พิจิก','ธนู','มกร','กุมภ์','มีน']
          for sign in signs:
            for n,m in enumerate(re.finditer(sign,html)):
              if n>=5: break
              i=m.start()
              print('SIGN',sign,'OCC',n,html[max(0,i-500):min(len(html),i+800)])

          print('\n=== NUMERIC/JS-LIKE ASSIGNMENTS ===')
          patterns=[
            r'(?i)(?:lagna|lakna|ascendant|asc)[^\n<]{0,300}',
            r'ลัคนา[^\n<]{0,300}',
            r'(?i)(?:degree|deg|longitude|position|planet)[^\n<]{0,300}',
            r'(?i)(?:rotate|transform)[^\n<]{0,300}',
          ]
          for pat in patterns:
            vals=re.findall(pat,html)
            print('PATTERN',pat,'COUNT',len(vals))
            for v in vals[:80]: print(v[:1000])
          PY
      - name: Clean probe workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/thai-lagna-duduang-structure-probe.yml
          git commit -m 'chore: clean Duduang structure probe'
          git push origin HEAD:feature/thai-lagna-phase1-real-20260831
