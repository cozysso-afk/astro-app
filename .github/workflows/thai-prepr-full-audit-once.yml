name: Thai pre-PR full repository audit once

on:
  push:
    branches:
      - feature/thai-lagna-phase1-real-20260831
    paths:
      - '.github/workflows/thai-prepr-full-audit-once.yml'

permissions:
  contents: read

jobs:
  full-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/thai-lagna-phase1-real-20260831
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Audit net diff and temporary-file hygiene
        run: |
          git fetch origin main --depth=1
          echo '=== NET CHANGED FILES main...HEAD ==='
          git diff --name-status origin/main...HEAD
          echo '=== DIFF STAT ==='
          git diff --stat origin/main...HEAD
          echo '=== NON-TEST PRODUCT FILES ==='
          git diff --name-only origin/main...HEAD | grep -Ev '^(tests/|docs/|\.github/)' || true
          test ! -e scripts/apply_thai_g52.py
          test ! -e .github/workflows/thai-phase2g52-output-guard-apply-once.yml
          git diff --check origin/main...HEAD

      - name: Show shared-file patches for audit
        run: |
          echo '=== integrated_fortune_v1.py ==='
          git diff --unified=3 origin/main...HEAD -- integrated_fortune_v1.py
          echo '=== ai_interpret_v1.py ==='
          git diff --unified=3 origin/main...HEAD -- ai_interpret_v1.py
          echo '=== thai_astrology_v2.py ==='
          git diff --unified=2 origin/main...HEAD -- thai_astrology_v2.py

      - name: Install production Python dependencies
        run: python -m pip install --disable-pip-version-check -r api/requirements.txt

      - name: Compile runtime and test Python sources
        run: |
          python - <<'PY'
          from pathlib import Path
          import py_compile
          import sys

          excluded = {'.git', '.venv', 'venv', 'node_modules', '__pycache__', 'scripts'}
          files = []
          for path in Path('.').rglob('*.py'):
              if any(part in excluded for part in path.parts):
                  continue
              files.append(path)
          failures = []
          for path in files:
              try:
                  py_compile.compile(str(path), doraise=True)
              except Exception as exc:
                  failures.append((str(path), repr(exc)))
          print(f'PY_RUNTIME_TEST_COMPILE_FILES={len(files)}')
          if failures:
              print('PY_RUNTIME_TEST_COMPILE_FAILURES=')
              for item in failures:
                  print(item)
              sys.exit(1)
          print('PY_RUNTIME_TEST_COMPILE_ALL_PASS')
          PY

      - name: Record known pre-existing script syntax debt
        run: |
          python - <<'PY'
          import py_compile
          path = 'scripts/polish_mockup_ui_v76.py'
          try:
              py_compile.compile(path, doraise=True)
          except Exception as exc:
              print('KNOWN_MAIN_SCRIPT_SYNTAX_DEBT=', path, type(exc).__name__)
          else:
              raise SystemExit('expected known script syntax debt changed unexpectedly')
          PY
          git diff --quiet origin/main...HEAD -- scripts/polish_mockup_ui_v76.py

      - name: Run all repository unit tests
        env:
          PYTHONPATH: .
        run: |
          python - <<'PY'
          import sys
          import unittest

          suite = unittest.defaultTestLoader.discover('tests', pattern='test_*.py')
          total = suite.countTestCases()
          print(f'REPOSITORY_DISCOVERED_TESTS={total}')
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          print(f'REPOSITORY_RESULT={result.testsRun}/{total}')
          if not result.wasSuccessful():
              sys.exit(1)
          PY

      - name: Production-style FastAPI health smoke
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          uvicorn api.main:app --host 127.0.0.1 --port 8765 >/tmp/astro-uvicorn.log 2>&1 &
          UVICORN_PID=$!
          cleanup() {
            kill "$UVICORN_PID" 2>/dev/null || true
          }
          trap cleanup EXIT
          ok=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/health >/tmp/astro-health.json; then
              ok=1
              break
            fi
            sleep 1
          done
          if [ "$ok" -ne 1 ]; then
            cat /tmp/astro-uvicorn.log
            exit 1
          fi
          cat /tmp/astro-health.json
          echo
          echo 'FASTAPI_UVICORN_HEALTH_SMOKE_PASS'

      - name: Frontend production build
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Final repository cleanliness check
        run: |
          git status --short
          test -z "$(git status --porcelain)"
          echo 'THAI_PREPR_FULL_AUDIT_PASS'
