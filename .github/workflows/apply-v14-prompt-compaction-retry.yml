name: Apply V14 Prompt Compaction Retry

on:
  push:
    branches:
      - audit/reunion-dimensions-v14
    paths:
      - '.github/workflows/apply-v14-prompt-compaction-retry.yml'

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/reunion-dimensions-v14
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Normalize duplicate cache-version regex
        run: python scripts/prepare_v14_prompt_compaction_retry.py
      - name: Apply V14 prompt compaction
        run: python scripts/patch_v14_prompt_compaction.py
      - name: Relationship contract tests
        run: |
          node --experimental-strip-types --check supabase/functions/relationship-interpret-v9-preview/index.ts
          node --test web/src/lib/relationshipModeContract.test.mjs
          node --test web/src/lib/relationshipEvidencePipeline.test.mjs
      - name: Web production build
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Commit permanent prompt-compaction changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/functions/relationship-interpret-v9-preview/index.ts \
            web/src/lib/resultFormatters.ts web/src/lib/readingCache.ts \
            web/src/lib/relationshipModeContract.test.mjs web/src/lib/relationshipEvidencePipeline.test.mjs
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No permanent prompt-compaction changes.'
          else
            git commit -m 'fix(ai): bound reunion V14 evidence packets'
            git push origin HEAD:audit/reunion-dimensions-v14
          fi
