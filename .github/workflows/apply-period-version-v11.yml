name: Apply Period Version V11

on:
  push:
    branches:
      - work/integrated-interpretation-v2
    paths:
      - .github/workflows/apply-period-version-v11.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/integrated-interpretation-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Bump period-aware interpreter version
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('supabase/functions/fortune-interpret-v6-preview/integratedInterpretationV2.ts')
          s=p.read_text(encoding='utf-8')
          old='export const VERSION = "supabase-ai-v10-cross-system-action-contract";'
          new='export const VERSION = "supabase-ai-v11-period-aware-cross-system";'
          if old in s:
              s=s.replace(old,new,1)
          elif new not in s:
              raise SystemExit('VERSION anchor missing')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Full interpretation regression
        run: |
          node --experimental-strip-types --test supabase/functions/fortune-interpret-v6-preview/periodInstruction.test.mjs
          node --experimental-strip-types --test supabase/functions/fortune-interpret-v6-preview/qualityPeriods.test.mjs
          node --experimental-strip-types --test supabase/functions/fortune-interpret-v6-preview/integratedInterpretationV2.test.mjs
          node --experimental-strip-types --test supabase/functions/fortune-interpret-v6-preview/thaiContract.test.mjs
      - name: Web production build
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Commit V11 interpreter version
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/functions/fortune-interpret-v6-preview/integratedInterpretationV2.ts
          git diff --cached --quiet && exit 0
          git commit -m 'fix(ai): invalidate pre-period-aware server cache'
          git push origin HEAD:work/integrated-interpretation-v2
