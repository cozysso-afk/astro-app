name: Thai Phase 2C labels and standards gate

on:
  push:
    branches:
      - feature/thai-lagna-phase1-real-20260831
    paths:
      - .github/workflows/thai-phase2c-standards-once.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/thai-lagna-phase1-real-20260831
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Update Phase 2C research metadata only
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('thai_astrology_v2.py')
          text = path.read_text(encoding='utf-8')

          old_version = 'ENGINE_VERSION = "thai-mahathaksa-taksajorn-suriyayat-v2.3-phase2b-research"'
          new_version = 'ENGINE_VERSION = "thai-mahathaksa-taksajorn-suriyayat-v2.4-phase2c-standards"'
          if old_version not in text:
              raise SystemExit('Phase 2B engine version anchor missing')
          text = text.replace(old_version, new_version, 1)

          old_rel = '            "suriyayat_house_lords_basic_dignities": "research_only_table_facts",\n            "suriyayat_sign_aspects": "research_only_geometry_facts",'
          new_rel = '            "suriyayat_house_lords_and_standard_tables": "research_only_table_facts_including_house_labels_and_advanced_standards",\n            "suriyayat_sign_aspects": "research_only_geometry_facts",'
          if old_rel not in text:
              raise SystemExit('Phase 2B reliability anchor missing')
          text = text.replace(old_rel, new_rel, 1)

          old_policy = '"consensus_policy": "Mahathaksa/Taksajorn and cross-validated Suriyayat positions remain the interpreted Thai layers. Validated Lagna position plus Whole Sign, house-lord, basic dignity-table and sign-relation facts are research diagnostics only; no meaning or Western-style probability score is derived from them.",'
          new_policy = '"consensus_policy": "Mahathaksa/Taksajorn and cross-validated Suriyayat positions remain the interpreted Thai layers. Validated Lagna position plus Whole Sign house labels, house-lord, basic/advanced standard-table and sign-relation facts are research diagnostics only; no house meaning, rank, strength, event judgement, or Western-style probability score is derived from them.",'
          if old_policy not in text:
              raise SystemExit('Phase 2B consensus policy anchor missing')
          text = text.replace(old_policy, new_policy, 1)

          old_not_calc = '            "Suriyayat house meanings, dignity strength/meaning, aspect strength/pair interpretation",'
          new_not_calc = '            "Suriyayat house meanings, standard-table rank/strength/meaning, aspect strength/pair interpretation",'
          if old_not_calc not in text:
              raise SystemExit('not_calculated anchor missing')
          text = text.replace(old_not_calc, new_not_calc, 1)

          path.write_text(text, encoding='utf-8')
          PY
      - name: Install Swiss Ephemeris dependency
        run: python -m pip install --disable-pip-version-check pyswisseph==2.10.3.2
      - name: Run Phase 2C labels and advanced standards tests
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s tests -p 'test_thai_phase2c_labels_standards.py' -v
      - name: Run Phase 2B dignity regressions
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s tests -p 'test_thai_dignities_v1.py' -v
      - name: Run Phase 2B aspect regressions
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s tests -p 'test_thai_aspects_v1.py' -v
      - name: Run Phase 2B integration regressions
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s tests -p 'test_thai_rules_phase2b_integration.py' -v
      - name: Run Phase 2A house regressions
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s tests -p 'test_thai_houses*.py' -v
      - name: Run all Lagna regressions
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s tests -p 'test_thai_lagna*.py' -v
      - name: Run Gemini research isolation regressions
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s tests -p 'test_ai_thai_research_isolation.py' -v
      - name: Compile Thai research modules
        run: python -m py_compile thai_lagna_v1.py thai_houses_v1.py thai_dignities_v1.py thai_aspects_v1.py thai_astrology_v2.py ai_interpret_v1.py
      - name: Verify Phase 2C remains facts-only
        env:
          PYTHONPATH: .
        run: |
          python - <<'PY'
          from datetime import date,time
          from thai_astrology_v2 import build_thai_fortune

          thai = build_thai_fortune(
              birth_date=date(1991,3,21), birth_time=time(7,26),
              start_date=date(2026,8,31), end_date=date(2026,8,31),
              utc_offset_hours=9.0, latitude=34.7604, longitude=127.6622,
          )
          suri = thai['suriyayat']
          houses = suri['houses_research']
          dignities = suri['dignities_research']
          aspects = suri['aspects_research']

          assert suri['lagna']['available'] is False
          assert houses['promotion_gate']['house_name_labels_validated'] is True
          assert houses['promotion_gate']['house_meanings_allowed'] is False
          assert houses['promotion_gate']['houses_allowed_in_product'] is False
          assert houses['promotion_gate']['gemini_interpretation_allowed'] is False
          assert dignities['promotion_gate']['advanced_standard_table_facts_validated'] is True
          assert dignities['promotion_gate']['interpretive_strength_validated'] is False
          assert dignities['promotion_gate']['scores_allowed'] is False
          assert dignities['promotion_gate']['event_judgement_allowed'] is False
          assert dignities['promotion_gate']['gemini_interpretation_allowed'] is False
          assert aspects['promotion_gate']['strength_percent_allowed'] is False
          assert aspects['promotion_gate']['pair_meaning_allowed'] is False
          assert aspects['promotion_gate']['event_judgement_allowed'] is False
          assert aspects['promotion_gate']['gemini_interpretation_allowed'] is False
          assert thai['engine'] == 'thai-mahathaksa-taksajorn-suriyayat-v2.4-phase2c-standards'
          print('PHASE2C_LABELS_AND_STANDARD_FACTS_PASS_INTERPRETATION_BLOCKED')
          PY
      - name: Check whitespace
        run: git diff --check
      - name: Commit Phase 2C state and clean workflow
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add thai_astrology_v2.py thai_houses_v1.py thai_dignities_v1.py tests/test_thai_phase2c_labels_standards.py
          git rm -f .github/workflows/thai-phase2c-standards-once.yml
          git commit -m 'research: validate Thai house labels and advanced standard tables'
          git push origin HEAD:feature/thai-lagna-phase1-real-20260831
