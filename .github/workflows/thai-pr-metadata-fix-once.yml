name: Thai PR metadata fix once

on:
  push:
    branches:
      - audit/thai-clean-pr-verify-20260831
    paths:
      - '.github/workflows/thai-pr-metadata-fix-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/thai-lagna-clean-pr-20260831
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Align Thai top-level metadata with promoted descriptive scope
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('thai_astrology_v2.py')
          text = p.read_text(encoding='utf-8')
          old_status = 'mahathaksa_taksajorn_plus_verified_suriyayat_positions_with_research_only_lagna_house_dignity_aspect_facts'
          new_status = 'mahathaksa_taksajorn_plus_verified_suriyayat_positions_with_promoted_descriptive_lagna_context_no_prediction'
          old_policy = 'Mahathaksa/Taksajorn and cross-validated Suriyayat positions remain the interpreted Thai layers. Research now preserves the Thai house reading order as source house -> house lord -> destination house, while keeping planet archetypes and multi-label pair tables as facts only. Route interpretation, net pair valence, disputed aspect percentages, advanced-standard meanings, combined judgement, event claims and Western-style probability scores remain disabled.'
          new_policy = 'Mahathaksa/Taksajorn and cross-validated Suriyayat positions remain interpreted Thai layers. The independently validated numeric Lagna and whitelist-only source house -> house lord -> destination house context are product-enabled for descriptive, non-predictive explanation only. Research-only dignity/aspect/pair details, school-policy exceptions, final good/bad judgement, event claims, timing, probability and scores remain disabled.'
          if text.count(old_status) != 1:
              raise SystemExit('unexpected predictive_status anchor count')
          if text.count(old_policy) != 1:
              raise SystemExit('unexpected consensus_policy anchor count')
          text = text.replace(old_status, new_status, 1).replace(old_policy, new_policy, 1)
          p.write_text(text, encoding='utf-8')
          PY
      - name: Compile and run full repository tests
        run: |
          python -m pip install --disable-pip-version-check -r api/requirements.txt
          python -m py_compile thai_astrology_v2.py ai_interpret_v1.py integrated_fortune_v1.py
          PYTHONPATH=. python - <<'PY'
          import sys, unittest
          suite = unittest.defaultTestLoader.discover('tests', pattern='test_*.py')
          total = suite.countTestCases()
          print(f'REPOSITORY_DISCOVERED_TESTS={total}')
          if total != 239:
              raise SystemExit(f'expected 239, found {total}')
          result = unittest.TextTestRunner(verbosity=1).run(suite)
          if not result.wasSuccessful():
              sys.exit(1)
          print('THAI_PR_METADATA_FIX_TESTS_PASS')
          PY
          git diff --check
      - name: Commit metadata fix to PR branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add thai_astrology_v2.py
          git commit -m 'fix: align Thai descriptive promotion metadata'
          git push origin HEAD:release/thai-lagna-clean-pr-20260831
