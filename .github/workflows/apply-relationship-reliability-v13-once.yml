name: Apply Relationship Reliability V13 Once

on:
  push:
    branches:
      - audit/relationship-reliability-v13
    paths:
      - '.github/workflows/apply-relationship-reliability-v13-once.yml'

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/relationship-reliability-v13
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply V13 reliability patches
        run: python scripts/patch_relationship_reliability_v13.py
      - name: Install calculation dependencies
        run: python -m pip install -q -r api/requirements.txt pytest
      - name: Run relationship reliability regressions
        run: |
          python -m py_compile relationship_reliability_v1.py relationship_western_v1.py birth_time_reliability_v1.py api/main.py
          python -m pytest -q \
            tests/test_relationship_reliability_v13.py \
            tests/test_birth_time_reliability_v12.py \
            tests/test_relationship_midpoints_v8.py \
            tests/test_relationship_timing_v9.py
      - name: Check relationship interpreter source
        run: node --experimental-strip-types --check supabase/functions/relationship-interpret-v9-preview/index.ts
      - name: Commit permanent V13 changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add relationship_reliability_v1.py relationship_western_v1.py \
            tests/test_relationship_reliability_v13.py \
            supabase/functions/relationship-interpret-v9-preview/index.ts \
            .github/workflows/calculation-audit-ci.yml
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No permanent V13 changes to commit.'
          else
            git commit -m 'feat(calc): add time sensitivity and evidence reliability V13'
            git push origin HEAD:audit/relationship-reliability-v13
          fi
