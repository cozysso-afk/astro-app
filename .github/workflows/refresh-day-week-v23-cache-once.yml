name: Refresh V23 day-week cache once

on:
  push:
    branches:
      - fix/day-week-cache-refresh-v23
    paths:
      - .github/workflows/refresh-day-week-v23-cache-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/day-week-cache-refresh-v23
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply selective cache refresh patch
        run: python scripts/refresh_day_week_v23_cache.py
      - name: Verify selective cache contracts
        run: |
          node --experimental-strip-types --test supabase/functions/fortune-interpret-v23-preview/cacheIdentityV23.test.mjs
          node --experimental-strip-types --test web/src/lib/v23NarrativeTransport.test.mjs
          node --experimental-strip-types --test supabase/functions/fortune-interpret-v23-preview/periodNarrativeV23.test.mjs
          node --experimental-strip-types --test supabase/functions/fortune-interpret-v23-preview/provisionalV23.test.mjs
      - name: Commit cache refresh patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/fortune-interpret-v23-preview/index.ts supabase/functions/fortune-interpret-v22-preview/index.ts web/src/lib/readingCache.ts web/src/lib/v23NarrativeTransport.test.mjs
          git commit -m "Refresh day and week V23 narrative caches"
          git push origin HEAD:fix/day-week-cache-refresh-v23
