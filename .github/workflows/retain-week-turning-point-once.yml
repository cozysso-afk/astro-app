name: Retain weekly turning point once

on:
  push:
    branches:
      - fix/period-distinctness-reading-size
    paths:
      - .github/workflows/retain-week-turning-point-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/period-distinctness-reading-size
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply weekly turning-point retention patch
        run: python scripts/retain_week_turning_point.py
      - name: Verify V23 period contracts
        run: |
          node --experimental-strip-types --test supabase/functions/fortune-interpret-v23-preview/periodNarrativeV23.test.mjs
          node --experimental-strip-types --test supabase/functions/fortune-interpret-v23-preview/promptV23.test.mjs
          node --experimental-strip-types --test supabase/functions/fortune-interpret-v23-preview/provisionalV23.test.mjs
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/fortune-interpret-v23-preview/periodNarrativeV23.ts
          git commit -m "Keep single-day evidence as a weekly turning point"
          git push origin HEAD:fix/period-distinctness-reading-size
