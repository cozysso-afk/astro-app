name: Fortune Output Headroom V10 Patch

on:
  push:
    branches:
      - fix/fortune-structured-output-headroom-v10

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'chore: run fortune output headroom patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/fortune-structured-output-headroom-v10
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Apply targeted runtime patch
        run: python3 scripts/apply-fortune-output-headroom-v10.py
      - name: Run runtime headroom regression
        run: |
          node --experimental-strip-types --test supabase/functions/fortune-interpret-v23-preview/runtimeBudgetV23.test.mjs
          node --experimental-strip-types --test supabase/functions/fortune-interpret-v23-preview/cacheIdentityV23.test.mjs
          node --experimental-strip-types --test supabase/functions/fortune-interpret-v23-preview/qualityV6Semantic.test.mjs
          node --experimental-strip-types --check supabase/functions/fortune-interpret-v23-preview/index.ts
      - name: Install web dependencies
        working-directory: web
        run: npm ci
      - name: Build web app
        working-directory: web
        run: npm run build
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: prevent structured fortune output truncation"
          git push origin HEAD:fix/fortune-structured-output-headroom-v10
