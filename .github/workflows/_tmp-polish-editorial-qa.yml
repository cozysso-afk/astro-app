name: temporary editorial QA polish

on:
  push:
    branches:
      - fix/reunion-hierarchy-v2
    paths:
      - scripts/_tmp_polish_editorial_qa.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/reunion-hierarchy-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Apply focused editorial patch
        run: python scripts/_tmp_polish_editorial_qa.py
      - name: Install web dependencies
        working-directory: web
        run: npm ci
      - name: Run editorial regression tests
        working-directory: web
        run: node --test src/lib/humanLanguageV25.test.mjs src/lib/readingExperience.test.mjs src/lib/interpretationUiContract.test.mjs
      - name: Build web
        working-directory: web
        run: npm run build
      - name: Commit verified source changes
        run: |
          if git diff --quiet; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/src/lib/fortuneUserSummary.ts web/src/EditorialQaPreview.tsx web/src/RelationshipInterpretationPanel.tsx web/src/lib/humanLanguageV25.test.mjs
          git commit -m 'fix: polish fortune bands and reunion candidate wording'
          git push origin HEAD:fix/reunion-hierarchy-v2
