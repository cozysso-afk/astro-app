name: Thai clean PR final audit once

on:
  push:
    branches:
      - audit/thai-clean-pr-verify-20260831
    paths:
      - '.github/workflows/thai-clean-pr-final-audit-once.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/thai-lagna-clean-pr-20260831
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Verify clean diff contract
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          test "$(git rev-list --count origin/main..HEAD)" -eq 1
          test "$(git diff --name-only origin/main...HEAD | wc -l)" -eq 57
          test -z "$(git diff --name-only origin/main...HEAD | grep '^\.github/' || true)"
          git diff --check origin/main...HEAD
          grep -q 'with_promoted_descriptive_lagna_context_no_prediction' thai_astrology_v2.py
          ! grep -q 'with_research_only_lagna_house_dignity_aspect_facts' thai_astrology_v2.py
          echo 'FINAL_CLEAN_DIFF_CONTRACT_PASS'
      - name: Install production Python dependencies
        run: python -m pip install --disable-pip-version-check -r api/requirements.txt
      - name: Compile runtime and test Python sources
        run: |
          python - <<'PY'
          from pathlib import Path
          import py_compile, sys
          excluded={'.git','.venv','venv','node_modules','__pycache__','scripts'}
          files=[p for p in Path('.').rglob('*.py') if not any(part in excluded for part in p.parts)]
          if len(files) != 63:
              raise SystemExit(f'expected 63 Python files, found {len(files)}')
          for p in files:
              py_compile.compile(str(p), doraise=True)
          print('PY_RUNTIME_TEST_COMPILE_ALL_PASS')
          PY
      - name: Run entire repository test suite
        env:
          PYTHONPATH: .
        run: |
          python - <<'PY'
          import sys, unittest
          suite=unittest.defaultTestLoader.discover('tests', pattern='test_*.py')
          total=suite.countTestCases()
          print(f'REPOSITORY_DISCOVERED_TESTS={total}')
          if total != 239:
              raise SystemExit(f'expected 239 tests, found {total}')
          result=unittest.TextTestRunner(verbosity=1).run(suite)
          if not result.wasSuccessful(): sys.exit(1)
          print('REPOSITORY_RESULT=239/239')
          PY
      - name: Production-style FastAPI health smoke
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          uvicorn api.main:app --host 127.0.0.1 --port 8765 >/tmp/astro-uvicorn.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/health >/tmp/astro-health.json; then
              cat /tmp/astro-health.json
              echo
              echo 'FASTAPI_UVICORN_HEALTH_SMOKE_PASS'
              exit 0
            fi
            sleep 1
          done
          cat /tmp/astro-uvicorn.log
          exit 1
      - name: Frontend production build
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Final source cleanliness
        run: |
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          rm -rf web/dist web/node_modules
          test -z "$(git status --porcelain)"
          echo 'THAI_CLEAN_PR_FINAL_AUDIT_PASS'
