name: Thai houses Phase 2A research gate

on:
  push:
    branches:
      - feature/thai-lagna-phase1-real-20260831
    paths:
      - .github/workflows/thai-houses-phase2a-once.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/thai-lagna-phase1-real-20260831
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Isolate Thai research layers from Gemini input
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('ai_interpret_v1.py')
          text = path.read_text(encoding='utf-8')
          old_version = 'AI_INTERPRETER_VERSION = "mobile-ai-v2.3-suriyayat-position-safe"'
          new_version = 'AI_INTERPRETER_VERSION = "mobile-ai-v2.4-suriyayat-research-isolated"'
          if old_version not in text:
              raise SystemExit('AI interpreter version anchor missing')
          text = text.replace(old_version, new_version, 1)

          anchor = '\n\ndef _compact_calculation(calculation: dict[str, Any]) -> dict[str, Any]:\n'
          helper = '''\n\ndef _compact_thai_suriyayat(value: Any) -> dict[str, Any]:\n    """Whitelist interpreted Suriyayat facts and exclude every research layer.\n\n    Lagna/house experiments intentionally live inside calculation results for\n    diagnostics, but Gemini must not see them until their separate product and\n    interpretation gates are explicitly promoted.\n    """\n    if not isinstance(value, dict):\n        return {}\n    allowed = (\n        "available",\n        "engine",\n        "source_commit",\n        "time_basis",\n        "validation",\n        "natal",\n        "period_start",\n        "period_end",\n        "lagna",\n        "interpretation_status",\n        "policy",\n    )\n    return {key: value.get(key) for key in allowed if key in value}\n'''
          if anchor not in text:
              raise SystemExit('compact calculation anchor missing')
          text = text.replace(anchor, helper + anchor, 1)

          old = '            "suriyayat": thai.get("suriyayat"),'
          new = '            "suriyayat": _compact_thai_suriyayat(thai.get("suriyayat")),'
          if old not in text:
              raise SystemExit('suriyayat payload anchor missing')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pyswisseph==2.10.3.2
      - name: Run Phase 2A house structural tests
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s tests -p 'test_thai_houses_v1.py' -v
      - name: Run all Thai Lagna regression tests
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s tests -p 'test_thai_lagna*.py' -v
      - name: Verify Gemini research isolation
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s tests -p 'test_ai_thai_research_isolation.py' -v
      - name: Compile research modules
        run: python -m py_compile thai_lagna_v1.py thai_houses_v1.py thai_astrology_v2.py ai_interpret_v1.py
      - name: Verify Phase 2A stays research-only
        env:
          PYTHONPATH: .
        run: |
          python - <<'PY'
          from thai_houses_v1 import build_whole_sign_houses_research
          r = build_whole_sign_houses_research(
              lagna_longitude_deg=350.266667,
              planet_positions={'sun': {'longitude_deg': 336.0}},
          )
          assert r['research_only'] is True
          assert r['promotion_gate']['houses_allowed_in_product'] is False
          assert r['promotion_gate']['house_structure_interpretation_validated'] is False
          assert r['promotion_gate']['dignities_allowed'] is False
          assert r['promotion_gate']['aspects_allowed'] is False
          assert r['promotion_gate']['gemini_interpretation_allowed'] is False
          print('PHASE2A_RESEARCH_ONLY_GATE_CLOSED')
          PY
      - name: Check whitespace
        run: git diff --check
      - name: Commit Phase 2A state and clean workflow
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ai_interpret_v1.py thai_houses_v1.py tests/test_thai_houses_v1.py tests/test_ai_thai_research_isolation.py
          git rm -f .github/workflows/thai-houses-phase2a-once.yml
          git commit -m 'research: add isolated Thai whole-sign house layer'
          git push origin HEAD:feature/thai-lagna-phase1-real-20260831
