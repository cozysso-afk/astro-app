name: Apply reunion interpretation vNext

on:
  push:
    branches:
      - feat/reunion-interpretation-vnext

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/reunion-interpretation-vnext
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply patch
        run: python scripts/apply_reunion_interpretation_vnext.py
      - name: Focused interpretation contracts
        run: |
          node --test supabase/functions/relationship-interpret-v9-preview/reunionEvidenceV2.test.mjs
          node --test web/src/lib/relationshipEvidencePipeline.test.mjs
          node --test web/src/lib/relationshipReunionV2.contract.test.mjs
          git diff --check
      - name: Remove temporary runner
        run: |
          rm scripts/apply_reunion_interpretation_vnext.py
          rm .github/workflows/apply-reunion-interpretation-vnext.yml
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: ground reunion narrative in directional progression evidence"
          git push origin HEAD:feat/reunion-interpretation-vnext
