name: Apply AI Job Contract V11

on:
  push:
    branches:
      - work/integrated-interpretation-v2
    paths:
      - .github/workflows/apply-ai-job-contract-v11.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/integrated-interpretation-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Wire versioned pending AI jobs
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('web/src/AppNext.tsx')
          s=p.read_text(encoding='utf-8')
          import_anchor="import { fortuneAiCacheId, fortuneCalculationCacheId, readReadingCache, relationshipAiCacheId, writeReadingCache } from './lib/readingCache'\n"
          import_line="import { decodePendingFortuneAiJob, encodePendingFortuneAiJob, FORTUNE_AI_JOB_STORAGE_KEY } from './lib/fortuneAiJob'\n"
          s=s.replace("const AI_JOB_STORAGE_KEY = 'starlight-destiny.ai-job.v1'\n",'',1)
          s=s.replace('AI_JOB_STORAGE_KEY','FORTUNE_AI_JOB_STORAGE_KEY')
          s=s.replace('FORTUNE_FORTUNE_AI_JOB_STORAGE_KEY','FORTUNE_AI_JOB_STORAGE_KEY')
          if import_line not in s:
              if import_anchor not in s: raise SystemExit('AI job import anchor missing')
              s=s.replace(import_anchor,import_anchor+import_line,1)
          s=s.replace("interpreter_version: data.interpreter_version || 'supabase-ai-v7-thai-lagna-output-guard',","interpreter_version: data.interpreter_version || 'unknown',",1)
          old='''  const resumeAiInterpretationJob = () => {\n    if (document.visibilityState === 'hidden') return\n    const raw = readLocalStorage(FORTUNE_AI_JOB_STORAGE_KEY)\n    if (!raw) return\n    try {\n      const saved = JSON.parse(raw) as { jobId?: string; periodStart?: string; periodEnd?: string; cacheId?: string; ttlDays?: number; request?: Record<string,unknown> }\n      if (saved.jobId) void pollAiInterpretationJob(saved.jobId, saved.periodStart, saved.periodEnd, saved.cacheId, saved.ttlDays ?? PERIOD_CACHE_TTL_DAYS.today, saved.request)\n    } catch {\n      removeLocalStorage(FORTUNE_AI_JOB_STORAGE_KEY)\n      setAiLoading(false)\n    }\n  }\n'''
          new='''  const resumeAiInterpretationJob = () => {\n    if (document.visibilityState === 'hidden') return\n    const raw = readLocalStorage(FORTUNE_AI_JOB_STORAGE_KEY)\n    if (!raw) return\n    const saved = decodePendingFortuneAiJob(raw)\n    if (!saved) {\n      removeLocalStorage(FORTUNE_AI_JOB_STORAGE_KEY)\n      setAiLoading(false)\n      return\n    }\n    void pollAiInterpretationJob(saved.jobId, saved.periodStart, saved.periodEnd, saved.cacheId, saved.ttlDays ?? PERIOD_CACHE_TTL_DAYS.today, saved.request)\n  }\n'''
          if old not in s: raise SystemExit('resume AI job anchor missing')
          s=s.replace(old,new,1)
          old='''      const pending = { jobId: String(data.job_id), periodStart: calculation.period.start, periodEnd: calculation.period.end, cacheId, ttlDays, request: requestForCache }\n      const jobPersisted = writeLocalStorage(FORTUNE_AI_JOB_STORAGE_KEY, JSON.stringify(pending))\n'''
          new='''      const pending = { jobId: String(data.job_id), periodStart: calculation.period.start, periodEnd: calculation.period.end, cacheId, ttlDays, request: requestForCache }\n      const jobPersisted = writeLocalStorage(FORTUNE_AI_JOB_STORAGE_KEY, encodePendingFortuneAiJob(pending))\n'''
          if old not in s: raise SystemExit('pending AI job anchor missing')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Pending job contract test
        run: node --experimental-strip-types --test web/src/lib/fortuneAiJob.test.mjs
      - name: Web production build
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Commit pending job contract
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/src/AppNext.tsx
          git diff --cached --quiet && exit 0
          git commit -m 'fix(web): reject stale pending interpretation jobs'
          git push origin HEAD:work/integrated-interpretation-v2
