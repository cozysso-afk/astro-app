name: temporary align overall headline test

on:
  push:
    branches:
      - fix/daily-overall-bestflow-anchor

permissions:
  contents: write

jobs:
  align-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Align stale headline assertion
        run: >-
          python -c "from pathlib import Path; p=Path('web/src/lib/interpretationUiContract.test.mjs'); s=p.read_text(); old=r'assert.match(summary.headline,/^오늘의 중심은 학업 쪽이야\\./)'; new=r'assert.match(summary.headline,/^오늘 전체 흐름에서 가장 먼저 볼 건 학업이야\\./)'; assert old in s, 'stale assertion missing'; p.write_text(s.replace(old,new,1))"
      - name: Install web dependencies
        working-directory: web
        run: npm ci
      - name: Run interpretation UI contract
        working-directory: web
        run: node --test src/lib/interpretationUiContract.test.mjs
      - name: Commit aligned assertion
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/src/lib/interpretationUiContract.test.mjs
          git commit -m "test: align overall headline contract"
          git push origin HEAD:fix/daily-overall-bestflow-anchor
