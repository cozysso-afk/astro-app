name: Refactor relationship precision details once

on:
  push:
    branches:
      - refactor/relationship-precision-details-20260901

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/relationship-precision-details-20260901
          fetch-depth: 0

      - name: Extract relationship precision details
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          app_path = Path('web/src/AppNext.tsx')
          workflow_path = Path('.github/workflows/refactor-relationship-precision-details-once.yml')
          original = app_path.read_text()
          text = original

          import_anchor = "import { RelationshipEvidenceDetails } from './RelationshipEvidenceDetails'\n"
          if import_anchor not in text:
              raise SystemExit('relationship evidence import anchor missing')
          text = text.replace(import_anchor, import_anchor + "import { RelationshipPrecisionDetails } from './RelationshipPrecisionDetails'\n", 1)

          start_marker = "              {partnerTimeExact&&relationshipResult.result.house_overlays?.available&&<section className=\"result-card\">"
          end_marker = "              {(relationshipResult.result.limitations?.length??0)>0 && <div className=\"status-banner subtle\"><AlertTriangle size={16}/><span>{partnerTimeExact ? relationshipResult.result.limitations?.map(relationshipLimitKo).join(' ') : '상대 출생시간을 몰라 데이비슨·마크스·3차 진행은 임의 추정하지 않고 제외했어.'}</span></div>}"
          start = text.index(start_marker)
          end = text.index(end_marker, start) + len(end_marker)
          old_block = text[start:end]
          if 'RelationshipEvidenceDetails' not in old_block or 'HOUSE OVERLAY' not in old_block or '출생시간 미상' not in old_block:
              raise SystemExit('unexpected relationship precision block')

          replacement = "              <RelationshipPrecisionDetails result={relationshipResult} partnerTimeExact={partnerTimeExact} formatLimit={relationshipLimitKo} />"
          text = text[:start] + replacement + text[end:]
          app_path.write_text(text)
          workflow_path.unlink()

          print(f'AppNext bytes: {len(original.encode())} -> {len(text.encode())}')
          PY

      - name: Build web
        working-directory: web
        run: npm ci && npm run build

      - name: Commit refactor
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/src/AppNext.tsx web/src/RelationshipPrecisionDetails.tsx .github/workflows/refactor-relationship-precision-details-once.yml
          git diff --cached --check
          git commit -m "refactor(web): extract relationship precision details"
          git push origin HEAD:refactor/relationship-precision-details-20260901
