name: Apply All Timed Decision Guard V12

on:
  push:
    branches:
      - work/integrated-interpretation-v2
    paths:
      - .github/workflows/apply-all-timed-decision-guard-v12.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/integrated-interpretation-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Require every timed decision to match evidence
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('supabase/functions/fortune-interpret-v6-preview/qualityV2.ts')
          s=p.read_text(encoding='utf-8')
          old='''      if(windowEvidence.length&&timedDecisions.length){\n        const periodDate=isoDate(payload?.period?.start);\n        let exactLinked=false;\n        for(const d of timedDecisions){\n          const timingWindow=clockWindow(d?.timing);\n          const refs=(d?.evidence_refs??[]).map(String);\n          for(const ref of refs){\n            const row:any=map.get(ref);\n            if(!row||(row?.scope!=="intraday_window"&&!String(ref).startsWith("W:window:")))continue;\n            if(isoDate(row?.date)!==periodDate||clockWindow(row?.window??row?.text)!==timingWindow)continue;\n            const sameTopicDetailAvailable=[...map.values()].some((x:any)=>x?.scope==="intraday_evidence"&&isoDate(x?.date)===isoDate(row?.date)&&String(x?.topic??"")===String(row?.topic??""));\n            const sameTopicDetailLinked=refs.some((detailRef:string)=>{const x:any=map.get(detailRef);return x?.scope==="intraday_evidence"&&isoDate(x?.date)===isoDate(row?.date)&&String(x?.topic??"")===String(row?.topic??"");});\n            if(!sameTopicDetailAvailable||sameTopicDetailLinked){exactLinked=true;break;}\n          }\n          if(exactLinked)break;\n        }\n        if(!exactLinked)s5.push("오늘 시간대 행동 가이드에 동일 시간창 W:window:* 및 같은 분야 W:detail:* 근거 미연결");\n      }\n'''
          new='''      if(windowEvidence.length&&timedDecisions.length){\n        const periodDate=isoDate(payload?.period?.start);\n        for(const d of timedDecisions){\n          const timingWindow=clockWindow(d?.timing);\n          const refs=(d?.evidence_refs??[]).map(String);\n          let exactLinked=false;\n          for(const ref of refs){\n            const row:any=map.get(ref);\n            if(!row||(row?.scope!=="intraday_window"&&!String(ref).startsWith("W:window:")))continue;\n            if(isoDate(row?.date)!==periodDate||clockWindow(row?.window??row?.text)!==timingWindow)continue;\n            const sameTopicDetailAvailable=[...map.values()].some((x:any)=>x?.scope==="intraday_evidence"&&isoDate(x?.date)===isoDate(row?.date)&&String(x?.topic??"")===String(row?.topic??""));\n            const sameTopicDetailLinked=refs.some((detailRef:string)=>{const x:any=map.get(detailRef);return x?.scope==="intraday_evidence"&&isoDate(x?.date)===isoDate(row?.date)&&String(x?.topic??"")===String(row?.topic??"");});\n            if(!sameTopicDetailAvailable||sameTopicDetailLinked){exactLinked=true;break;}\n          }\n          if(!exactLinked)s5.push(`오늘 시간대 행동 가이드 근거 불일치: ${txt(d?.timing,45)} · 동일 시간창 W:window:* 및 같은 분야 W:detail:* 필요`);\n        }\n      }\n'''
          if old not in s: raise SystemExit('all timed decisions quality anchor missing')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          p=Path('supabase/functions/fortune-interpret-v6-preview/qualityPeriods.test.mjs')
          s=p.read_text(encoding='utf-8')
          s=s.replace('assert.match(unlinkedIssues,/동일 시간창 W:window/);','assert.match(unlinkedIssues,/시간대 행동 가이드 근거 불일치/);',1)
          s=s.replace('assert.match(windowOnlyIssues,/같은 분야 W:detail/);','assert.match(windowOnlyIssues,/시간대 행동 가이드 근거 불일치/);',1)
          s=s.replace('assert.match(mismatchIssues,/동일 시간창 W:window/);','assert.match(mismatchIssues,/시간대 행동 가이드 근거 불일치/);',1)
          anchor='''  data.decisions[0].evidence_refs.push(detailRef);\n  const fixed=inspectInterpretationQuality(data,payload);\n  assert.equal(fixed.ok,true,JSON.stringify(fixed,null,2));\n  assert.equal(fixed.score,100);\n\n  data.decisions[0].timing="2026-09-03 10:00~11:00";\n'''
          replacement='''  data.decisions[0].evidence_refs.push(detailRef);\n  const fixed=inspectInterpretationQuality(data,payload);\n  assert.equal(fixed.ok,true,JSON.stringify(fixed,null,2));\n  assert.equal(fixed.score,100);\n\n  data.decisions[1].timing="2026-09-03 10:00~11:00";\n  const partiallyValid=inspectInterpretationQuality(data,payload);\n  assert.equal(partiallyValid.ok,false,"one valid timed decision must not hide another unsupported time");\n  const partialIssues=partiallyValid.stages.flatMap(stage=>stage.issues??[]).join(" / ");\n  assert.match(partialIssues,/10:00~11:00/);\n  assert.match(partialIssues,/시간대 행동 가이드 근거 불일치/);\n  data.decisions[1].timing="중간 점검";\n\n  data.decisions[0].timing="2026-09-03 10:00~11:00";\n'''
          if anchor not in s: raise SystemExit('all timed decisions test anchor missing')
          s=s.replace(anchor,replacement,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Full interpretation regression
        run: |
          node --experimental-strip-types --test supabase/functions/fortune-interpret-v6-preview/periodInstruction.test.mjs
          node --experimental-strip-types --test supabase/functions/fortune-interpret-v6-preview/qualityPeriods.test.mjs
          node --experimental-strip-types --test supabase/functions/fortune-interpret-v6-preview/integratedInterpretationV2.test.mjs
          node --experimental-strip-types --test supabase/functions/fortune-interpret-v6-preview/thaiContract.test.mjs
          node --experimental-strip-types --test web/src/lib/fortuneAiJob.test.mjs
      - name: Web production build
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Commit strict timed decision guard
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/functions/fortune-interpret-v6-preview/qualityV2.ts supabase/functions/fortune-interpret-v6-preview/qualityPeriods.test.mjs
          git diff --cached --quiet && exit 0
          git commit -m 'fix(ai): validate every intraday decision window'
          git push origin HEAD:work/integrated-interpretation-v2
