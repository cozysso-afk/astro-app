name: Fix concise summary test path

on:
  push:
    branches: [work/ai-cost-guard-v21]
    paths:
      - '.github/workflows/fix-v2131-summary-test-path.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix compiled helper path and retrigger patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/patch-v2131-summary-hierarchy.yml')
          s = p.read_text()
          old = "import { buildInterpretationBrief } from '/tmp/summary-brief/interpretationSummary.js'"
          new = "import { buildInterpretationBrief } from '/tmp/summary-brief/lib/interpretationSummary.js'"
          if old not in s:
              raise SystemExit('test import anchor not found')
          p.write_text(s.replace(old, new, 1))
          PY
          rm -f .github/workflows/fix-v2131-summary-test-path.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/patch-v2131-summary-hierarchy.yml .github/workflows/fix-v2131-summary-test-path.yml
          git commit -m 'fix(ci): resolve compiled summary helper path'
          git push origin HEAD:work/ai-cost-guard-v21
