name: Benchmark reunion runtime v2.9

on:
  push:
    branches:
      - fix/reunion-runtime-stall-v29
    paths:
      - .github/workflows/benchmark-reunion-runtime-v29.yml

permissions:
  contents: read

jobs:
  benchmark-365-days:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/reunion-runtime-stall-v29

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: api/requirements.txt

      - name: Install API runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r api/requirements.txt

      - name: Benchmark full-year async reunion path
        run: |
          python - <<'PY'
          import time
          from api.main import RelationshipRequest
          import api.relationship_async_v1 as asyncmod

          body = {
              'user': {
                  'birth_date': '1988-06-12',
                  'birth_time': '09:30',
                  'latitude': 37.5665,
                  'longitude': 126.9780,
                  'utc_offset_hours': 9,
                  'time_source': 'official_record',
                  'time_confidence': 'exact',
              },
              'counterpart': {
                  'birth_date': '1990-11-08',
                  'birth_time': '16:20',
                  'latitude': 35.1796,
                  'longitude': 129.0756,
                  'utc_offset_hours': 9,
                  'time_source': 'user_estimate',
                  'time_confidence': 'medium',
              },
              'start_date': '2026-01-01',
              'end_date': '2026-12-31',
              'as_of_date': '2026-09-24',
              'query_utc_offset_hours': 9,
              'analysis_mode': 'reunion',
          }
          request = RelationshipRequest(**body)
          started = time.perf_counter()
          response = asyncmod._calculate_reunion('benchmark-full-year', request)
          elapsed = time.perf_counter() - started
          hierarchy = response['result']['reunion_hierarchy']
          print(f'REUNION_365_ELAPSED_SECONDS={elapsed:.3f}')
          print(f"REUNION_VALIDATION={hierarchy['validation']['status']}")
          print(f"REUNION_RUNTIME_REVISION={getattr(__import__('reunion_hierarchy_v2'), 'RUNTIME_REVISION', 'missing')}")
          assert hierarchy['validation']['status'] == 'PASS'
          assert elapsed < 60.0, f'optimized full-year reunion runtime too slow: {elapsed:.3f}s'
          PY
