name: Gemini 429 Quota Probe

on:
  push:
    branches:
      - hotfix/gemini-429-backoff

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        working-directory: web
        run: npm ci
      - name: Probe project Gemini quotas
        working-directory: web
        run: |
          node --input-type=module - <<'JS'
          import { createClient } from '@supabase/supabase-js'
          const url='https://dbynfabwfcakxayyggzi.supabase.co'
          const key='sb_publishable_IEf9R9oJ5kbn513DdeqODQ_DwLeF35r'
          const supabase=createClient(url,key,{auth:{persistSession:false,autoRefreshToken:false}})
          const {data,error}=await supabase.auth.signInAnonymously()
          if(error||!data.session?.access_token)throw new Error(`auth failed: ${error?.message??'no token'}`)
          const r=await fetch(`${url}/functions/v1/gemini-quota-probe-v1`,{method:'POST',headers:{'Content-Type':'application/json','apikey':key,'Authorization':`Bearer ${data.session.access_token}`},body:'{}'})
          const text=await r.text()
          console.log('probe-http',r.status)
          console.log(text)
          if(!r.ok)throw new Error(`probe failed HTTP ${r.status}`)
          JS
