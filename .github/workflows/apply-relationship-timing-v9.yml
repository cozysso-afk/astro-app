name: Apply Relationship Timing V9

on:
  push:
    branches:
      - audit/relationship-timing-v9
    paths:
      - '.github/workflows/apply-relationship-timing-v9.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/relationship-timing-v9
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply V9 patch
        run: python scripts/apply_relationship_timing_v9.py
      - name: Commit patched runtime
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add relationship_western_v1.py
          git diff --cached --quiet && exit 0
          git commit -m 'fix(calc): preserve relationship timing timezone contract V9'
          git push origin HEAD:audit/relationship-timing-v9
