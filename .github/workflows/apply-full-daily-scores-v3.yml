name: Branch Interpretation V3 Verification

on:
  push:
    branches:
      - work/integrated-interpretation-v2
    paths:
      - .github/workflows/apply-full-daily-scores-v3.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/integrated-interpretation-v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python syntax contract
        run: |
          python -m py_compile integrated_fortune_v1.py key_date_evidence_v2.py api/main.py
          grep -q 'daily_scores' integrated_fortune_v1.py
      - name: Interpretation guards
        run: |
          node --experimental-strip-types --test supabase/functions/fortune-interpret-v6-preview/integratedInterpretationV2.test.mjs
          node --experimental-strip-types --test supabase/functions/fortune-interpret-v6-preview/thaiContract.test.mjs
      - name: Web typecheck and build
        working-directory: web
        run: |
          npm ci
          npm run build
