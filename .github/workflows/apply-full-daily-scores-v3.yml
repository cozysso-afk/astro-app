name: Remove Selective Key-Date Compatibility Layer

on:
  push:
    branches:
      - work/integrated-interpretation-v2
    paths:
      - .github/workflows/apply-full-daily-scores-v3.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/integrated-interpretation-v2
          fetch-depth: 0
      - name: Make Supabase interpreter use full-daily packet directly
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('supabase/functions/fortune-interpret-v6-preview/index.ts')
          s=p.read_text(encoding='utf-8')
          old='''import { KEY_DATE_LEDGER_VERSION, attachActualKeyDateEvidence } from "./keyDateEvidenceV2.ts";\n'''
          if old not in s: raise SystemExit('key-date import missing')
          s=s.replace(old,'',1)
          old='''      :"연평균만 요약하지 말고 월별 변화→핵심 날짜→독립 체계 교차맥락 순으로 분석하라. western.key_date_details가 있으면 중요한 날짜 문단에 실제 트랜짓 근거 W:keydate:*를 우선 연결하라.";'''
          new='''      :"연평균만 요약하지 말고 365일 일별 궤적→월별 변화→핵심 날짜→독립 체계 교차맥락 순으로 분석하라. 중요한 날짜 문단에는 계산엔진이 보존한 실제 일별 트랜짓·하우스 근거 W:daily:*를 우선 연결하라.";'''
          if old not in s: raise SystemExit('prompt compatibility anchor missing')
          s=s.replace(old,new,1)
          old='''if(b?.action==="meta")return res({configured:Boolean(key),interpreter_version:VERSION,packet_version:PACKET_VERSION,quality_version:QUALITY_VERSION,key_date_ledger_version:KEY_DATE_LEDGER_VERSION,models:MODELS,background_jobs:true,payload_hash_cache:true,inflight_dedupe:true,five_stage_validation:true,evidence_ledger:true,monthly_trajectory:true,key_date_actual_transits:true,cross_system_timeline:true,thai_contract:THAI_CONTRACT_VERSION,thai_layers:["Mahathaksa","Taksajorn","Suriyayat 10-planet position facts","validated numeric Lagna","12 descriptive non-predictive house routes"],suriyayat_lagna:true,thai_output_guard:true,thai_strict_retry:true,thai_safe_fallback:true});'''
          new='''if(b?.action==="meta")return res({configured:Boolean(key),interpreter_version:VERSION,packet_version:PACKET_VERSION,quality_version:QUALITY_VERSION,models:MODELS,background_jobs:true,payload_hash_cache:true,inflight_dedupe:true,five_stage_validation:true,evidence_ledger:true,full_daily_scores:true,daily_actual_evidence:true,monthly_trajectory:true,cross_system_timeline:true,thai_contract:THAI_CONTRACT_VERSION,thai_layers:["Mahathaksa","Taksajorn","Suriyayat 10-planet position facts","validated numeric Lagna","12 descriptive non-predictive house routes"],suriyayat_lagna:true,thai_output_guard:true,thai_strict_retry:true,thai_safe_fallback:true});'''
          if old not in s: raise SystemExit('meta compatibility anchor missing')
          s=s.replace(old,new,1)
          old='''  const payload=attachActualKeyDateEvidence(compactCalculation(b.calculation),b.calculation);'''
          new='''  const payload=compactCalculation(b.calculation);'''
          if old not in s: raise SystemExit('payload compatibility anchor missing')
          s=s.replace(old,new,1)
          old='''    return res({ok:true,interpreter_version:VERSION,packet_version:PACKET_VERSION,quality_version:QUALITY_VERSION,key_date_ledger_version:KEY_DATE_LEDGER_VERSION,payload_bytes:new TextEncoder().encode(JSON.stringify(payload)).byteLength,payload_hash_prefix:hash.slice(0,16),evidence_ledger:payload?.evidence_ledger?.length??0,key_dates:payload?.key_dates?.length??0,cross_system_dates:payload?.cross_system_timeline?.length??0,western_months:payload?.western?.months?.length??0,western_key_date_details:payload?.western?.key_date_details?.length??0,actual_key_date_refs:(payload?.evidence_ledger??[]).filter((x:any)=>String(x?.id??"").startsWith("W:keydate:")).length,thai:{mahathaksa:Boolean(payload?.thai?.mahathaksa),taksajorn:Boolean(payload?.thai?.taksajorn),suriyayat:Boolean(payload?.thai?.suriyayat),suriyayat_lagna:Boolean(payload?.thai?.suriyayat?.lagna?.available)},saju:{annual_segments:payload?.saju?.annual?.length??0,monthly_segments:payload?.saju?.monthly?.length??0},detail_days:payload?.western?.detail_days?.length??0});'''
          new='''    return res({ok:true,interpreter_version:VERSION,packet_version:PACKET_VERSION,quality_version:QUALITY_VERSION,payload_bytes:new TextEncoder().encode(JSON.stringify(payload)).byteLength,payload_hash_prefix:hash.slice(0,16),evidence_ledger:payload?.evidence_ledger?.length??0,key_dates:payload?.key_dates?.length??0,cross_system_dates:payload?.cross_system_timeline?.length??0,western_months:payload?.western?.months?.length??0,daily_score_rows:payload?.western?.daily_score_matrix?.rows?.length??0,actual_daily_refs:(payload?.evidence_ledger??[]).filter((x:any)=>String(x?.id??"").startsWith("W:daily:")).length,thai:{mahathaksa:Boolean(payload?.thai?.mahathaksa),taksajorn:Boolean(payload?.thai?.taksajorn),suriyayat:Boolean(payload?.thai?.suriyayat),suriyayat_lagna:Boolean(payload?.thai?.suriyayat?.lagna?.available)},saju:{annual_segments:payload?.saju?.annual?.length??0,monthly_segments:payload?.saju?.monthly?.length??0},detail_days:payload?.western?.detail_days?.length??0});'''
          if old not in s: raise SystemExit('inspect compatibility anchor missing')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Guard direct full-daily path
        run: |
          ! grep -q 'keyDateEvidenceV2' supabase/functions/fortune-interpret-v6-preview/index.ts
          ! grep -q 'W:keydate:' supabase/functions/fortune-interpret-v6-preview/index.ts
          grep -q 'W:daily:' supabase/functions/fortune-interpret-v6-preview/index.ts
          grep -q 'full_daily_scores:true' supabase/functions/fortune-interpret-v6-preview/index.ts
      - name: Commit interpreter cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/functions/fortune-interpret-v6-preview/index.ts
          git diff --cached --quiet && exit 0
          git commit -m 'refactor: use full-daily evidence path directly'
          git push origin HEAD:work/integrated-interpretation-v2
