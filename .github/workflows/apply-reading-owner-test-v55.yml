name: Apply reading owner test v55
on:
  push:
    branches:
      - fix/summary-font-scope-v55
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/summary-font-scope-v55
          fetch-depth: 0
      - name: Update owner assertion
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('web/src/lib/readingExperience.test.mjs')
          s = p.read_text()
          old = "  assert.equal(imports.at(-1),'reading-experience.css')"
          new = "  assert.equal(imports.at(-1),'reading-font-fix-v54.css')\n  assert.ok(imports.indexOf('reading-experience.css') < imports.indexOf('reading-font-fix-v54.css'))"
          if old not in s:
              raise SystemExit('reading owner assertion target not found')
          p.write_text(s.replace(old, new, 1))
          PY
          rm .github/workflows/apply-reading-owner-test-v55.yml
      - name: Commit
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add web/src/lib/readingExperience.test.mjs .github/workflows/apply-reading-owner-test-v55.yml
          git commit -m 'Update reading owner regression for scoped font layer'
          git push origin HEAD:fix/summary-font-scope-v55
