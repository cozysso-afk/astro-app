name: Verify Render Saju V5 Live

on:
  push:
    branches:
      - audit/saju-natal-boundary-v5
    paths:
      - '.github/workflows/verify-render-saju-v5-live.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Wait for Render Saju V5 and verify live calculation
        run: |
          python - <<'PY'
          import json
          import time
          import urllib.request

          expected = 'lunar_python-1.4.8-true-solar-absolute-jie-v5'
          payload = {
              'profile': {
                  'name': 'saju-v5-live-probe',
                  'birth_date': '2024-02-04',
                  'birth_time': '17:20:00',
                  'latitude': 37.5665,
                  'longitude': 126.9780,
                  'utc_offset_hours': 9,
                  'gender': 'female',
              },
              'start_date': '2026-09-05',
              'end_date': '2026-09-05',
          }
          url = 'https://astro-app-api-f7fn.onrender.com/v1/fortune/integrated'
          last = None
          for attempt in range(36):
              try:
                  request = urllib.request.Request(
                      url,
                      data=json.dumps(payload).encode('utf-8'),
                      headers={'Content-Type': 'application/json'},
                      method='POST',
                  )
                  with urllib.request.urlopen(request, timeout=120) as response:
                      result = json.load(response)
                  saju = result.get('saju') or {}
                  last = {
                      'engine': saju.get('engine'),
                      'pillars': saju.get('pillars'),
                      'policy': saju.get('pillar_boundary_policy'),
                  }
                  if saju.get('engine') == expected:
                      assert saju.get('pillars', {}).get('year') == '癸卯', last
                      assert saju.get('pillars', {}).get('month') == '乙丑', last
                      assert 'year_month' in (saju.get('pillar_boundary_policy') or {}), last
                      print('render-saju-v5-live', json.dumps(last, ensure_ascii=False))
                      break
              except Exception as exc:
                  last = repr(exc)
              print('waiting-for-render-v5', attempt + 1, last)
              time.sleep(10)
          else:
              raise SystemExit(f'Render did not serve Saju V5 in time: {last}')
          PY
