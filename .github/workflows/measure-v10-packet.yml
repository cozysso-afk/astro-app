name: Measure V10 Annual Packet

on:
  push:
    branches:
      - work/integrated-interpretation-v2
    paths:
      - .github/workflows/measure-v10-packet.yml

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/integrated-interpretation-v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: api/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install calculation dependencies
        run: pip install -r api/requirements.txt
      - name: Build a real 365-day calculation
        run: |
          python - <<'PY'
          import json, time
          from datetime import date, time as dt_time
          from integrated_fortune_v1 import build_integrated_fortune
          started=time.perf_counter()
          result=build_integrated_fortune(
              birth_date=date(1990,1,1), birth_time=dt_time(12,0),
              latitude=37.5665, longitude=126.9780, utc_offset_hours=9,
              gender='female', start_date=date(2026,1,1), end_date=date(2026,12,31),
          )
          with open('/tmp/annual-calculation.json','w',encoding='utf-8') as f:
              json.dump(result,f,ensure_ascii=False,default=str,separators=(',',':'))
          print('CALC_SECONDS',round(time.perf_counter()-started,2))
          print('CALC_BYTES',len(json.dumps(result,ensure_ascii=False,default=str,separators=(',',':')).encode('utf-8')))
          PY
      - name: Measure compact V10 AI packet
        run: |
          node --experimental-strip-types --input-type=module <<'JS'
          import fs from 'node:fs';
          import { compactCalculation } from './supabase/functions/fortune-interpret-v6-preview/integratedInterpretationV2.ts';
          const calc=JSON.parse(fs.readFileSync('/tmp/annual-calculation.json','utf8'));
          const packet=compactCalculation(calc);
          const bytes=(value)=>Buffer.byteLength(JSON.stringify(value),'utf8');
          const report={
            packet_bytes:bytes(packet),
            period_kind:packet.period_kind,
            daily_rows:packet.western?.daily_score_matrix?.rows?.length??0,
            daily_matrix_bytes:bytes(packet.western?.daily_score_matrix??null),
            daily_digest_bytes:bytes(packet.western?.daily_pattern_digest??null),
            month_bytes:bytes(packet.western?.months??null),
            evidence_rows:packet.evidence_ledger?.length??0,
            evidence_ledger_bytes:bytes(packet.evidence_ledger??null),
            key_dates:packet.key_dates?.length??0,
            key_dates_bytes:bytes(packet.key_dates??null),
            cross_dates:packet.cross_system_timeline?.length??0,
            cross_timeline_bytes:bytes(packet.cross_system_timeline??null),
            saju_bytes:bytes(packet.saju??null),
            thai_bytes:bytes(packet.thai??null),
          };
          console.log('V10_PACKET_METRICS '+JSON.stringify(report));
          JS
