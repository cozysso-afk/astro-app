name: Thai Phase 2D2 interpretation policy gate

on:
  push:
    branches:
      - feature/thai-lagna-phase1-real-20260831
    paths:
      - .github/workflows/thai-phase2d2-policy-once.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/thai-lagna-phase1-real-20260831
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Attach interpretation consensus registry as research diagnostics only
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('thai_astrology_v2.py')
          text = path.read_text(encoding='utf-8')
          replacements = {
              'from thai_semantics_v1 import build_semantics_research\n':
                  'from thai_semantics_v1 import build_semantics_research\nfrom thai_interpretation_policy_v1 import build_interpretation_policy_research\n',
              'ENGINE_VERSION = "thai-mahathaksa-taksajorn-suriyayat-v2.5-phase2d1-semantics-research"':
                  'ENGINE_VERSION = "thai-mahathaksa-taksajorn-suriyayat-v2.6-phase2d2-policy-research"',
              '    semantics_research = build_semantics_research(\n        houses_research=houses_research,\n        dignities_research=dignities_research,\n    )\n    house_lords_research: dict[str, Any] = {':
                  '    semantics_research = build_semantics_research(\n        houses_research=houses_research,\n        dignities_research=dignities_research,\n    )\n    interpretation_policy_research = build_interpretation_policy_research()\n    house_lords_research: dict[str, Any] = {',
              '        "semantics_research": semantics_research,\n        "interpretation_status": "planetary_position_facts_plus_noninterpreted_lagna_house_dignity_aspect_semantics_research",':
                  '        "semantics_research": semantics_research,\n        "interpretation_policy_research": interpretation_policy_research,\n        "interpretation_status": "planetary_position_facts_plus_noninterpreted_lagna_house_dignity_aspect_semantics_policy_research",',
              '"consensus_policy": "Mahathaksa/Taksajorn and cross-validated Suriyayat positions remain the interpreted Thai layers. Cross-source neutral house domains and basic Kaset/Pra/Ucca/Nicha functional directions are now research semantics only. Advanced-standard meanings, aspect meanings, combined judgement, event claims and Western-style probability scores remain disabled.",':
                  '"consensus_policy": "Mahathaksa/Taksajorn and cross-validated Suriyayat positions remain the interpreted Thai layers. A research-only consensus registry now records which semantic claims are stable and which remain school-dependent or numerically conflicting. Disputed aspect percentages, advanced-standard meanings, combined judgement, event claims and Western-style probability scores remain disabled.",',
              '            "suriyayat_semantic_vocabulary": "research_only_neutral_house_domains_and_basic_status_direction",\n            "suriyayat_predictive_rules": "not_implemented",':
                  '            "suriyayat_semantic_vocabulary": "research_only_neutral_house_domains_and_basic_status_direction",\n            "suriyayat_interpretation_consensus_registry": "research_only_preserves_source_conflicts",\n            "suriyayat_predictive_rules": "not_implemented",',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit('missing Phase 2D2 anchor: ' + old[:100])
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Install Swiss Ephemeris dependency
        run: python -m pip install --disable-pip-version-check pyswisseph==2.10.3.2
      - name: Run Phase 2D2 policy tests
        env: {PYTHONPATH: .}
        run: python -m unittest discover -s tests -p 'test_thai_interpretation_policy_v1.py' -v
      - name: Run Phase 2D2 integration tests
        env: {PYTHONPATH: .}
        run: python -m unittest discover -s tests -p 'test_thai_interpretation_policy_integration.py' -v
      - name: Run Phase 2D1 semantics regressions
        env: {PYTHONPATH: .}
        run: python -m unittest discover -s tests -p 'test_thai_semantics_v1.py' -v
      - name: Run Phase 2C regressions
        env: {PYTHONPATH: .}
        run: python -m unittest discover -s tests -p 'test_thai_phase2c_labels_standards.py' -v
      - name: Run dignity regressions
        env: {PYTHONPATH: .}
        run: python -m unittest discover -s tests -p 'test_thai_dignities_v1.py' -v
      - name: Run aspect regressions
        env: {PYTHONPATH: .}
        run: python -m unittest discover -s tests -p 'test_thai_aspects_v1.py' -v
      - name: Run Phase 2B integration regressions
        env: {PYTHONPATH: .}
        run: python -m unittest discover -s tests -p 'test_thai_rules_phase2b_integration.py' -v
      - name: Run house regressions
        env: {PYTHONPATH: .}
        run: python -m unittest discover -s tests -p 'test_thai_houses*.py' -v
      - name: Run Lagna regressions
        env: {PYTHONPATH: .}
        run: python -m unittest discover -s tests -p 'test_thai_lagna*.py' -v
      - name: Run Gemini research isolation regressions
        env: {PYTHONPATH: .}
        run: python -m unittest discover -s tests -p 'test_ai_thai_research_isolation.py' -v
      - name: Compile Thai modules
        run: python -m py_compile thai_lagna_v1.py thai_houses_v1.py thai_dignities_v1.py thai_aspects_v1.py thai_semantics_v1.py thai_interpretation_policy_v1.py thai_astrology_v2.py ai_interpret_v1.py
      - name: Verify disagreement preservation and closed gates
        env: {PYTHONPATH: .}
        run: |
          python - <<'PY'
          import json
          from datetime import date,time
          from ai_interpret_v1 import _compact_calculation
          from thai_astrology_v2 import build_thai_fortune
          thai = build_thai_fortune(
              birth_date=date(1991,3,21), birth_time=time(7,26),
              start_date=date(2026,8,31), end_date=date(2026,8,31),
              utc_offset_hours=9.0, latitude=34.7604, longitude=127.6622,
          )
          suri = thai['suriyayat']
          policy = suri['interpretation_policy_research']
          strength = policy['rules']['aspect_strength']
          a = strength['observed_source_examples']['source_a']
          b = strength['observed_source_examples']['source_b']
          assert a['kum'] == b['kum'] == 100
          assert a['leng'] != b['leng']
          assert a['yok'] != b['yok']
          assert 'canonical_percent' not in strength
          gate = policy['promotion_gate']
          assert gate['advanced_standard_interpretation_allowed'] is False
          assert gate['aspect_strength_percent_allowed'] is False
          assert gate['aspect_pair_interpretation_allowed'] is False
          assert gate['combined_judgement_allowed'] is False
          assert gate['scores_allowed'] is False
          assert gate['event_judgement_allowed'] is False
          assert gate['gemini_interpretation_allowed'] is False
          assert suri['lagna']['available'] is False
          compact_suri = _compact_calculation({'period': {'day_count': 1}, 'thai': thai})['thai']['suriyayat']
          assert 'interpretation_policy_research' not in compact_suri
          encoded = json.dumps(compact_suri, ensure_ascii=False)
          assert 'numeric_conflict_blocked' not in encoded
          assert thai['engine'] == 'thai-mahathaksa-taksajorn-suriyayat-v2.6-phase2d2-policy-research'
          print('PHASE2D2_SOURCE_CONFLICTS_PRESERVED_NO_HIDDEN_SCORE_INTERPRETATION_BLOCKED')
          PY
      - name: Check whitespace
        run: git diff --check
      - name: Commit Phase 2D2 state and clean workflow
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add thai_astrology_v2.py thai_interpretation_policy_v1.py tests/test_thai_interpretation_policy_v1.py tests/test_thai_interpretation_policy_integration.py
          git rm -f .github/workflows/thai-phase2d2-policy-once.yml
          git commit -m 'research: preserve Thai interpretation consensus and source conflicts'
          git push origin HEAD:feature/thai-lagna-phase1-real-20260831
