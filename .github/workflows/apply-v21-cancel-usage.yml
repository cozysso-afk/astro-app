name: Apply V21 Cancel Usage Observability
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/patch_v21_cancel_usage.py'
      - '.github/workflows/apply-v21-cancel-usage.yml'
permissions:
  contents: write
jobs:
  apply:
    if: github.head_ref == 'work/ai-cost-guard-v21'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/ai-cost-guard-v21
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply cancel usage patch
        run: python scripts/patch_v21_cancel_usage.py
      - name: V21 regression
        run: node --experimental-strip-types --test supabase/functions/fortune-interpret-v21-preview/costGuardV21.test.mjs
      - name: Web production build
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Commit product changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/functions/fortune-interpret-v21-preview web/src/AppNext.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix(ai): preserve usage after canceled V21 calls'
          git push origin HEAD:work/ai-cost-guard-v21
