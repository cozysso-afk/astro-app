name: Daily production smoke
on:
  push:
    branches: [qa/daily-editorial-v23-11]
    paths: [.github/workflows/daily-production-smoke.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: daily-production-smoke
  cancel-in-progress: false
jobs:
  production:
    if: github.ref_name == 'qa/daily-editorial-v23-11'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Install browser
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify actual production with one synthetic generation maximum
        env:
          QA_SUPABASE_URL: ${{ secrets.QA_SUPABASE_URL }}
          QA_SUPABASE_ANON_KEY: ${{ secrets.QA_SUPABASE_ANON_KEY }}
          QA_USER_EMAIL: ${{ secrets.QA_USER_EMAIL }}
          QA_USER_PASSWORD: ${{ secrets.QA_USER_PASSWORD }}
          QA_CALC_API_URL: ${{ secrets.QA_CALC_API_URL }}
        run: node scripts/daily-production-smoke.mjs
      - name: Save synthetic-only verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-production-smoke
          path: web/daily-production-artifacts/
          retention-days: 7
          if-no-files-found: warn
