name: Daily production smoke
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Replay a completed QA job, or request one synthetic Gemini job'
        type: choice
        options: [replay, generate]
        default: replay
      period:
        description: 'Period to check'
        type: choice
        options: [day, week, month]
        default: day
      start_date:
        description: 'Period start (YYYY-MM-DD, Monday for weeks or first of month)'
        required: true
      interpreter_version:
        description: 'Exact V23 interpreter version to verify'
        required: true
      existing_job_id:
        description: 'Completed synthetic QA job ID; required only in replay mode'
        required: false
      confirm_paid_calls:
        description: 'Enable one generation job (up to two Gemini calls); leave off for replay'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: daily-production-smoke
  cancel-in-progress: false
jobs:
  production:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Install browser
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify selected period on the production web app
        env:
          QA_SUPABASE_URL: ${{ secrets.QA_SUPABASE_URL }}
          QA_SUPABASE_ANON_KEY: ${{ secrets.QA_SUPABASE_ANON_KEY }}
          QA_USER_EMAIL: ${{ secrets.QA_USER_EMAIL }}
          QA_USER_PASSWORD: ${{ secrets.QA_USER_PASSWORD }}
          QA_RUN_MODE: ${{ inputs.mode }}
          QA_PERIOD: ${{ inputs.period }}
          QA_REPLAY_DATE: ${{ inputs.start_date }}
          QA_REPLAY_VERSION: ${{ inputs.interpreter_version }}
          QA_EXISTING_JOB_ID: ${{ inputs.existing_job_id }}
          QA_CONFIRM_PAID_CALLS: ${{ inputs.confirm_paid_calls }}
        run: node --experimental-strip-types scripts/daily-production-smoke.mjs
      - name: Save synthetic-only verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-reading-${{ inputs.period }}-${{ inputs.mode }}-${{ github.run_id }}
          path: web/daily-production-artifacts/
          retention-days: 7
          if-no-files-found: warn
