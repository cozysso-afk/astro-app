name: Fix history and settings v1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-history-settings-v1.yml'

permissions:
  contents: write

jobs:
  patch-build-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python scripts/patch_history_settings_v1.py
      - name: Verify markers
        run: |
          grep -q "저장된 기록 0개" web/src/AppNext.tsx
          grep -q "별빛 · 오로라 효과" web/src/AppNext.tsx
          grep -q "settings.css" web/src/main.tsx
          grep -q "pointer-events:auto" web/src/settings.css
      - name: Build web
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/src/AppNext.tsx web/src/main.tsx web/src/settings.css
          git commit -m 'fix: make archive and settings functional'
          git push
