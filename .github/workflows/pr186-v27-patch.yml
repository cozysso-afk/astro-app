name: PR186 v2.7 guarded patch

on:
  push:
    branches:
      - fix/reunion-hierarchy-v2
    paths:
      - scripts/apply_reunion_v27_patch.py
      - .github/workflows/pr186-v27-patch.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: fix/reunion-hierarchy-v2
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply guarded v2.7 patch
        run: python scripts/apply_reunion_v27_patch.py

      - name: Install focused test dependencies
        run: python -m pip install -q -r api/requirements.txt pytest httpx

      - name: Syntax, focused tests, and diff checks
        run: |
          python -m py_compile api/main.py relationship_return_v1.py tests/test_return_relocation_v27.py
          python -m pytest -q tests/test_return_relocation_v26.py tests/test_return_relocation_v27.py
          git diff --check

      - name: Commit and push v2.7 code/tests
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/main.py relationship_return_v1.py tests/test_return_relocation_v27.py .github/workflows/calculation-audit-ci.yml
          git commit -m "fix(reunion): add event-specific return relocation timeline"
          git push origin HEAD:fix/reunion-hierarchy-v2
