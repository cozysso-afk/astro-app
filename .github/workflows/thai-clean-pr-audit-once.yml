name: Thai clean PR candidate audit once

on:
  push:
    branches:
      - audit/thai-clean-pr-verify-20260831
    paths:
      - '.github/workflows/thai-clean-pr-audit-once.yml'

permissions:
  contents: read

jobs:
  verify-clean-candidate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/thai-lagna-clean-pr-20260831
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Verify one-commit clean diff contract
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          echo '=== CLEAN CANDIDATE DIFF ==='
          git diff --name-status origin/main...HEAD
          echo '=== CLEAN CANDIDATE STAT ==='
          git diff --stat origin/main...HEAD
          test "$(git rev-list --count origin/main..HEAD)" -eq 1
          test "$(git diff --name-only origin/main...HEAD | wc -l)" -eq 57
          test -z "$(git diff --name-only origin/main...HEAD | grep '^\.github/' || true)"
          test ! -e .github/workflows/thai-phase2g5-product-promotion-once.yml
          test ! -e .github/workflows/thai-prepr-full-audit-once.yml
          test ! -e scripts/apply_thai_g52.py
          git diff --check origin/main...HEAD
          echo 'CLEAN_DIFF_CONTRACT_PASS'

      - name: Install production Python dependencies
        run: python -m pip install --disable-pip-version-check -r api/requirements.txt

      - name: Compile runtime and test Python sources
        run: |
          python - <<'PY'
          from pathlib import Path
          import py_compile
          import sys

          excluded = {'.git', '.venv', 'venv', 'node_modules', '__pycache__', 'scripts'}
          files = []
          for path in Path('.').rglob('*.py'):
              if any(part in excluded for part in path.parts):
                  continue
              files.append(path)
          failures = []
          for path in files:
              try:
                  py_compile.compile(str(path), doraise=True)
              except Exception as exc:
                  failures.append((str(path), repr(exc)))
          print(f'PY_RUNTIME_TEST_COMPILE_FILES={len(files)}')
          if len(files) != 63:
              raise SystemExit(f'expected 63 runtime/test Python files, found {len(files)}')
          if failures:
              for item in failures:
                  print(item)
              sys.exit(1)
          print('PY_RUNTIME_TEST_COMPILE_ALL_PASS')
          PY

      - name: Confirm known legacy script debt is unchanged from main
        run: |
          python - <<'PY'
          import py_compile
          path = 'scripts/polish_mockup_ui_v76.py'
          try:
              py_compile.compile(path, doraise=True)
          except Exception as exc:
              print('KNOWN_MAIN_SCRIPT_SYNTAX_DEBT=', path, type(exc).__name__)
          else:
              raise SystemExit('expected known legacy script syntax debt changed unexpectedly')
          PY
          git diff --quiet origin/main...HEAD -- scripts/polish_mockup_ui_v76.py

      - name: Run entire repository test suite
        env:
          PYTHONPATH: .
        run: |
          python - <<'PY'
          import sys
          import unittest

          suite = unittest.defaultTestLoader.discover('tests', pattern='test_*.py')
          total = suite.countTestCases()
          print(f'REPOSITORY_DISCOVERED_TESTS={total}')
          if total != 239:
              raise SystemExit(f'expected 239 tests, discovered {total}')
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          print(f'REPOSITORY_RESULT={result.testsRun}/{total}')
          if not result.wasSuccessful():
              sys.exit(1)
          PY

      - name: Production-style FastAPI health smoke
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          uvicorn api.main:app --host 127.0.0.1 --port 8765 >/tmp/astro-uvicorn.log 2>&1 &
          UVICORN_PID=$!
          cleanup() { kill "$UVICORN_PID" 2>/dev/null || true; }
          trap cleanup EXIT
          ok=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/health >/tmp/astro-health.json; then
              ok=1
              break
            fi
            sleep 1
          done
          if [ "$ok" -ne 1 ]; then
            cat /tmp/astro-uvicorn.log
            exit 1
          fi
          cat /tmp/astro-health.json
          echo
          echo 'FASTAPI_UVICORN_HEALTH_SMOKE_PASS'

      - name: Frontend production build
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Final artifact and source cleanliness check
        run: |
          echo '=== STATUS BEFORE CLEANUP ==='
          git status --short
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          rm -rf web/dist web/node_modules
          echo '=== STATUS AFTER CLEANUP ==='
          git status --short
          test -z "$(git status --porcelain)"
          echo 'THAI_CLEAN_PR_CANDIDATE_AUDIT_PASS'
