name: Run personal marriage fun forecast

on:
  push:
    branches:
      - work/ai-cost-guard-v21
    paths:
      - '.github/workflows/run-personal-marriage-fun-forecast.yml'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Apply fun forecast patch
        run: python scripts/patch_personal_marriage_fun_forecast.py
      - name: Verify deterministic personal marriage forecast
        run: |
          python -m pip install -q -r api/requirements.txt pytest
          python -m py_compile personal_marriage_v1.py api/main.py
          python -m pytest -q tests/test_personal_marriage_v1.py
          python - <<'PY'
          from datetime import date, time
          from personal_marriage_v1 import build_personal_marriage
          r = build_personal_marriage(
              birth_date=date(1991,3,21), birth_time=time(7,26), latitude=34.7604, longitude=127.6622,
              utc_offset_hours=9.0, start_date=date(2026,9,4), end_date=date(2027,9,3)
          )
          assert r['policy']['marriage_probability'] is True
          assert r['policy']['spouse_archetype_prediction'] is True
          assert r['policy']['specific_identity_claims'] is False
          assert 0 <= r['forecast']['marriage_probability_percent'] <= 100
          assert len(r['forecast']['strong_windows']) >= 3
          assert r['spouse_archetype']['appearance_hints']
          assert r['spouse_archetype']['career_clusters']
          assert r['spouse_archetype']['meeting_route']
          # No physical planet may be counted twice simply because it is also a house ruler alias.
          for row in r['natal_aspects']:
              assert not (row['orb'] == 0 and (str(row['a']).endswith('ruler') or str(row['b']).endswith('ruler')))
          print('forecast', r['forecast']['marriage_probability_percent'], r['forecast']['label'])
          print('spouse', r['spouse_archetype']['summary'])
          PY
          git diff --check
      - name: Verify web production build
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Commit verified forecast
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/run-personal-marriage-fun-forecast.yml scripts/patch_personal_marriage_fun_forecast.py
          git add -A
          git commit -m 'feat(marriage): add fun probability timing and spouse forecast'
          git push origin HEAD:work/ai-cost-guard-v21
