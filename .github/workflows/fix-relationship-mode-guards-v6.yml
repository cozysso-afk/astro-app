name: Relationship v6 guard fix

on:
  push:
    paths:
      - '.github/workflows/fix-relationship-mode-guards-v6.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply mode guard fix
        run: python scripts/fix_relationship_mode_guards_v6.py
      - name: Build web
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/src/AppNext.tsx
          git commit -m 'fix: isolate compatibility reunion and marriage render modes'
          git push
