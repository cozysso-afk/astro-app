name: Apply archive resilience v6.9.0

on:
  push:
    branches: [main]
    paths:
      - "scripts/upgrade_archive_resilience_v690.py"
      - ".github/workflows/apply-archive-resilience-v690.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: astro-app-write-main
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync main before patch
        run: git pull --rebase origin main

      - name: Apply archive resilience upgrade
        run: python scripts/upgrade_archive_resilience_v690.py

      - name: Python syntax check
        run: python -m py_compile app.py

      - name: Diff sanity check
        run: git diff --check

      - name: Feature marker check
        shell: bash
        run: |
          grep -q 'def _request_browser_persistent_storage' app.py
          grep -q 'navigator.storage.persist()' app.py
          grep -q 'def _read_browser_archive_backup' app.py
          grep -q 'def _restore_browser_archive_records' app.py
          grep -q 'IndexedDB 오래 보관 요청' app.py
          grep -q '저장함 JSON 백업 다운로드' app.py
          grep -q '백업 JSON 복원' app.py

      - name: Commit and push patched app
        shell: bash
        run: |
          if git diff --quiet -- app.py; then
            echo "No app.py changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git commit -m "feat: harden IndexedDB archive persistence and backups"
          git pull --rebase origin main
          git push origin HEAD:main

# retrigger: v6.9.0 archive resilience
