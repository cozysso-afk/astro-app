name: Apply archive resilience v6.9.1

on:
  workflow_dispatch:
  issues:
    types: [opened]

permissions:
  contents: write

concurrency:
  group: astro-app-write-main
  cancel-in-progress: false

jobs:
  patch:
    if: github.event_name != 'issues' || github.event.issue.title == '[automation] apply archive resilience'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync main before patch
        run: git pull --rebase origin main

      - name: Apply archive resilience upgrade
        run: python scripts/upgrade_archive_resilience_v690.py

      - name: Apply headless automation auth compatibility
        run: python scripts/upgrade_automation_auth_v691.py

      - name: Python syntax check
        run: |
          python -m py_compile app.py
          python -m py_compile scripts/prewarm_streamlit_horoscope.py

      - name: Diff sanity check
        run: git diff --check

      - name: Feature marker check
        shell: bash
        run: |
          grep -q 'def _request_browser_persistent_storage' app.py
          grep -q 'navigator.storage.persist()' app.py
          grep -q 'def _read_browser_archive_backup' app.py
          grep -q 'def _restore_browser_archive_records' app.py
          grep -q 'IndexedDB 오래 보관 요청' app.py
          grep -q '저장함 JSON 백업 다운로드' app.py
          grep -q '백업 JSON 복원' app.py
          grep -q 'automation_mode = str(automation_value or "").strip() == "1"' app.py
          grep -q '"automation": "1"' scripts/prewarm_streamlit_horoscope.py

      - name: Commit and push patched app
        shell: bash
        run: |
          if git diff --quiet -- app.py scripts/prewarm_streamlit_horoscope.py; then
            echo "No app/worker changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py scripts/prewarm_streamlit_horoscope.py
          git commit -m "fix: support headless PIN automation without weakening auth"
          git pull --rebase origin main
          git push origin HEAD:main
