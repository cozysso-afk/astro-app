name: temporary weekly stale-test fixer

on:
  push:
    branches:
      - fix/reunion-hierarchy-v2
    paths:
      - scripts/_tmp_fix_weekly_stale_test.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/reunion-hierarchy-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Apply stale-test fix
        run: python scripts/_tmp_fix_weekly_stale_test.py
      - name: Install web dependencies
        working-directory: web
        run: npm ci
      - name: Run reading experience test
        working-directory: web
        run: node --experimental-strip-types --test src/lib/readingExperience.test.mjs
      - name: Build web
        working-directory: web
        run: npm run build
      - name: Commit verified test change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/src/lib/readingExperience.test.mjs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'test: align weekly arc assertion with compact copy'
          git push origin HEAD:fix/reunion-hierarchy-v2
