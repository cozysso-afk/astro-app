name: New stack smoke

on:
  push:
    paths:
      - 'api/**'
      - 'web/**'
      - 'render.yaml'
      - '.github/workflows/new-stack-smoke.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate FastAPI Python syntax
        run: python -m py_compile api/main.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        working-directory: web
        run: npm install

      - name: Build mobile web
        working-directory: web
        run: npm run build
