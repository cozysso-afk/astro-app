name: Apply Relationship Preview v4

on:
  push:
    branches: [ui-reading-overhaul-20260829]
    paths:
      - '.github/workflows/apply-relationship-preview-v4.yml'

permissions:
  contents: write

jobs:
  patch-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Wire preview interpreter
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('web/src/AppNext.tsx')
          s = p.read_text(encoding='utf-8')
          old = "supabase.functions.invoke('relationship-interpret', {"
          new = "supabase.functions.invoke('relationship-interpret-v4-preview', {"
          if new not in s:
              assert old in s, 'relationship interpreter call not found'
              s = s.replace(old, new, 1)
          s = s.replace("<strong>현실 조언</strong>", "<strong>이 관계를 다룰 때</strong>", 1)
          s = s.replace("<summary>핵심 애스펙트 상세</summary>", "<summary>왜 이런 관계로 느껴지는지 · 핵심 접점</summary>", 1)
          p.write_text(s, encoding='utf-8')
          PY
          cd web
          npm ci
          npm run build
      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/src/AppNext.tsx
          git commit -m 'test: use deep relationship interpreter preview'
          git push
