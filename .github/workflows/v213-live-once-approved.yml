name: V21.3 Approved Live Once

on:
  push:
    branches:
      - work/ai-cost-guard-v21
    paths:
      - '.github/workflows/v213-live-once-approved.yml'

permissions:
  contents: read

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RENDER_API: https://astro-app-api-f7fn.onrender.com
      SUPABASE_URL: https://dbynfabwfcakxayyggzi.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_IEf9R9oJ5kbn513DdeqODQ_DwLeF35r
      FUNCTION_NAME: fortune-interpret-v21-preview
      EXPECTED_VERSION: supabase-ai-v21.3-balanced-evidence-budget
      MAX_INSPECT_BYTES: '80000'
      MAX_EST_INPUT_TOKENS: '28500'
    steps:
      - uses: actions/checkout@v4

      - name: Create isolated anonymous test session
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body -sS -X POST "$SUPABASE_URL/auth/v1/signup" \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            -H 'Content-Type: application/json' \
            --data '{"data":{"purpose":"v21.3-approved-live-smoke"}}' > auth.json
          TOKEN=$(jq -r '.access_token // empty' auth.json)
          USER_ID=$(jq -r '.user.id // empty' auth.json)
          test -n "$TOKEN"; test -n "$USER_ID"
          echo "ACCESS_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          echo "$USER_ID" > test-user-id.txt

      - name: Calculate same dummy annual fixture without Gemini
        shell: bash
        run: |
          set -euo pipefail
          cat > calc-request.json <<'JSON'
          {
            "profile": {
              "name": "V21.3 DUMMY TEST",
              "birth_date": "1990-06-15",
              "birth_time": "12:00",
              "latitude": 37.5665,
              "longitude": 126.9780,
              "utc_offset_hours": 9,
              "gender": "female"
            },
            "start_date": "2026-01-01",
            "end_date": "2026-12-31"
          }
          JSON
          curl --fail-with-body -sS -X POST "$RENDER_API/v1/fortune/integrated/start" -H 'Content-Type: application/json' --data-binary @calc-request.json > calc-start.json
          CALC_JOB_ID=$(jq -r '.job_id // empty' calc-start.json); test -n "$CALC_JOB_ID"
          for i in $(seq 1 240); do
            sleep 2
            curl -sS "$RENDER_API/v1/fortune/integrated/jobs/$CALC_JOB_ID" > calc-status.json || true
            STATUS=$(jq -r '.status // empty' calc-status.json)
            if [ "$STATUS" = "done" ]; then jq '.result' calc-status.json > calculation.json; break; fi
            if [ "$STATUS" = "failed" ]; then cat calc-status.json; exit 1; fi
          done
          test -s calculation.json

      - name: Inspect and cost-gate before any Gemini call
        shell: bash
        run: |
          set -euo pipefail
          jq -n --slurpfile calc calculation.json '{action:"inspect",calculation:$calc[0]}' > inspect-request.json
          curl --fail-with-body -sS -X POST "$SUPABASE_URL/functions/v1/$FUNCTION_NAME" \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" -H "Authorization: Bearer $ACCESS_TOKEN" -H 'Content-Type: application/json' \
            --data-binary @inspect-request.json > inspect.json
          VERSION=$(jq -r '.interpreter_version // empty' inspect.json)
          BYTES=$(jq -r '.prompt_payload_bytes // 999999999' inspect.json)
          EST=$(jq -r '.estimated_input_tokens // 999999999' inspect.json)
          MAX_CALLS=$(jq -r '.max_gemini_calls_per_job // 0' inspect.json)
          OK=$(jq -r '.prompt_budget_ok // false' inspect.json)
          jq '{interpreter_version,prompt_payload_bytes,prompt_budget_bytes,prompt_budget_ok,estimated_input_tokens,max_gemini_calls_per_job,prompt_evidence_ledger,evidence_ledger,key_dates}' inspect.json
          test "$VERSION" = "$EXPECTED_VERSION"
          test "$OK" = "true"
          test "$MAX_CALLS" = "2"
          test "$BYTES" -le "$MAX_INSPECT_BYTES"
          test "$EST" -le "$MAX_EST_INPUT_TOKENS"

      - name: Verify Saju and Thai survive compressed prompt without Gemini
        shell: bash
        run: |
          set -euo pipefail
          jq -n --slurpfile calc calculation.json '{action:"prompt",calculation:$calc[0]}' > prompt-request.json
          curl --fail-with-body -sS -X POST "$SUPABASE_URL/functions/v1/$FUNCTION_NAME" \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" -H "Authorization: Bearer $ACCESS_TOKEN" -H 'Content-Type: application/json' \
            --data-binary @prompt-request.json > prompt.json
          python - <<'PY'
          import json
          obj=json.load(open('prompt.json'))
          text=obj.get('prompt','')
          marker='CALCULATED_DATA='
          assert marker in text
          packet=json.loads(text.split(marker,1)[1])
          rows=packet.get('evidence_ledger') or []
          systems={str(r.get('system','')) for r in rows}
          counts={s:sum(1 for r in rows if r.get('system')==s) for s in ('western','saju','thai')}
          print('compressed_evidence_counts='+json.dumps(counts,ensure_ascii=False))
          assert 'western' in systems
          assert 'saju' in systems
          assert 'thai' in systems
          PY

      - name: Run exactly one approved V21.3 AI job
        shell: bash
        run: |
          set -euo pipefail
          jq -n --slurpfile calc calculation.json '{action:"start",model:"gemini-3.7-flash",calculation:$calc[0]}' > start.json
          curl --fail-with-body -sS -X POST "$SUPABASE_URL/functions/v1/$FUNCTION_NAME" \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" -H "Authorization: Bearer $ACCESS_TOKEN" -H 'Content-Type: application/json' \
            --data-binary @start.json > ai-start.json
          test "$(jq -r '.ok // false' ai-start.json)" = "true"
          JOB_ID=$(jq -r '.job_id // empty' ai-start.json); test -n "$JOB_ID"; echo "$JOB_ID" > ai-job-id.txt
          for i in $(seq 1 70); do
            sleep 3
            jq -n --arg id "$JOB_ID" '{action:"status",job_id:$id}' > status-request.json
            curl --fail-with-body -sS -X POST "$SUPABASE_URL/functions/v1/$FUNCTION_NAME" \
              -H "apikey: $SUPABASE_PUBLISHABLE_KEY" -H "Authorization: Bearer $ACCESS_TOKEN" -H 'Content-Type: application/json' \
              --data-binary @status-request.json > ai-final.json
            STATUS=$(jq -r '.status // empty' ai-final.json)
            echo "poll=$i status=$STATUS"
            if [ "$STATUS" = "done" ] || [ "$STATUS" = "failed" ]; then break; fi
          done
          test "$(jq -r '.status // empty' ai-final.json)" = "done"
          test "$(jq -r '.interpreter_version // empty' ai-final.json)" = "$EXPECTED_VERSION"
          ATTEMPTS=$(jq -r '.usage.attempt_count // 0' ai-final.json)
          test "$ATTEMPTS" -le 2
          jq '{status,model,fallback_from,interpreter_version,error,usage,headline:.data.headline,overall_summary:.data.overall.summary,priorities:.data.priorities,key_windows_count:(.data.key_windows|length),decisions_count:(.data.decisions|length),year_phases_count:(.data.year_phases|length),cross_checks_count:(.data.cross_checks|length),cross_checks:.data.cross_checks,systems:.data.systems,investment_reading:.data.investment_reading,relationship_reading:.data.relationship_reading,limits:.data.limits}' ai-final.json > live-summary.json
          cat live-summary.json

      - name: Sanity-check output wording
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,re
          obj=json.load(open('ai-final.json'))
          data=obj.get('data') or {}
          text=json.dumps(data,ensure_ascii=False)
          banned=['연중 가장 완벽한 합일','완벽한 합일','대길의 시기','매수 적기','매도 적기','수익률이 오를','가격이 오를']
          hits=[x for x in banned if x in text]
          print('banned_hits='+json.dumps(hits,ensure_ascii=False))
          assert not hits
          usage=obj.get('usage') or {}
          q=usage.get('quality_validation') or {}
          print('quality_score='+str(q.get('score')))
          print('attempt_count='+str(usage.get('attempt_count')))
          print('total_tokens='+str(usage.get('total_tokens')))
          PY

      - name: Upload sanitized result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v213-approved-live-result
          path: |
            inspect.json
            ai-final.json
            live-summary.json
            test-user-id.txt
            ai-job-id.txt
          retention-days: 1
