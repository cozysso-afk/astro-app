          node --experimental-strip-types --test supabase/functions/fortune-interpret-v6-preview/integratedInterpretationV2.test.mjs
          node --experimental-strip-types --test supabase/functions/fortune-interpret-v6-preview/thaiContract.test.mjs
          node --experimental-strip-types --test web/src/lib/fortuneAiJob.test.mjs
      - name: Web production build
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Commit V14 adaptive length contract
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/functions/fortune-interpret-v6-preview/integratedInterpretationV2.ts supabase/functions/fortune-interpret-v6-preview/qualityV2.ts supabase/functions/fortune-interpret-v6-preview/qualityPeriods.test.mjs supabase/functions/fortune-interpret-v6-preview/integratedInterpretationV2.test.mjs web/src/AiInterpretationPanel.tsx web/src/lib/readingCache.ts web/src/lib/fortuneAiJob.ts web/src/lib/fortuneAiJob.test.mjs
          git diff --cached --quiet && exit 0
          git commit -m 'feat(ai): make interpretation length adaptive to salience'
          git push origin HEAD:work/integrated-interpretation-v2
