name: Optimize Reunion Speed 2026-08-30

on:
  push:
    branches:
      - perf/reunion-speed-20260830b
    paths:
      - .github/workflows/optimize-reunion-speed-20260830.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/reunion-speed-20260830b

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Apply reunion patch
        run: python scripts/patch_reunion_speed_v1.py

      - name: Build frontend
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Verify patch markers
        run: |
          grep -q "const reunionTask = shouldRunReunionTiming ? runReunionTiming() : null" web/src/AppNext.tsx
          grep -q "pollResponse.status === 404" web/src/AppNext.tsx
          grep -q "transientFailures <= 4" web/src/AppNext.tsx

      - name: Commit verified patch to branch
        run: |
          git config user.name "cozysso-afk"
          git config user.email "cozysso@gmail.com"
          git add web/src/AppNext.tsx
          if git diff --cached --quiet; then
            echo "No patch changes to commit"
            exit 0
          fi
          git commit -m "perf: make reunion calculation concurrent and retry-safe"
          git push origin HEAD:perf/reunion-speed-20260830b
