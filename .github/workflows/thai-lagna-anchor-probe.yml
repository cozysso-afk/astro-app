name: Thai Lagna 06 anchor probe

on:
  push:
    branches:
      - feature/thai-lagna-phase1-real-20260831
    paths:
      - .github/workflows/thai-lagna-anchor-probe.yml

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/thai-lagna-phase1-real-20260831
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pyswisseph==2.10.3.2
      - name: Compare birth-Sun vs 06:00-Sun anchors
        run: |
          python - <<'PY'
          from datetime import date,time,datetime,timedelta,timezone
          from thai_lagna_v1 import calculate_common_anto_0600,angular_delta_deg,COMMON_SIGN_DURATIONS_MINUTES
          from thai_suriyayat_v1 import calculate_positions_for_instant
          lon=100.494066; utc=7.0
          def d(s,x,m): return s*30+x+m/60
          refs=[
            ('1777',date(1777,5,14),time(6,42),d(1,16,19),d(1,10,41)),
            ('1862',date(1862,3,6),time(0,0),d(7,10,31),d(7,6,45)),
            ('1871',date(1871,1,22),time(23,41),d(6,14,3),d(6,10,50)),
            ('1959',date(1959,7,1),time(0,18),d(11,7,21),d(11,2,51)),
            ('2026a',date(2026,1,7),time(8,9),d(10,8,17),d(10,2,39)),
            ('2026b',date(2026,3,24),time(14,15),d(4,0,59),d(3,26,41)),
            ('2026c',date(2026,4,20),time(23,42),d(8,14,5),d(8,9,35)),
          ]
          def corrected(day,tm,lmt):
            tz=timezone(timedelta(hours=utc))
            anchor=datetime.combine(day,time(6,0),tzinfo=tz)
            sun=float(calculate_positions_for_instant(anchor)['positions']['sun']['longitude_deg'])%360
            sign=int(sun//30); within=sun-sign*30
            z=sum(COMMON_SIGN_DURATIONS_MINUTES[:sign])+COMMON_SIGN_DURATIONS_MINUTES[sign]*(within/30)
            clock=tm.hour*60+tm.minute+tm.second/60
            if lmt: clock += 4*(lon-15*utc)
            target=(z+(clock-360))%1440
            c=0
            for i,dur in enumerate(COMMON_SIGN_DURATIONS_MINUTES):
              if target<c+dur or i==11:
                return (i*30+(target-c)*30/dur)%360
              c+=dur
          for mode,key in [(False,3),(True,4)]:
            old=[]; new=[]
            for row in refs:
              label,day,tm,*vals=row
              ref=vals[0 if not mode else 1]
              a=calculate_common_anto_0600(birth_date=day,birth_time=tm,longitude=lon,utc_offset_hours=utc,adjust_local_mean_time=mode)['longitude_deg']
              b=corrected(day,tm,mode)
              eo=abs(angular_delta_deg(a,ref))*60; en=abs(angular_delta_deg(b,ref))*60
              old.append(eo);new.append(en)
              print('LMT' if mode else 'LEGAL',label,'old=',round(eo,3),'anchor06=',round(en,3))
            print('SUMMARY','LMT' if mode else 'LEGAL','old max/mean=',round(max(old),3),round(sum(old)/len(old),3),'new max/mean=',round(max(new),3),round(sum(new)/len(new),3))
          PY
