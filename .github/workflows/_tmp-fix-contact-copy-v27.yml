name: temporary contact/copy v27 verifier

on:
  push:
    branches:
      - fix/reunion-hierarchy-v2
    paths:
      - scripts/_tmp_fix_contact_copy_v27.py
      - web/src/lib/humanLanguageV25.test.mjs
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/reunion-hierarchy-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Apply v27 copy/contact patch
        run: python scripts/_tmp_fix_contact_copy_v27.py
      - name: Install web dependencies
        working-directory: web
        run: npm ci
      - name: Run interpretation regressions
        working-directory: web
        run: node --experimental-strip-types --test src/lib/readingExperience.test.mjs src/lib/humanLanguageV25.test.mjs src/lib/relationshipReunionV2.contract.test.mjs
      - name: Build web
        working-directory: web
        run: npm run build
      - name: Commit verified source changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/src/lib/fortuneUserSummary.ts web/src/lib/relationshipUserSummary.ts web/src/RelationshipInterpretationPanel.tsx web/src/EditorialQaPreview.tsx web/src/lib/readingExperience.test.mjs web/src/lib/humanLanguageV25.test.mjs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: restore reunion contact score and sentence coherence'
          git push origin HEAD:fix/reunion-hierarchy-v2
