name: Run relationship v11 final free audit

on:
  push:
    branches:
      - work/ai-cost-guard-v21
    paths:
      - '.github/workflows/run-relationship-v11-final-free-audit.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Repair v11 patcher
        run: python scripts/finalize_relationship_v11_fun.py
      - name: Apply audited relationship v11 changes
        run: |
          python scripts/patch_relationship_audit_v11.py
          python scripts/patch_relationship_prompt_v11.py
          python scripts/patch_relationship_ui_depth_v11.py
          python scripts/patch_relationship_ci_v11.py
          python - <<'PY'
          from scripts.finalize_relationship_v11_fun import finalize_runtime_and_contract
          finalize_runtime_and_contract()
          PY
          python scripts/adjust_v11_test_contract.py
      - name: Verify personal marriage deterministic forecast
        run: |
          python -m pip install -q -r api/requirements.txt pytest
          python -m py_compile personal_marriage_v1.py api/main.py
          python -m pytest -q tests/test_personal_marriage_v1.py
      - name: Verify all relationship mode and cost contracts
        run: |
          node --test web/src/lib/relationshipModeContract.test.mjs
          node --experimental-strip-types --check supabase/functions/relationship-interpret-v9-preview/index.ts
          git diff --check
      - name: Verify web production build
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Commit verified v11 source and permanent regressions only
        run: |
          rm -f \
            .github/workflows/run-relationship-v11-final-free-audit.yml \
            .github/workflows/run-full-relationship-audit-v11.yml \
            .github/workflows/run-marriage-scope-ui-patch.yml \
            .github/workflows/run-personal-marriage-backend-patch.yml \
            scripts/adjust_v11_test_contract.py \
            scripts/finalize_relationship_v11_fun.py \
            scripts/patch_marriage_scope_ui.py \
            scripts/patch_personal_marriage_backend.py \
            scripts/patch_personal_marriage_quality.py \
            scripts/patch_relationship_audit_v11.py \
            scripts/patch_relationship_prompt_v11.py \
            scripts/patch_relationship_ui_depth_v11.py \
            scripts/patch_relationship_ci_v11.py
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(relationship): finalize marriage modes and v11 cost guard'
          git push origin HEAD:work/ai-cost-guard-v21
