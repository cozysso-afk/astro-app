name: Apply provisional relationship time v1

on:
  push:
    branches: [fix/reunion-readability-provisional-time]
    paths:
      - ".github/workflows/apply-provisional-relationship-time-v1.yml"

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Apply provisional entered-time patch
        run: python scripts/patch_provisional_relationship_time_v1.py

      - name: Install calculation test dependencies
        run: python -m pip install -q -r api/requirements.txt pytest httpx

      - name: Relationship calculation regressions
        run: |
          python -m py_compile relationship_western_v1.py api/main.py
          python -m pytest -q \
            tests/test_birth_time_reliability_v12.py \
            tests/test_relationship_reliability_v13.py \
            tests/test_relationship_api_e2e_v15.py \
            tests/test_relationship_timing_v9.py \
            tests/test_relationship_midpoints_v8.py \
            tests/test_reunion_dimensions_v14.py

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Relationship presentation regressions
        run: |
          node --experimental-strip-types --check supabase/functions/relationship-interpret-v9-preview/index.ts
          node --experimental-strip-types --test web/src/lib/readingExperience.test.mjs
          node --test web/src/lib/relationshipReunionV2.contract.test.mjs

      - name: Web production build
        working-directory: web
        run: npm run build

      - name: Diff sanity
        run: git diff --check

      - name: Commit patched product files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            relationship_western_v1.py \
            tests/test_birth_time_reliability_v12.py \
            tests/test_relationship_reliability_v13.py \
            web/src/AppNext.tsx \
            web/src/lib/relationshipUserSummary.ts \
            web/src/lib/readingExperience.test.mjs \
            web/src/RelationshipPrecisionDetails.tsx \
            web/src/lib/relationshipReunionV2.contract.test.mjs \
            supabase/functions/relationship-interpret-v9-preview/index.ts
          if ! git diff --cached --quiet; then
            git commit -m "Use entered birth time as provisional relationship reference"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
