name: Repair home icon safely
on:
  push:
    paths:
      - .github/workflows/fix-icon-placeholder.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore verified PNG and harden page icon
        shell: bash
        run: |
          cat > /tmp/icon.b64 <<'B64'
          
          B64
          base64 -d /tmp/icon.b64 > icon.PNG
          python -m pip install --quiet pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          p=Path('icon.PNG')
          with Image.open(p) as im:
              im.load()
              assert im.size==(180,180), im.size
              assert im.format=='PNG', im.format
          app=Path('app.py')
          s=app.read_text(encoding='utf-8')
          old='''try:\n    PAGE_ICON = Image.open(ICON_PATH)\nexcept Exception:\n    PAGE_ICON = "✨"\n'''
          new='''try:\n    with Image.open(ICON_PATH) as _page_icon_src:\n        _page_icon_src.load()\n        PAGE_ICON = _page_icon_src.copy()\nexcept Exception:\n    PAGE_ICON = "✨"\n'''
          if old not in s and new not in s:
              raise SystemExit('page icon block not found')
          if old in s:
              s=s.replace(old,new,1)
          app.write_text(s,encoding='utf-8')
          idx=Path('index.html')
          t=idx.read_text(encoding='utf-8').replace('icon.PNG?v=48','icon.PNG?v=49').replace('manifest.webmanifest?v=48','manifest.webmanifest?v=49')
          idx.write_text(t,encoding='utf-8')
          mf=Path('manifest.webmanifest')
          m=mf.read_text(encoding='utf-8').replace('icon.PNG?v=48','icon.PNG?v=49')
          mf.write_text(m,encoding='utf-8')
          print('verified icon', p.stat().st_size)
          PY
          python -m py_compile app.py fortune_lab_v71.py
          git diff --check
      - name: Commit repaired icon
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add icon.PNG app.py index.html manifest.webmanifest
          if git diff --cached --quiet; then
            echo 'No changes'
            exit 0
          fi
          git commit -m 'fix: restore valid home icon and harden favicon loading'
          git push
