name: Fix fortune UX v14

on:
  push:
    branches:
      - fix/annual-fortune-ui-thai-20260831
    paths:
      - .github/workflows/fix-fortune-ux-v14.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/annual-fortune-ui-thai-20260831
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Syntax check patch
        run: python -m py_compile scripts/fix_fortune_ux_v14.py

      - name: Apply corrected UX and relationship AI patch
        run: python scripts/fix_fortune_ux_v14.py

      - name: Verify period selection contract unchanged
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('web/src/AppNext.tsx').read_text()
          contract="""  const integratedStartDate = integratedCalendarYear ? `${integratedCalendarYear}-01-01` : queryDate
            const integratedSelectionEnd = integratedCalendarYear ? `${integratedCalendarYear}-12-31` : periodEnd(queryDate, period)
          """.replace('            const integratedSelectionEnd','  const integratedSelectionEnd')
          assert contract in s
          assert "{(selectedTool==='integrated'||selectedTool==='precision') && <section className=\"section-block\"><div className=\"section-label\">통합운세 기간 선택</div><div className=\"period-grid\">{periods.map" in s
          for token in ["key: 'today'", "key: 'week'", "key: 'month'", "key: 'year'"]:
              assert token in s, token
          print('PERIODS_UNCHANGED_OK')
          PY

      - name: Verify integrated result de-duplication
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('web/src/AppNext.tsx').read_text()
          assert '천체 흐름 리포트' not in s
          assert s.count('className="tool-panel integrated-panel"') == 1
          for token in ['integrated-relationship-flow','금전 · 주식 · 투자 흐름','integrated-date-highlights','integrated-time-evidence']:
              assert token in s, token
          print('INTEGRATED_DEDUP_OK')
          PY

      - name: Verify iOS date centering and luminous score cards
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('web/src/fortune-ux-v14.css').read_text()
          for token in ['::-webkit-date-and-time-value','::-webkit-datetime-edit-fields-wrapper','justify-content:center','font-variant-numeric:tabular-nums','Bodoni 72','backdrop-filter:blur','radial-gradient']:
              assert token in s, token
          m=Path('web/src/main.tsx').read_text()
          assert "import './fortune-ux-v14.css'" in m
          print('IOS_AND_SCORE_STYLE_OK')
          PY

      - name: Typecheck relationship Edge Function
        run: deno check supabase/functions/relationship-interpret-v9-preview/index.ts

      - name: Verify relationship AI hardening
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('supabase/functions/relationship-interpret-v9-preview/index.ts').read_text()
          assert 'relationship-v10.2-purpose-schema' in s
          assert 'responseSchema:schemaFor(purpose)' in s
          assert 'required.push("reunion_reading")' in s
          assert 'required.push("marriage_reading")' in s
          assert 'return respond(result,200)' in s
          assert 'result.ok?200:502' not in s
          assert s.count('await generate(') == 2
          print('RELATIONSHIP_AI_HARDENING_OK')
          PY

      - name: Python source compile
        run: python -m py_compile api/main.py integrated_fortune_v1.py relationship_western_v1.py thai_astrology_v2.py thai_suriyayat_v1.py

      - name: Frontend production build
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Diff safety
        run: |
          git diff --check
          git status --short

      - name: Commit verified product changes only
        run: |
          git rm scripts/fix_fortune_ux_v13.py .github/workflows/fix-fortune-ux-v13.yml scripts/fix_fortune_ux_v14.py .github/workflows/fix-fortune-ux-v14.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/src/AppNext.tsx web/src/main.tsx web/src/fortune-ux-v14.css supabase/functions/relationship-interpret-v9-preview/index.ts
          git commit -m 'fix: dedupe integrated fortune and harden reunion AI'
          git push origin HEAD:fix/annual-fortune-ui-thai-20260831
