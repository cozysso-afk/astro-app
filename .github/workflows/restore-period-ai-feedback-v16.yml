name: Restore period AI cache feedback v16

on:
  push:
    branches:
      - fix/restore-period-ai-feedback-20260831
    paths:
      - .github/workflows/restore-period-ai-feedback-v16.yml

permissions:
  contents: write

jobs:
  restore-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/restore-period-ai-feedback-20260831
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Clean staged patch lint issue
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/restore_period_ai_feedback_v16.py')
          s=p.read_text()
          s=s.replace("const [relationshipAiCacheSource, setRelationshipAiCacheSource] = useState<'local'|'fresh'|''>('')", "const [, setRelationshipAiCacheSource] = useState<'local'|'fresh'|''>('')")
          p.write_text(s)
          PY

      - name: Apply restored period AI and feedback contracts
        run: python scripts/restore_period_ai_feedback_v16.py

      - name: Static feature gate
        run: |
          python - <<'PY'
          from pathlib import Path
          app=Path('web/src/AppNext.tsx').read_text()
          archive=Path('web/src/lib/archive.ts').read_text()
          cache=Path('web/src/lib/readingCache.ts').read_text()
          css=Path('web/src/period-ai-feedback-v16.css').read_text()
          checks={
            'period_ai_panel':'PeriodAiInterpretationPanel' in app,
            'summary_detail':'상세 해설 보기' in app and 'GEMINI PERIOD SUMMARY' in app,
            'zero_recall':'이번 Gemini API 재호출 0회' in app,
            'auto_ai':"if (selectedTool === null)" in app and 'runAiInterpretation(calculation' in app,
            'calc_cache':'fortuneCalculationCacheId' in app and 'writeReadingCache(calculationCacheId' in app,
            'ai_cache':'fortuneAiCacheId' in app and "'fortune-ai'" in app,
            'relationship_cache':'relationshipAiCacheId' in app and "'relationship-ai'" in app,
            'feedback':'실제 결과 기록 · 개인보정' in app and '연락 받음' in app and '서로 주고받음' in app,
            'feedback_metadata':'event_time_bucket' in app and 'past_connection' in app and "channel: OutcomeChannel" in app,
            'archive_ai':'interpretation?: Record<string, unknown>' in archive and 'interpretation_json' in archive,
            'stable_archive':'stableId?: string' in archive,
            'indexeddb':"starlight-destiny-reading-cache-v1" in cache,
            'mobile_css':'.period-ai-card' in css and '.outcome-card' in css,
          }
          failed=[name for name,ok in checks.items() if not ok]
          print(checks)
          if failed: raise SystemExit('FAILED: '+', '.join(failed))
          print('RESTORED_FEATURE_GATE_PASS')
          PY

      - name: Backend and Thai syntax gate
        run: python -m py_compile api/main.py integrated_fortune_v1.py thai_astrology_v2.py thai_suriyayat_v1.py relationship_western_v1.py

      - name: Frontend production build
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Diff safety
        run: |
          git diff --check
          git status --short

      - name: Commit verified product changes to work branch
        run: |
          rm -rf __pycache__ api/__pycache__
          git rm scripts/restore_period_ai_feedback_v16.py .github/workflows/restore-period-ai-feedback-v16.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/src/AppNext.tsx web/src/lib/archive.ts web/src/lib/readingCache.ts web/src/period-ai-feedback-v16.css web/src/main.tsx
          git commit -m 'fix: restore cached period AI and personal outcome feedback'
          git push origin HEAD:fix/restore-period-ai-feedback-20260831
