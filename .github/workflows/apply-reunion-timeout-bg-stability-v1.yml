name: Apply reunion timeout bg stability v1

on:
  push:
    branches:
      - fix/reunion-timeout-bg-stability-v1

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: fix/reunion-timeout-bg-stability-v1
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Apply targeted patch
        run: python scripts/patch_reunion_timeout_bg_stability_v1.py
      - name: Focused contract tests
        run: python -m pytest -q tests/test_reunion_timeout_background_stability_v1.py tests/test_mobile_archive_reunion_stall.py
      - name: Frontend build
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Commit verified source changes
        run: |
          rm -f scripts/patch_reunion_timeout_bg_stability_v1.py .github/workflows/apply-reunion-timeout-bg-stability-v1.yml
          if git diff --quiet && git diff --cached --quiet; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/src/lib/auth.ts web/src/main.tsx web/src/background-stability-v1.css tests/test_reunion_timeout_background_stability_v1.py scripts/patch_reunion_timeout_bg_stability_v1.py .github/workflows/apply-reunion-timeout-bg-stability-v1.yml
          git commit -m 'fix: align reunion timeout and stabilize form background'
          git push origin HEAD:fix/reunion-timeout-bg-stability-v1
