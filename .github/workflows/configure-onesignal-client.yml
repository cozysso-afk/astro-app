name: Configure OneSignal client

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: astro-app-write-main
  cancel-in-progress: false

jobs:
  configure:
    runs-on: ubuntu-latest
    env:
      ONESIGNAL_APP_ID: ${{ secrets.ONESIGNAL_APP_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure public App ID
        run: python scripts/configure_onesignal_client.py

      - name: Validate client files
        shell: bash
        run: |
          grep -Eq 'oneSignalAppId: "[0-9a-fA-F-]{36}"' push-config.js
          grep -q 'OneSignalSDK.sw.js' OneSignalSDKWorker.js
          grep -q 'OneSignalSDK.page.js' index.html
          grep -q 'Notifications.requestPermission' index.html

      - name: Commit and push client config
        shell: bash
        run: |
          if git diff --quiet -- push-config.js; then
            echo "Client App ID is already configured."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add push-config.js
          git commit -m "config: enable OneSignal web push client"
          git pull --rebase origin main
          git push origin HEAD:main
