name: PR267 quality split patch

on:
  push:
    paths:
      - "scripts/patch_pr267_quality_split_once.py"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/quality-validator-repair-split
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/patch_pr267_quality_split_once.py
      - run: git diff --check
      - name: Commit patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/fortune-interpret-v6-preview/qualityV2.ts supabase/functions/fortune-interpret-v6-preview/qualityV23TimingRepair.test.mjs supabase/functions/fortune-interpret-v23-preview/index.ts supabase/functions/fortune-interpret-v23-preview/deliveryPolicyV23.test.mjs
          git commit -m "refactor: separate quality validation from targeted repair"
          git push origin HEAD:refactor/quality-validator-repair-split
