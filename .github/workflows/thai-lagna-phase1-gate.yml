name: Thai Lagna phase 1 research gate

on:
  push:
    branches:
      - feature/thai-lagna-phase1-real-20260831
    paths:
      - .github/workflows/thai-lagna-phase1-gate.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/thai-lagna-phase1-real-20260831
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Lagna test dependency
        run: python -m pip install --disable-pip-version-check pyswisseph==2.10.3.2

      - name: Apply research integration
        run: python scripts/integrate_thai_lagna_phase1.py

      - name: Syntax gate
        run: |
          python -m py_compile thai_suriyayat_v1.py thai_lagna_v1.py thai_astrology_v2.py integrated_fortune_v1.py api/main.py

      - name: Independent reference corpus tests
        run: python -m unittest discover -s tests -p 'test_thai_lagna_v1.py' -v

      - name: Print validation deltas
        run: |
          python - <<'PY'
          from datetime import date,time
          from thai_lagna_v1 import calculate_common_anto_0600, calculate_astronomical_suriyayat_candidate, angular_delta_deg
          lat,lon,utc=13.752555,100.494066,7.0
          refs=[
            (date(2026,1,7),time(8,9),308+17/60,302+39/60,283+17/60),
            (date(2026,3,24),time(14,15),120+59/60,90+26+41/60,90+9+25/60),
            (date(2026,4,20),time(23,42),240+14+5/60,240+9+35/60,240+18+44/60),
          ]
          common=[]; lmt=[]; astro=[]
          for d,t,rc,rl,ra in refs:
            a=calculate_common_anto_0600(birth_date=d,birth_time=t,longitude=lon,utc_offset_hours=utc,adjust_local_mean_time=False)
            b=calculate_common_anto_0600(birth_date=d,birth_time=t,longitude=lon,utc_offset_hours=utc,adjust_local_mean_time=True)
            c=calculate_astronomical_suriyayat_candidate(birth_date=d,birth_time=t,latitude=lat,longitude=lon,utc_offset_hours=utc)
            common.append(abs(angular_delta_deg(a['longitude_deg'],rc))*60)
            lmt.append(abs(angular_delta_deg(b['longitude_deg'],rl))*60)
            astro.append(abs(angular_delta_deg(c['longitude_deg'],ra))*60)
          print('COMMON_ERRORS_ARCMIN=',[round(x,3) for x in common],'max=',round(max(common),3),'mean=',round(sum(common)/len(common),3))
          print('LMT_ERRORS_ARCMIN=',[round(x,3) for x in lmt],'max=',round(max(lmt),3),'mean=',round(sum(lmt)/len(lmt),3))
          print('ASTRO_ERRORS_ARCMIN=',[round(x,3) for x in astro],'max=',round(max(astro),3),'mean=',round(sum(astro)/len(astro),3))
          PY

      - name: Product safety contract
        run: |
          python - <<'PY'
          from pathlib import Path
          thai=Path('thai_astrology_v2.py').read_text()
          integ=Path('integrated_fortune_v1.py').read_text()
          edge=Path('supabase/functions/fortune-interpret-v6-preview/core.ts').read_text()
          assert '"lagna": {' in thai and '"available": False' in thai
          assert '"lagna_research": lagna_research' in thai
          assert 'gemini_interpretation_allowed' not in edge
          assert 'lagna_research' not in edge
          assert 'integrated-fortune-v2.10-thai-lagna-research' in integ
          assert 'latitude=latitude' in integ and 'longitude=longitude' in integ
          print('PRODUCT_SAFETY_CONTRACT_PASS')
          PY

      - name: Diff safety
        run: |
          git diff --check
          git status --short

      - name: Commit validated research integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f scripts/integrate_thai_lagna_phase1.py .github/workflows/thai-lagna-phase1-gate.yml
          git add thai_lagna_v1.py thai_astrology_v2.py integrated_fortune_v1.py tests/test_thai_lagna_v1.py
          git commit -m 'feat: integrate research-only Suriyayat Lagna phase 1'
          git push origin HEAD:feature/thai-lagna-phase1-real-20260831
