name: Apply summary font scope fix
on:
  push:
    branches: ['fix/summary-font-scope-v55']
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/summary-font-scope-v55
          fetch-depth: 0
      - name: Patch live reading font owner
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          views = Path('web/src/SystemReadingViews.tsx').read_text()
          expected = "injectReadingContext(children,{field:focusedField,systemOverview:overview})"
          if expected not in views:
              raise SystemExit('focused topic scope fix is missing')

          Path('web/src/reading-font-fix-v54.css').write_text("""/* V55 · live reading typography owner
           * Period AI cards are not guaranteed to live under .fortune-experience/.app-shell.
           * Target the actual rendered card and load this file last.
           */
          @media (max-width: 600px) {
            html body .period-ai-card.period-ai-v18 .period-ai-head h3,
            html body .relationship-experience .reading-hero h3 {
              font-family: 'Nanum Myeongjo', 'Noto Serif KR', 'AppleMyungjo', 'Batang', serif !important;
              font-synthesis: none !important;
              font-weight: 700 !important;
              line-height: 1.62 !important;
              letter-spacing: -.025em !important;
              word-break: keep-all !important;
            }

            html body .period-ai-card.period-ai-v18 .reading-hero-subtitle,
            html body .relationship-experience .reading-hero-subtitle {
              font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif !important;
              font-synthesis: none !important;
              font-weight: 400 !important;
              line-height: 1.76 !important;
              letter-spacing: -.012em !important;
              word-break: keep-all !important;
            }
          }
          """)

          p = Path('web/src/main.tsx')
          s = p.read_text()
          old = "import './reading-font-fix-v54.css'\nimport './reading-experience.css'"
          new = "import './reading-experience.css'\nimport './reading-font-fix-v54.css'"
          if old in s:
              s = s.replace(old, new, 1)
          elif new not in s:
              raise SystemExit('font import order target not found')
          p.write_text(s)

          Path('web/src/lib/summaryFontScopeV55.test.mjs').write_text("""import test from 'node:test'\nimport assert from 'node:assert/strict'\nimport { readFileSync } from 'node:fs'\n\nconst css = readFileSync(new URL('../reading-font-fix-v54.css', import.meta.url), 'utf8')\nconst main = readFileSync(new URL('../main.tsx', import.meta.url), 'utf8')\nconst views = readFileSync(new URL('../SystemReadingViews.tsx', import.meta.url), 'utf8')\n\ntest('live period headline uses Myeongjo on the actual rendered card', () => {\n  assert.match(css, /\\.period-ai-card\\.period-ai-v18 \\.period-ai-head h3[\\s\\S]*?font-family:\\s*'Nanum Myeongjo'/)\n  assert.match(css, /\\.period-ai-card\\.period-ai-v18 \\.reading-hero-subtitle[\\s\\S]*?font-family:\\s*-apple-system/)\n  assert.ok(main.indexOf(\"import './reading-experience.css'\") < main.indexOf(\"import './reading-font-fix-v54.css'\"))\n})\n\ntest('focused integrated topics use their own summary instead of the overall Saju summary', () => {\n  assert.match(views, /injectReadingContext\\(children,\\{field:focusedField,systemOverview:overview\\}\\)/)\n})\n""")
          PY
          rm .github/workflows/apply-summary-font-scope-v55.yml
      - name: Commit fix
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add web/src/reading-font-fix-v54.css web/src/main.tsx web/src/lib/summaryFontScopeV55.test.mjs .github/workflows/apply-summary-font-scope-v55.yml
          git commit -m 'Fix live summary font and focused topic scope'
          git push origin HEAD:fix/summary-font-scope-v55
