name: Apply reunion AI resilience v12.8

on:
  push:
    branches: [fix/reunion-ai-prompt-grounding-v128]

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/reunion-ai-prompt-grounding-v128
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Apply targeted patch
        run: |
          python scripts/patch_reunion_ai_resilience_v128.py
          python scripts/patch_stale_grounding_test_v128.py
      - name: Install web dependencies
        run: npm --prefix web ci
      - name: Edge syntax and focused resilience tests
        run: |
          node --experimental-strip-types --check supabase/functions/relationship-interpret-v9-preview/index.ts
          node --experimental-strip-types --test web/src/lib/reunionAiResilienceV128.test.mjs
          node --experimental-strip-types --test supabase/functions/relationship-interpret-v9-preview/reunionGroundingV2.test.mjs
          node --experimental-strip-types --test supabase/functions/relationship-interpret-v9-preview/reunionEvidenceV2.test.mjs
      - name: Existing relationship contracts
        run: |
          node --test web/src/lib/relationshipModeContract.test.mjs
          node --test web/src/lib/relationshipEvidencePipeline.test.mjs
          node --test web/src/lib/relationshipReunionV2.contract.test.mjs
          node --test web/src/lib/reunionEditorialV126.test.mjs
          node --test web/src/lib/provisionalFullAnalysisV127.test.mjs
      - name: Production web build
        run: npm --prefix web run build
      - name: Commit verified product changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/functions/relationship-interpret-v9-preview/index.ts supabase/functions/relationship-interpret-v9-preview/reunionGroundingV2.ts supabase/functions/relationship-interpret-v9-preview/reunionGroundingV2.test.mjs web/src/lib/readingCache.ts web/src/lib/relationshipModeContract.test.mjs web/src/lib/relationshipEvidencePipeline.test.mjs web/src/lib/relationshipReunionV2.contract.test.mjs web/src/lib/reunionEditorialV126.test.mjs web/src/lib/humanLanguageV25.test.mjs web/src/lib/provisionalFullAnalysisV127.test.mjs web/src/lib/reunionAiResilienceV128.test.mjs
          git diff --cached --quiet && exit 0
          git commit -m 'fix: compact reunion AI prompt and repair unsafe wording'
          git push origin HEAD:fix/reunion-ai-prompt-grounding-v128
