name: Apply Fortune Lab module reload v0.1.4

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-fortune-lab-module-reload-v715.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply module reload patch
        run: python scripts/fix_fortune_lab_module_reload_v715.py
      - name: Syntax check
        run: python -m py_compile app.py fortune_lab_v71.py scripts/fix_fortune_lab_module_reload_v715.py
      - name: Verify markers
        run: |
          grep -q 'fortune_lab_module = importlib.reload(fortune_lab_module)' app.py
          grep -q 'FORTUNE_LAB_VERSION = "v0.1.4"' fortune_lab_v71.py
          grep -q '운영 버전 · {FORTUNE_LAB_VERSION}' fortune_lab_v71.py
          grep -q 'forced_mode' fortune_lab_v71.py
      - name: Diff sanity
        run: git diff --check
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py fortune_lab_v71.py
          git commit -m "fix: force-reload Fortune Lab module in Streamlit"
          git push origin HEAD:main
