name: Patch reunion runtime contract

on:
  push:
    branches:
      - fix/reunion-runtime-contract-v1

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[runtime-guard-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/reunion-runtime-contract-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch runtime contract guard
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              assert count == 1, f'{label}: expected 1 occurrence, got {count}'
              return text.replace(old, new, 1)

          api = Path('api/main.py')
          s = api.read_text()
          s = replace_once(
              s,
              'from relationship_return_v1 import ENGINE_VERSION as REL_RETURN_ENGINE_VERSION, augment_relationship_with_returns\n',
              'from relationship_return_v1 import ENGINE_VERSION as REL_RETURN_ENGINE_VERSION, augment_relationship_with_returns\nfrom relationship_evidence_contract_v1 import CONTRACT_VERSION as REUNION_EVIDENCE_CONTRACT_VERSION\n',
              'api contract import',
          )
          s = replace_once(
              s,
              '        "relationship_return_engine": REL_RETURN_ENGINE_VERSION,\n',
              '        "relationship_return_engine": REL_RETURN_ENGINE_VERSION,\n        "reunion_evidence_contract": REUNION_EVIDENCE_CONTRACT_VERSION,\n        "runtime_git_sha": os.getenv("RENDER_GIT_COMMIT", ""),\n',
              'api meta contract',
          )
          api.write_text(s)

          app = Path('web/src/AppNext.tsx')
          s = app.read_text()
          s = replace_once(
              s,
              "const ARCHIVE_DELETE_UNDO_MS = 8000\n",
              "const ARCHIVE_DELETE_UNDO_MS = 8000\nconst REQUIRED_REUNION_EVIDENCE_CONTRACT = 'reunion-evidence-contract-v1'\n",
              'web required contract constant',
          )
          s = replace_once(
              s,
              "  const [apiStatus, setApiStatus] = useState<ApiStatus>('warming')\n",
              "  const [apiStatus, setApiStatus] = useState<ApiStatus>('warming')\n  const [reunionContractStatus, setReunionContractStatus] = useState<'checking'|'ready'|'stale'>('checking')\n",
              'web runtime contract state',
          )
          old_effect = '''  useEffect(() => {\n    let cancelled = false\n    fetch(`${API_BASE}/health`)\n      .then((response) => {\n        if (!response.ok) throw new Error('health check failed')\n        if (!cancelled) setApiStatus('online')\n      })\n      .catch(() => { if (!cancelled) setApiStatus('offline') })\n    return () => { cancelled = true }\n  }, [])'''
          new_effect = '''  useEffect(() => {\n    let cancelled = false\n    fetch(`${API_BASE}/v1/meta`)\n      .then((response) => {\n        if (!response.ok) throw new Error('meta check failed')\n        return response.json()\n      })\n      .then((payload) => {\n        if (cancelled) return\n        setApiStatus('online')\n        setReunionContractStatus(payload?.reunion_evidence_contract === REQUIRED_REUNION_EVIDENCE_CONTRACT ? 'ready' : 'stale')\n      })\n      .catch(() => {\n        if (cancelled) return\n        setApiStatus('offline')\n        setReunionContractStatus('checking')\n      })\n    return () => { cancelled = true }\n  }, [])'''
          s = replace_once(s, old_effect, new_effect, 'web meta health effect')
          run_anchor = "    setRelationshipError(''); setRelationshipResult(null); setRelationshipRequestSnapshot(null); setRelationshipAi(null); setRelationshipAiError(''); setReunionTiming(null); setReunionTimingError('')\n"
          run_guard = run_anchor + "    const reunionRequest = selectedTool === 'compatibility' && relationshipPurpose === 'reunion'\n    if (reunionRequest && reunionContractStatus !== 'ready') {\n      setRelationshipError(reunionContractStatus === 'stale' ? '재회 계산 서버가 최신 근거 계약으로 아직 배포되지 않았어. 비용이 드는 AI 해설은 시작하지 않아. 잠시 후 다시 시도해줘.' : '재회 계산 서버 버전을 확인 중이야. 확인이 끝난 뒤 다시 시도해줘.')\n      return\n    }\n"
          s = replace_once(s, run_anchor, run_guard, 'run relationship guard')
          s = replace_once(
              s,
              "    const shouldRunReunionTiming = selectedTool === 'compatibility' && relationshipPurpose === 'reunion'\n",
              "    const shouldRunReunionTiming = reunionRequest\n",
              'reuse reunion request guard',
          )
          ai_anchor = "    const analysisMode = (snapshotMode || currentMode) as RelationshipAnalysisMode\n"
          ai_guard = ai_anchor + "    if (analysisMode === 'reunion' && relationshipResult.result.reunion_evidence_contract?.version !== REQUIRED_REUNION_EVIDENCE_CONTRACT) {\n      setRelationshipAiError('이 계산본은 현재 재회 해설 계약보다 오래된 결과야. 유료 AI 해설을 새로 호출하지 않아. 최신 재회 계산을 먼저 실행해줘.')\n      return\n    }\n"
          s = replace_once(s, ai_anchor, ai_guard, 'relationship ai stale result guard')
          old_disabled = "disabled={personalMarriageLoading||relationshipLoading||reunionTimingLoading||apiStatus==='offline'}"
          new_disabled = "disabled={personalMarriageLoading||relationshipLoading||reunionTimingLoading||apiStatus==='offline'||(selectedTool==='compatibility'&&relationshipPurpose==='reunion'&&reunionContractStatus!=='ready')}"
          s = replace_once(s, old_disabled, new_disabled, 'reunion button contract disable')
          counterpart_anchor = "            {needsCounterpart&&<>\n"
          contract_banner = "            {selectedTool==='compatibility'&&relationshipPurpose==='reunion'&&reunionContractStatus!=='ready'&&<div className=\"status-banner error\"><AlertTriangle size={16}/><span>{reunionContractStatus==='stale'?'재회 계산 서버가 최신 근거 계약으로 아직 배포되지 않았어. 최신 서버 확인 전에는 재회 계산과 유료 AI 해설을 시작하지 않아.':'재회 계산 서버 버전을 확인 중이야. 확인이 끝나기 전에는 재회 계산과 유료 AI 해설을 시작하지 않아.'}</span></div>}\n"
          s = replace_once(s, counterpart_anchor, contract_banner + counterpart_anchor, 'reunion contract warning banner')
          app.write_text(s)

          test = Path('web/src/lib/reunionRuntimeContract.test.mjs')
          test.write_text(r'''import test from 'node:test'
          import assert from 'node:assert/strict'
          import fs from 'node:fs'
          import { fileURLToPath } from 'node:url'
          import path from 'node:path'

          const here = path.dirname(fileURLToPath(import.meta.url))
          const app = fs.readFileSync(path.resolve(here, '../AppNext.tsx'), 'utf8')
          const api = fs.readFileSync(path.resolve(here, '../../../api/main.py'), 'utf8')

          test('reunion runtime contract blocks stale API before paid interpretation', () => {
            assert.match(api, /REUNION_EVIDENCE_CONTRACT_VERSION/)
            assert.match(api, /"reunion_evidence_contract": REUNION_EVIDENCE_CONTRACT_VERSION/)
            assert.match(api, /"runtime_git_sha": os\.getenv\("RENDER_GIT_COMMIT", ""\)/)
            assert.match(app, /REQUIRED_REUNION_EVIDENCE_CONTRACT = 'reunion-evidence-contract-v1'/)
            assert.match(app, /fetch\(`\$\{API_BASE\}\/v1\/meta`\)/)
            assert.match(app, /setReunionContractStatus\(payload\?\.reunion_evidence_contract === REQUIRED_REUNION_EVIDENCE_CONTRACT \? 'ready' : 'stale'\)/)
            assert.match(app, /reunionRequest && reunionContractStatus !== 'ready'/)
            assert.match(app, /relationshipResult\.result\.reunion_evidence_contract\?\.version !== REQUIRED_REUNION_EVIDENCE_CONTRACT/)
            assert.match(app, /relationshipPurpose==='reunion'&&reunionContractStatus!=='ready'/)
            assert.match(app, /유료 AI 해설을 새로 호출하지 않아/)
          })
          ''')

          api_test = Path('tests/test_relationship_api_e2e_v15.py')
          t = api_test.read_text()
          addition = '''\n\ndef test_reunion_meta_exposes_runtime_contract_and_git_sha_field():\n    response = client.get("/v1/meta")\n    assert response.status_code == 200\n    body = response.json()\n    assert body["reunion_evidence_contract"] == "reunion-evidence-contract-v1"\n    assert "runtime_git_sha" in body\n'''
          assert 'test_reunion_meta_exposes_runtime_contract_and_git_sha_field' not in t
          api_test.write_text(t.rstrip() + addition + '\n')
          PY
      - name: Contract sanity checks
        run: |
          python -m py_compile api/main.py relationship_evidence_contract_v1.py
          node --test web/src/lib/reunionRuntimeContract.test.mjs
      - name: Commit patch
        run: |
          git config user.name "cozysso-afk"
          git config user.email "cozysso@gmail.com"
          git add api/main.py web/src/AppNext.tsx web/src/lib/reunionRuntimeContract.test.mjs tests/test_relationship_api_e2e_v15.py
          git commit -m "[runtime-guard-patched] guard reunion against stale calculation API"
          git push origin HEAD:fix/reunion-runtime-contract-v1
