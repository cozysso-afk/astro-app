name: Research Saju JieQi Boundary 2026-08-31

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/research-saju-jieqi-boundary-20260831.yml'

jobs:
  verify-jie-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: api/requirements.txt
      - run: pip install -r api/requirements.txt
      - name: Inspect exact Jie boundaries and month pillar switch
        run: |
          python - <<'PY'
          from lunar_python import Solar

          probe=Solar.fromYmdHms(2026,8,1,12,0,0).getLunar()
          table=probe.getJieQiTable()
          keys=probe.getJieQiList()
          print('JIEQI_2026_NEAR_AUGUST')
          for k in keys:
              s=table[k]
              ymd=s.toYmdHms()
              if ymd.startswith('2026-07') or ymd.startswith('2026-08') or ymd.startswith('2026-09'):
                  print(k,ymd)

          # Exact 八字 month pillar must change at Jie (節), not the first day of a civil month.
          liqiu=table.get('立秋')
          if liqiu is None:
              raise SystemExit('立秋 missing from JieQi table')
          before=liqiu.next(-1).getLunar()
          after=liqiu.next(1).getLunar()
          # next() is days, so also probe same calendar date surrounding exact clock manually below.
          print('LIQIU',liqiu.toYmdHms())
          print('DAY_BEFORE_MONTH_EXACT',before.getMonthInGanZhiExact())
          print('DAY_AFTER_MONTH_EXACT',after.getMonthInGanZhiExact())

          y,m,d=liqiu.getYear(),liqiu.getMonth(),liqiu.getDay()
          hh,mm,ss=liqiu.getHour(),liqiu.getMinute(),liqiu.getSecond()
          total=hh*3600+mm*60+ss
          def at(delta):
              t=total+delta
              dd=d
              if t<0: raise SystemExit('unexpected boundary near midnight')
              h=t//3600; rem=t%3600; mi=rem//60; se=rem%60
              return Solar.fromYmdHms(y,m,dd,h,mi,se).getLunar()
          b=at(-1); a=at(1)
          print('ONE_SECOND_BEFORE',b.getSolar().toYmdHms(),b.getMonthInGanZhiExact())
          print('ONE_SECOND_AFTER',a.getSolar().toYmdHms(),a.getMonthInGanZhiExact())
          assert b.getMonthInGanZhiExact()!=a.getMonthInGanZhiExact(), 'month pillar did not switch at exact Jie second'
          print('EXACT_JIE_MONTH_SWITCH_PASS')

          # Public navigation helpers should expose neighboring Jie objects with exact Solar timestamps.
          prev_jie=Solar.fromYmdHms(2026,8,20,12,0,0).getLunar().getPrevJie()
          next_jie=Solar.fromYmdHms(2026,8,20,12,0,0).getLunar().getNextJie()
          print('PREV_JIE',prev_jie.getName(),prev_jie.getSolar().toYmdHms())
          print('NEXT_JIE',next_jie.getName(),next_jie.getSolar().toYmdHms())
          assert prev_jie.getName()=='立秋'
          assert next_jie.getName()=='白露'
          print('JIE_NAVIGATION_PASS')
          PY
      - name: Mark research only
        run: |
          echo 'RESEARCH_ONLY_NO_PRODUCT_WRITE_PASS'
          test "$GITHUB_REF_NAME" = 'work/full-year-thai-hardening-20260831'
