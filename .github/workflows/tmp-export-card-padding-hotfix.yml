name: Temporary export card padding hotfix

on:
  push:
    branches:
      - hotfix/export-card-text-padding-v3-3

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/export-card-text-padding-v3-3
          fetch-depth: 0
      - name: Patch canvas card text layout
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('web/src/lib/readingImageExport.ts')
          s = p.read_text()
          marker = "ctx.textBaseline = 'top'"
          if marker in s:
              print('already patched')
              raise SystemExit(0)

          s = s.replace(
          """    top: compact ? 22 : 28,\n    bottom: compact ? 20 : 24,\n    eyebrowHeight: card.eyebrow ? (compact ? 29 : 33) : 0,\n    xPad: compact ? 28 : 31,""",
          """    top: compact ? 28 : 34,\n    bottom: compact ? 26 : 32,\n    eyebrowHeight: card.eyebrow ? (compact ? 34 : 39) : 0,\n    xPad: compact ? 34 : 38,"""
          )

          needle = """  const radius = metrics.compact ? 28 : 32\n\n  ctx.save()"""
          repl = """  const radius = metrics.compact ? 28 : 32\n\n  // Canvas defaults to an alphabetic baseline. Using the card padding value as\n  // a baseline made Korean labels/titles visually stick to the top border and\n  // collapse into each other. Draw card copy from its top edge instead.\n  ctx.save()\n  ctx.textBaseline = 'top'\n\n  ctx.save()"""
          if needle not in s:
              raise SystemExit('drawGlassCard start pattern not found')
          s = s.replace(needle, repl, 1)

          needle = """  return y + height\n}\n\nfunction drawHeader"""
          repl = """  ctx.restore()\n  return y + height\n}\n\nfunction drawHeader"""
          if needle not in s:
              raise SystemExit('drawGlassCard end pattern not found')
          s = s.replace(needle, repl, 1)

          p.write_text(s)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/src/lib/readingImageExport.ts
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix: restore real inner padding in export cards"
          git push origin HEAD:hotfix/export-card-text-padding-v3-3
