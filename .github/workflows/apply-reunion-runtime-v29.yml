name: Apply reunion runtime v2.9

on:
  push:
    branches:
      - fix/reunion-runtime-stall-v29
    paths:
      - scripts/patch_reunion_runtime_v29.py
      - tests/test_reunion_runtime_v29.py
      - .github/workflows/apply-reunion-runtime-v29.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/reunion-runtime-stall-v29
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: api/requirements.txt

      - name: Install API runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r api/requirements.txt
          pip install pytest httpx

      - name: Apply performance-only patch
        run: python scripts/patch_reunion_runtime_v29.py

      - name: Syntax check
        run: python -m py_compile reunion_hierarchy_v2.py relationship_western_v1.py api/relationship_async_v1.py

      - name: Verify longitude equivalence and hierarchy regression
        run: |
          python -m pytest -q tests/test_reunion_runtime_v29.py
          python -m pytest -q tests/test_reunion_hierarchy_v2.py
          python -m pytest -q tests/test_relationship_async_contract.py

      - name: Verify policy constants are unchanged
        run: |
          grep -q "WEIGHTS = dict(long_term=.35, mid_term=.25, event_trigger=.25, cross_system=.15)" reunion_hierarchy_v2.py
          grep -q "THRESHOLDS = dict(long_term=35.0, mid_term=25.0, event_trigger=12.0)" reunion_hierarchy_v2.py
          grep -q "FAST_SAMPLE_HOURS = (0, 3, 6, 9, 12, 15, 18, 21, 23.999)" reunion_hierarchy_v2.py
          grep -q "VERSION = 'reunion-hierarchy-v2.8-birth-time-precision-audit'" reunion_hierarchy_v2.py
          grep -q "RUNTIME_REVISION = 'reunion-runtime-v2.9-efficiency'" reunion_hierarchy_v2.py

      - name: Commit verified runtime patch to branch
        run: |
          git config user.name "cozysso-afk"
          git config user.email "cozysso@gmail.com"
          git add reunion_hierarchy_v2.py relationship_western_v1.py api/relationship_async_v1.py
          if git diff --cached --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git commit -m "perf: remove duplicate and unused reunion calculations"
          git push origin HEAD:fix/reunion-runtime-stall-v29
