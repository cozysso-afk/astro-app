name: Apply external relationship prompt contract V29

on:
  push:
    branches:
      - fix/compact-cards-usage-v29-20260905
    paths:
      - scripts/patch_external_relationship_prompt_contract_v29.py
      - .github/workflows/apply-external-relationship-prompt-contract-v29.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/compact-cards-usage-v29-20260905
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Apply UI cache and contract patch
        run: python scripts/patch_external_relationship_prompt_contract_v29.py
      - name: Verify relationship prompt contract
        run: node --test web/src/lib/relationshipModeContract.test.mjs
      - name: Install web dependencies
        working-directory: web
        run: npm ci
      - name: Web production build
        working-directory: web
        run: npm run build
      - name: Commit patched source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/src/AppNext.tsx web/src/lib/readingCache.ts web/src/lib/relationshipModeContract.test.mjs
          if git diff --cached --quiet; then
            echo 'No source changes to commit'
            exit 0
          fi
          git commit -m 'fix(ui): bound and label external relationship prompt copy'
          git push origin HEAD:fix/compact-cards-usage-v29-20260905
