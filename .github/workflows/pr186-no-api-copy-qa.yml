name: PR186 no-api copy QA

on:
  push:
    branches:
      - fix/reunion-hierarchy-v2
    paths:
      - '.github/workflows/pr186-no-api-copy-qa.yml'

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/reunion-hierarchy-v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        working-directory: web
        run: npm ci
      - name: Run no-provider copy QA
        working-directory: web
        run: node --experimental-strip-types src/lib/pr186NoApiCopyQa.mjs
