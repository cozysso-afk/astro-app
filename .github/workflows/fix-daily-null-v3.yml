name: Fix Daily Null V3

on:
  push:
    branches:
      - work/integrated-interpretation-v2
    paths:
      - .github/workflows/fix-daily-null-v3.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/integrated-interpretation-v2
          fetch-depth: 0
      - name: Preserve null daily scores
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('supabase/functions/fortune-interpret-v6-preview/integratedInterpretationV2.ts')
          s = p.read_text(encoding='utf-8')
          old = '''function trajectoryDigest(rows:any[],topic:string){
  const values=rows.map((row:any)=>({date:String(row?.date??""),score:Number(row?.scores?.[topic])})).filter((x:any)=>x.date&&Number.isFinite(x.score));'''
          new = '''function finiteDailyScore(v:any){ return typeof v === "number" && Number.isFinite(v) ? v : null; }
function trajectoryDigest(rows:any[],topic:string){
  const values=rows.map((row:any)=>({date:String(row?.date??""),score:finiteDailyScore(row?.scores?.[topic])})).filter((x:any):x is {date:string;score:number}=>Boolean(x.date)&&x.score!==null);'''
          if old not in s: raise SystemExit('trajectory null anchor missing')
          s = s.replace(old, new, 1)
          old = '''  const dailyScoreMatrix={topic_order:dailyTopicOrder,rows:dailyRaw.map((d:any)=>[String(d?.date??""),...dailyTopicOrder.map((topic)=>Number.isFinite(Number(d?.scores?.[topic]))?Number(d.scores[topic]):null)])};'''
          new = '''  const dailyScoreMatrix={topic_order:dailyTopicOrder,rows:dailyRaw.map((d:any)=>[String(d?.date??""),...dailyTopicOrder.map((topic)=>finiteDailyScore(d?.scores?.[topic]))])};'''
          if old not in s: raise SystemExit('matrix null anchor missing')
          s = s.replace(old, new, 1)
          old = '''      const score=Number(d?.scores?.[topic]); if(!Number.isFinite(score))continue;'''
          new = '''      const score=finiteDailyScore(d?.scores?.[topic]); if(score===null)continue;'''
          if old not in s: raise SystemExit('rank null anchor missing')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Guard null semantics
        run: |
          grep -q 'function finiteDailyScore' supabase/functions/fortune-interpret-v6-preview/integratedInterpretationV2.ts
          ! grep -q 'score:Number(row?.scores' supabase/functions/fortune-interpret-v6-preview/integratedInterpretationV2.ts
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/functions/fortune-interpret-v6-preview/integratedInterpretationV2.ts
          git diff --cached --quiet && exit 0
          git commit -m 'fix: preserve nulls in daily trajectory analysis'
          git push origin HEAD:work/integrated-interpretation-v2
