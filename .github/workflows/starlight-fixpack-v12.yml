name: Starlight fixpack v12
on:
  push:
    branches: [starlight-fixpack-20260829-v2]
    paths:
      - 'scripts/starlight_fixpack_v12.py'
      - '.github/workflows/starlight-fixpack-v12.yml'
permissions:
  contents: write
jobs:
  patch-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: starlight-fixpack-20260829-v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply fixpack
        run: python scripts/starlight_fixpack_v12.py
      - name: Python syntax check
        run: python -m py_compile integrated_fortune_v1.py relationship_western_v1.py astrocartography_v1.py api/main.py
      - name: Build web
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Commit applied fixpack
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add integrated_fortune_v1.py relationship_western_v1.py astrocartography_v1.py api/main.py web/src/AppNext.tsx web/src/main.tsx web/src/fixpack-v12.css
          git diff --cached --quiet && exit 0
          git commit -m 'fix: apply feedback-driven fortune and relationship fixpack'
          git push origin HEAD:starlight-fixpack-20260829-v2
