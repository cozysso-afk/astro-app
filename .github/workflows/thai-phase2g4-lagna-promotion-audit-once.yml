name: Thai Phase 2G4 Lagna promotion audit

on:
  push:
    branches:
      - feature/thai-lagna-phase1-real-20260831
    paths:
      - '.github/workflows/thai-phase2g4-lagna-promotion-audit-once.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/thai-lagna-phase1-real-20260831
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Attach research-only Lagna promotion audit
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('thai_astrology_v2.py')
          text = path.read_text(encoding='utf-8')
          replacements = {
              'from thai_ai_safe_packet_v1 import build_ai_safe_packet_research\n':
                  'from thai_ai_safe_packet_v1 import build_ai_safe_packet_research\nfrom thai_lagna_promotion_audit_v1 import build_lagna_promotion_audit\n',
              'ENGINE_VERSION = "thai-mahathaksa-taksajorn-suriyayat-v2.14-phase2g3-ai-safe-packet-lagna-gated"':
                  'ENGINE_VERSION = "thai-mahathaksa-taksajorn-suriyayat-v2.15-phase2g4-lagna-promotion-audit"',
              '    ai_safe_packet_research = build_ai_safe_packet_research(\n        descriptive_synthesis_research=descriptive_synthesis_research,\n        lagna_product_available=lagna_product_interpretation_ready,\n    )\n\n    return {':
                  '    ai_safe_packet_research = build_ai_safe_packet_research(\n        descriptive_synthesis_research=descriptive_synthesis_research,\n        lagna_product_available=lagna_product_interpretation_ready,\n    )\n    lagna_promotion_audit_research = build_lagna_promotion_audit(\n        lagna_research=lagna_research,\n        houses_research=houses_research,\n        dignities_research=dignities_research,\n        aspects_research=aspects_research,\n        descriptive_synthesis_research=descriptive_synthesis_research,\n        school_policy_research=school_policy_research,\n        ai_safe_packet_research=ai_safe_packet_research,\n    )\n\n    return {',
              '        "ai_safe_packet_research": ai_safe_packet_research,\n        "dignities_research": dignities_research,':
                  '        "ai_safe_packet_research": ai_safe_packet_research,\n        "lagna_promotion_audit_research": lagna_promotion_audit_research,\n        "dignities_research": dignities_research,',
              '            "suriyayat_ai_safe_packet": "whitelist_validated_but_gemini_blocked_until_lagna_product_promotion",\n            "suriyayat_predictive_rules": "not_implemented",':
                  '            "suriyayat_ai_safe_packet": "whitelist_validated_but_gemini_blocked_until_lagna_product_promotion",\n            "suriyayat_lagna_product_promotion_audit": "research_only_prerequisite_matrix_no_state_change",\n            "suriyayat_predictive_rules": "not_implemented",',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit('missing Thai Phase 2G4 anchor: ' + old[:200])
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Install Swiss Ephemeris dependency
        run: python -m pip install --disable-pip-version-check pyswisseph==2.10.3.2

      - name: Run Phase 2G4 full 202-test regression matrix
        env:
          PYTHONPATH: .
        run: |
          python - <<'PY'
          import sys
          import unittest

          patterns = [
              'test_thai_lagna_promotion_audit_v1.py',
              'test_thai_lagna_promotion_audit_integration.py',
              'test_thai_ai_safe_packet_v1.py',
              'test_thai_ai_safe_packet_integration.py',
              'test_thai_ai_safe_packet_compaction.py',
              'test_thai_phase2g2_profile_differential.py',
              'test_thai_phase2g2_profile_differential_integration.py',
              'test_thai_school_policy_v1.py',
              'test_thai_school_policy_integration.py',
              'test_thai_dignity_exceptions_v1.py',
              'test_thai_dignity_exceptions_integration.py',
              'test_thai_descriptive_synthesis_v1.py',
              'test_thai_descriptive_synthesis_integration.py',
              'test_thai_context_graph_v1.py',
              'test_thai_context_graph_integration.py',
              'test_thai_house_lord_routes_v1.py',
              'test_thai_house_lord_routes_integration.py',
              'test_thai_planet_pairs_v1.py',
              'test_thai_planet_pairs_integration.py',
              'test_thai_interpretation_policy_v1.py',
              'test_thai_interpretation_policy_integration.py',
              'test_thai_semantics_v1.py',
              'test_thai_phase2c_labels_standards.py',
              'test_thai_dignities_v1.py',
              'test_thai_aspects_v1.py',
              'test_thai_rules_phase2b_integration.py',
              'test_thai_houses*.py',
              'test_thai_lagna*.py',
              'test_ai_thai_research_isolation.py',
          ]
          loader = unittest.defaultTestLoader
          suite = unittest.TestSuite()
          total = 0
          for pattern in patterns:
              found = loader.discover('tests', pattern=pattern)
              count = found.countTestCases()
              print(f'{pattern}: {count}')
              total += count
              suite.addTests(found)
          print(f'PHASE2G4_DISCOVERED_TESTS={total}')
          if total != 202:
              raise SystemExit(f'expected 202 tests, discovered {total}')
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if not result.wasSuccessful():
              sys.exit(1)
          PY

      - name: Compile Thai and AI modules
        run: |
          python -m py_compile thai_lagna_v1.py thai_houses_v1.py thai_dignities_v1.py thai_aspects_v1.py thai_semantics_v1.py thai_interpretation_policy_v1.py thai_planet_pairs_v1.py thai_house_lord_routes_v1.py thai_context_graph_v1.py thai_descriptive_synthesis_v1.py thai_dignity_exceptions_v1.py thai_school_policy_v1.py thai_ai_safe_packet_v1.py thai_lagna_promotion_audit_v1.py thai_astrology_v2.py ai_interpret_v1.py

      - name: Verify audit readiness without product-state mutation
        env:
          PYTHONPATH: .
        run: |
          python - <<'PY'
          import json
          from datetime import date, time
          from ai_interpret_v1 import _compact_calculation
          from thai_astrology_v2 import build_thai_fortune

          thai = build_thai_fortune(
              birth_date=date(1991,3,21), birth_time=time(7,26),
              start_date=date(2026,8,31), end_date=date(2026,8,31),
              utc_offset_hours=9.0, latitude=34.7604, longitude=127.6622,
          )
          assert thai['engine'] == 'thai-mahathaksa-taksajorn-suriyayat-v2.15-phase2g4-lagna-promotion-audit'
          suri = thai['suriyayat']
          audit = suri['lagna_promotion_audit_research']
          assert audit['available'] is True and audit['research_only'] is True
          assert audit['failed_checks'] == []
          assert audit['lagna_position_product_promotion_ready'] is True
          assert audit['descriptive_house_context_product_promotion_ready'] is True
          assert audit['ai_safe_packet_ready_after_explicit_lagna_promotion'] is True
          assert audit['automatic_promotion_allowed'] is False
          assert audit['product_state_changed'] is False
          assert audit['promotion_gate']['predictive_interpretation_allowed'] is False
          assert audit['promotion_gate']['event_judgement_allowed'] is False
          assert audit['promotion_gate']['timing_prediction_allowed'] is False
          assert audit['promotion_gate']['probability_allowed'] is False
          assert audit['promotion_gate']['scores_allowed'] is False

          # Readiness must not mutate the current product contract.
          assert suri['lagna']['available'] is False
          lagna_gate = suri['lagna_research']['promotion_gate']
          assert lagna_gate['lagna_numeric_position_validated'] is True
          assert lagna_gate['houses_allowed'] is False
          assert lagna_gate['dignities_allowed'] is False
          assert lagna_gate['gemini_interpretation_allowed'] is False
          packet = suri['ai_safe_packet_research']
          assert packet['eligible_for_gemini'] is False
          assert packet['promotion_gate']['lagna_dependency_satisfied'] is False
          assert packet['promotion_gate']['gemini_interpretation_allowed'] is False

          compact = _compact_calculation({'period': {'day_count': 1}, 'thai': thai})['thai']['suriyayat']
          encoded = json.dumps(compact, ensure_ascii=False)
          assert 'lagna_promotion_audit_research' not in compact
          assert 'ai_safe_descriptive_packet' not in compact
          assert 'descriptive_house_context_product_promotion_ready' not in encoded
          assert 'source_topic_domains' not in encoded
          assert 'literal_exception' not in encoded
          print('PHASE2G4_PROMOTION_AUDIT_PASS_PREREQUISITES_READY_PRODUCT_LAGNA_GEMINI_PREDICTION_STILL_BLOCKED')
          PY

      - name: Check whitespace
        run: git diff --check

      - name: Commit Phase 2G4 state and clean workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add thai_astrology_v2.py thai_lagna_promotion_audit_v1.py tests/test_thai_lagna_promotion_audit_v1.py tests/test_thai_lagna_promotion_audit_integration.py
          git rm -f .github/workflows/thai-phase2g4-lagna-promotion-audit-once.yml
          git commit -m 'research: validate Thai Lagna product-promotion audit'
          git push origin HEAD:feature/thai-lagna-phase1-real-20260831
