name: Verify Supabase AI Edge E2E

on:
  push:
    paths:
      - '.github/workflows/verify-supabase-ai-edge.yml'

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Anonymous auth, exact calculation, Edge Gemini
        shell: bash
        run: |
          set -euo pipefail
          SUPA='https://dbynfabwfcakxayyggzi.supabase.co'
          PUB='sb_publishable_IEf9R9oJ5kbn513DdeqODQ_DwLeF35r'
          API='https://astro-app-api-f7fn.onrender.com'

          curl -fsS --max-time 20 -X POST "$SUPA/auth/v1/signup" \
            -H "apikey: $PUB" -H 'Content-Type: application/json' -d '{}' >/tmp/auth.json
          TOKEN=$(python -c "import json; print(json.load(open('/tmp/auth.json'))['access_token'])")

          curl -fsS --max-time 20 -X POST "$SUPA/functions/v1/fortune-interpret" \
            -H "apikey: $PUB" -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' \
            -d '{"action":"meta"}' >/tmp/meta.json
          cat /tmp/meta.json
          python - <<'PY'
          import json
          m=json.load(open('/tmp/meta.json'))
          assert m.get('runtime')=='supabase-edge', m
          assert m.get('interpreter_version')=='supabase-ai-v1', m
          assert m.get('configured') is True, 'MISSING_SUPABASE_GEMINI_API_KEY'
          print('EDGE META CONFIGURED OK')
          PY

          cat >/tmp/request.json <<'JSON'
          {"profile":{"name":"E2E","birth_date":"1990-01-01","birth_time":"12:00:00","latitude":37.5665,"longitude":126.978,"utc_offset_hours":9,"gender":"female"},"start_date":"2026-08-28","end_date":"2026-08-28"}
          JSON
          curl -fsS --max-time 20 -H 'Content-Type: application/json' -d @/tmp/request.json "$API/v1/fortune/integrated/start" >/tmp/calc-start.json
          JOB=$(python -c "import json; print(json.load(open('/tmp/calc-start.json'))['job_id'])")
          for i in $(seq 1 90); do
            curl -fsS --max-time 15 "$API/v1/fortune/integrated/jobs/$JOB" >/tmp/calc-job.json
            STATUS=$(python -c "import json; print(json.load(open('/tmp/calc-job.json')).get('status',''))")
            [ "$STATUS" = done ] && break
            [ "$STATUS" = failed ] && { cat /tmp/calc-job.json; exit 1; }
            sleep 2
          done
          python - <<'PY'
          import json
          job=json.load(open('/tmp/calc-job.json'))
          assert job.get('status')=='done', job
          calc=job['result']
          w=calc['western']
          assert '07:00~23:30/30분' in w['method']
          assert '09:00~15:30/15분' in w['method']
          for k in ['금전','학업','시험','직장','이직','연애','연락','재회','소식','컨디션','수익실현','신규진입','투자주의']:
              assert k in w['overall'], k
          json.dump({'calculation':calc,'model':'gemini-3.7-flash'},open('/tmp/ai.json','w'),ensure_ascii=False)
          print('EXACT CALC OK')
          PY

          T0=$(date +%s)
          curl -fsS --max-time 145 -X POST "$SUPA/functions/v1/fortune-interpret" \
            -H "apikey: $PUB" -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' \
            -d @/tmp/ai.json >/tmp/ai-result.json
          T1=$(date +%s)
          echo "Edge Gemini elapsed=$((T1-T0))s"
          python - <<'PY'
          import json
          d=json.load(open('/tmp/ai-result.json'))
          assert d.get('ok') is True, d
          assert d.get('interpreter_version')=='supabase-ai-v1', d
          usage=d.get('usage') or {}
          assert usage.get('total_tokens',0)>0, usage
          assert isinstance(usage.get('estimated_krw'),(int,float)), usage
          topics=(d.get('data') or {}).get('topic_analysis') or {}
          for k in ['금전','수익실현','학업','시험','직장','이직','연락','소식']:
              assert k in topics, (k,topics.keys())
          print('SUPABASE EDGE GEMINI E2E OK')
          print('model',d.get('model'),'fallback_from',d.get('fallback_from'))
          print('usage',usage)
          print('headline',(d.get('data') or {}).get('headline'))
          PY
