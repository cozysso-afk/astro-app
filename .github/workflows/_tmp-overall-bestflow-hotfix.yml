name: temporary overall best-flow hotfix

on:
  push:
    branches:
      - fix/daily-overall-bestflow-anchor

permissions:
  contents: write

jobs:
  patch-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Patch overall headline anchor
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('web/src/lib/fortuneUserSummary.ts')
          s = p.read_text()
          old = """  const preferred = ranked.filter(row => wanted.has(row.topic))
          const lead = (preferred.length ? preferred : ranked)[0]
          if (!lead) return focusedDayFallback(context, bestFlow, cautionFlow)
          """
          new = """  const preferred = ranked.filter(row => wanted.has(row.topic))
          const overallPrimary = !scopedTopics.size ? bestFlow.find(topic => DAILY_HEADLINE_SCENE[topic]) : undefined
          const lead = overallPrimary
            ? ranked.find(row => row.topic === overallPrimary)
            : (preferred.length ? preferred : ranked)[0]
          if (!lead) {
            if (overallPrimary) {
              const primaryScene = DAILY_HEADLINE_SCENE[overallPrimary]
              const primaryLevel = flowLevel(topicStat(context, overallPrimary))
              const primaryText = primaryLevel === 'low' ? primaryScene.caution : primaryScene.use
              const secondary = [...bestFlow, ...cautionFlow].find(topic => topic !== overallPrimary && DAILY_HEADLINE_SCENE[topic])
              const secondaryText = secondary ? ` ${secondary} 쪽은 ${cautionFlow.includes(secondary) ? DAILY_HEADLINE_SCENE[secondary].caution : DAILY_HEADLINE_SCENE[secondary].use}` : ''
              return `오늘 전체 흐름에서 가장 먼저 볼 건 ${overallPrimary}이야. ${primaryText}${secondaryText}`
            }
            return focusedDayFallback(context, bestFlow, cautionFlow)
          }
          """
          if old not in s:
              raise SystemExit('missing lead selection anchor')
          s = s.replace(old, new, 1)

          old = """  const caution = cautionFlow.includes(lead.topic) || polarity < 0
          """
          new = """  const caution = scopedTopics.size
            ? cautionFlow.includes(lead.topic) || polarity < 0
            : cautionFlow.includes(lead.topic)
          """
          if old not in s:
              raise SystemExit('missing caution anchor')
          p.write_text(s.replace(old, new, 1))

          t = Path('web/src/lib/systemReading.test.mjs')
          s = t.read_text()
          old = """ assert.notEqual(overall.headline,love.headline)
          assert.match(overall.headline,/전체 흐름/)
          assert.match(condition.headline,/컨디션/)
          """
          new = """ assert.notEqual(overall.headline,love.headline)
          assert.equal(overall.bestFlow[0],'대인관계')
          assert.match(overall.headline,/전체 흐름에서 가장 먼저 볼 건 대인관계/)
          assert.doesNotMatch(overall.headline,/전체 흐름에서 가장 먼저 볼 건 연락/)
          assert.match(condition.headline,/컨디션/)
          """
          if old not in s:
              raise SystemExit('missing scoped regression anchor')
          t.write_text(s.replace(old, new, 1))
          PY
      - name: Install web dependencies
        working-directory: web
        run: npm ci
      - name: Run focused regression
        working-directory: web
        run: node --test src/lib/systemReading.test.mjs
      - name: Build web
        working-directory: web
        run: npm run build
      - name: Commit source after tests pass
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/src/lib/fortuneUserSummary.ts web/src/lib/systemReading.test.mjs
          git commit -m "fix: anchor overall daily headline to top flow"
          git push origin HEAD:fix/daily-overall-bestflow-anchor
