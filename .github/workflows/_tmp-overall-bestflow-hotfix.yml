name: temporary overall best-flow hotfix

on:
  push:
    branches:
      - fix/daily-overall-bestflow-anchor

permissions:
  contents: write

jobs:
  patch-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Patch overall headline anchor
        run: python .github/scripts/_tmp_overall_bestflow_hotfix.py
      - name: Install web dependencies
        working-directory: web
        run: npm ci
      - name: Run focused regression
        working-directory: web
        run: node --test src/lib/systemReading.test.mjs
      - name: Build web
        working-directory: web
        run: npm run build
      - name: Commit source after tests pass
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/src/lib/fortuneUserSummary.ts web/src/lib/systemReading.test.mjs
          git commit -m "fix: anchor overall daily headline to top flow"
          git push origin HEAD:fix/daily-overall-bestflow-anchor
