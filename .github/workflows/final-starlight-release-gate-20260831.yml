name: Final Starlight Release Gate 2026-08-31

on:
  push:
    branches:
      - fix/starlight-result-integrity-20260831
    paths:
      - '.github/workflows/final-starlight-release-gate-20260831.yml'

permissions:
  contents: write

jobs:
  final-release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/starlight-result-integrity-20260831
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: api/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Clean temporary release scaffolding
        run: |
          git fetch origin main
          git checkout origin/main -- supabase/functions/fortune-interpret/index.ts
          python - <<'PY'
          from pathlib import Path
          p=Path('ai_interpret_v1.py')
          s=p.read_text(encoding='utf-8')
          old='Thai 출생요일·Mahathaksa·Taksajorn의 실제 계산 범위와 Suriyayat 미구현 한계'
          new='Thai 출생요일·Mahathaksa·Taksajorn과 검증된 Suriyayat 10행성 위치 사실층, Suriyayat Lagna 미구현 한계'
          if old in s:
              s=s.replace(old,new)
          assert old not in s
          p.write_text(s,encoding='utf-8')
          PY
          git rm -f .github/workflows/final-release-candidate-gate-20260831.yml
          git rm -f .github/workflows/final-release-candidate-gate-v2-20260831.yml
          git rm -f .github/workflows/finalize-release-candidate-20260831.yml
          git rm -f .github/workflows/final-starlight-release-gate-20260831.yml

      - name: Install calculation dependencies
        run: pip install -r api/requirements.txt

      - name: Compile calculation modules
        run: python -m py_compile ai_interpret_v1.py api/main.py integrated_fortune_v1.py relationship_western_v1.py relationship_saju_v1.py thai_astrology_v2.py thai_suriyayat_v1.py

      - name: Verify full 365-day integrated fortune
        run: |
          python - <<'PY'
          import time as clock
          from datetime import date,time
          import integrated_fortune_v1 as f
          t0=clock.perf_counter()
          r=f.build_integrated_fortune(
              birth_date=date(1991,3,21), birth_time=time(7,26),
              latitude=34.7604, longitude=127.6622, utc_offset_hours=9,
              gender='female', start_date=date(2026,1,1), end_date=date(2026,12,31)
          )
          assert r['period']['day_count']==365
          assert len(r['western']['months'])==12
          assert r['western']['overall']['대인관계']['average'] is not None
          assert r['western']['overall']['연락']['average'] is not None
          for key in ['수신신호','발신적합','과거인연접점']:
              assert r['western']['relationship_signals'][key]['average'] is not None
          assert r['saju']['ok'] is True
          assert len(r['saju']['monthly']) >= 12
          assert all(x.get('segment_start') and x.get('segment_end_exclusive') for x in r['saju']['monthly'])
          assert all(x.get('segment_start') and x.get('segment_end_exclusive') for x in r['saju']['annual'])
          th=r['thai']
          assert th['mahathaksa']['available'] is True
          assert th['taksajorn']['available'] is True
          assert th['suriyayat']['available'] is True
          assert th['suriyayat']['lagna']['available'] is False
          print('ANNUAL_365_PASS',round(clock.perf_counter()-t0,3),r['engine'])
          PY

      - name: Verify exact seasonal boundary segmentation
        run: |
          python - <<'PY'
          from datetime import date,time
          import integrated_fortune_v1 as f
          r=f.build_integrated_fortune(
              birth_date=date(1991,3,21),birth_time=time(7,26),latitude=34.7604,longitude=127.6622,
              utc_offset_hours=9,gender='female',start_date=date(2026,8,1),end_date=date(2026,8,31)
          )
          seg=r['saju']['monthly']
          assert any(x['ganzhi']=='乙未' for x in seg),seg
          assert any(x['ganzhi']=='丙申' for x in seg),seg
          boundary=[x for x in seg if x['ganzhi']=='丙申'][0]['segment_start']
          assert boundary.startswith('2026-08-07T20:42:43'),boundary
          print('SAJU_BOUNDARY_PASS',boundary)
          PY

      - name: Verify relationship engines and input safety
        run: |
          python - <<'PY'
          from datetime import date,time
          from fastapi import HTTPException
          from api.main import RelationshipProfile, RelationshipRequest, relationship_western, _month_segments
          from relationship_western_v1 import build_relationship_western

          a={'name':'A','birth_date':date(1991,3,21),'birth_time':time(7,26),'time_known':True,'latitude':34.7604,'longitude':127.6622,'utc_offset_hours':9}
          b={'name':'B','birth_date':date(1992,2,9),'birth_time':time(10,15),'time_known':True,'latitude':35.1595,'longitude':126.8526,'utc_offset_hours':9}
          seg=_month_segments(date(2026,1,1),date(2026,12,31))
          compat=build_relationship_western(a,b,seg,analysis_mode='compatibility')
          assert compat['ok'] is True
          assert compat['daily_transit_policy']['reunion_scan']=='skipped'
          assert 'reunion_transits' not in compat
          assert compat['house_overlays']['available'] is True
          for direction in ['user_in_counterpart','counterpart_in_user']:
              d=compat['house_overlays'][direction]
              assert d['available'] is True and d['systems']==['Whole Sign','Placidus'] and d['all']
              assert all(x.get('whole_house') and x.get('placidus_house') for x in d['all'])

          unknown={'name':'B','birth_date':date(1992,2,9),'birth_time':None,'time_known':False,'latitude':None,'longitude':None,'utc_offset_hours':9}
          reunion=build_relationship_western(a,unknown,seg,analysis_mode='reunion')
          assert reunion['ok'] is True
          assert reunion['natal_synastry']['partner_time_exact'] is False
          assert reunion['house_overlays']['available'] is False
          assert reunion['reunion_transits']['available'] is True
          assert reunion['reunion_transits']['directional_context']['period']=={'start':'2026-01-01','end':'2026-12-31'}
          forbidden={'Moon','ASC','DSC','MC','IC'}
          assert not [x for x in reunion['natal_synastry']['aspects'] if x.get('b') in forbidden]

          user_ok=RelationshipProfile(name='A',birth_date=date(1991,3,21),birth_time=time(7,26),time_known=True,latitude=34.7604,longitude=127.6622,utc_offset_hours=9)
          cp_unknown=RelationshipProfile(name='B',birth_date=date(1992,2,9),birth_time=None,time_known=False,latitude=None,longitude=None,utc_offset_hours=9)
          user_missing_place=RelationshipProfile(name='A',birth_date=date(1991,3,21),birth_time=time(7,26),time_known=True,latitude=None,longitude=None,utc_offset_hours=9)
          cp_known_missing_place=RelationshipProfile(name='B',birth_date=date(1992,2,9),birth_time=time(10,15),time_known=True,latitude=None,longitude=None,utc_offset_hours=9)

          def expect_422(req, needle):
              try: relationship_western(req)
              except HTTPException as e:
                  assert e.status_code==422 and needle in str(e.detail),(e.status_code,e.detail)
                  return
              raise AssertionError('expected 422')

          expect_422(RelationshipRequest(user=user_missing_place,counterpart=cp_unknown,start_date=date(2026,8,1),end_date=date(2026,8,7)), 'user birth coordinates')
          expect_422(RelationshipRequest(user=user_ok,counterpart=cp_known_missing_place,start_date=date(2026,8,1),end_date=date(2026,8,7)), 'counterpart birth coordinates')
          api_unknown=relationship_western(RelationshipRequest(user=user_ok,counterpart=cp_unknown,start_date=date(2026,8,1),end_date=date(2026,8,31),analysis_mode='reunion'))
          assert api_unknown['ok'] is True and api_unknown['result']['natal_synastry']['partner_time_exact'] is False
          print('RELATIONSHIP_FULL_GATE_PASS')
          PY

      - name: Verify result-integrity frontend guards
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('web/src/AppNext.tsx').read_text()
          for token in [
              'relationshipRevisionRef = useRef(0)',
              'restoringRelationshipRef = useRef(false)',
              'parseOptionalNumber(counterpart.latitude)',
              'parseOptionalNumber(counterpart.longitude)',
              'revision !== relationshipRevisionRef.current',
              'setRelationshipRequestSnapshot(null)',
              'restoringRelationshipRef.current = true',
              "const snapshotMode = String(relationshipRequestSnapshot?.analysis_mode ?? '')",
              "supabase.functions.invoke('relationship-interpret-v9-preview'",
              "supabase.functions.invoke('fortune-interpret-v6-preview'",
          ]:
              assert token in s,token
          assert "counterpart.timeKnown ? Number(counterpart.latitude) : null" not in s
          assert "counterpart.timeKnown ? Number(counterpart.longitude) : null" not in s
          assert s.count('className="tool-panel integrated-panel"')==1
          assert '천체 흐름 리포트' not in s
          print('FRONTEND_RESULT_INTEGRITY_PASS')
          PY

      - name: Verify Edge Functions typecheck
        run: |
          deno check supabase/functions/fortune-interpret-v6-preview/core.ts
          deno check supabase/functions/fortune-interpret-v6-preview/index.ts
          deno check supabase/functions/relationship-interpret-v9-preview/index.ts

      - name: Build frontend production bundle
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Verify exact release diff
        run: |
          git add -A
          git diff --check --cached
          git diff --cached --name-only origin/main | sort -u > /tmp/all.txt
          cat >/tmp/allowed.txt <<'EOF'
          ai_interpret_v1.py
          api/main.py
          integrated_fortune_v1.py
          relationship_western_v1.py
          supabase/functions/fortune-interpret-v6-preview/core.ts
          supabase/functions/fortune-interpret-v6-preview/index.ts
          supabase/functions/relationship-interpret-v9-preview/index.ts
          thai_astrology_v2.py
          thai_suriyayat_v1.py
          web/src/AppNext.tsx
          web/src/fortune-ux-v14.css
          web/src/main.tsx
          EOF
          sort -u /tmp/allowed.txt -o /tmp/allowed.txt
          echo FINAL_RELEASE_DIFF
          cat /tmp/all.txt
          test -z "$(comm -23 /tmp/all.txt /tmp/allowed.txt)" || { echo UNEXPECTED_FILES; comm -23 /tmp/all.txt /tmp/allowed.txt; exit 1; }
          test -z "$(comm -13 /tmp/all.txt /tmp/allowed.txt)" || { echo MISSING_FILES; comm -13 /tmp/all.txt /tmp/allowed.txt; exit 1; }
          echo FINAL_12_FILE_ALLOWLIST_PASS

      - name: Commit clean verified release candidate
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'candidate: clean verified starlight release'
          git push origin HEAD:fix/starlight-result-integrity-20260831
