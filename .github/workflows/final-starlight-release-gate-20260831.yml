name: Final Starlight Release Packaging Gate 2026-08-31

on:
  push:
    branches:
      - fix/starlight-result-integrity-20260831
    paths:
      - '.github/workflows/final-starlight-release-gate-20260831.yml'

permissions:
  contents: write

jobs:
  final-release-packaging:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/starlight-result-integrity-20260831
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Clean temporary release scaffolding
        run: |
          git fetch origin main
          git checkout origin/main -- supabase/functions/fortune-interpret/index.ts
          python - <<'PY'
          from pathlib import Path
          p=Path('ai_interpret_v1.py')
          s=p.read_text(encoding='utf-8')
          old='Thai 출생요일·Mahathaksa·Taksajorn의 실제 계산 범위와 Suriyayat 미구현 한계'
          new='Thai 출생요일·Mahathaksa·Taksajorn과 검증된 Suriyayat 10행성 위치 사실층, Suriyayat Lagna 미구현 한계'
          if old in s:
              s=s.replace(old,new)
          assert old not in s
          assert new in s
          p.write_text(s,encoding='utf-8')
          PY
          git rm -f .github/workflows/final-release-candidate-gate-20260831.yml
          git rm -f .github/workflows/final-release-candidate-gate-v2-20260831.yml
          git rm -f .github/workflows/finalize-release-candidate-20260831.yml
          git rm -f .github/workflows/final-starlight-release-gate-20260831.yml

      - name: Reconfirm critical product guards
        run: |
          python -m py_compile ai_interpret_v1.py api/main.py integrated_fortune_v1.py relationship_western_v1.py relationship_saju_v1.py thai_astrology_v2.py thai_suriyayat_v1.py
          python - <<'PY'
          from pathlib import Path
          app=Path('web/src/AppNext.tsx').read_text()
          api=Path('api/main.py').read_text()
          edge=Path('supabase/functions/relationship-interpret-v9-preview/index.ts').read_text()
          for token in [
              'relationshipRevisionRef = useRef(0)',
              'restoringRelationshipRef = useRef(false)',
              'parseOptionalNumber(counterpart.latitude)',
              'parseOptionalNumber(counterpart.longitude)',
              'revision !== relationshipRevisionRef.current',
              "const snapshotMode = String(relationshipRequestSnapshot?.analysis_mode ?? '')",
          ]:
              assert token in app, token
          for token in [
              'user birth coordinates are required for the precision relationship engine',
              'counterpart birth coordinates are required when time_known=true',
              'self.latitude if exact_time else None',
              'self.longitude if exact_time else None',
          ]:
              assert token in api, token
          assert 'relationship-v10.2-purpose-schema' in edge
          assert 'responseSchema:schemaFor(purpose)' in edge
          assert 'required.push("reunion_reading")' in edge
          assert 'required.push("marriage_reading")' in edge
          print('CRITICAL_GUARDS_PASS')
          PY

      - name: Verify clean release diff
        run: |
          git add -A
          git diff --check --cached
          git diff --cached --name-only origin/main | sort -u > /tmp/all.txt
          cat >/tmp/allowed.txt <<'EOF'
          ai_interpret_v1.py
          api/main.py
          integrated_fortune_v1.py
          relationship_western_v1.py
          supabase/functions/fortune-interpret-v6-preview/core.ts
          supabase/functions/fortune-interpret-v6-preview/index.ts
          supabase/functions/relationship-interpret-v9-preview/index.ts
          thai_astrology_v2.py
          thai_suriyayat_v1.py
          web/src/AppNext.tsx
          web/src/fortune-ux-v14.css
          web/src/main.tsx
          EOF
          sort -u /tmp/allowed.txt -o /tmp/allowed.txt
          echo FINAL_RELEASE_DIFF
          cat /tmp/all.txt
          unexpected="$(comm -23 /tmp/all.txt /tmp/allowed.txt)"
          test -z "$unexpected" || { echo UNEXPECTED_FILES; printf '%s\n' "$unexpected"; exit 1; }
          ! grep -q '^\.github/workflows/' /tmp/all.txt
          ! grep -qx 'supabase/functions/fortune-interpret/index.ts' /tmp/all.txt
          for required in \
            api/main.py \
            integrated_fortune_v1.py \
            relationship_western_v1.py \
            supabase/functions/relationship-interpret-v9-preview/index.ts \
            web/src/AppNext.tsx; do
            grep -qx "$required" /tmp/all.txt || { echo "MISSING_REQUIRED $required"; exit 1; }
          done
          echo CLEAN_RELEASE_ALLOWLIST_PASS

      - name: Commit clean verified release candidate
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'candidate: clean verified starlight release'
          git push origin HEAD:fix/starlight-result-integrity-20260831
