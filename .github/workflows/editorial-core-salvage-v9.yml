name: Editorial Core Salvage V9

on:
  push:
    branches:
      - fix/fortune-editorial-depth-v9

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'chore: apply editorial core salvage patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/fortune-editorial-depth-v9
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Apply editorial core salvage patch
        run: python3 scripts/apply-editorial-core-salvage-v9.py
      - name: Install dependencies
        working-directory: web
        run: npm ci
      - name: Run focused editorial tests
        working-directory: web
        run: node --experimental-strip-types --test src/lib/fortuneEditorialV3.test.mjs
      - name: Build web app
        working-directory: web
        run: npm run build
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: preserve strong editorial core prose"
          git push origin HEAD:fix/fortune-editorial-depth-v9
