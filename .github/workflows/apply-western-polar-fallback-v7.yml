name: Apply Western Polar Fallback V7

on:
  push:
    branches:
      - audit/western-polar-timezone-v7
    paths:
      - 'scripts/apply_western_polar_fallback_v7.py'
      - '.github/workflows/apply-western-polar-fallback-v7.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/western-polar-timezone-v7
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply V7 patch
        run: python scripts/apply_western_polar_fallback_v7.py
      - name: Commit patched runtime and UI files
        run: |
          if git diff --quiet; then
            echo "No patch changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add integrated_fortune_v1.py relationship_western_v1.py personal_marriage_v1.py web/src/appTypes.ts web/src/RelationshipPrecisionDetails.tsx web/src/PersonalMarriagePanel.tsx .github/workflows/calculation-audit-ci.yml
          git commit -m "fix(calc): add polar-safe Western house fallback V7"
          git push origin HEAD:audit/western-polar-timezone-v7
