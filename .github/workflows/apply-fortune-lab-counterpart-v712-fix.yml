name: Fix and apply Fortune Lab counterpart v0.1.2

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-fortune-lab-counterpart-v712-fix.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix patch script raw-string newline
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/upgrade_fortune_lab_counterpart_v712.py')
          s=p.read_text(encoding='utf-8')
          old="helper=r'''\\n\\ndef _counterpart_saju_payload"
          new="helper='''\\n\\ndef _counterpart_saju_payload"
          if old not in s:
              raise SystemExit('raw helper marker not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Apply counterpart reunion patch
        run: python scripts/upgrade_fortune_lab_counterpart_v712.py
      - name: Syntax check
        run: python -m py_compile fortune_lab_v71.py app.py scripts/upgrade_fortune_lab_counterpart_v712.py
      - name: Diff sanity
        run: git diff --check
      - name: Verify markers
        run: |
          grep -q 'FORTUNE_LAB_VERSION = "v0.1.2"' fortune_lab_v71.py
          grep -q '💞 특정 상대와 재회' fortune_lab_v71.py
          grep -q 'partner natal/synastry/transit not calculated yet' fortune_lab_v71.py
          grep -q '상대 출생시간을 알고 있음' fortune_lab_v71.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fortune_lab_v71.py scripts/upgrade_fortune_lab_counterpart_v712.py
          git commit -m "feat: add specific-counterpart reunion mode"
          git push origin HEAD:main
