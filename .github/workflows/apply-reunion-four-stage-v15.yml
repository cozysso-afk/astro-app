name: Apply Reunion Four Stage V15

on:
  push:
    branches:
      - feat/reunion-four-stage-engine-v15
    paths:
      - 'scripts/apply_reunion_four_stage_v15.py'
      - '.github/workflows/apply-reunion-four-stage-v15.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/reunion-four-stage-engine-v15
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply v15 contract hardening
        run: python scripts/apply_reunion_four_stage_v15.py

      - name: Syntax check relationship engine
        run: python -m py_compile reunion_dimension_v1.py relationship_western_v1.py

      - name: Commit generated changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/functions/relationship-interpret-v9-preview/index.ts web/src/lib/readingCache.ts web/src/lib/relationshipModeContract.test.mjs
          if git diff --cached --quiet; then
            echo 'No generated changes'
          else
            git commit -m 'fix: keep reunion v15 gating fields in AI payload'
            git push origin HEAD:feat/reunion-four-stage-engine-v15
          fi
