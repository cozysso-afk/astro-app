name: Apply relationship image export v1

on:
  push:
    branches: [fix/reunion-readability-provisional-time]
    paths:
      - ".github/workflows/apply-relationship-image-export-v1.yml"

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Apply relationship image export patch
        run: python scripts/patch_relationship_image_export_v1.py

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Image export contract
        run: node --test web/src/lib/readingImageExport.test.mjs

      - name: Web production build
        working-directory: web
        run: npm run build

      - name: Diff sanity
        run: git diff --check

      - name: Commit patched panel
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/src/RelationshipInterpretationPanel.tsx
          if ! git diff --cached --quiet; then
            git commit -m "Add relationship result image export"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
