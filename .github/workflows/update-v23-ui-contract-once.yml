name: Update V23 UI contract once

on:
  push:
    branches:
      - fix/v23-delivery-pipeline
    paths:
      - scripts/update_v23_ui_contract_once.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v23-delivery-pipeline
          fetch-depth: 0
      - name: Update UI contract
        run: python scripts/update_v23_ui_contract_once.py
      - name: Verify UI contract
        run: node --test web/src/lib/interpretationUiContract.test.mjs
      - name: Commit contract update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/src/lib/interpretationUiContract.test.mjs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update UI contract for verified V23 hero"
          git push origin HEAD:fix/v23-delivery-pipeline
