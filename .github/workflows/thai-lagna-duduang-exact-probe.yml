name: Thai Lagna Duduang exact foreign probe

on:
  push:
    branches:
      - feature/thai-lagna-phase1-real-20260831
    paths:
      - .github/workflows/thai-lagna-duduang-exact-probe.yml

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/thai-lagna-phase1-real-20260831
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pyswisseph==2.10.3.2 requests beautifulsoup4
      - name: Extract Duduang Lagna and compare candidates
        run: |
          PYTHONPATH=. python - <<'PY'
          import json, re, requests
          from bs4 import BeautifulSoup
          from datetime import date, time
          from thai_lagna_v1 import calculate_common_anto_0600, angular_delta_deg

          SIGNS_TH={
            'เมษ':0,'พฤษภ':1,'มิถุน':2,'กรกฎ':3,'สิงห์':4,'กันย์':5,
            'ตุล':6,'พิจิก':7,'ธนู':8,'มกร':9,'กุมภ์':10,'มีน':11,
          }
          base='https://www.duduang.com'
          page=base+'/%E0%B9%82%E0%B8%AB%E0%B8%A3%E0%B8%B2%E0%B8%A8%E0%B8%B2%E0%B8%AA%E0%B8%95%E0%B8%A3%E0%B9%8C%E0%B9%84%E0%B8%97%E0%B8%A2/'
          ua='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124 Safari/537.36'
          session=requests.Session()
          warm=session.get(page,timeout=30,headers={'User-Agent':ua})
          warm.raise_for_status()
          headers={'User-Agent':ua,'Referer':page,'Origin':base,'X-Requested-With':'XMLHttpRequest'}

          cases=[
            ('Yeosu',date(1991,3,21),time(7,26),34.7604,127.6622,9.0),
            ('Seoul',date(2026,3,24),time(14,26),37.5665,126.9780,9.0),
            ('Tokyo',date(2026,4,20),time(23,49),35.6762,139.6503,9.0),
            ('NewYork',date(2026,3,24),time(14,26),40.7128,-74.0060,-4.0),
          ]

          def extract_position_text(soup):
            for names_ul in soup.select('ul.star-name'):
              names=[li.get_text(' ',strip=True) for li in names_ul.find_all('li',recursive=False)]
              if 'ลัคนา' not in names:
                continue
              idx=names.index('ลัคนา')
              container=names_ul.find_parent('li')
              pos_ul=container.select_one('ul.star-position') if container else None
              if pos_ul is None:
                # fallback to common parent if the closest LI is not the paired row
                parent=names_ul.parent.parent if names_ul.parent else None
                pos_ul=parent.select_one('ul.star-position') if parent else None
              if pos_ul is None:
                return names, [], idx, None
              positions=[li.get_text(' ',strip=True) for li in pos_ul.find_all('li',recursive=False)]
              value=positions[idx] if idx < len(positions) else None
              return names, positions, idx, value
            return [],[],None,None

          def parse_degree_minute(text):
            if not text:
              return None
            # Duduang prose and tables use degree:minute notation such as 6:4.
            pairs=re.findall(r'(-?\d{1,3})\s*[:°º]\s*(\d{1,2})',text)
            if pairs:
              degree,minute=map(int,pairs[-1])
              if 0 <= minute < 60:
                return degree,minute
            nums=[int(x) for x in re.findall(r'\d+',text)]
            if len(nums)>=2 and 0 <= nums[-1] < 60:
              return nums[-2],nums[-1]
            return None

          for label,day,tm,lat,lon,utc in cases:
            payload={
              'day':str(day.day),'month':str(day.month),'year':str(day.year),
              'hour':str(tm.hour),'minute':str(tm.minute),
              'location':'2','country':'','province':'','districts':'',
              'lat':str(lat),'long':str(lon),
              'jday':'0','jmonth':'0','jyear':'0','t':'0','ca':'1',
            }
            r=session.post(base+'/ajax/2-thai.php',data=payload,headers=headers,timeout=30)
            r.raise_for_status(); r.encoding=r.apparent_encoding or 'utf-8'
            soup=BeautifulSoup(r.text,'html.parser')
            names,positions,idx,pos=extract_position_text(soup)
            fulltext=' '.join(soup.stripped_strings)
            sign=None
            m=re.search(r'ลัคนาราศี\s*([ก-๙]+)',fulltext)
            if m and m.group(1) in SIGNS_TH:
              sign=m.group(1)
            if sign is None:
              for strong in soup.find_all('strong'):
                txt=strong.get_text(' ',strip=True)
                m=re.search(r'ลัคนาราศี\s*([ก-๙]+)',txt)
                if m and m.group(1) in SIGNS_TH:
                  sign=m.group(1); break
            dm=parse_degree_minute(pos)
            duduang_long=None
            if sign is not None and dm is not None:
              degree,minute=dm
              # If table returns full zodiac degree rather than within-sign degree,
              # retain both interpretations in output and prefer within-sign only
              # when degree < 30.
              if 0 <= degree < 30:
                duduang_long=SIGNS_TH[sign]*30+degree+minute/60
            ours=calculate_common_anto_0600(
              birth_date=day,birth_time=tm,longitude=lon,
              utc_offset_hours=utc,adjust_local_mean_time=True,
            )
            ours_legal=calculate_common_anto_0600(
              birth_date=day,birth_time=tm,longitude=lon,
              utc_offset_hours=utc,adjust_local_mean_time=False,
            )
            # Duduang exposes no timezone field. Compare a Thailand-UTC+7
            # hypothesis as a diagnostic only; it is NOT a validation rule.
            ours_plus7=calculate_common_anto_0600(
              birth_date=day,birth_time=tm,longitude=lon,
              utc_offset_hours=7.0,adjust_local_mean_time=True,
            )
            print('\n===',label,'===')
            print('REQUEST',day.isoformat(),tm.isoformat(),lat,lon,'utc',utc)
            print('NAMES',json.dumps(names,ensure_ascii=False))
            print('POSITIONS',json.dumps(positions,ensure_ascii=False))
            print('LAGNA_INDEX',idx,'LAGNA_POSITION_RAW',repr(pos),'LAGNA_SIGN',sign,'PARSED_DM',dm)
            print('DUDUANG_LONGITUDE',None if duduang_long is None else round(duduang_long,6))
            print('OURS_LMT',ours['display'],ours['longitude_deg'])
            print('OURS_LEGAL',ours_legal['display'],ours_legal['longitude_deg'])
            print('OURS_UTC7_DIAGNOSTIC',ours_plus7['display'],ours_plus7['longitude_deg'])
            if duduang_long is not None:
              print('DELTA_OURS_LMT_ARCMIN',round(abs(angular_delta_deg(ours['longitude_deg'],duduang_long))*60,3))
              print('DELTA_OURS_LEGAL_ARCMIN',round(abs(angular_delta_deg(ours_legal['longitude_deg'],duduang_long))*60,3))
              print('DELTA_UTC7_DIAGNOSTIC_ARCMIN',round(abs(angular_delta_deg(ours_plus7['longitude_deg'],duduang_long))*60,3))
          PY
      - name: Clean probe workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/thai-lagna-duduang-exact-probe.yml
          git commit -m 'chore: clean exact Duduang Lagna probe'
          git push origin HEAD:feature/thai-lagna-phase1-real-20260831
