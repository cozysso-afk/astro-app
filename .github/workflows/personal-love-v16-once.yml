name: Personal Love V16 Once

on:
  push:
    branches:
      - audit/personal-love-engine-v16
    paths:
      - '.github/workflows/personal-love-v16-once.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/personal-love-engine-v16
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: api/requirements.txt
      - name: Install dependencies
        run: python -m pip install -q -r api/requirements.txt pytest httpx
      - name: Syntax contract
        run: python -m py_compile personal_love_forecast_v1.py api/main.py
      - name: Personal love V16 contracts
        run: |
          python -m pytest -q \
            tests/test_personal_love_engine_v16.py \
            tests/test_personal_love_api_v16.py
      - name: Prior relationship regressions
        run: |
          python -m pytest -q \
            tests/test_relationship_api_e2e_v15.py \
            tests/test_reunion_dimensions_v14.py \
            tests/test_relationship_reliability_v13.py \
            tests/test_birth_time_reliability_v12.py \
            tests/test_relationship_timing_v9.py \
            tests/test_relationship_midpoints_v8.py \
            tests/test_personal_marriage_v1.py
