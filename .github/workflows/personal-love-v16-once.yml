name: Personal Love Engine V16 Once

on:
  push:
    branches:
      - audit/personal-love-engine-v16
    paths:
      - '.github/workflows/personal-love-v16-once.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/personal-love-engine-v16
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply API patch
        run: python scripts/patch_personal_love_api_v16.py
      - name: Install dependencies
        run: python -m pip install -q -r api/requirements.txt pytest httpx
      - name: Syntax
        run: python -m py_compile personal_love_forecast_v1.py api/main.py
      - name: V16 engine and API contracts
        run: |
          python -m pytest -q \
            tests/test_personal_love_engine_v16.py \
            tests/test_personal_love_api_v16.py
      - name: Prior relationship regressions
        run: |
          python -m pytest -q \
            tests/test_relationship_api_e2e_v15.py \
            tests/test_reunion_dimensions_v14.py \
            tests/test_relationship_reliability_v13.py \
            tests/test_birth_time_reliability_v12.py \
            tests/test_relationship_timing_v9.py \
            tests/test_relationship_midpoints_v8.py
      - name: Commit permanent V16 API change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add api/main.py
          git diff --cached --check
          git commit -m 'feat(api): separate personal love from relationship engine V16'
          git push origin HEAD:audit/personal-love-engine-v16
