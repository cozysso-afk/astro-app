name: Apply reunion background resume v1

on:
  push:
    branches: [fix/reunion-background-resume-v1]

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/reunion-background-resume-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Apply backend timeout patch
        run: python scripts/patch_reunion_background_resume_v1.py
      - name: Install verification dependencies
        run: |
          python -m pip install pytest
          npm --prefix web ci
      - name: Focused reunion transport contracts
        run: |
          python tests/test_relationship_async_contract.py
          python -m pytest -q tests/test_mobile_archive_reunion_stall.py tests/test_reunion_timeout_background_stability_v1.py
          npm --prefix web run build
      - name: Commit verified backend change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add api/relationship_async_v1.py
          git diff --cached --quiet && exit 0
          git commit -m 'fix: keep reunion jobs alive across iOS backgrounding'
          git push origin HEAD:fix/reunion-background-resume-v1
