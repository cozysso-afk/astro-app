name: Patch concise interpretation summary v2

on:
  push:
    branches: [work/ai-cost-guard-v21]
    paths:
      - '.github/workflows/patch-v2131-summary-hierarchy-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply concise summary hierarchy
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          helper = Path('web/src/lib/interpretationSummary.ts')
          helper.write_text("""import type { AiInterpretationResponse } from '../appTypes'\n\ntype InterpretationData = NonNullable<AiInterpretationResponse['data']>\n\nfunction normalize(text?: string) {\n  return String(text ?? '').replace(/\\s+/g, ' ').trim()\n}\n\nfunction metricDense(text: string) {\n  const metricHits = text.match(/평균|변동폭|최고(?:값)?|최저(?:값)?|최댓값|최솟값|점수|상승폭|하락폭/g)?.length ?? 0\n  const numberHits = text.match(/[+-]?\\d+(?:\\.\\d+)?\\s*(?:점|%|회|개)?/g)?.length ?? 0\n  return metricHits >= 2 || (metricHits >= 1 && numberHits >= 2) || numberHits >= 4\n}\n\nfunction sentences(text?: string) {\n  const clean = normalize(text)\n  if (!clean) return []\n  return clean.split(/(?<=[.!?])\\s+|[\\n;]+/).map(normalize).filter(Boolean)\n}\n\nfunction compact(text: string, max = 180) {\n  const clean = normalize(text)\n  if (clean.length <= max) return clean\n  const clipped = clean.slice(0, max - 1)\n  const lastSpace = clipped.lastIndexOf(' ')\n  return `${(lastSpace > max * 0.65 ? clipped.slice(0, lastSpace) : clipped).trim()}…`\n}\n\nfunction firstNarrative(text?: string) {\n  const parts = sentences(text)\n  return parts.find((part) => !metricDense(part)) ?? ''\n}\n\nexport function buildInterpretationBrief(data: InterpretationData) {\n  const flowSource = firstNarrative(data.overall.dominant_pattern)\n    || firstNarrative(data.overall.summary)\n    || normalize(data.headline)\n\n  const priority = (data.priorities ?? []).map(normalize).find((item) => item && !metricDense(item))\n  const decision = normalize(data.decisions?.[0]?.action)\n  const windowLabel = normalize(data.key_windows?.[0]?.label)\n  const rememberSource = priority || decision || windowLabel\n\n  return {\n    flow: compact(flowSource, 190),\n    remember: rememberSource && rememberSource !== flowSource ? compact(rememberSource, 150) : '',\n  }\n}\n""")

          annual = Path('web/src/AiInterpretationPanel.tsx')
          a = annual.read_text()
          if "./lib/interpretationSummary" not in a:
              a = a.replace("import { estimateGeminiUsage } from './lib/aiUsage'\n", "import { estimateGeminiUsage } from './lib/aiUsage'\nimport { buildInterpretationBrief } from './lib/interpretationSummary'\n", 1)
          anchor = "  const relationshipReading = data.relationship_reading\n"
          if anchor not in a:
              raise SystemExit('annual brief anchor not found')
          a = a.replace(anchor, anchor + "  const brief = buildInterpretationBrief(data)\n", 1)
          old = '<div className="ai-overall-block"><span className="ai-section-kicker">전체 결론</span><p className="ai-summary">{data.overall.summary}</p></div>'
          new = '<div className="ai-overall-block"><span className="ai-section-kicker">한눈에 결론</span><div className="ai-overall-brief"><p><b>핵심 흐름</b><span>{brief.flow}</span></p>{brief.remember&&<p><b>먼저 기억할 것</b><span>{brief.remember}</span></p>}</div></div>'
          if old not in a:
              raise SystemExit('annual overall block not found')
          a = a.replace(old, new, 1)
          old_pattern = "    {data.overall.dominant_pattern && <div className=\"ai-highlight\"><strong>핵심 패턴</strong><span>{data.overall.dominant_pattern}</span></div>}\n"
          if old_pattern not in a:
              raise SystemExit('annual duplicate pattern block not found')
          a = a.replace(old_pattern, '', 1)
          details_anchor = '    <details className="ai-details"><summary>15개 분야별 정밀 해석 보기 · 중요도순</summary>'
          if details_anchor not in a:
              raise SystemExit('annual detail anchor not found')
          raw = '    <details className="ai-overall-raw-details"><summary>수치 포함 전체 계산 요약 보기</summary><p>{data.overall.summary}</p></details>\n\n'
          a = a.replace(details_anchor, raw + details_anchor, 1)
          annual.write_text(a)

          period = Path('web/src/PeriodAiInterpretationPanel.tsx')
          p = period.read_text()
          if "./lib/interpretationSummary" not in p:
              p = p.replace("import { estimateGeminiUsage } from './lib/aiUsage'\n", "import { estimateGeminiUsage } from './lib/aiUsage'\nimport { buildInterpretationBrief } from './lib/interpretationSummary'\n", 1)
          anchor = "  const relationshipReading = data.relationship_reading\n"
          if anchor not in p:
              raise SystemExit('period brief anchor not found')
          p = p.replace(anchor, anchor + "  const brief = buildInterpretationBrief(data)\n", 1)
          old = '    <p className="period-ai-summary">{data.overall.summary}</p>\n'
          new = '    <section className="period-ai-overall-brief"><span>한눈에 결론</span><p><b>핵심 흐름</b><strong>{brief.flow}</strong></p>{brief.remember&&<p><b>먼저 기억할 것</b><strong>{brief.remember}</strong></p>}</section>\n'
          if old not in p:
              raise SystemExit('period overall summary not found')
          p = p.replace(old, new, 1)
          old_pattern = '        {data.overall.dominant_pattern && <div className="period-ai-section"><strong>기간을 관통하는 패턴</strong><p>{data.overall.dominant_pattern}</p></div>}\n'
          if old_pattern not in p:
              raise SystemExit('period duplicate pattern block not found')
          p = p.replace(old_pattern, '        <div className="period-ai-section"><strong>수치 포함 전체 계산 요약</strong><p>{data.overall.summary}</p></div>\n', 1)
          period.write_text(p)

          annual_css = Path('web/src/ai-interpret-v2.css')
          c = annual_css.read_text()
          c += """\n\n/* V21.3.1 UX pass 2 · concise top conclusion, raw numeric summary below */\n.ai-overall-brief{display:grid;gap:7px;padding:12px 13px;border:1px solid rgba(159,153,177,.18);border-radius:15px;background:linear-gradient(135deg,rgba(251,247,255,.9),rgba(242,250,248,.88))}.ai-overall-brief>p{display:grid;grid-template-columns:92px minmax(0,1fr);gap:8px;margin:0;font-size:.84rem;line-height:1.58}.ai-overall-brief>p>b{color:#715c7d;font-size:.76rem}.ai-overall-brief>p>span{color:#554c5d}.ai-overall-raw-details{border:1px solid rgba(158,144,170,.16);border-radius:13px;overflow:hidden}.ai-overall-raw-details>summary{cursor:pointer;list-style:none;padding:10px 11px;color:#675772;font-size:.75rem;font-weight:900;background:rgba(250,248,252,.72)}.ai-overall-raw-details>summary::-webkit-details-marker{display:none}.ai-overall-raw-details>summary::before{content:'＋';margin-right:6px;color:#887294}.ai-overall-raw-details[open]>summary::before{content:'－'}.ai-overall-raw-details>p{margin:0;padding:11px 12px;color:#716776;font-size:.79rem;line-height:1.68;background:rgba(255,255,255,.58)}\n@media(max-width:520px){.ai-overall-brief>p{grid-template-columns:1fr;gap:2px}.ai-overall-brief>p>b{font-size:.72rem}.ai-overall-brief>p>span{font-size:.83rem}}\n"""
          annual_css.write_text(c)

          period_css = Path('web/src/period-ai-v18.css')
          c = period_css.read_text()
          c = c.replace('.period-ai-v18>.period-ai-summary{order:2}', '.period-ai-v18>.period-ai-overall-brief{order:2}', 1)
          c += """\n\n/* V21.3.1 UX pass 2 · concise period conclusion */\n.period-ai-overall-brief{display:grid;gap:7px;padding:11px 12px;border:1px solid rgba(157,151,177,.17);border-radius:14px;background:linear-gradient(135deg,rgba(251,247,255,.9),rgba(242,250,248,.86))}.period-ai-overall-brief>span{color:#8d7a95;font-size:.68rem;font-weight:900;letter-spacing:.04em}.period-ai-overall-brief>p{display:grid;grid-template-columns:86px minmax(0,1fr);gap:7px;margin:0;line-height:1.55}.period-ai-overall-brief>p>b{color:#715d7c;font-size:.72rem}.period-ai-overall-brief>p>strong{color:#534958;font-size:.81rem;font-weight:650}@media(max-width:430px){.period-ai-overall-brief>p{grid-template-columns:1fr;gap:2px}.period-ai-overall-brief>p>strong{font-size:.8rem}}\n"""
          period_css.write_text(c)
          PY
      - name: Behavior and diff sanity
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          summary = '금전 평균 46.3점, 변동폭 42점, 최고 81점이다. 관계와 일에서는 서두르기보다 실제 반응을 확인하며 속도를 조절하는 흐름이 핵심이다.'
          parts = re.split(r'(?<=[.!?])\s+|[\n;]+', summary)
          def dense(text):
              metrics = len(re.findall(r'평균|변동폭|최고|최저|점수|상승폭|하락폭', text))
              nums = len(re.findall(r'[+-]?\d+(?:\.\d+)?\s*(?:점|%|회|개)?', text))
              return metrics >= 2 or (metrics >= 1 and nums >= 2) or nums >= 4
          flow = next((p for p in parts if p and not dense(p)), '')
          assert '실제 반응' in flow and '46.3' not in flow and '변동폭' not in flow
          PY
          git diff --check
          grep -q 'buildInterpretationBrief' web/src/AiInterpretationPanel.tsx
          grep -q '한눈에 결론' web/src/PeriodAiInterpretationPanel.tsx
          grep -q '수치 포함 전체 계산 요약' web/src/AiInterpretationPanel.tsx
      - name: Commit and clean one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/patch-v2131-summary-hierarchy-v2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/src/AiInterpretationPanel.tsx web/src/PeriodAiInterpretationPanel.tsx web/src/ai-interpret-v2.css web/src/period-ai-v18.css web/src/lib/interpretationSummary.ts .github/workflows/patch-v2131-summary-hierarchy-v2.yml
          git commit -m 'fix(ui): make interpretation conclusion scannable'
          git push origin HEAD:work/ai-cost-guard-v21
